name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew android:assembleDebug
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Android
          path: android/build/outputs/apk/debug/android-debug.apk

  build-desktop:
    name: Build Desktop (Win & Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Desktop Distributions
        run: ./gradlew desktop:distZip
      
      - name: Upload Desktop Build
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Desktop
          path: desktop/build/distributions/*.zip
