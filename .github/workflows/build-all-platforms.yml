name: Build All Platforms (Android, Windows, Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من واجهة GitHub

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew android:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Android
          path: android/build/outputs/apk/debug/android-debug.apk

  build-desktop:
    name: Build Desktop (Win & Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # بناء نسخة لينكس
      - name: Build Linux Desktop
        run: ./gradlew desktop:distLinux
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Linux
          path: desktop/build/libs/*.jar

      # بناء نسخة ويندوز (يتم بناؤها على بيئة لينكس باستخدام Cross-Compilation)
      - name: Build Windows Desktop
        run: ./gradlew desktop:distWindows
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Windows
          path: desktop/build/libs/*.exe
