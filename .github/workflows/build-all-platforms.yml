name: Build All Platforms (Android, Windows EXE, Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Android
          path: android/build/outputs/apk/debug/android-debug.apk

  build-linux:
    name: Build Linux Zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew desktop:distZip
      - uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Linux
          path: desktop/build/distributions/*.zip

  build-windows-exe:
    name: Build Windows EXE (jpackage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Windows app image (EXE)
        run: ./gradlew.bat desktop:jpackageImage
      - uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Arabic-Windows-EXE
          path: desktop/build/jpackage/
