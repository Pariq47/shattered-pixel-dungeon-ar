journal.document.adventurers_guide.title=كتاب إتقان الزنزانة
journal.document.adventurers_guide.intro.title=مقدمة
journal.document.adventurers_guide.intro.body=مرحباً أيها المغامر، أنت تقرأ كتاب إتقان الزنزانة! يُستخدم هذا الدليل كمرجع، وسيخبرك بالسحر متى يكون من الأفضل قراءة كل صفحة.\n\n)عندما يومض زر الصحيفة، اختره لقراءة ما يقوله لك الدليل! بعض الصفحات مفقودة رغم ذلك، ربما يمكنك العثور عليها في الزنزانة؟(
journal.document.adventurers_guide.examining.title=الفحص
journal.document.adventurers_guide.examining.body=من المهم دراسة أعدائك ومحيطك بدلاً من الاندفاع بتهور! اعتد على فحص كل شيء جديد.\n\n)يمكنك الفحص باستخدام زر العدسة المكبرة ثم اختيار ما تريد فحصه. يمكنك أيضاً فحص التأثيرات الإيجابية أو السلبية باختيار أيقوناتها.(
journal.document.adventurers_guide.surprise_attacks.title=هجمات مفاجئة
journal.document.adventurers_guide.surprise_attacks.body=الهجمات المفاجئة مضمونة الإصابة، مما يجعلها مفيدة بشكل خاص ضد الأعداء المراوغين مثل الثعابين والأشباح.\n\nيمكنك مفاجئة الأعداء مباشرة بعد دخولهم عبر باب أثناء مطاردتك، أو عندما يفقدونك من بصرهم.
journal.document.adventurers_guide.identifying.title=تعريف الأغراض
journal.document.adventurers_guide.identifying.body=ألوان الجرعات والرموز على اللفافات تختلف في كل زنزانة. المعدات غير المعرفة يمكن ترقيتها أو سحرها إذا كنت محظوظاً، أو قد تكون ملعونة!\n\nلفافات التعريف، الترقية، أو إزالة اللعنة مفيدة جداً إذا كنت تريد تقليل مخاطر استخدام معدات غير معرفة.\n\n)يمكنك العثور على قائمة بكل الأغراض التي عرّفتها في تبويب الفهرس في صحيفتك(
journal.document.adventurers_guide.food.title=التعامل مع الجوع
journal.document.adventurers_guide.food.body=تقسيم الطعام بفعالية هو أحد أفضل الطرق لتحسين فرص بقائك، فأنت لست بحاجة دائماً للأكل فور شعورك بالجوع!\n\nعندما لا تتضوّر جوعاً، ستجدد صحتك ببطء، لذا إذا أكلت وصحتك كاملة فسيضيع هذا التجديد هدراً!\n\nإذا نظمت متى تأكل بناءً على صحتك، فسيستمر طعامك لفترة أطول بكثير.
journal.document.adventurers_guide.alchemy.title=الخيمياء والتمائم
journal.document.adventurers_guide.alchemy.body=إذا لم تجد غرضاً مستهلكاً مفيداً، يمكنك استخدامه كمكون خيميائي أو تحويله إلى طاقة خيميائية متعددة الأغراض. شحن الجرعات واللفافات بالطاقة يعرّفها أيضاً!\n\nالتمائم هي نوع فريد من المعدات تُصنع وتُرقى باستخدام الخيمياء. تُصنع بمحفز تمائم سحري وقليل من الطاقة الخيميائية.\n\n)يوجد أول قدر خيمياء في الطابق الثالث أو الرابع من الزنزانة. توجد أيضاً صفحات كتاب وصفات الخيمياء بالقرب من هذه القدور.(
journal.document.adventurers_guide.dieing.title=التعامل مع الهزيمة
journal.document.adventurers_guide.dieing.body=استكشاف الزنزانات خطير ومعظم المغامرين يلقون حتفهم في النهاية.\n\nالحظ يساعد، لكن أفضل المغامرين يستخدمون كل حيلة صغيرة لتحسين فرصهم.\n\n)لا تنزعج إذا كنت تموت كثيراً، فهذه اللعبة صعبة! ركز على تعلم اللعبة والتحسن باستمرار، وليس على الفوز فوراً.(
journal.document.adventurers_guide.searching.title=البحث
journal.document.adventurers_guide.searching.body=الزنزانات مليئة بالأبواب السرية والفخاخ التي تبدو غير مرئية للوهلة الأولى. يمكنك قضاء بعض الوقت والبحث بعناية إذا شككت في وجود باب أو فخ مخفي في مكان قريب.\n\n)يمكنك البحث في كل البلاطات حولك باستخدام زر العدسة المكبرة مرتين. ربما توجد بعض الأبواب المخفية بالقرب من مكان عثورك على هذه الصفحة!(
journal.document.adventurers_guide.strength.title=القوة
journal.document.adventurers_guide.strength.body=لا يوجد وقت للتدرب على الأسلحة والدروع التي تجدها في الزنزانة، لذا ستحتاج إلى القوة الخام لاستخدامها بفعالية.\n\nجرعات القوة ولفافات الترقية هي الطريقة الأكثر فعالية لتلبية متطلبات القوة للمعدات من الفئات الأعلى.\n\nمن المهم أن تبدأ في استخدام أغراض الفئة العالية في النهاية، لكن لا تتجاهل المعدات التي يمكنك استخدامها الآن.
journal.document.adventurers_guide.upgrades.title=الترقيات
journal.document.adventurers_guide.upgrades.body=كلما تعمقت في الزنزانة، زاد أهمية استخدامك لمعدات عالية الفئة مرقاة سحرياً، لكنك ستحتاج أيضاً إلى القوة لاستخدامها بشكل صحيح.\n\nالعصي السحرية، الخواتم، والقطع الأثرية لا تحتاج إلى قوة، لكن استخدامها محدود أو لا تساعد بشكل مباشر في القتال.\n\nاتخاذ خيارات جيدة حول ما ترقّيه مهم جداً للبقاء على قيد الحياة مبكراً في الزنزانة، ولتمهيد طريقك نحو النجاح لاحقاً.
journal.document.adventurers_guide.looting.title=نهب فعال
journal.document.adventurers_guide.looting.body=الغرف التي تقع خلف أبواب مقفلة أو التي تحتوي على عوائق عادة ما تحوي غنائم أفضل. عندما يمنعك عائق ما، يمكنك عادة العثور على غرض للمساعدة في نفس الطابق.\n\nستتمكن دائماً من العثور على جرعتي قوة و 3 لفافات ترقية في كل منطقة زنزانة مكونة من خمسة طوابق، لذا فهي مؤشر رائع على مدى جودة استكشافك.\n\n)يمكنك رؤية قائمة المعالم والمفاتيح غير المستخدمة في تبويب الملاحظات في نافذة الصحيفة.(
journal.document.adventurers_guide.levelling.title=اكتساب الخبرة
journal.document.adventurers_guide.levelling.body=رفع المستوى يعزز إحصائياتك ويمنحك نقاط موهبة، مما يمكن أن يحدث فرقاً كبيراً في القتال. من الأفضل أن يكون لديك مستوى واحد على الأقل لكل طابق من الزنزانة.\n\nقد يكون من المغري التسرع وتجنب الاستكشاف أو القتال، لكن القيام بذلك سيحرمك من الإمدادات والخبرة.\n\n)يمكنك رؤية معلومات عن بطلك، بما في ذلك الخبرة، في لوحة الحالة في زاوية واجهة اللعبة. اختر صورة بطلك للحصول على مزيد من المعلومات.(
journal.document.adventurers_guide.positioning.title=التموضع
journal.document.adventurers_guide.positioning.body=الاستراتيجية لا تقل أهمية عن المعدات. المواقف السيئة مثل التطويق يمكن تجنبها عادة بالتموضع الجيد.\n\nعلى سبيل المثال، معظم الزنزانات تحتوي على ممرات ضيقة تجبر الأعداء على قتالك واحداً تلو الآخر. هذه الممرات غالباً ما تحتوي على مداخل لهجمات مفاجئة أيضاً!\n\nهناك الكثير من الطرق الصغيرة لاستخدام ميزات البيئة مثل العشب، الماء، الحفر، أو الفخاخ لصالحك أيضاً.
journal.document.adventurers_guide.magic.title=الهجمات السحرية
journal.document.adventurers_guide.magic.body=الهجمات السحرية تخترق الدروع وتصعب مراوغتها. هذا يعني أن ضرر العصي السحرية موثوق جداً، لكنه يجعل الأعداء السحريين خطرين جداً أيضاً!\n\nالهجمات السحرية لها عيب دائماً رغم ذلك. العصي السحرية لديها شحنات محدودة والأعداء السحريون عادة لن يتمكنوا من استخدام سحرهم في المدى القريب.\n\nعند مواجهة أعداء يستخدمون السحر، من المهم تعلم كيفية منعهم من استخدامه عليك.

journal.document.alchemy_guide.title=دليل الخيمياء
journal.document.alchemy_guide.potions.title=مقدمة والجرعات
journal.document.alchemy_guide.potions.body=مرحباً بكم في التطبيقات العملية للخيمياء! هذا الكتاب هو مرجع للوصفات لصنع الأغراض في قدر الخيمياء.\n\nسنبدأ بالوصفة الأكثر شهرة: الجرعات!\n\nاستخدم ثلاث بذور لتحضير جرعة عشوائية! كل بذرة لها نظير من الجرعات، استخدم عدة بذور من نفس النوع لزيادة فرصة أن تتعلق الجرعة بالبذور التي استخدمتها.
journal.document.alchemy_guide.stones.title=صنع الأحجار الرونية
journal.document.alchemy_guide.stones.body=خلط لفافة في قدر خيمياء سيضفي سحرها على صخرتين داخل القدر. هذا يخلق أحجاراً رونية ويعرّف اللفافة!
journal.document.alchemy_guide.energy_food.title=الطاقة والطعام
journal.document.alchemy_guide.energy_food.body=العديد من الوصفات تتطلب طاقة خيميائية بلورية، والتي تُصنع عن طريق تفكيك الأغراض المستهلكة في قدر الخيمياء. شحن الجرعات أو اللفافات بالطاقة يعرّفها أيضاً.\n\nبعض الوصفات التي تتطلب الطاقة هي سحرية، لكن هذه تشبه الطهي التقليدي.
journal.document.alchemy_guide.exotic_potions.title=جرعات غريبة
journal.document.alchemy_guide.exotic_potions.body=يمكن خلط الجرعات بالطاقة لإنشاء جرعات غريبة. لديها تأثيرات أقوى، لكنها غالباً ما تكون مفيدة بطرق مختلفة.
journal.document.alchemy_guide.exotic_scrolls.title=لفافات غريبة
journal.document.alchemy_guide.exotic_scrolls.body=يمكن صنع اللفافات الغريبة ببعض الطاقة ولفافة. إنها أقوى قليلاً وأكثر تكلفة من الجرعات الغريبة.
journal.document.alchemy_guide.bombs.title=قنابل معززة
journal.document.alchemy_guide.bombs.body=يمكن خلط قنبلة بارود أسود قياسية مع غرض محدد لإنشاء قنبلة معززة.
journal.document.alchemy_guide.weapons.title=تعزيز الأسلحة
journal.document.alchemy_guide.weapons.body=بعض الأسلحة الأخف أو الأكثر سحرية يمكن استخدامها في الخيمياء!\n\nكل مجموعة أسلحة رمي تنتج ما يكفي من المعدن السائل لإصلاح مجموعة أخرى بالكامل من نفس المستوى والفئة. لاحظ أن خيمياء مجموعة ستدمر المجموعة بأكملها، حتى لو لم تكن كلها حاضرة!\n\nعصا سحرية واحدة ستنتج ما يكفي من الراتنج السحري لترقية عصاتين من نفس المستوى، لكن لا أعلى من +3.
journal.document.alchemy_guide.brews_elixirs.title=أخلاط وإكسيرات
journal.document.alchemy_guide.brews_elixirs.body=الأخلاط والإكسيرات هي جرعات متقدمة ذات تأثيرات متنوعة، عادة ما تكون لاستخدام واحد.
journal.document.alchemy_guide.spells.title=تعويذات
journal.document.alchemy_guide.spells.body=التعويذات تُحتوى في بلورات وتوفر تأثيرات متنوعة، عادة ما تكون لعدة استخدامات.

journal.document.intros.title=مقدمات المناطق
journal.document.intros.discover_hint=يمكنك العثور على هذا النص عند الدخول إلى منطقة محددة لأول مرة.
journal.document.intros.dungeon.title=الزنزانة
journal.document.intros.dungeon.body=العديد من الأبطال غامروا في الزنزانة قبلك من المدينة في الأعلى، ومعظمهم لم يُسمع عنهم أبداً.\n\nيُقال إن شراً قديماً يكمن في الأعماق، يحرس تميمة يندور العظيمة. حتى الآن تشع طاقة مظلمة من الأسفل، وتشق طريقها إلى المدينة.\n\nهل ستقهر الزنزانة وتطالب بالتميمة؟ حان الوقت لبدء مغامرتك الخاصة!
journal.document.intros.sewers.title=المجاري
journal.document.intros.sewers.body=الطوابق العليا من الزنزانة تشكل في الواقع نظام مجاري المدينة.\n\nمع تسرب الطاقة المظلمة من الأسفل، أصبحت مخلوقات المجاري غير المؤذية عادة أكثر شراسة. اضطر الحرس لإرسال دوريات إلى هنا لمحاولة الحفاظ على سلامة من في الأعلى.\n\nهذا المكان خطير، لكن على الأقل السحر الشرير هنا ضعيف.
journal.document.intros.prison.title=السجن
journal.document.intros.prison.body=قبل سنوات عديدة بُني سجن هنا لإيواء المجرمين الخطرين. كان خاضعاً لتنظيم صارم وآمن، وجُلب إليه المحكومون من جميع أنحاء الأرض لقضاء عقوباتهم.\n\nلكن سرعان ما بدأ ضباب مظلم يتسرب من الأسفل، مشوهاً عقول الحراس والسجناء على حد سواء.\n\nاستجابة للفوضى المتزايدة، أغلقت المدينة السجن بأكمله. لا أحد يعلم ما حل بمن تُركوا ليموتوا داخل هذه الجدران...
journal.document.intros.caves.title=الكهوف
journal.document.intros.caves.body=هذه الكهوف قليلة السكان تمتد تحت السجن المهجور. غنية بالمعادن، كانت ذات يوم مركزاً للتجارة والصناعة لمجتمع الأقزام في الأسفل، لكنها هُجرت عندما هوس الأقزام بالسحر المظلم.\n\nالكهوف الآن يسكنها في الغالب الحياة البرية تحت الأرض، الجنول، والآلات المهجورة؛ والتي أفسدتها على الأرجح نفس القوة التي أثرت على المناطق العليا.
journal.document.intros.city.title=متروبوليس الأقزام
journal.document.intros.city.body=كانت متروبوليس الأقزام ذات يوم أعظم مدن الأقزام. في أوجها، بنى الأقزام آلات رائعة من المعدن والسحر سمحت لمدينتهم بالتوسع بسرعة.\n\nثم، في أحد الأيام، أُغلقت بوابات المدينة ولم يسمع أحد عن الأقزام مرة أخرى. القلة الذين هربوا من المدينة عند إغلاقها رووا قصصاً عن ساحر مظلم مجنون سرق العرش، وعن السحر الرهيب الذي تعلم تسخيره.
journal.document.intros.halls.title=قاعات الشياطين
journal.document.intros.halls.body=هذه القاعات العميقة من متروبوليس الأقزام شُوّهت بالسحر المظلم. في الماضي، استضافت هذه المناطق بلاط ملك الأقزام من السحرة النخبة، لكن يبدو الآن أنها سيطرت عليها قوة أكثر شراً...\n\nجميع أنواع المخلوقات الشيطانية المروعة تسكن هذه القاعات، بقيادة قوة مظلمة رهيبة. إذا لم يكن ملك الأقزام هو مصدر الفساد المنتشر، فمهما كان ما بالأسفل فهو المصدر.\n\nامشِ بحذر، قلة قليلة من المغامرين نزلوا إلى هذا العمق...
journal.document.intros.halls.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.

journal.document.sewers_guard.title=رسائل الحارس
journal.document.sewers_guard.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.
journal.document.sewers_guard.new_position.title=منصبي الجديد!
journal.document.sewers_guard.new_position.body=الخامس والثمانون من الخريف، 375\nأمي وأبي العزيزان،\n\nلقد أخبرتكم أن العمل الجاد في حرس المدينة سيؤتي ثماره. لقد تُرقيت للتو!\n\nلقد دُعيت للانضمام إلى فريق متخصص يعمل في المجاري. على ما يبدو أن هناك مشاكل مع الآفات والخارجين عن القانون هناك، ومهمتنا هي التخلص منهم. إنه عمل فوضوي، لكن المجاري دافئة في الشتاء وتدفع ثلاثة أضعاف أجر الحراسة العادية!\n\nالأمر سري للغاية رغم ذلك، لذا لا يمكنني إرسال هذه الرسالة فعلياً. يبدو غريباً ألا أكتب إليكم، لذا سأستمر في كتابتها على أي حال. ربما أريكم إياها يوماً ما.\n\nمع أطيب التحيات،\n- سونيا
journal.document.sewers_guard.dangerous.title=منصب خطير...
journal.document.sewers_guard.dangerous.body=الثامن والثمانون من الخريف، 375\nأمي وأبي العزيزان،\n\nأفهم الآن سبب كون الأجر جيداً جداً، المجاري مليئة بالوحوش! "الآفات" و"الخارجون عن القانون" هم جرذان عملاقة متعطشة للدماء وقطعان من الجنول الغاضبين.\n\nلحسن الحظ، بقية فريقي يعرفون حقاً ما يفعلونه. قائد فريقنا، توماس، خبير في هذا. أحاول التعلم بسرعة حتى لا أكون عبئاً كبيراً.\n\nهذه الوظيفة أخطر بكثير مما ظننت. أنا سعيدة لأنني لا أستطيع إرسال هذه الرسائل الآن، لا أريدكم أن تقلقوا.\n\nسأبقى بأمان،\n- سونيا
journal.document.sewers_guard.crabs.title=سرطانات عملاقة!
journal.document.sewers_guard.crabs.body=الحادي عشر من الشتاء، 376\nأمي وأبي العزيزان،\n\nوكأن الجرذان لم تكن سيئة بما فيه الكفاية، في الأعماق توجد سرطانات عملاقة! أحدها اندفع نحوي وأصاب "لي" بشدة قبل أن نقتله. توماس يقول إن هذا ليس خطأي، لكنني أعلم أنه يحاول فقط أن يكون لطيفاً معي.\n\nلحسن الحظ، في طريق خروجنا صادفنا مغامراً لديه بعض من مرهم عشب الشمس الاحتياطي. ربما لم ينجُ "لي" بدون ذلك الشيء.\n\nرأيت المغامر يحدق في وردة قبل رحيله، قال إنها هدية. لماذا يخاطرون بحياتهم هنا إذا كان هناك شخص يهتم لأمرهم كثيراً؟\n\nهذا بالضبط ما أفعله أليس كذلك؟ أشعر أنني في موقف يفوق قدراتي.
journal.document.sewers_guard.guild.title=نقابة اللصوص
journal.document.sewers_guard.guild.body=الثالث والعشرون من الشتاء، 376\nأمي وأبي العزيزان،\n\nلا توجد وحوش جديدة هذه المرة، بدلاً من ذلك صادفنا مجموعة صغيرة من نقابة اللصوص أثناء الدورية.\n\nكل ما سمعته عن النقابة سيء، لكن بقية فريقي بدوا ودودين تقريباً معهم. تبادل توماس المعلومات والإمدادات مع أحدهم قبل أن نفترق.\n\nلا أفهم، ألم يكن من المفترض أن نتخلص من الخارجين عن القانون؟ توماس قال حتى ألا أذكر هذا لأي شخص في القيادة. معلوماتهم وإمداداتهم كانت مفيدة جداً رغم ذلك، ولم نكن لنتمكن من تحمل المزيد من القتال.\n\nأفترض أننا جميعاً في هذا معاً هنا بالأسفل.
journal.document.sewers_guard.lost.title=لقد ضللنا
journal.document.sewers_guard.lost.body=الأربعون من الشتاء، 376\n\nتوماس وأنا ضللنا. لقد طُردنا بعيداً عن بقية الفريق أثناء قتال بعض الجنول. لم يُصب أي منا، لكن المجاري السفلية تشبه المتاهة.\n\nتوماس يقول إنه يعرف طريقاً للخروج، لكنه يبدأ عند مدخل السجن القديم في أسفل المجاري. لا أحب النزول أعمق حقاً، لكن ليس لدينا أي مؤن والنزول أسرع بكثير من التجول بحثاً عن طريق دوريتنا.\n\nسيكون كل شيء على ما يرام. توماس يعرف ما يفعله.
journal.document.sewers_guard.not_worth.title=الأمر لا يستحق
journal.document.sewers_guard.not_worth.body=توماس وأنا صادفنا نوعاً من وحش الوحل الضخم عند مدخل السجن. قبل أن نتمكن من الرد، قصفنا بالسحر. توماس تلقى معظمه. لقد رحل.\n\nلا يوجد مبلغ من المال يستحق هذا. سأغادر عبر الطريق الذي أخبرني عنه توماس. ثم سآخذ ما كسبته كحارسة وأستخدمه لنقل والديّ وأنا بعيداً عن هذه المدينة الملعونة. جزء مني يريد أن يأمل في أن يكون لدى الملك خطة لكل هذا، لكنني أشك في ذلك.\n\nأترك هذه الرسائل ورائي كتحذير للآخرين. الأمر ليس مجرد جرذان وسرطانات عملاقة، هناك شيء خاطئ جداً هنا بالأسفل.

journal.document.prison_warden.title=يوميات مأمور السجن
journal.document.prison_warden.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.
journal.document.prison_warden.journal.title=الاحتفاظ بيوميات
journal.document.prison_warden.journal.body=الأول من الربيع، 362\n\nهذا هو الإدخال الأول في يوميات عمل مأمورة السجن كيانا سميث. مع كل ما يحدث مؤخراً، قررت بدء يوميات للحفاظ على أفكاري منظمة.\n\nإدارة سجن على بعد نصف ميل تحت الأرض لم تكن لتكون سهلة أبداً، لكن مؤخراً يبدو أن هناك نوعاً من التخريب المنظم يحدث. السجناء يتصرفون بتهور دون سبب ثم يرفضون شرح السبب.\n\nبعض الحراس بدأوا يقولون إن المكان مسكون. لا يمكنني ترك رجالي ينشرون الشائعات، لكن لا يمكنني لومهم بالضبط على شعورهم بعدم الارتياح.\n- سميث
journal.document.prison_warden.recruits.title=مجندون جدد
journal.document.prison_warden.recruits.body=الثمانون من الربيع، 362\n\nكما وُعدت، وصلت مجموعة من المجندين الجدد اليوم. يبدو الأمر معتاداً، بضعة أشخاص واعدين والكثير من الجنود الذين يريدون الأجر فحسب. ومع ذلك، وجود كل هذه العضلات الجديدة يجب أن يساعد كثيراً مع سجنائنا المشاغبين مؤخراً.\n\nفي وظيفة مثل هذه، من المهم أن تعرف من يمكنك الوثوق به. أحد المعينين الجدد، توماس، يبدو واعداً بشكل خاص. أحتاج كل المساعدة التي يمكنني الحصول عليها الآن، لذا إذا أبلى بلاءً حسناً، فسأرى بشأن ترقيته بسرعة.\n- سميث
journal.document.prison_warden.mines.title=إغلاق المناجم
journal.document.prison_warden.mines.body=الرابع والخمسون من الشتاء، 363\n\nجاءت مجموعة من المهندسين من المدينة اليوم، قائلين إنهم هنا لإغلاق المدخل القديم للمناجم بالأسفل. أفترض أن المدينة لا تريد عناء صيانة الممر بعد الآن. لم أُبلغ مسبقاً، كالعادة.\n\nمهندسهم الرئيسي أخبرني أيضاً ببعض الهراء عن سحر الأقزام المتسرب من المناجم. لا أصدق كلمة واحدة منه.\n\nالوضع تحت السيطرة بشكل أفضل بكثير مع موظفينا الجدد، لكن جذر المشكلة لم يُعالج بعد. هناك شيء يؤثر بالتأكيد على السجناء هنا، وهدم بعض الجدران لن يغير ذلك.\n- سميث
journal.document.prison_warden.rotberry.title=نبتة توت العفن
journal.document.prison_warden.rotberry.body=الثالث والعشرون من الخريف، 363\n\nتلقيت هدية جميلة من فيليكس اليوم. إنها نوع من الشجيرات الحمراء الزاهية تسمى "توت العفن".\n\nلقد ذكرت له من قبل مدى كآبة هذا المكان، ويبدو أنه كان يصغي. وفقاً له، هذه النبتة تكره الضوء والماء في الواقع، لذا كل ما علي فعله هو تقليم الأوراق مرة واحدة في الشهر أو نحو ذلك. تقليمها يجب أن يكون مهماً رغم ذلك، فقد ذكره عشرات المرات في رسالته.\n\nبالطبع، فيليكس لا يفعل أي شيء مجاناً. يقول إن البذور التي ينتجها هذا الشيء رائعة لصنع العصي السحرية، لذا بطبيعة الحال أنا مدينة له ببعضها في كل مرة تنتج فيها النبتة بعضاً.\n- سميث
journal.document.prison_warden.no_support.title=لا دعم
journal.document.prison_warden.no_support.body=الحادي عشر من الربيع، 364\n\nبماذا تفكر المدينة بحق الجحيم؟ بعد طلب المساعدة بشكل عاجل لم أسمع شيئاً، ولا حتى اعتذاراً فارغاً كما يرسلون عادة عندما تُرفض طلباتي.\n\nفي هذه الأثناء، يستمر السجناء في التفاقم، وبعض الحراس بدأوا حتى في إثارة المشاكل. هل يخططون فقط لترك هذا يزداد سوءاً حتى نتعامل مع تمرد!؟\n\nتوماس بقي موثوقاً كعادته على الأقل. مساعدته التنظيمية كانت لا تقدر بثمن، وفكرته في تفعيل وحدات DM-100 القديمة كانت مؤسفة لكنها ضرورية. أنا واثقة من أنني أستطيع العودة للسيطرة على هذا الوضع، أحتاج فقط إلى بعض الدعم الملعون!\n- سميث
journal.document.prison_warden.letter.title=رسالة إلى توماس
journal.document.prison_warden.letter.body=توماس،\n\nلقد كنت صديقاً عظيماً، لذا أنا أقوم بمعروف لك.\n\nعندما تبدأ نوبتك الليلة، أغلق وأغلق زنزانة تينغو، ارمِ المفتاح في بعض المنافذ، واخرج. لا يهم إذا كان السجناء الآخرون دون رعاية، قريباً جداً لن يتمكن أحد من مغادرة هذا المكان. هذا المعتوه يجب أن يبقى مؤمناً رغم ذلك، إذا هرب فلا أحد يعلم ماذا سيفعل.\n\nلا تخبر أحداً عن هذا، ولا تكلف نفسك عناء البحث عني. القائد يجب أن يغرق مع سفينته.\n- كيانا

journal.document.caves_explorer.title=سجل المستكشف
journal.document.caves_explorer.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.
journal.document.caves_explorer.expedition.title=بدء الحملة!
journal.document.caves_explorer.expedition.body=الأول من الصيف، 308\n\nاليوم تبدأ حملتنا التي تستمر أربعة أسابيع في مناجم الأقزام المهجورة! لقد كُلفت من قبل الملك نفسه لاستكشاف المنطقة. أهدافي الرئيسية هي العثور على أي موارد طبيعية غير مستغلة ومسح الكهوف لمشروع بناء سجن محتمل.\n\nبينما أنا قادر على الدفاع عن نفسي، فقد قبلت مرافقة من حرس المدينة بإصرار من الملك. إنهم مجموعة من البسطاء، لكن طالما أنهم لا يبطئونني فوجودهم مقبول.\n\nمن المتوقع أن ننظف المجاري ونصل إلى المناجم بحلول المساء.\n- أرشيبالد دراموند. رئيس السحرة، معهد السحر الجنوبي.
journal.document.caves_explorer.gold.title=الكثير من الذهب!
journal.document.caves_explorer.gold.body=الرابع من الصيف، 308\n\nأيامنا القليلة الأولى كانت مثمرة جداً بالفعل! بعد إنشاء معسكر أساسي، انطلقنا لاستكشاف بعض المناطق العليا من المنجم المهجور. بينما يوجد الكثير من الفوضى غير المفيدة التي خلفها الأقزام، فإن العديد من جدران الكهوف تعج أيضاً بالذهب!\n\nلسوء الحظ، نحن لسنا الأولين هنا. الكهوف مليئة بالحياة البرية العدوانية، ويبدو أن قطعان الجنول لديها اهتمام بالذهب أيضاً. أعترف بأنني كنت غير منصف تجاه مرافقي الحراس، فقد كانوا مستكشفين وحراس شخصيين أكثر قدرة بكثير مما توقعت.\n\nحتى مع هذا النجاح، لا يزال لدينا الكثير من المناجم لاستكشافها.\n- أرشيبالد
journal.document.caves_explorer.troll.title=لقاء مع غول
journal.document.caves_explorer.troll.body=الحادي عشر من الصيف، 308\n\nبعد بدء استكشافنا في القسم الأوسط من المناجم، صادفنا وجهاً ودوداً! حسناً... ودود نسبياً. غول كهف أنشأ حدادة صغيرة هناك. إنه فظ ولا يتحدث كثيراً، لكنه أصلح معداتنا مقابل بعض الذهب.\n\nلسوء الحظ، أبلغنا الحداد الغول أيضاً أن كل هذا الذهب الجميل ليس جيداً كما يبدو. يسميه "الذهب الداكن" ومن الواضح أنه يتحلل بسرعة في ضوء الشمس. هذا بالتأكيد يفسر سبب عدم وجود أي نزاعات على الموارد هنا.\n\nأفترض أننا بحاجة إلى التعمق قليلاً لنرى إذا كان هناك أي شيء أكثر قيمة.\n- أرشيبالد
journal.document.caves_explorer.city.title=مدخل المدينة
journal.document.caves_explorer.city.body=الحادي والعشرون من الصيف، 308\n\nنحن الآن في علامة الأسابيع الثلاثة، وبعد قضاء الكثير من الأيام العشرة الماضية في رسم خرائط أعمق فأعمق، وصلنا أخيراً إلى قاع المناجم. وجدنا العديد من الأجهزة المعدنية وبوابة عظيمة تمنع الدخول إلى متروبوليس الأقزام القديم.\n\nحذرنا الحداد من بعض هذه الآلات. من الواضح أنها كانت مخصصة للدفاع عن المنطقة ولديها ميل للتفعيل عند الإزعاج. ليس لدينا أي عمل في المدينة، والمعدن سيكون له قيمة خردة ضئيلة، لذا اعتقدنا أنه من الأفضل الاصغاء لتحذيره والعودة.\n\nيجب أن أعترف أنني كنت فضولياً، لكن التحقيق هناك بالتأكيد لم يكن يستحق المخاطرة.\n- أرشيبالد
journal.document.caves_explorer.alive.title=إنه حي!
journal.document.caves_explorer.alive.body=الثالث والعشرون من الصيف، 308\n\nإحدى آلات الأقزام عادت إلى الحياة بطريقة ما! كنا نمر فحسب عندما شحنت وكادت تسحق اثنين من مجموعتنا بقبضتيها المعدنيتين الضخمتين. لحسن الحظ، كنت أحمل عصا التفكك معي. بضع طلقات جيدة التصويب من ذلك وتم تقليل الشيء الوحشي إلى خردة معدنية.\n\nما يزعجني هو أننا لم نفعل أي شيء على الإطلاق لاستفزاز الآلة. لم يكن من الممكن أن يصمم الأقزام الآلات لتكون عدوانية جداً، الأمر وكأنها كانت تحاول نصب كمين لنا!\n\nعلى الأقل تمكنت من تقديم بعض المساعدة لرفاقي هذه المرة.\n- أرشيبالد
journal.document.caves_explorer.report.title=التقرير النهائي
journal.document.caves_explorer.report.body=الثامن والعشرون من الصيف، 308\n\nاليوم سننتهي من حزم أمتعتنا ونستعد للمغادرة. في الوقت المناسب أيضاً، فقد بدأ العديد من مجموعتنا في رؤية كوابيس مروعة بعد حادثة الآلة العدوانية. من المحتمل أن يكون مجرد إرهاق، لكن كوابيسهم كلها متشابهة بشكل مقلق.\n\nباختصار، المناطق العليا من المنجم آمنة تماماً. إذا وُجد استخدام للذهب الداكن، فإن تعدينه قد يكون مربحاً جداً. المساحات المفتوحة الكبيرة ستعمل بشكل جيد جداً لخطط بناء المدينة أيضاً. المناجم السفلية أكثر خطورة رغم ذلك، ويجب تجنبها.\n\nسأكتب كل هذا في تقريري النهائي خلال الأيام القليلة القادمة.\n- أرشيبالد

journal.document.city_warlock.title=يوميات الساحر المظلم
journal.document.city_warlock.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، لكن فقط بعد العثور على كل النصوص السابقة في هذه المجموعة.
journal.document.city_warlock.old_king.title=الملك ميت
journal.document.city_warlock.old_king.body=إنه اليوم الخامس من الشهر الثاني من السنة الثالثة والثلاثين من عصر السحر. إذا كان أحد سكان العالم العلوي يقرأ هذا، فالوقت هو شتاء عام 264. اسمي ثايمور زاهر، وعلى حد علمي أنا آخر عضو ناجٍ من بلاط الأقزام.\n\nملكنا ميت، استُبدل بأحد زملائي السابقين الذي جنّ بالقوة. بقية البلاط خضعوا له، مثل الحمقى الذين هم عليه، وفقدوا إرادتهم الحرة في هذه العملية. أنا وحدي رأيت هذا قادماً وهربت قبل أن تكتمل طقوسه.\n\nالدائرة الداخلية سقطت، لكن قوة الملك الجديد لم تصل إلى الجميع بعد. يجب أن أنظم مقاومة بأسرع ما يمكن. أرفض ترك حضارتنا المجيدة تسقط في يد هذا المهووس بالعظمة!
journal.document.city_warlock.resistance.title=مقاومة
journal.document.city_warlock.resistance.body=يبدو أن الكلمة انتشرت بسرعة. لم تمر سوى بضعة أيام وقد جمعت بالفعل جيشاً صغيراً من الموالين للملك القديم. قلة منهم بارعون في السحر، لكن تقريباً كل رهبان المحاربين معنا. يجب أن نكون أكثر من كافٍ لمواجهة قزم مجنون واحد وبلاطه من العبيد.\n\nفي هذه الأثناء، اختبأ الملك الجديد في الغرف الداخلية لمدينتنا. مما لا شك فيه أنه استنفد معظم قوته ويأمل في التعافي قبل أن يواجه المزيد من المقاومة.\n\nسنشن هجومنا خلال ساعتين أخريين. مع الحظ، سنتمكن من تشكيل مجلس مؤقت وإعادة مدينتنا الرائعة إلى الاستقرار بحلول نهاية الليل.
journal.document.city_warlock.failure.title=فشل
journal.document.city_warlock.failure.body=يبدو أنني أحمق أيضاً. افترضت أن الملك الجديد يحتاج إلى خضوع البلاط له طوعاً، لكنني أرى الآن أن لديه القوة للسيطرة حتى على أولئك الذين يقاومونه.\n\nلقد أحضرت أعمى أقوى المعارضين مباشرة إلى عتبة بابه حتى يتمكن شخصياً من تحويلهم إلى عبيده. الآن تجتاح موجات من طاقته النخرية المدينة، محولة معظمهم فوراً إلى متوسلين له.\n\nالقلة الذين لا يزالون يملكون الإرادة الحرة يهربون. لقد اخترت البقاء للمراقبة بأفضل ما يمكنني والبحث عن ثغرة. مع القوة السحرية التي أملكها، يجب أن أتمكن من البقاء مخفياً وآمناً لبعض الوقت.
journal.document.city_warlock.more_powerful.title=أكثر قوة
journal.document.city_warlock.more_powerful.body=أصبح تتبع الوقت صعباً، لكن مر حوالي أسبوع منذ إدخالي الأخير. حضارتنا انهارت حقاً. البوابات مغلقة، توقفت كل وظائف مجتمعنا، وقشور أقزام فارغة تجول القاعات.\n\nخلال كل هذا، بطريقة ما، يصبح الملك الجديد أكثر قوة. كل يوم تصبح قوة إرادته أقوى، لكنها تتغير أيضاً. لا أستطيع وصفها، لكن الأمر يبدو وكأنه لم يعد قزماً على الإطلاق.\n\nبدأت أتقبل أن أفضل ما يمكنني أمله هو توثيق هذه الأحداث. سأبقى هنا طالما استطعت، ثم سأتراجع بمجرد أن تبدأ إرادتي في الضعف.
journal.document.city_warlock.new_power.title=قوة جديدة
journal.document.city_warlock.new_power.body=ما الذي يحدث هنا؟ القوة المنبعثة من الملك الجديد مختلفة بالفعل عن ذي قبل، لكن هناك شيئاً آخر أيضاً. هذه القوة الجديدة تبدو وكأنها تشع من أعماق قاعات مدينتنا.\n\nالأمر الأكثر إرباكاً هو أن النشاط في المتروبوليس العلوي قد انخفض أيضاً. لا أعرف ما الذي يحدث هناك بالأسفل، لكنه يجذب كل انتباه الملك الجديد تقريباً.\n\nالعودة إلى القاعات العميقة ستكون خطيرة، لكن يجب أن أكتشف ما الذي يسبب هذا التغيير. ربما لدى الملك الجديد نقطة ضعف بعد كل شيء؟
journal.document.city_warlock.seen_it.title=لقد رأيته
journal.document.city_warlock.seen_it.body=لقد رأيت ما يكمن في الأسفل، لكنني لا أستطيع وصفه. ترتعش يداي بلا سيطرة وأنا أحاول تدوين أفكاري.\n\nلماذا يحدث هذا؟ هل فعل الملك الجديد هذا؟ هذا لا يعقل. ربما استقطبه استخدامه الطائش للقوة؟ كنت آمل في إنقاذ حضارتنا، لكنني أرى الآن أن العالم بأكمله في خطر...
