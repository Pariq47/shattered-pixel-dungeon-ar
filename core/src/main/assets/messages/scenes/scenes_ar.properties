scenes.titlescene.patreon_body=Shattered Pixel Dungeon لعبة مجانية بالكامل، وهذا يعني أنني أعتمد على دعم اللاعبين الكرماء لمواصلة تطويرها.\n\nإن كنت مهتماً بدعمي، فأفضل طريقة لذلك هي عبر Patreon. يوفر لي Patreon مصدر دخل ثابت، ويتيح لي تقديم شيء مقابل لدعمكم!\n\nيحصل الداعمون على منشورات حصرية كل أسبوع تعرفهم على ما أعمل عليه قبل أي شخص آخر!\n\nيمكنك الاطلاع على صفحة Patreon الخاصة بي لأحدث المعلومات حول المزايا، شكراً لعطفك!\n\n)مكافآت Patreon متاحة باللغة الإنجليزية فقط(
