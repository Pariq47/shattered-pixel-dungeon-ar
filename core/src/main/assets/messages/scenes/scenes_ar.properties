scenes.supporterscene.title=ادعم اللعبة
scenes.supporterscene.intro=أريد أن تبقى Shattered Pixel Dungeon خالية من الإعلانات والمعاملات الدقيقة الاقتحامية التي تفسد الكثير من الألعاب المجانية. بدلاً من ذلك، أفضل أن أطلب من اللاعبين دعم اللعبة مباشرة!
scenes.supporterscene.patreon_msg=إن كنت تستمتع بلعبة Shattered وتريد مساعدتي على مواصلة تطويرها، فكّر في دعمي عبر _Patreon!_ يوفر Patreon مجموعة من المزايا الحصرية!:\n_- وصول مبكر_ للنسخ التجريبية من التحديثات القادمة.\n_- مدونات مصغرة أسبوعية_ تتضمن معلومات عما أعمل عليه.\n_- استطلاعات شهرية_ تؤثر مباشرة على المحتوى الذي أطوره.\n_- دبابيس مكافآت مادية_ بعد 1 و2 و3 سنوات من الدعم.\n_- ديسكورد مجتمع_ مع قنوات لسجل التطوير والدردشة.\n\n_والمزيد!_ يمكنك زيارة صفحة Patreon لمزيد من المعلومات. شكراً لوقتك، واستمتع باستكشاف الزنزانة!
scenes.supporterscene.patreon_english=)لاحظ أن مكافآت Patreon متاحة باللغة الإنجليزية فقط.(
