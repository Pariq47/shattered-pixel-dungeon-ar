scenes.heroselectscene.daily=مغامرة اليوم
scenes.heroselectscene.daily_desc=كل يوم تتاح لعبة جديدة متطابقة للجميع! هذه 'مغامرة اليوم' تولّد نفس الزنزانة لكل من يلعبها )طالما أنهم يلعبون نفس إصدار اللعبة أيضاً(.\n\nيمكنك أن تستغرق ما شئت لإكمال مغامرة اليوم، لكن لا يمكن أن تكون لديك إلا واحدة نشطة في الوقت نفسه. _مغامرات اليوم لا تؤهل للأوسمة ولها صفحة ترتيب منفصلة خاصة بها._\n\nهل تريد بدء مغامرة اليوم ببطلك وتحدياتك المحددة حالياً؟
scenes.heroselectscene.daily_yes=نعم
scenes.heroselectscene.daily_no=لا
scenes.heroselectscene.daily_repeat=لقد لعبت مغامرة اليوم بالفعل. يمكنك إعادة لعبها إن شئت، لكن فقط كجولة تدريبية غير مصنفة.\n\nبعد إكمال الإعادة، ستتمكن من عرضها من نافذة ترتيب اليوم لفترة قصيرة قبل حذف السجل.\n\nهل تريد إعادة مغامرة اليوم ببطلك وتحدياتك المحددة حالياً؟
scenes.heroselectscene.daily_unavailable_long=يبدو أنك بدأت مغامرة يومية في المستقبل! قد يحدث هذا إذا غيّرت المنطقة الزمنية مؤخراً، أو غيّرت ساعة نظامك. _مغامرتك اليومية التالية ستتاح بعد %d أيام._
scenes.heroselectscene.daily_existing=لديك بالفعل مغامرة يومية جارية. يجب أن تنهي تلك المغامرة قبل بدء يومية أخرى.
scenes.heroselectscene.daily_nowin=كل يوم تتاح لعبة جديدة متطابقة للجميع! هذه 'مغامرة اليوم' تولّد نفس الزنزانة لكل من يلعبها )طالما أنهم يلعبون نفس إصدار اللعبة أيضاً(.\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من لعب مغامرات اليوم._
