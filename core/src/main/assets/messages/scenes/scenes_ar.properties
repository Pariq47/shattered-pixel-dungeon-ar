scenes.welcomescene.controller_body=هل تلعب بعصا تحكم؟ استخدم العصا اليمنى للتحكم في مؤشر على الشاشة.\n\nاضغط RT/R2 أو العصا اليمنى للاختيار بالمؤشر.
