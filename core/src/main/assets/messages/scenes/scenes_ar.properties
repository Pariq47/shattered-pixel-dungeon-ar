scenes.heroselectscene.custom_seed_desc=تستخدم اللعبة رمز بذرة لتوليد الزنزانة، نفس البذرة ونفس إصدار اللعبة يولدان دائماً نفس الزنزانة! _ألعاب البذرة المخصصة لا يمكنها كسب الأوسمة ولا تحتسب ضمن الألعاب الملعوبة، وتظهر في أسفل صفحة الترتيب._
scenes.heroselectscene.custom_seed_duplicate=لديك بالفعل لعبة عادية جارية بتلك البذرة. يجب أن تنهي تلك اللعبة قبل استخدام تلك البذرة المخصصة.
scenes.heroselectscene.custom_seed_nowin=تستخدم اللعبة رمز بذرة لتوليد الزنزانة، نفس البذرة ونفس إصدار اللعبة يولدان دائماً نفس الزنزانة!\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من إدخال بذور مخصصة._
