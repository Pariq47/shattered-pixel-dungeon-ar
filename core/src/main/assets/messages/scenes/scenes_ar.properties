scenes.welcomescene.what_msg=يبدو أن ملفات حفظك الحالية من إصدار مستقبلي من Shattered Pixel Dungeon!\n\nتوخَّ الحذر! قد تحتوي ملفات حفظك على أشياء غير موجودة في هذا الإصدار، وقد يسبب ذلك أخطاء غريبة جداً.
scenes.welcomescene.lang_warning_title=ترجمة غير مكتملة
scenes.welcomescene.lang_warning_msg=لم تُترجم بعض محتويات هذا التحديث بعد.\n\nقد تظهر بعض العبارات باللغة الإنجليزية.\n\nتعمل فرق الترجمة على حل هذه المشكلة وستُضاف الترجمة الكاملة قريباً.\n\nشكراً لصبرك.
scenes.welcomescene.continue=متابعة
scenes.welcomescene.changelist=قائمة التغييرات
scenes.welcomescene.save_warning=انقطعت عملية حفظ بيانات لعبتك في Shattered Pixel Dungeon مؤخراً. تحتوي اللعبة على حمايات مدمجة ضد ذلك، لذا يفترض أن تكون بيانات لعبك سليمة.\n\nيحدث هذا عادة عندما يفقد جهازك الطاقة فجأة، أو عندما يُغلق اللعبة دون السماح لها بالإغلاق بشكل صحيح. قد تتسبب ميزات توفير البطارية في ذلك على الأجهزة المحمولة. قد تساعد إعادة تشغيل جهازك أيضاً إذا كنت ترى هذا الخطأ بشكل متكرر.
