scenes.titlescene$changesbutton.desc=تُحدَّث Shattered Pixel Dungeon بانتظام مع إصلاحات شاملة لمحتوى اللعبة الحالي أو محتوى جديد كلياً!\n\nكما يتحسن توازن اللعبة كثيراً في التحديثات، حتى لا تكون عناصر/أبطال/أعداء معينون أقوياء أو ضعفاء أكثر من اللازم.\n\nتشمل التحديثات أيضاً إصلاحات للأخطاء وتحسينات متنوعة للاستقرار.
scenes.titlescene$changesbutton.update=الانتقال إلى صفحة التحديث
