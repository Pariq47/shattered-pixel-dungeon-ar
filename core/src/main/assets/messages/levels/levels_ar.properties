levels.vaultlevel$vaultflametrap.desc=يبدو أن هذه الفتحة ترسل لهباً أخضر على فترات منتظمة. _بما أن هذه مجرد منطقة اختبار، فإن لهب الفتحات لن يؤذيك فعلياً._
