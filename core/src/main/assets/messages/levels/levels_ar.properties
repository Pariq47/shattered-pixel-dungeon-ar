levels.sewerlevel.bookshelf_desc=رف الكتب محشو بكتب رخيصة عديمة الفائدة. هل تحترق؟
levels.sewerlevel.region_deco_name=برميل تخزين
levels.sewerlevel.region_deco_desc=برميل متين يكبر حجمك تقريباً. لا بد أنه مملوء بشيء ما، إنه ثقيل جداً للتحريك.

