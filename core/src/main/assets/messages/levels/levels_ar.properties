levels.mininglevel.wall_desc=جدار صخري أملس أكثر ليونة قليلاً من المعتاد. يمكنك التنقيب خلاله بفأسك، لكن سيستغرق بعض الجهد ويزيد جوعك قليلاً.
levels.mininglevel.gold_extra_desc=يمكنك على الأرجح تنقيبه بفأسك.
levels.mininglevel.crystal_name=شوكة بلورية
levels.mininglevel.boulder_name=صخرة ضخمة
levels.mininglevel.crystal_desc=هناك نتوء بلوري كبير وملون هنا. هذه البلورات هشة ويمكن كسرها بسهولة بالفأس، أو ستنكسر إذا نُقّب شيء بجانبها.
levels.mininglevel.boulder_desc=هناك صخرة ضخمة تسد الطريق. ينبغي أن تكون سهلة الكسر بالفأس إلى حد ما.
levels.mininglevel.barricade_desc=المتاريس الخشبية مثبتة بإحكام وتعمل كدعم للسقف.\n\nهذا على الأرجح صنعه الجنول ليوفر بعض الحماية من الصخور الساقطة. _أي خلايا مجاورة ستكون محمية من فخاخ سقوط الصخور والهجمات._\n\nيبدو أنها ستحترق بنفس جودة أي متاريس أخرى.

levels.prisonlevel.water_name=ماء مظلم بارد
