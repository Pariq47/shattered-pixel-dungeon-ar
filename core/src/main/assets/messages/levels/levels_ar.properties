###features
levels.features.chasm.chasm=هاوية
levels.features.chasm.yes=نعم، أعرف ما أفعله
levels.features.chasm.no=لا، لقد غيرت رأيي
levels.features.chasm.jump=هل تريد حقاً القفز إلى الهاوية؟ السقوط من هذا الارتفاع سيكون مؤلماً.
levels.features.chasm.ondeath=لقد سقطت حتى الموت...
levels.features.chasm.rankings_desc=مات عند الارتطام



###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=جدار من اللهب الأخضر الساطع الكثيف هنا، ويبدو أنه ناتج عن السحر. إنه كثيف لدرجة أنك لا تستطيع المرور خلاله، ويشعل أي شيء يقترب كثيراً. لا تظهر عليه أي علامات على الخمود الطبيعي، ستحتاج لاستخدام شيء لإخماده.

levels.rooms.special.sentryroom$sentry.name=الحارس الأحمر
levels.rooms.special.sentryroom$sentry.desc=يبدو أن هذا الحارس الأحمر القاني موضوع هنا لحراسة الكنز في الطرف الآخر من هذه الغرفة. سيطلق عليك شعاعات من سحر التفكك إذا خطوت في المنطقة التي يدافع عنها.\n\nإنه محصن ضد كل التأثيرات الضارة ويستطيع الرؤية عبر التخفي، لكن يبدو أنه يحتاج لبعض الوقت ليشتعل قبل أن يبدأ بإطلاق النار.\n\nلسبب ما يريد الحارس إطلاق النار عليك أنت فقط، وكأنه يعلم أن سكان الزنزانة لا يشكلون تهديداً على الكنز.
levels.rooms.special.sentryroom$sentry.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.

levels.rooms.special.toxicgasroom$toxicvent.name=فتحة سامة
levels.rooms.special.toxicgasroom$toxicvent.desc=لا بد أن مغامراً مهملاً فعّل هذا الفخ منذ زمن بعيد. رغم حالته غير النشطة، ما زال ينفث الغاز السام في الغرفة ولا تظهر عليه أي علامات للتوقف. ستحتاج لطريقة ما لمنع الضرر من الغاز إذا أردت استكشاف هذه الغرفة.

levels.rooms.special.weakfloorroom$hiddenwell.name=بئر بعيدة
levels.rooms.special.weakfloorroom$hiddenwell.desc=يمكنك بالكاد تمييز بئر في الأعماق بالأسفل، ربما يوجد شيء هناك؟

levels.rooms.quest.ambitiousimproom$questentrance.name=مدخل الخزانة
levels.rooms.quest.ambitiousimproom$questentrance.desc=يبدو أن هذه الحفرة المشؤومة هي مدخل لخزانة أقزام قديمة. حاجز سحري يمنع الدخول، يمكنك المشي فوقه وكأن الأرض هنا.

levels.rooms.quest.blacksmithroom$questentrance.name=مدخل المنجم
levels.rooms.quest.blacksmithroom$questentrance.desc=هذا السلم يؤدي إلى منجم قديم أسفل ورشة الحداد مباشرة.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=علامة طقس
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=علامة مرسومة لطقس مظلم ما. توضع الشموع عادة على الزوايا الأربع.

levels.rooms.quest.massgraveroom$bones.name=قبر جماعي
levels.rooms.quest.massgraveroom$bones.desc=العظام تملأ الأرضية، ماذا حدث هنا؟

levels.rooms.quest.mineentrance$questexit.name=مخرج المنجم
levels.rooms.quest.mineentrance$questexit.desc=هذا السلم يؤدي خارج المنجم، عائداً إلى ورشة الحداد.

###traps
levels.traps.alarmtrap.name=فخ الإنذار
levels.traps.alarmtrap.alarm=يصدر الفخ صوتاً حاداً يتردد صداه في كل الزنزانة!
levels.traps.alarmtrap.desc=يبدو أن هذا الفخ مرتبط بآلية إنذار صاخبة. تفعيله على الأرجح سينبه كل شيء في الطابق.

levels.traps.blazingtrap.name=فخ اللهب الهائل
levels.traps.blazingtrap.desc=الخطو على هذا الفخ سيشعل خليطاً كيميائياً قوياً، مضرماً النار في منطقة واسعة.

levels.traps.burningtrap.name=فخ الحريق
levels.traps.burningtrap.desc=الخطو على هذا الفخ سيشعل خليطاً كيميائياً، مضرماً النار في المنطقة المحيطة.

levels.traps.chillingtrap.name=فخ التجميد
levels.traps.chillingtrap.desc=عند التفعيل، ستجمد المواد الكيميائية في هذا الفخ الهواء حول موقعه بسرعة.

levels.traps.confusiontrap.name=فخ غاز الارتباك
levels.traps.confusiontrap.desc=تفعيل هذا الفخ سيطلق سحابة من غاز الارتباك في المنطقة المجاورة مباشرة.

levels.traps.cursingtrap.name=فخ اللعنة
levels.traps.cursingtrap.curse=معداتك الملبوسة تصبح ملعونة!
levels.traps.cursingtrap.desc=يحتوي هذا الفخ على نفس السحر الخبيث الموجود في المعدات الملعونة. تفعيله سيلعن بعض الأغراض في المنطقة المجاورة مباشرة.

levels.traps.disarmingtrap.name=فخ نزع السلاح
levels.traps.disarmingtrap.disarm=سلاحك يُنقل بعيداً!
levels.traps.disarmingtrap.desc=يحتوي هذا الفخ على سحر نقل مكاني محدد جداً، سيقذف بسلاح ضحيته إلى مكان آخر.

levels.traps.disintegrationtrap.name=فخ التفكك
levels.traps.disintegrationtrap.one=الفخ يفكك %s الخاص بك!
levels.traps.disintegrationtrap.some=الفخ يفكك بعضاً من %s الخاص بك!
levels.traps.disintegrationtrap.ondeath=لقد قُتلت بواسطة فخ التفكك...
levels.traps.disintegrationtrap.desc=عند التفعيل، سيرشق هذا الفخ أقرب هدف بشعاعات التفكك، مسبباً ضرراً كبيراً ومدمراً الأغراض.\n\nلحسن الحظ أن آلية التفعيل ليست مخفية.

levels.traps.distortiontrap.name=فخ التشويه
levels.traps.distortiontrap.desc=مصنوع من سحر غريب مجهول المصدر، سيستدعي هذا الفخ كل أنواع المخلوقات إلى هذا الموقع.

levels.traps.explosivetrap.name=فخ متفجر
levels.traps.explosivetrap.desc=يحتوي هذا الفخ على بعض المتفجرات المسحوقة وآلية تفعيل. تفعيله سيسبب انفجاراً في المنطقة المجاورة مباشرة.

levels.traps.flashingtrap.name=فخ الوميض
levels.traps.flashingtrap.desc=عند التفعيل، سيشعل هذا الفخ مسحوق وميض قوي مخزن داخله، مسبباً العمى المؤقت والعرج والإصابة لضحيته.\n\nلا بد أن الفخ يملك مخزناً كبيراً من المسحوق، إذ يمكنه التفعيل مرات عديدة دون أن ينكسر.

levels.traps.flocktrap.name=فخ السرب
levels.traps.flocktrap.desc=ربما مزحة من ساحر هاوٍ، تفعيل هذا الفخ سيخلق سرباً من الخراف السحرية.

levels.traps.frosttrap.name=فخ الصقيع
levels.traps.frosttrap.desc=عند التفعيل، ستجمد المواد الكيميائية في هذا الفخ الهواء في نطاق واسع حول موقعه.

levels.traps.gatewaytrap.name=فخ البوابة
levels.traps.gatewaytrap.desc=هذا الفخ الناقل الخاص يمكنه التفعيل عدد لا نهائي من المرات وينقل دائماً إلى نفس الموقع.

levels.traps.geysertrap.name=فخ النافورة
levels.traps.geysertrap.desc=عند التفعيل، سيسبب هذا الفخ اندفاع نافورة من الماء، مسبباً الضرر للأعداء النارية، ودافعاً بعيداً كل الشخصيات القريبة، ومخمداً النيران، ومحولاً التضاريس المحيطة إلى ماء.

levels.traps.gnollrockfalltrap.name=فخ سقوط صخور الجنول
levels.traps.gnollrockfalltrap.desc=هذا الفخ الصخري مصنوع بنوع من المساعدة السحرية. عند التفعيل، سيسبب ارتخاء الصخور وسقوطها فوراً من الأعلى في منطقة 5x5 حوله. بسبب الصخور الأكثر ليونة في المنطقة، لن يسبب ضرراً بقدر فخ سقوط الصخور العادي، لكن درعك أيضاً لن يكون فعالاً ضده. الصخور أيضاً لن تسقط في المواقع ذات المتاريس المجاورة، إذ تساعد في حمل السقف.\n\n_هذا الفخ لا يميز الصديق من العدو، لذا فهو ضار للجنول بقدر ما هو ضار لك._

levels.traps.grimtrap.name=فخ الموت القاتم
levels.traps.grimtrap.ondeath=لقد قُتلت بواسطة انفجار فخ قاتم...
levels.traps.grimtrap.desc=سحر تدميري قوي للغاية مخزن داخل هذا الفخ، كافٍ لقتل كل الأبطال فوراً عدا الأصحاء منهم. تفعيله سيرسل انفجاراً بعيد المدى من السحر القاتل نحو أقرب شخصية.\n\nلحسن الحظ أن آلية التفعيل ليست مخفية.

levels.traps.grippingtrap.name=فخ الإمساك
levels.traps.grippingtrap.desc=يمسك هذا الفخ بأقدام من فعله، مسبباً الضرر ومبطئاً حركته.\n\nبسبب طبيعته البسيطة، يمكن لهذا الفخ التفعيل مرات عديدة دون أن ينكسر.

levels.traps.guardiantrap.name=فخ الحارس
levels.traps.guardiantrap.alarm=يصدر الفخ صوتاً حاداً يتردد صداه في كل الزنزانة!
levels.traps.guardiantrap.desc=هذا الفخ مرتبط بآلية سحرية غريبة، ستستدعي الحراس وتنبيه كل الأعداء في الطابق.
levels.traps.guardiantrap$guardian.name=حارس مستدعى
levels.traps.guardiantrap$guardian.desc=يبدو أن هذا الطيف الأزرق هو صدى مستدعى لأحد حراس الزنزانة الحجريين.
levels.traps.guardiantrap$guardian.desc_weapon=رغم أن التمثال نفسه شبه غير مادي، إلا أن الـ_%s_ الذي يحمله يبدو حقيقياً.
levels.traps.guardiantrap$guardian.discover_hint=يمكنك العثور على هذا العدو مع فخ محدد.

levels.traps.oozetrap.name=فخ الوحل
levels.traps.oozetrap.desc=سيرش هذا الفخ وحلاً كاوياً عند التفعيل، وسيحرق حتى يُغسل.

levels.traps.pitfalltrap.name=فخ الحفرة
levels.traps.pitfalltrap.triggered_hero=الأرض تبدأ بالانهيار من حولك!
levels.traps.pitfalltrap.triggered=الأرض تبدأ بالانهيار حول الفخ المُفعّل!
levels.traps.pitfalltrap.no_pit=الأرض صلبة جداً بحيث لا يعمل فخ الحفرة هنا.
levels.traps.pitfalltrap.desc=هذا الفخ متصل بآلية باب سري كبيرة، وبعد فترة قصيرة من تفعيله سينزلق أي شيء قريب منه عبر الأرض ويسقط! لكنه لن يعمل في المناطق ذات الأرضيات الصلبة بشكل خاص.

levels.traps.poisondarttrap.name=فخ السهم المسموم
levels.traps.poisondarttrap.ondeath=لقد قُتلت بواسطة فخ السهم المسموم...
levels.traps.poisondarttrap.desc=لا بد أن نافخ سهام صغير مخفي بالقرب، تفعيل هذا الفخ سيجعله يطلق سهماً مسموماً على أقرب هدف.\n\nلحسن الحظ أن آلية التفعيل ليست مخفية.

levels.traps.rockfalltrap.name=فخ سقوط الصخور
levels.traps.rockfalltrap.ondeath=لقد سُحقت بواسطة فخ سقوط الصخور...
levels.traps.rockfalltrap.desc=هذا الفخ متصل بسلسلة من الصخور المرتخية بالأعلى، تفعيله سيسبب سقوطها مدوية على الغرفة بأكملها! إذا لم يكن الفخ في غرفة محددة، ستسقط الصخور في منطقة حول الفخ بدلاً من ذلك.\n\nلحسن الحظ أن آلية التفعيل ليست مخفية.

levels.traps.shockingtrap.name=فخ الصدمة
levels.traps.shockingtrap.desc=آلية بكمية كبيرة من الطاقة مخزنة فيها. تفعيل هذا الفخ سيفرغ تلك الطاقة في حقل حوله.

levels.traps.stormtrap.name=فخ العاصفة
levels.traps.stormtrap.desc=آلية بكمية هائلة من الطاقة مخزنة فيها. تفعيل هذا الفخ سيفرغ تلك الطاقة في عاصفة كهربائية كبيرة.

levels.traps.summoningtrap.name=فخ الاستدعاء
levels.traps.summoningtrap.desc=تفعيل هذا الفخ سيستدعي عدداً من وحوش هذه المنطقة إلى هذا الموقع.

levels.traps.teleportationtrap.name=فخ النقل المكاني
levels.traps.teleportationtrap.desc=كلما فُعّل هذا الفخ، سيُنقل كل شيء حوله إلى مواقع عشوائية في هذا الطابق.

levels.traps.tengudarttrap.desc=من الواضح أن تينغو كان يستعد للقتال. هذا الفخ سيفعل نافخ سهام مخفي سيطلق سهماً مسموماً على أقرب شيء ليس تينغو.\n\nالفخ مصنوع ببراعة بحيث يستحيل اكتشاف آلية التفعيل دون مساعدة سحرية. لكن الفخ يظهر للحظة عند وضعه.

levels.traps.toxictrap.name=فخ الغاز السام
levels.traps.toxictrap.desc=تفعيل هذا الفخ سيطلق سحابة من الغاز السام في المنطقة المحيطة.

levels.traps.trap.discover_hint=يمكنك العثور على هذا الفخ عشوائياً في الزنزانة. كل منطقة لها فخاخ مختلفة قد تظهر.
levels.traps.trap.rankings_desc=قُتل بواسطة: %s

levels.traps.corrosiontrap.name=فخ الغاز الأكال
levels.traps.corrosiontrap.desc=تفعيل هذا الفخ سيطلق سحابة من الغاز الحمضي القاتل في المنطقة المجاورة مباشرة.

levels.traps.warpingtrap.name=فخ الالتواء
levels.traps.warpingtrap.desc=هذا الفخ مشابه لفخ النقل المكاني، لكنه سيسبب أيضاً فقدان البطل معرفته بتخطيط الطابق!

levels.traps.weakeningtrap.name=فخ الإضعاف
levels.traps.weakeningtrap.desc=السحر المظلم في هذا الفخ يمتص الطاقة من أي شيء يلامسه. الأعداء الأقوياء قد يقاومون التأثير، مع ذلك.

levels.traps.worndarttrap.name=فخ السهم البالي
levels.traps.worndarttrap.ondeath=لقد قُتلت بواسطة فخ السهم البالي...
levels.traps.worndarttrap.desc=لا بد أن نافخ سهام صغير مخفي بالقرب، تفعيل هذا الفخ سيجعله يطلق على أقرب هدف.\n\nبسبب قدمه ليس ضاراً جداً، بل إنه ليس مخفياً حتى...



###levels
levels.cavesbosslevel.wires_name=أسلاك مكشوفة
levels.cavesbosslevel.wires_desc=الأرض محفورة جزئياً هنا، كاشفة بعض الأسلاك الكبيرة المكشوفة. لا بد أنها توصل الآلات الكهربائية المختلفة مع بعضها.\n\nلا بد أن تياراً كهربائياً يمر في الأسلاك. إذا خطا DM-300 هنا فقد يتمكن من سحب الطاقة منها.
levels.cavesbosslevel.energy_desc=الأرض هنا تشرر بالكهرباء، والخطو عليها ضار. _يبدو أن الشرارات تنجذب في اتجاه معين..._ ربما تقود إلى مصدر الطاقة؟
levels.cavesbosslevel.gate_name=بوابة معدنية
levels.cavesbosslevel.gate_desc=بوابة معدنية كبيرة تسد الطريق إلى متروبوليس الأقزام. الصندوق المعدني في الوسط يصدر طنيناً صاخباً، لا بد أنه متصل بالدوائر والآلات القريبة. ربما تدمير DM-300 سيفتح البوابة؟
levels.cavesbosslevel.gate_desc_broken=لا بد أن البوابة كانت متصلة بـ DM-300 بطريقة ما، إذ انفجرت عند هزيمة DM-300. الآن تبقى فقط قطع محطمة.
levels.cavesbosslevel.water_desc=مع كل الكهرباء حول هنا قد لا يكون الماء آمناً دائماً...

levels.citybosslevel.throne_name=عرش
levels.citybosslevel.throne_desc=هذا العرش الكبير المثير للإعجاب هو مقر إمبراطورية الأقزام، وقد استولى عليه الآن نيكرومانسر مجنون بالسلطة.\n\nيبدو أن هناك أجزاء سحرية أو ميكانيكية في العرش، قد يملك ملك الأقزام قوة إضافية عند الجلوس عليه.
levels.citybosslevel.summoning_name=قاعدة استدعاء
levels.citybosslevel.summoning_desc=هذه القاعدة لها فتحة كبيرة في الوسط، تشع عملياً بالطاقة المظلمة.\n\nيستخدم ملك الأقزام هذه القواعد كنقاط تركيز لسحره النيكرومانسي، ويمكنه استدعاء الأعوان إليها. يجب أن تشحن القاعدة لعدة أدوار قبل ظهور العون، ونوع العون المستدعى يُنبأ به بواسطة الطاقة السحرية المتراكمة.

levels.caveslevel.grass_name=طحلب مضيء
levels.caveslevel.high_grass_name=فطر مضيء
levels.caveslevel.water_name=ماء متجمد البرودة
levels.caveslevel.entrance_desc=السلم يؤدي إلى العمق الأعلى.
levels.caveslevel.exit_desc=السلم يؤدي إلى العمق الأدنى.
levels.caveslevel.high_grass_desc=فطر ضخم يحجب الرؤية.
levels.caveslevel.wall_deco_desc=عرق من بعض الخام مرئي على الجدار. ذهب؟
levels.caveslevel.bookshelf_desc=من سيحتاج رف كتب في كهف؟
levels.caveslevel.region_deco_name=هيكل معدني
levels.caveslevel.region_deco_desc=هيكل معدني بالكامل كبير، ربما بناه الأقزام عندما كانوا ينقبون هذا المكان. تعتقد أنك ترى قضبان عربات منجم مهملة منذ زمن طويل تمر على القمة.

levels.citylevel.water_name=ماء ملون بشكل مريب
levels.citylevel.high_grass_name=زهور متفتحة عالية
levels.citylevel.entrance_desc=منحدر يؤدي إلى العمق الأعلى.
levels.citylevel.exit_desc=منحدر يؤدي إلى العمق الأدنى.
levels.citylevel.deco_desc=عدة بلاطات مفقودة هنا.
levels.citylevel.sp_desc=سجاد سميك يغطي الأرضية.
levels.citylevel.statue_desc=التمثال يصور قزماً ما واقفاً في وضع بطولي.
levels.citylevel.bookshelf_desc=صفوف الكتب في تخصصات مختلفة تملأ رف الكتب.
levels.citylevel.region_deco_name=قاعدة ملتهبة
levels.citylevel.region_deco_desc=قاعدة مرتفعة بلهب سحري أخضر ساطع فوقها. اللهب كثيف لدرجة أنه قد يكون صلباً.

levels.citylevel.upcoming_quest_intro_title=رسالة المطور
levels.citylevel.upcoming_quest_intro_body=التحديث الرئيسي التالي لـ Shattered Pixel Dungeon سيشمل إعادة تصميم للمهمة التي يعطيها القزم الطموح! ستكلفك هذه المهمة بمداهمة خزانة أقزام قديمة، وأنت واقف حالياً فوق مدخلها.\n\nحالياً منطقة المهمة الجديدة فارغة تماماً، لكن نرحب بك للنزل والتجول، لاختبار المنطقة الجديدة وتقديم ملاحظات مبكرة!\n\nإحدى آليات المهمة هي أن أياً من أغراضك لن تأتي معك، لذا عند النزول ستفقد أغراضك مؤقتاً و_ستُعطى بلورة هروب تمكنك من العودة._ تأثيرات الجوع والتجدد ستتوقف أيضاً.\n\n- Evan
