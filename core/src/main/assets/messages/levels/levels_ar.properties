levels.prisonlevel.bookshelf_desc=هذا على الأرجح بقايا من مكتبة السجن. هل تحترق؟
levels.prisonlevel.region_deco_name=قفص سجن
levels.prisonlevel.region_deco_desc=قفص معدني كبير بما يكفي بالكاد لشخص. يبدو أنه مقفل على الأرض بطريقة ما، لا تستطيع تحريكه.
levels.prisonlevel.region_deco_alt_name=قفص معلق
levels.prisonlevel.region_deco_alt_desc=قفص معدني كبير بما يكفي بالكاد لشخص. إنه معلق فوق هاوية عميقة، معلق بسلسلة.

levels.sewerlevel.water_name=ماء عكر
