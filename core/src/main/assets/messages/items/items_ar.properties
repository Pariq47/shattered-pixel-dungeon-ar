items.weapon.melee.gauntlet.ability_desc=يمكن للمبارزة تنفيذ _ضربة متتابعة_ بالقفاز الحجري. هذا الهجوم مضمون الإصابة ويسبب _+%d ضرر_ لكل مرة أصابت فيها المبارزة بهجوم قريب أو رمي عادي. عدم الإصابة لـ5 أدوار يصفّر هذا التتابع.
