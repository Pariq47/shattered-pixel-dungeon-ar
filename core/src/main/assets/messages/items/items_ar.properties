items.weapon.melee.flail.ability_name=دوران
items.weapon.melee.flail.spin_warn=لا يمكنك تدوير الكرة المسلسلة أكثر.
items.weapon.melee.flail.typical_ability_desc=يمكن للمبارزة _تدوير_ الكرة المسلسلة لبناء القوة لفترة قصيرة. كل دور تُدار فيه الكرة المسلسلة تسبب عادة _+%d ضرر_ في هجومها العادي التالي، بحد أقصى 3 مرات. الكرة المسلسلة الدوارة مضمونة الإصابة أيضاً. فقط بدء الدوران يكلف شحنة.
items.weapon.melee.flail.ability_desc=يمكن للمبارزة _تدوير_ الكرة المسلسلة لبناء القوة لفترة قصيرة. كل دور تُدار فيه الكرة المسلسلة تسبب _+%d ضرر_ في هجومها العادي التالي، بحد أقصى 3 مرات. الكرة المسلسلة الدوارة مضمونة الإصابة أيضاً. فقط بدء الدوران يكلف شحنة.
items.weapon.melee.flail.desc=كرة شائكة متصلة بمقبض بطول من السلسلة. غير عملية جداً، لكنها مدمرة إذا وجهت ضربة قوية.
items.weapon.melee.flail$spinabilitytracker.name=دوران
items.weapon.melee.flail$spinabilitytracker.desc=المبارزة تدور كرتها المسلسلة، مبنية الضرر لهجومها العادي التالي بها. كل دورة تأخذ دوراً واحداً لكنها تزيد الضرر، بحد أقصى ثلاث دورات. الكرة المسلسلة مضمونة الإصابة أيضاً أثناء الدوران.
الدورات الحالية: %1$d%%.
الأدوار المتبقية: %2$s.
