items.food.blandfruit.firefruit=ثمرة النار
items.food.blandfruit.icefruit=ثمرة الجليد
items.food.blandfruit.fadefruit=ثمرة التلاشي
items.food.blandfruit.sorrowfruit=ثمرة الحزن
items.food.blandfruit.stormfruit=ثمرة العاصفة
items.food.blandfruit.dreamfruit=ثمرة الساحر
items.food.blandfruit.starfruit=ثمرة النجم
items.food.blandfruit.swiftfruit=ثمرة السرعة
items.food.blandfruit.raw=لا تطيق أكلها نيئة.
items.food.blandfruit.desc=جافة وضئيلة جداً، ربما طهيها مع مكون آخر سيحسنها.
items.food.blandfruit.desc_cooked=الثمرة امتلأت من وقت نقعها في القدر وحتى امتصت خصائص البذرة التي طُهيت معها. سيكون لها تأثير أياً كانت الجرعة التي تقابلها البذرة.
items.food.blandfruit.desc_eat=تبدو جاهزة للأكل!
items.food.blandfruit.desc_throw=تبدو متقلبة إلى حد ما، ربما من الأفضل رميها.
items.food.blandfruit$chunks.name=قطع الثمرة الباهتة
items.food.blandfruit$chunks.desc=الثمرة الباهتة انفجرت عند الارتطام، تاركة قطعاً خاملة خلفها.\nرغم قليل من الأوساخ، هذه القطع الكبيرة من الثمرة الباهتة المطهوة تبدو صالحة للأكل تماماً.
items.food.chargrilledmeat.name=لحم مشوي
items.food.chargrilledmeat.desc=يبدو كشريحة لحم لائقة.
items.food.chargrilledmeat.discover_hint=يمكنك صنع هذا باستخدام غرض طعام آخر.
items.food.food.name=حصة غذائية
items.food.food.ac_eat=أكل
items.food.food.eat_msg=كان طعم ذلك الطعام لذيذاً!
items.food.food.desc=لا شيء فاخر هنا: لحم مجفف، بعض البسكويت - أشياء من هذا القبيل.
items.food.frozencarpaccio.name=شرائح لحم مجمدة
items.food.frozencarpaccio.invis=ترى يديك تصبحان غير مرئيتين!
items.food.frozencarpaccio.hard=تشعر بشرتك تقسو!
items.food.frozencarpaccio.refresh=منعش!
items.food.frozencarpaccio.better=تشعر بتحسن!
items.food.frozencarpaccio.desc=إنها قطعة لحم نيئ مجمد. الطريقة الوحيدة لأكلها هي قطع شرائح رقيقة منها. وبهذه الطريقة هي جيدة بشكل مفاجئ.
items.food.frozencarpaccio.discover_hint=يمكنك صنع هذا باستخدام غرض طعام آخر.
items.food.meatpie.name=فطيرة لحم
items.food.meatpie.eat_msg=كان ذلك الطعام رائعاً!
items.food.meatpie.desc=فطيرة لذيذة محشوة بلحم شهي. هذا سيشبعك أكثر بكثير من أي وجبة أخرى.
items.food.meatpie.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.food.mysterymeat.name=لحم غامض
items.food.mysterymeat.eat_msg=كان طعم ذلك الطعام... غريباً.
items.food.mysterymeat.hot=أوه إنه ساخن!
items.food.mysterymeat.legs=لا تشعر بساقيك!
items.food.mysterymeat.not_well=أنت لا تشعر بأنك بخير.
items.food.mysterymeat.stuffed=أنت متخم.
items.food.mysterymeat.desc=كل على مسؤوليتك الخاصة!
items.food.mysterymeat.discover_hint=يمكنك الحصول على هذا الغرض كغنيمة من أعداء معينين.
items.food.mysterymeat$placeholder.name=لحم
items.food.phantommeat.name=لحم شبحي
items.food.phantommeat.desc=شريحة كبيرة لامعة شفافة، مقطوعة من سمكة بيرانا شبحية. هذا اللحم السحري لا يحتاج طهياً ويمنح عدداً من الفوائد الدفاعية إضافة إلى إشباعك تماماً. عند أكله سيمنح تخفياً، وجلداً شجرياً، وبعض الشفاء، ويعالج العديد من التأثيرات الضارة.
items.food.phantommeat.discover_hint=يمكنك الحصول على هذا الغرض كغنيمة من أعداء معينين.
items.food.pasty.name=فطيرة كورنية
items.food.pasty.fish_name=سمك مطهو على البخار
items.food.pasty.amulet_name=تميمة يندور؟
items.food.pasty.egg_name=بيضة العيد
items.food.pasty.rainbow_name=جرعة قوس قزح
items.food.pasty.shattered_name=كعكة خضراء
items.food.pasty.pie_name=فطيرة يقطين
items.food.pasty.vanilla_name=كعكة زرقاء
items.food.pasty.cane_name=عصا حلوى
items.food.pasty.sparkling_name=جرعة فوارة
items.food.pasty.desc=فطيرة كورنية أصيلة بحشوة تقليدية من اللحم والبطاطس. لذيذة!
items.food.pasty.fish_desc=سمكة كاملة مطهوة على البخار، محفوظة سحرياً على فراش من الخضار. من التقليد حفظ بعض السمك لوقت لاحق في مثل هذا الوقت من السنة، لذا ستحتفظ ببعض البقايا بدلاً من أكلها كلها دفعة واحدة.\nسنة قمرية جديدة سعيدة!
items.food.pasty.amulet_desc=أخيراً وجدتها، التميمة السحرية - لحظة، هذه مجرد شوكولاتة مغلفة بورق فضي لتشبه التميمة! لن تمنحك قوة لا محدودة، لكنها على الأقل ستملؤك وتمنحك قليلاً من شحنة القطع الأثرية.\nكذبة أبريل!
items.food.pasty.egg_desc=بيضة شوكولاتة كبيرة عظيمة، مغلفة بورق أصفر ملون. هناك بسهولة ما يكفي من الشوكولاتة هنا لملئك، والسكر قد يمنح قطعك الأثرية قليلاً من الشحنة الإضافية.\nعيد فصح سعيد!
items.food.pasty.rainbow_desc=هذه الجرعة الملونة نوع من الطعام السائل. إضافة إلى إشباع جوعك، فيها قليل من السحر الذي سيهدئ عدواً مجاوراً غير زعيم، جاعلاً إياه متردداً مؤقتاً في قتالك.\nعيد فخر سعيد!
items.food.pasty.shattered_desc=هذه الشريحة الكبيرة من كعكة الفانيلا عليها رشات ملونة وطلاء أخضر. الكعكة صُنعت للاحتفال بسنوات من الخبرة، وستمنحك كمية صغيرة من تلك الخبرة عند أكلها.\nShattered Pixel Dungeon صدر لأول مرة في 5 أغسطس 2014. عيد ميلاد سعيد يا Shattered Pixel Dungeon!
items.food.pasty.pie_desc=شريحة كبيرة عظيمة من فطيرة اليقطين. نكهتها الحلوة والحارة ستملؤك وتمنحك قليلاً من الشفاء.\nهالوين سعيد!
items.food.pasty.vanilla_desc=هذه الشريحة الكبيرة من كعكة الفانيلا عليها رشات ملونة وطلاء أزرق. الكعكة صُنعت للاحتفال بسنوات من الخبرة، وستمنحك كمية صغيرة من تلك الخبرة عند أكلها.\nPixel Dungeon الأصلي صدر لأول مرة في 4 ديسمبر 2012. عيد ميلاد سعيد يا Pixel Dungeon!
items.food.pasty.cane_desc=عصا حلوى سكرية حلوة ضخمة. كبيرة بما يكفي لملئك، والسكر قد يمنح عصيك السحرية قليلاً من الشحنة الإضافية أيضاً.\nأعياد سعيدة!
items.food.pasty.sparkling_desc=هذه الجرعة الفوارة نوع من الطعام السائل. تشبع الجوع وتحاكي النبيذ الفوار، لكنها ليست كحولية في الواقع. الشعور الدافئ في بطنك سيمنح قليلاً من الحماية.\nسنة جديدة سعيدة!
items.food.pasty$fishleftover.name=بقايا سمك
items.food.pasty$fishleftover.eat_msg=كان طعم ذلك الطعام مقبولاً.
items.food.pasty$fishleftover.desc=بعض فائض السمك من وجبتك السابقة. يمكنك أكله في أي وقت تشاء لاستعادة قليل من الجوع.
items.food.smallration.name=حصة غذائية صغيرة
items.food.smallration.eat_msg=كان طعم ذلك الطعام مقبولاً.
items.food.smallration.desc=تبدو تماماً كحصة غذائية قياسية لكن أصغر.
items.food.smallration.discover_hint=يمكنك شراء هذا الغرض من متجر.
items.food.stewedmeat.name=لحم مطهو
items.food.stewedmeat.eat_msg=كان طعم ذلك الطعام مقبولاً.
items.food.stewedmeat.desc=طهي اللحم نظفه من أي مرض أو طفيليات. ينبغي أن يكون آمناً للأكل.
items.food.stewedmeat.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.food.supplyration.name=حصة إمداد
items.food.supplyration.desc=هذه الحصة تُركت في الزنزانة بواسطة ولأجل أعضاء نقابة اللصوص. مصممة خصيصاً لتُؤكل أثناء التنقل، وتساعد في أعمال التسلل العامة.\nرغم أنها لا تملؤك بقدر الحصة العادية، يمكن أكلها بسرعة، توفر قليلاً من الشفاء المباشر، وستعيد شحنة إلى عباءة ظلال اللص.
items.food.supplyration.discover_hint=يمكنك العثور على هذا الغرض باستخدام موهبة بطل محددة.
##journal items
items.journal.documentpage.name=صفحة ممزقة
items.journal.documentpage.desc=صفحة وحيدة، على الأرجح ممزقة من كتاب ما. ستحتاج لالتقاطها لقراءتها.
items.journal.alchemypage.name=صفحة ممزقة من كتاب الخيمياء
items.journal.alchemypage.desc=صفحة ممزقة من كتاب إرشادي عن الخيمياء.\nمعظم النص صغير جداً ليُقرأ عن بعد، لكن يمكنك تمييز عنوان الصفحة:\n_"%s"_
items.journal.guidebook.name=مجلد إتقان الزنزانة
items.journal.guidebook.hint_mobile=دليلك لديه نصيحة لك! اضغط زر الصحيفة الوامض في الأعلى يميناً لقراءتها.
items.journal.guidebook.hint_desktop=دليلك لديه نصيحة لك! اختر زر الصحيفة الوامض )%s( في الأعلى يميناً لقراءتها.
items.journal.guidebook.hint_status=الدليل
items.journal.guidebook.desc=كتاب إرشادي لمغامر، تُرك هنا بواسطة شخص قرر أن المغامرة ليست له! هذا الكتاب تحديداً سحري، ويمكنه حث المغامرين على قراءة صفحة في اللحظة المناسبة.\nرغم تلك الوظيفة، الكتاب الأكثر شعبية بسبب الكلمات الكبيرة "لا تذعر!" المكتوبة بحروف كبيرة ودودة على الغلاف.
items.journal.guidepage.name=صفحة ممزقة من الكتاب الإرشادي
items.journal.guidepage.desc=صفحة ممزقة من كتاب إرشادي للمغامرة.\nمعظم النص صغير جداً ليُقرأ عن بعد، لكن يمكنك تمييز عنوان الصفحة:\n_"%s"_
items.journal.regionlorepage$sewers.name=رسالة بالية
items.journal.regionlorepage$sewers.desc=ما يبدو رسالة، مكتوبة على قطعة ورق ملطخة بالأوساخ. ستحتاج لالتقاطها لتتمكن من تمييز ما مكتوب عليها.
items.journal.regionlorepage$prison.name=قيد صحيفة بالٍ
items.journal.regionlorepage$prison.desc=قيد صحيفة، أو نوع آخر من السجلات، مكتوب على قطعة ورق قديمة. يبدو أنه صمد أفضل من الرسائل التي وجدتها في المجاري، لكنك ستحتاج لالتقاطه لقراءته.
items.journal.regionlorepage$caves.name=قيد سجل قديم
items.journal.regionlorepage$caves.desc=ما يبدو أنه قيد في سجل مستكشف، محفوظ بشكل مفاجئ جيداً رغم قدمه المفترض. التقطه لقراءته.
items.journal.regionlorepage$city.name=لوح صدئ
items.journal.regionlorepage$city.desc=لوح معدني صغير صدئ برسالة محفورة سحرياً فيه. الحروف ما زالت واضحة رغم قدم اللوح، لكن عليك التقاطه لقراءته.
items.journal.regionlorepage$halls.name=لوح متوهج
items.journal.regionlorepage$halls.desc=لوح أسود صغير بحروف خضراء متوهجة محفورة فيه. الحروف المتوهجة تتشابك في ضباب عن بعد، عليك التقاطه لقراءته.
###keys
items.keys.goldenkey.name=مفتاح ذهبي
items.keys.goldenkey.desc=الشقوق في هذا المفتاح الذهبي صغيرة ومعقدة. ربما سيفتح صدراً مقفلاً؟
items.keys.crystalkey.name=مفتاح بلوري
items.keys.crystalkey.desc=الأسطح المقطوعة لهذا المفتاح البلوري تلمع في الظلام. ربما سيفتح شيئاً مصنوعاً من البلور؟
items.keys.ironkey.name=مفتاح حديدي
items.keys.ironkey.desc=الشقوق في هذا المفتاح الحديدي القديم بالية جيداً؛ رباطه الجلدي متعب من العمر. أي باب قد يفتح؟
items.keys.wornkey.name=مفتاح بالٍ
items.keys.wornkey.desc=هذا المفتاح بالٍ وباهت اللون، لكنه يبدو جاداً. على الأرجح يمكنه فتح بعض الأبواب الجادة القريبة.
