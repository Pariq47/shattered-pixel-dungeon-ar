items.brokenseal.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.brokenseal$warriorshield.name=درع المحارب
items.brokenseal$warriorshield.desc_active=ختم المحارب المكسور يساعده حالياً على المثابرة، مانحاً إياه حماية فوق صحته. هناك فترة تهدئة بعد تفعيل الحماية أول مرة قبل أن يمكن استخدامها مجدداً.
هذا الدرع لا يتلاشى مع الزمن، لكنه سينتهي إذا لم يكن هناك أعداء قريبون لعدة أدوار. عند انتهائه، أي حماية غير مستخدمة ستقلل فترة التهدئة، حتى حد أقصى 50%%.
