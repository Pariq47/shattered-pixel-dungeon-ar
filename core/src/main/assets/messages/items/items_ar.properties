items.artifacts.skeletonkey.wont_open=المفتاح يرفض الدخول في هذا القفل لسبب ما.
items.artifacts.skeletonkey.locked_with_key=ذلك الباب قُفل بمفتاحك الهيكلي.
items.artifacts.skeletonkey.force_lock=القفل ضعف بدون مفتاحك الهيكلي. تفلح في فتحه عنوة.
items.artifacts.skeletonkey.discard=تتخلص من مفاتيحك الفائضة.
items.artifacts.skeletonkey.levelup=مفتاحك الهيكلي يصبح أقوى!
items.artifacts.skeletonkey.desc=مفتاح ذو مظهر مهم برأس على شكل جمجمة. أسنانه تبدو مختلفة في كل مرة تنظر إليها.
items.artifacts.skeletonkey.desc_worn=هذا المفتاح السحري يبدو أنه يكسب قوة كلما استخدمته بدلاً من مفاتيح الزنزانة العادية. يمكن إدراجه في معظم أقفال الزنزانة لفتحها أو إغلاقها، بما فيها الأبواب التي لم تُقفل سابقاً.\nالمفتاح يمكن استخدامه حتى على مساحة فارغة في اتجاه أساسي أو مائل لـ"قفل" الهواء أمامك، منشئاً جداراً صلباً بعرض 3 بلاطات يدوم 10 أدوار. القفل سيدفع الأعداء بعيداً إذا وجدت مساحة لذلك.
items.artifacts.skeletonkey.desc_cursed=المفتاح الملعون يبدو أنه يتجنب الدخول في أي قفل بنشاط، وحتى يجعل استخدامك مفاتيحك الأخرى صعباً )لكن ليس مستحيلاً(.
items.artifacts.skeletonkey$keywall.desc=جدار سحري مؤقت وُضع هنا بواسطة المفتاح الهيكلي.
items.artifacts.talismanofforesight.name=طِلسم البصيرة
items.artifacts.talismanofforesight.ac_scry=كشف
items.artifacts.talismanofforesight.low_charge=الطِلسم يتطلب على الأقل 5% شحنة للكشف.
items.artifacts.talismanofforesight.prompt=اختر موقعاً للمسح.
items.artifacts.talismanofforesight.levelup=طِلسمك يصبح أقوى!
items.artifacts.talismanofforesight.full_charge=طِلسمك مشحون تماماً!
items.artifacts.talismanofforesight.desc=حجر أملس بنقوش غريبة عليه. تشعر وكأنه يراقب كل ما حولك، متنبهاً لأي شيء مخفي.
items.artifacts.talismanofforesight.desc_worn=عندما تمسك الطِلسم تشعر وكأن حواسك متحدة. الطِلسم يبني شحنة ببطء كلما مر الزمن وكلما اكتشفت أبواباً أو فخاخاً مخفية.\nالطِلسم يمكنه استهلاك شحنته لـ"الكشف" بشكل مخروطي، مما يكشف كل البلاطات والأسرار في المنطقة الممسوحة، وسيمنحك رؤية الأعداء والأغراض لفترة قصيرة.
items.artifacts.talismanofforesight.desc_cursed=الطِلسم الملعون يحدق فيك بانتباه، مثبطاً حواسك.
items.artifacts.talismanofforesight$foresight.name=بصيرة
items.artifacts.talismanofforesight$foresight.uneasy=تشعر بقلق.
items.artifacts.talismanofforesight$foresight.desc=تشعر بعصبية شديدة، وكأن هناك خطراً قريباً غير مرئي.
items.artifacts.timekeepershourglass.name=ساعة حارس الزمن
items.artifacts.timekeepershourglass.ac_activate=تفعيل
items.artifacts.timekeepershourglass.deactivate=تلغي تفعيل تجميد الزمن.
items.artifacts.timekeepershourglass.no_charge=ساعتك لم تشحن بما يكفي لتُستخدم بعد.
items.artifacts.timekeepershourglass.cursed=لا يمكنك استخدام ساعة ملعونة.
items.artifacts.timekeepershourglass.onstasis=يبدو أن العالم يتحول حولك في لحظة.
items.artifacts.timekeepershourglass.onfreeze=كل ما حولك يتجمد فجأة.
items.artifacts.timekeepershourglass.stasis=ضع نفسي في سبات
items.artifacts.timekeepershourglass.freeze=جمّد الزمن حولي
items.artifacts.timekeepershourglass.prompt=كيف تريد استخدام سحر الساعة؟\nأثناء السبات، سيتحرك الزمن طبيعياً بينما أنت متجمد وغير قابل للأذى تماماً، يستهلك حتى شحنتين في المرة.\nعند تجميد الزمن، يمكنك التحرك وكأن أفعالك لا تستهلك وقتاً. هذا يمكن إلغاؤه في أي وقت باستخدام الساعة أو المهاجمة.
items.artifacts.timekeepershourglass.desc=هذه الساعة الكبيرة المزخرفة تبدو متواضعة تماماً، لكنك تشعر بقوة عظيمة في إطارها المنحوت بدقة. أثناء تدويرك الساعة ومراقبتك الرمل ينسكب يمكنك الشعور بسحرها يجذبك، بالتأكيد استخدام هذا السحر سيمنحك بعض التحكم على الزمن.
items.artifacts.timekeepershourglass.desc_hint=الساعة تبدو وكأنها فقدت بعض الرمل، ليتك تجد بعضه...
items.artifacts.timekeepershourglass.desc_cursed=الساعة الملعونة مقفلة على جنبك، يمكنك الشعور بها تحاول التلاعب بتدفق زمنك.
items.artifacts.timekeepershourglass$timefreeze.name=تجميد الزمن
items.artifacts.timekeepershourglass$timefreeze.desc=الزمن متجمد حولك، يتيح لك أداء الأفعال فوراً. التأثير سيدوم حتى الإلغاء أو نفاد شحنة ساعتك. المهاجمة أو استخدام السحر سيكسران هذا التأثير أيضاً.\nأدوار حتى استخدام الشحنة: %s.
items.artifacts.timekeepershourglass$sandbag.name=كيس رمل سحري
items.artifacts.timekeepershourglass$sandbag.levelup=تضيف الرمل إلى ساعتك.
items.artifacts.timekeepershourglass$sandbag.maxlevel=ساعتك ممتلئة بالرمل السحري!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=ليس لديك ساعة لوضع هذا الرمل فيها.
items.artifacts.timekeepershourglass$sandbag.desc=هذا الكيس الصغير من الرمل الناعم ينبغي أن يعمل تماماً مع ساعتك.\nمن الغريب أن صاحب المتجر يملك هذا الغرض المحدد بالضبط عندما تحتاجه...
items.artifacts.unstablespellbook.name=كتاب تعويذ غير مستقر
items.artifacts.unstablespellbook.ac_read=قراءة
items.artifacts.unstablespellbook.ac_add=إضافة
items.artifacts.unstablespellbook.blinded=لا يمكنك القراءة من الكتاب أثناء العمى.
items.artifacts.unstablespellbook.no_charge=كتاب تعويذك نفدت طاقته حالياً.
items.artifacts.unstablespellbook.cursed=لا يمكنك القراءة من كتاب تعويذ ملعون.
items.artifacts.unstablespellbook.prompt=اختر لفافة
items.artifacts.unstablespellbook.infuse_scroll=تحقن طاقة اللفافة في الكتاب.
items.artifacts.unstablespellbook.unable_scroll=لا تستطيع إضافة هذه اللفافة إلى الكتاب.
items.artifacts.unstablespellbook.unknown_scroll=لست متأكداً بعد من نوع هذه اللفافة.
items.artifacts.unstablespellbook.desc=هذا المجلد في حالة جيدة بشكل مثير بالنظر إلى قدمه. يفور وطقطقة أثناء تقليبك الصفحات، مفعمّاً بطاقة غير مستقرة. إذا قرأت من هذا الكتاب، لا يمكن معرفة أي تعويذة قد تلقي.
items.artifacts.unstablespellbook.desc_cursed=الكتاب الملعون ربط نفسه بك، إنه يثبط قدرتك على استخدام معظم اللفافات.
items.artifacts.unstablespellbook.desc_index=الكتاب غير مكتمل. فهرسه يشير حالياً إلى الصفحات الفارغة التالية:
items.artifacts.unstablespellbook.desc_empowered=اللفافات التي أضفتها إلى الكتاب تتوهج بقوة. ستتمكن من اختيار النسخة الغريبة من تأثيرات هذه اللفافات، لكن بكلفة شحنة إضافية.
items.artifacts.unstablespellbook.read_empowered=اللفافة التي أضفتها إلى كتاب التعويذ تفعم بالطاقة. أنت قادر على توجيه إما النسخة العادية أو الغريبة من تأثير هذه اللفافة.\nاختيار النسخة الغريبة سيكلف شحنتين بدلاً من واحدة.
###bags
items.bags.bag.name=حقيبة ظهر
items.bags.bag.discover_hint=يمكنك شراء هذا الغرض من متجر.
items.bags.potionbandolier.name=حزام الجرعات
items.bags.potionbandolier.desc=هذا الحزام السميك يلتف حول صدرك كوشاح، عليه العديد من الأشرطة المعزولة لحمل قوارير الجرعات، أو قربتك، أو قوارير المعدن السائل.\nأثناء وجودها داخل الحزام، ينبغي أن تكون جرعاتك محمية من البرد.
items.bags.scrollholder.name=حامل اللفافات
items.bags.scrollholder.desc=هذا الوعاء الأنبوبي يبدو وكأنه يحمل أدوات وخرائط فلكي، لكن لفافاتك ستناسبه بنفس الجودة. هناك حتى بعض الجيوب الجانبية التي تناسب تماماً بلورات التعويذ، والأقلام السحرية، والراتنج السحري.\nالحامل لا يبدو قابلاً للاشتعال كثيراً، لذا لفافاتك ينبغي أن تكون بأمان من النار داخله.
items.bags.velvetpouch.name=كيس مخملي
items.bags.velvetpouch.desc=هذا الكيس المخملي الصغير يمكنه تخزين العديد من الأغراض الصغيرة فيه، مثل البذور، والأحجار الرونية، وبعض مكونات الخيمياء.
items.bags.velvetpouch.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.bags.magicalholster.name=جعبة سحرية
items.bags.magicalholster.desc=هذه الجعبة النحيلة مصنوعة من جلد حيوان غريب، وتملك سحراً قوياً يتيح لها تخزين كمية هائلة من الأسلحة بعيدة المدى.\nيمكنك ببساطة مد يدك داخل الكيس وستمسك دائماً الغرض الذي كنت تبحث عنه.\nبسبب سحر الجعبة، ستُشحن العصي السحرية أسرع قليلاً وستدوم الأسلحة المرمية أطول قليلاً داخلها.
###bombs
items.bombs.arcanebomb.name=قنبلة سحرية
items.bombs.arcanebomb.desc=هذه القنبلة مُشبعة بخصائص سحرية. ستنفجر في انفجار قوي مشابه لهجوم غو المتضخم، مسببة _%1$d-%2$d ضرر سحري_ لأي شيء ضمن بلاطتين.
items.bombs.arcanebomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.bomb.name=قنبلة
items.bombs.bomb.ac_lightthrow=إشعال ورمي
items.bombs.bomb.snuff_fuse=تخمد فتيل القنبلة بسرعة.
items.bombs.bomb.ondeath=الانفجار يقتلك...
items.bombs.bomb.rankings_desc=قُتل بانفجار
items.bombs.bomb.desc=قنبلة مسحوق أسود ثقيلة إلى حد ما. انفجار هذه القنبلة يوجه _%1$d-%2$d ضرر_ لأي شيء مجاور لها، وسيدمر بعض التضاريس أو الأغراض المجاورة.
items.bombs.bomb.desc_fuse=يبدو أن الفتيل سيستغرق بضعة أدوار ليحترق بمجرد إشعاله.
items.bombs.bomb.desc_burning=فتيل القنبلة يحترق، حافظ على مسافتك أو أخمده!
items.bombs.bomb$doublebomb.name=قنبلتان
items.bombs.bomb$doublebomb.desc=كومة من قنبلتين ثقيلتين من المسحوق الأسود، يبدو أنك حصلت على واحدة مجاناً!
items.bombs.firebomb.name=قنبلة نارية
items.bombs.firebomb.desc=هذه القنبلة عُدلت لتنفجر في منطقة أكبر، مسببة _%1$d-%2$d ضرر_ وناشرة لهباً مستمراً ضمن بلاطتين.
items.bombs.firebomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.flashbangbomb.name=قنبلة وميضية
items.bombs.flashbangbomb.desc=هذه القنبلة المخصصة ستنفجر في وميض من الضوء والصوت والكهرباء عند انفجارها. أي شيء ضمن بلاطتين سيتلقى _%1$d-%2$d ضرر_ من الانفجار، و25%% ضرراً إضافياً من الكهرباء، وسيُصعق لـ10 أدوار.
items.bombs.flashbangbomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.frostbomb.name=قنبلة صقيع
items.bombs.frostbomb.desc=هذه القنبلة عُدلت لتنفجر في منطقة أكبر، مسببة _%1$d-%2$d ضرر_ وناشرة هبة مستمرة من الهواء المتجمد ضمن بلاطتين.
items.bombs.frostbomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.holybomb.name=قنبلة مقدسة
items.bombs.holybomb.desc=هذه القنبلة عُدلت لتومض بضوء مقدس في منطقة أكبر عند انفجارها. أي شيء ضمن بلاطتين سيتلقى _%1$d-%2$d ضرر_ من الانفجار، والأعداء الأموات أحياء أو الشيطانية ستتلقى 50%% ضرراً إضافياً من الضوء المقدس.
items.bombs.holybomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.noisemaker.name=صانع الضجيج
items.bombs.noisemaker.desc=هذه القنبلة المخصصة ستصدر ضجيجاً متكرراً عندما ينتهي فتيلها. عندما يلمس شيء القنبلة، ستنفجر مسببة _%1$d-%2$d ضرر_ لأي شيء ضمن بلاطتين!
items.bombs.noisemaker.desc_burning=صانع الضجيج يعدّ تنازلياً، سينفجر عندما يقترب شيء!
items.bombs.noisemaker.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.smokebomb.name=قنبلة دخانية
items.bombs.smokebomb.desc=هذه القنبلة عُدلت لتنفث سحابة كثيفة من الغاز في نفس وقت الانفجار. ستسبب _%1$d-%2$d ضرر_ وتنشر ضباباً حاجباً ضمن بلاطتين.
items.bombs.smokebomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.regrowthbomb.name=قنبلة إعادة النمو
items.bombs.regrowthbomb.desc=هذه القنبلة المخصصة سترش سائلاً مانحاً للحياة في كل مكان ضمن 3 بلاطات بدلاً من الانفجار. المنطقة المصابة بالانفجار ستنبت عشباً ونباتات بسرعة. أنت وأي حلفاء مصابين بالانفجار ستُشفون وكأنكم شربتم جرعة شفاء.
items.bombs.regrowthbomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.shrapnelbomb.name=قنبلة شظايا
items.bombs.shrapnelbomb.desc=هذه القنبلة عُدلت بخردق معدن DM-300، والتي ستتشظى وتطير في كل مكان عند انفجارها، مسببة _%1$d-%2$d ضرر_ في مدى هائل حول القنبلة. من الأفضل أن تختبئ خلف شيء عند استخدامها...
items.bombs.shrapnelbomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.bombs.woollybomb.name=قنبلة صوفية
items.bombs.woollybomb.desc=هذه القنبلة المخصصة ستخلق حقلاً واسعاً من الخراف السحرية بعد الانفجار. الانفجار سيسبب _%1$d-%2$d ضرر_ لأي شيء ضمن بلاطتين. الخراف ستسد الحركة وتبقى لفترة طويلة جداً! لكن الخراف لن تدوم طويلاً في وجود أعداء أقوياء، ويمكن تبديدها يدوياً أبكر بالتفاعل معها.
items.bombs.woollybomb.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
###food
items.food.berry.name=توتة الزنزانة
items.food.berry.eat_msg=كانت تلك التوتة لذيذة!
items.food.berry.desc=هذه التوتة الصغيرة وجدتها الصيادة بين نباتات الزنزانة. يمكن أكلها بسرعة، تستعيد كمية صغيرة من الشبع، وقد تحتوي بذرة صالحة للاستخدام!
items.food.berry.discover_hint=يمكنك العثور على هذا الغرض باستخدام موهبة بطل محددة.
