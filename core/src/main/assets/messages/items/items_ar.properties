items.artifacts.sandalsofnature.out_of_range=ذلك الموقع خارج المدى.
items.artifacts.sandalsofnature.desc_1=ما يبدو أولاً صندلين من ليف هما في الحقيقة نبتتان! تبدوان ضعيفتين وشاحبتين جداً، ربما تحتاجان للمغذيات؟
items.artifacts.sandalsofnature.desc_2=الحذاء نما ويشبه الآن أكثر حذاءين مفصلين. بعض اللون عاد إليهما، ربما ما زال بإمكانهما النمو أكثر؟
items.artifacts.sandalsofnature.desc_3=النبتتان نمتا مجدداً وتشبهان الآن زوجاً من الجزم الصلبة المصنوعة من لحاء. النبتتان تبدوان وكأنهما استعادتا قوتهما، لكن ربما ما زال بإمكانهما النمو أكثر؟
items.artifacts.sandalsofnature.desc_4=النبتتان تبدوان وكأنهما بلغتا حجمهما الأقصى، تشبهان زوجاً من الساقين المدرعتين. الساقان بنيتان غامقتان وتشبهان شجرة صلبة جداً.
items.artifacts.sandalsofnature.desc_hint=تشعر بانسجام أكبر مع الطبيعة أثناء لبس هذه القطعة الأثرية.
items.artifacts.sandalsofnature.desc_cursed=الصندل الملعون يحجب أي انسجام مع الطبيعة.
items.artifacts.sandalsofnature.desc_ability=الحذاء يتموج بلون آخر بذرة أطعمته إياها. يمكنه التجذير وجيزاً في الأرض وإنتاج تأثير تلك النبتة في أي مكان ضمن قطر 3 بلاطات.\nالبذرة: _%s_\nالشحنة المطلوبة: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=أطعمت الحذاء %d بذرة.
