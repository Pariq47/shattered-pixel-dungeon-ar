items.potions.potion.amber=جرعة عنبرية
items.potions.potion.bistre=جرعة بنية داكنة
items.potions.potion.indigo=جرعة نيلية
items.potions.potion.silver=جرعة فضية
items.potions.potion.unknown_desc=هذه القارورة تحتوي سائلاً ملوناً دوامياً. من يدري ماذا سيفعل عند شربه أو رميه؟
items.potions.potion.harmful=جرعة ضارة!
items.potions.potion.beneficial=جرعة نافعة
items.potions.potion.yes=نعم، أعرف ما أفعله
items.potions.potion.no=لا، لقد غيرت رأيي
items.potions.potion.sure_drink=هل أنت متأكد أنك تريد شربها؟ في معظم الحالات ينبغي أن ترمي مثل هذه الجرعات على أعدائك.
items.potions.potion.sure_throw=هل أنت متأكد أنك تريد رميها؟ في معظم الحالات من المنطقي شربها.
items.potions.potion.shatter=القارورة تتحطم والسائل يتناثر بلا ضرر.
items.potions.potion.discover_hint=يمكنك العثور على هذا الغرض عشوائياً في الزنزانة، أو صنعه عبر الخيمياء.
items.potions.potion$placeholder.name=جرعة
items.potions.potion$seedtopotion.name=جرعة عشوائية
items.potions.potionofexperience.name=جرعة الخبرة
items.potions.potionofexperience.desc=الخبرات المحكية لمعارك لا حصر لها مختزلة في شكل سائل، هذا الشراب سيرفع مستوى خبرتك فوراً.
items.potions.potionoffrost.name=جرعة الصقيع
items.potions.potionoffrost.desc=المادة الكيميائية المحتواة في هذه الجرعة ستتبخر في سحابة متجمدة عند تعرضها للهواء الطلق.
items.potions.potionofhaste.name=جرعة العجلة
items.potions.potionofhaste.energetic=تشعر بالطاقة!
items.potions.potionofhaste.desc=شرب هذا السائل الحلو بشكل غريب سيمنحك طاقة هائلة لفترة قصيرة، يتيح لك الجري بسرعات عالية.
items.potions.potionofhealing.name=جرعة الشفاء
items.potions.potionofhealing.heal=جراحك تبدأ بالالتئام.
items.potions.potionofhealing.desc=هذا الإكسير سيعيد صحتك بسرعة ويعالج فوراً العديد من العلل.
items.potions.potionofinvisibility.name=جرعة التخفي
items.potions.potionofinvisibility.invisible=ترى يديك تصبحان غير مرئيتين!
items.potions.potionofinvisibility.desc=شرب هذه الجرعة سيجعلك غير مرئي مؤقتاً. أثناء التخفي، الأعداء لن يتمكنوا من رؤيتك. الهجمات الجسدية والتأثيرات السحرية )مثل اللفافات والعصي السحرية( ستلغي التخفي فوراً.
items.potions.potionoflevitation.name=جرعة الطفو
items.potions.potionoflevitation.float=تطفو في الهواء!
items.potions.potionoflevitation.desc=شرب هذا السائل الغريب سيجعلك تحوم في الهواء، قادراً على الانجراف بلا جهد فوق الفخاخ والحفر. رمي هذه الجرعة سيخلق سحابة من غاز غير مكرر، مشوشاً أي شيء يعلق فيها.
items.potions.potionofliquidflame.name=جرعة اللهب السائل
items.potions.potionofliquidflame.desc=هذه القارورة تحتوي مركباً غير مستقر سينفجر بعنف في لهب عند تعرضه للهواء الطلق.
items.potions.potionofmindvision.name=جرعة رؤية العقول
items.potions.potionofmindvision.see_mobs=يمكنك بشكل ما الشعور بحضور عقول مخلوقات أخرى!
items.potions.potionofmindvision.see_none=يمكنك بشكل ما معرفة أنك وحدك في هذا الطابق في هذه اللحظة.
items.potions.potionofmindvision.desc=بعد شرب هذا، سيصبح عقلك متناغماً مع البصمة النفسية للمخلوقات البعيدة، يتيح لك الإحساس بالحضور البيولوجية عبر الجدران. أيضاً هذه الجرعة ستتيح لك الرؤية عبر الجدران والأبواب القريبة.
items.potions.potionofparalyticgas.name=جرعة غاز الشلل
items.potions.potionofparalyticgas.desc=عند التعرض للهواء الطلق، السائل في هذه القارورة سيتبخر في ضباب أصفر مخدر. أي شخص يستنشق السحابة سيُشل فوراً، عاجزاً عن الحركة لبعض الوقت بعد تبدد السحابة. هذا الغرض يمكن رميه على أعداء بعيدين لالتقاطهم ضمن تأثير الغاز.
items.potions.potionofpurity.name=جرعة النقاء
items.potions.potionofpurity.freshness=تشعر بنضارة غير مألوفة في الهواء.
items.potions.potionofpurity.protected=غشاء واقي يغلفك!
items.potions.potionofpurity.desc=هذا الكاشف السحري سيعادل بسرعة كل التأثيرات الضارة المرتبطة بمنطقة في منطقة كبيرة. شربه سيمنحك مناعة مؤقتة ضد مثل هذه التأثيرات.
items.potions.potionofstrength.name=جرعة القوة
items.potions.potionofstrength.msg=قوة مكتشفة حديثاً تتدفق عبر جسدك، لديك الآن %d قوة!
items.potions.potionofstrength.desc=هذا السائل القوي سيجري عبر عضلاتك، يزيد قوتك بنقطة واحدة دائماً.
items.potions.potionoftoxicgas.name=جرعة الغاز السام
items.potions.potionoftoxicgas.desc=فتح أو تحطيم هذا الزجاج المضغوط سيسبب انفجار محتوياته في سحابة قاتلة من غاز أخضر سام. قد تختار قذف هذه الجرعة على أعداء بعيدين بدلاً من فتحها يدوياً.
###brews
items.potions.brews.brew.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.potions.brews.aquabrew.name=خليط مائي
items.potions.brews.aquabrew.desc=عند التحطم، هذا الخليط سيطلق هبة من ماء مضغوط في موقعه. قوته كافية فقط لإيذاء الأعداء النارية، لكنه أيضاً ينشر الماء على التضاريس القريبة، يعطل الفخاخ، يخمد النيران، ويدفع بعيداً الشخصيات قرب الهبة.
items.potions.brews.blizzardbrew.name=خليط العاصفة الثلجية
items.potions.brews.blizzardbrew.desc=عند التحطم، هذا الخليط سيطلق عاصفة ثلجية دوامة تنتشر بسرعة كالغاز.
items.potions.brews.causticbrew.name=خليط أكّال
items.potions.brews.causticbrew.desc=هذا الخليط سينشر وحلاً أكّالاً في منطقة واسعة حول الموقع الذي يتحطم فيه. أي شيء يعلق بالوحل سيذوب ببطء إذا لم يغسله في الماء.
items.potions.brews.infernalbrew.name=خليط جهنمي
items.potions.brews.infernalbrew.desc=عند التحطم، هذا الخليط سيطلق جحيماً هائجاً ينتشر بسرعة كالغاز.
items.potions.brews.shockingbrew.name=خليط صعق
items.potions.brews.shockingbrew.desc=عند التحطم، هذا الخليط سيطلق عاصفة كهربائية في منطقة واسعة حول الموقع الذي ينكسر فيه.
items.potions.brews.unstablebrew.name=خليط غير مستقر
items.potions.brews.unstablebrew.desc=هذا الخليط السحري يتوهج بألوان قوس قزح المتحولة.\nعند شربه أو رميه سيفعل تأثير جرعة عشوائية. تأثير الجرعة سيكون دائماً نافعاً إذا شُرب، وسيكون دائماً ضاراً إذا رُمي.
###elixirs
items.potions.elixirs.elixir.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.potions.elixirs.elixirofarcanearmor.name=إكسير الدرع السحري
items.potions.elixirs.elixirofarcanearmor.desc=هذا الإكسير سيمنح الشارب مقاومة طويلة الأمد للضرر السحري.
items.potions.elixirs.elixirofaquaticrejuvenation.name=إكسير التجدد المائي
items.potions.elixirs.elixirofaquaticrejuvenation.desc=هذا الإكسير يحتوي بقايا غو معززة بجرعة شفاء. رغم أنه لن يوفر شفاءً فورياً، سيستعيد باطراد كمية أكبر من الصحة أثناء وقوفك في الماء.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=شفاء مائي
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=لقد اكتسبت مؤقتاً خصائص ترميمية مشابهة لتلك التي لغو.\nأثناء الوقوف في الماء، ستستعيد كمية صغيرة من الصحة كل دور. التأثير يتوقف عندما تكون بصحة كاملة أو خارج الماء.\nالشفاء المتبقي: %d.
items.potions.elixirs.elixirofdragonsblood.name=إكسير دم التنين
items.potions.elixirs.elixirofdragonsblood.desc=عند استهلاكه، هذا الإكسير سيرسل قوة نارية تجري عبر عروق الشارب. هذا التأثير سيجعل الشارب محصناً ضد النار، ويتيح له إشعال الأعداء بالهجمات الجسدية.
items.potions.elixirs.elixiroffeatherfall.name=إكسير السقوط الريشي
items.potions.elixirs.elixiroffeatherfall.light=تشعر بالخفة كالريشة!
items.potions.elixirs.elixiroffeatherfall.desc=هذا الإكسير يوفر تأثير طفو أضعف لكن أكثر تحكماً، يتيح للشارب السقوط لمسافات كبيرة بلا ضرر لفترة قصيرة.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=سقوط ريشي
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=أنت تحت تأثير إكسير السقوط الريشي، يتيح لك السقوط في الهاويات دون تلقي ضرر!\nالأدوار المتبقية: %s.
items.potions.elixirs.elixirofhoneyedhealing.name=إكسير الشفاء المعسّل
items.potions.elixirs.elixirofhoneyedhealing.desc=هذا الإكسير يجمع الشفاء مع حلاوة العسل. عند شربه، سيطبق نفس تأثير جرعة الشفاء ويشبع كمية صغيرة من الجوع، لكنه يمكن أيضاً رميه لشفاء حليف.\nالمخلوقات ذات الميل للعسل قد تُهدأ إذا استُخدم هذا الغرض عليها.
items.potions.elixirs.elixiroficytouch.name=إكسير اللمسة الجليدية
items.potions.elixirs.elixiroficytouch.desc=عند استهلاكه، هذا الإكسير سيتيح للشارب امتصاص الحرارة من الأعداء الذين يهاجمهم. هذا التأثير سيجعل الشارب محصناً ضد البرد، ويتيح له تبريد الأعداء بالهجمات الجسدية.
items.potions.elixirs.elixirofmight.name=إكسير البأس
items.potions.elixirs.elixirofmight.msg=قوة مكتشفة حديثاً تتدفق عبر جسدك، لديك الآن %d قوة!
items.potions.elixirs.elixirofmight.desc=هذا السائل القوي سيجري عبر عضلاتك، يزيد قوتك بنقطة واحدة دائماً ويزيد مؤقتاً الصحة القصوى بـ%d نقطة. تعزيز الصحة يتدرج مع صحتك القصوى، لكنه سيتلاشى ببطء كلما كسبت مستويات.
items.potions.elixirs.elixirofmight$htboost.name=تعزيز الصحة القصوى
items.potions.elixirs.elixirofmight$htboost.desc=جسدك يشعر بقوة وصحة غير طبيعيتين.\nصحتك القصوى معززة لفترة ممتدة من الزمن. كلما كسبت مستويات، سيتلاشى التعزيز باطراد.\nكمية التعزيز الحالية: %d.\nالمستويات المتبقية: %d.
items.potions.elixirs.elixiroftoxicessence.name=إكسير الجوهر السام
items.potions.elixirs.elixiroftoxicessence.desc=عند استهلاكه، هذا الإكسير سيمنح الشارب طاقة سامة. الشارب سينشر باستمرار غازاً ساماً أثناء حركته، وسيكون محصناً ضد الغاز السام والسم لفترة أطول قليلاً من مدة التأثير.
###exotic potions
items.potions.exotic.exoticpotion.turquoise=جرعة فيروزية غريبة
items.potions.exotic.exoticpotion.crimson=جرعة قرمزية غريبة
items.potions.exotic.exoticpotion.azure=جرعة زرقاء سماوية غريبة
items.potions.exotic.exoticpotion.jade=جرعة يشمية غريبة
items.potions.exotic.exoticpotion.golden=جرعة ذهبية غريبة
items.potions.exotic.exoticpotion.magenta=جرعة أرجوانية غريبة
items.potions.exotic.exoticpotion.charcoal=جرعة فحمية غريبة
items.potions.exotic.exoticpotion.ivory=جرعة عاجية غريبة
items.potions.exotic.exoticpotion.amber=جرعة عنبرية غريبة
items.potions.exotic.exoticpotion.bistre=جرعة بنية داكنة غريبة
items.potions.exotic.exoticpotion.indigo=جرعة نيلية غريبة
items.potions.exotic.exoticpotion.silver=جرعة فضية غريبة
items.potions.exotic.exoticpotion.unknown_desc=هذه القارورة المستديرة تحتوي سائلاً ملوناً حبيبياً. يبدو غريباً عن هذه الأرض، من يدري ماذا قد يفعل عند شربه أو رميه؟
items.potions.exotic.exoticpotion.warning=هل تريد حقاً إلغاء استخدام هذه الجرعة؟ ستُستهلك على أي حال.
items.potions.exotic.exoticpotion.yes=نعم، أنا متأكد
items.potions.exotic.exoticpotion.no=لا، لقد غيرت رأيي
items.potions.exotic.exoticpotion.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.potions.exotic.potionofcleansing.name=جرعة التطهير
items.potions.exotic.potionofcleansing.desc=هذا الكاشف القوي سيجعل الشارب محصناً ضد كل التأثيرات الحالة الضارة لبضعة أدوار عند تجرعه. يمكن رميه على هدف لتطهيره أيضاً.
items.potions.exotic.potionofcleansing$cleanse.name=مطهّر
items.potions.exotic.potionofcleansing$cleanse.desc=هذه الشخصية محصنة مؤقتاً ضد كل التأثيرات الحالة الضارة!\nالأدوار المتبقية: %s.
items.potions.exotic.potionofcorrosivegas.name=جرعة الغاز الأكّال
items.potions.exotic.potionofcorrosivegas.desc=فتح أو تحطيم هذا الزجاج المضغوط سيسبب انفجار محتوياته في سحابة قاتلة من غاز أكّال بلون الصدأ. الغاز ينتشر أسرع من الغاز السام وأكثر فتكاً، لكنه أيضاً لن يدوم طويلاً.
items.potions.exotic.potionofdragonsbreath.name=جرعة نفس التنين
items.potions.exotic.potionofdragonsbreath.prompt=اختر موقعاً للإحراق
items.potions.exotic.potionofdragonsbreath.desc=هذه القارورة تحتوي مركباً غير معتاد يشتعل باللهب بعد فترة قصيرة من الاختلاط باللعاب. بصق السائل بسرعة سيتيح للمستخدم نفث اللهب من فمه!
items.potions.exotic.potionofearthenarmor.name=جرعة الدرع الطيني
items.potions.exotic.potionofearthenarmor.desc=بدلاً من الشلل، هذا السائل له تأثير تقسية على الجلد سيحوله إلى درع طبيعي مؤقت.
items.potions.exotic.potionofdivineinspiration.name=جرعة الإلهام الإلهي
items.potions.exotic.potionofdivineinspiration.no_more_points=لا يمكنك كسب أي نقاط مواهب إضافية أخرى.
items.potions.exotic.potionofdivineinspiration.select_tier=اختر فئة مواهب لتكسب فيها نقطتين إضافيتين. يجب أن تكون قد فتحت الفئة لتتمكن من إنفاق النقاط.
items.potions.exotic.potionofdivineinspiration.bonus=+2 نقطتا مواهب!
items.potions.exotic.potionofdivineinspiration.desc=قوة الطاقة المقدسة مختزلة في شكل سائل، هذا الشراب سيمنح الشارب قوة إلهية، مانحاً إياه نقطتي مواهب إضافيتين في فئة من اختياره.\nهذه الجرعة يمكن استخدامها مرة واحدة فقط لكل فئة مواهب.
items.potions.exotic.potionofmagicalsight.name=جرعة الرؤية السحرية
items.potions.exotic.potionofmagicalsight.desc=بعد شرب هذا، ستتعزز حواسك وجيزاً إلى مستويات لا تصدق، تتيح لك الرؤية عبر الجدران في قطر 12 بلاطة!
items.potions.exotic.potionofmastery.name=جرعة الإتقان
items.potions.exotic.potionofmastery.prompt=أتقن غرضاً
items.potions.exotic.potionofmastery.weapon_easier=سلاحك يصبح أسهل استخداماً!
items.potions.exotic.potionofmastery.armor_easier=درعك يصبح أسهل لبساً!
items.potions.exotic.potionofmastery.desc=بدلاً من منح قوة خام، هذه الجرعة ستوائم عضلات المستخدم مع غرض معين. هذا سيجعل ذلك الغرض أسهل استخداماً، وكأن الشارب تدرب عليه وبنى ذاكرة عضلية.\nالسلاح أو الدرع المختار سيتطلب قوة أقل بـ2 للاستخدام. هذه الجرعة يمكن استخدامها مرة واحدة فقط على كل غرض.
items.potions.exotic.potionofshielding.name=جرعة الحماية
items.potions.exotic.potionofshielding.desc=بدلاً من الشفاء، هذه الجرعة ستنشئ درعاً متيناً حول جسد المستخدم، صاداً كمية كبيرة من الضرر.
items.potions.exotic.potionofshroudingfog.name=جرعة الضباب الحاجب
items.potions.exotic.potionofshroudingfog.desc=عند التعرض للهواء، السائل في هذه القارورة سينتج ضباباً دخانياً كثيفاً ينتشر بسرعة ويسد رؤية أعدائك.
items.potions.exotic.potionofsnapfreeze.name=جرعة التجميد الفوري
items.potions.exotic.potionofsnapfreeze.desc=المادة الكيميائية المحتواة في هذه الجرعة ستتفاعل بسرعة مع الهواء، مجمدة ومجذرة فوراً كل شيء ضمن تأثيرها.
items.potions.exotic.potionofstamina.name=جرعة الجلد
items.potions.exotic.potionofstamina.desc=شرب هذا السائل الحلو بشكل غريب سيمنحك تعزيز طاقة طويل الأمد، يتيح لك الجري بوتيرة مسرعة لفترة ممتدة من الزمن.
items.potions.exotic.potionofstormclouds.name=جرعة السحب العاصفة
items.potions.exotic.potionofstormclouds.desc=رمي هذه الجرعة سيخلق سحابة سريعة الانتشار من بخار مركز، سيتكثف وينهمر على البيئة. معظم التضاريس ستتحول إلى ماء، الأعداء النارية ستتلقى ضرراً، النار ستُخمد، والفخاخ ستُغمر وتنكسر.
###quest items
items.quest.ceremonialcandle.name=شمعة طقسية
items.quest.ceremonialcandle.desc=مجموعة شموع، ذابت والتصقت ببعضها عبر الاستخدام. وحدها لا قيمة لها، لكن مع شموع أخرى في نمط، يمكنها تركيز الطاقة لطقس استدعاء.
items.quest.ceremonialcandle.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.corpsedust.name=غبار جثة
items.quest.corpsedust.chill=قشعريرة تسري في عمودك الفقري.
items.quest.corpsedust.desc=كرة غبار الجثة لا تختلف ظاهرياً عن كرة غبار عادية. لكن يمكنك الشعور بطاقة خبيثة تتربص داخلها. التخلص منها بأسرع ما يمكن فكرة جيدة.
items.quest.corpsedust.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.darkgold.name=خام الذهب الداكن
items.quest.darkgold.you_now_have=لديك الآن %d خام الذهب الداكن.
items.quest.darkgold.desc=يسمى هذا المعدن داكناً ليس بسبب لونه )لا يختلف عن الذهب العادي(، بل لأنه يذوب تحت ضوء النهار، مما يجعله عديم الفائدة على السطح.
items.quest.darkgold.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.dwarftoken.name=رمز قزمي
items.quest.dwarftoken.desc=كثير من الأقزام وبعض مخلوقاتهم الأكبر يحملون هذه القطع الصغيرة من المعدن مجهولة الغرض. ربما هي مجوهرات أو نوع من بطاقات الهوية. الأقزام قوم غريبون.
items.quest.dwarftoken.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.embers.name=جمر عنصري
items.quest.embers.desc=جمر خاص يمكن حصاده فقط من عناصري النار الفتيين. يشع طاقة حرارية.
items.quest.embers.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.escapecrystal.name=بلورة هروب
items.quest.escapecrystal.ac_use=استخدام
items.quest.escapecrystal.desc=بلورة تعويذة سحرية رقيقة يبدو أنها تحتوي سحر النقل المكاني. يمكنك استخدامها في أي وقت لمغادرة خزانة الأقزام، لكنك لن تستطيع إخراج أي شيء معك!
items.quest.escapecrystal.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.gooblob.name=كتلة غو
items.quest.gooblob.desc=كتلة هلامية متمايلة، انفصلت عن غو عند موته. تشبه كرة جيلي كبيرة، رغم أنك لا تجرؤ على أكلها. لا تفعل شيئاً بمفردها، لكنها قد تكون مفيدة عند دمجها مع جرعات معينة أو قنبلة. على الأقل يجب أن تتحول لكمية لا بأس بها من الطاقة.
items.quest.gooblob.discover_hint=يمكنك الحصول على هذا الغرض كغنيمة من أعداء معينين.
items.quest.metalshard.name=شظية معدن ملعون
items.quest.metalshard.desc=شظية من المعدن الملعون الصدئ، انفصلت عن DM-300 عند تدميرها. يمكنك الشعور بسحر خبيث خامد داخلها. لا تفعل شيئاً بمفردها، لكنها قد تكون مفيدة عند دمجها مع لفافات معينة أو قنبلة. على الأقل يجب أن تتحول لكمية لا بأس بها من الطاقة.
items.quest.metalshard.discover_hint=يمكنك الحصول على هذا الغرض كغنيمة من أعداء معينين.
items.quest.pickaxe.name=فأس تنقيب
items.quest.pickaxe.ability_name=اختراق
items.quest.pickaxe.ability_desc=يمكن للمبارزة _اختراق_ عدو بفأس التنقيب. هذه الضربة مضمونة الإصابة، وتطبق قابلية الإصابة لـ3 أدوار، وتسبب _%1$d-%2$d ضرر_ للأعداء ذوي الجلد الصلب.
items.quest.pickaxe.upgrade_ability_stat_name=ضرر القدرة
items.quest.pickaxe.desc=أداة متينة وثقيلة لتكسير الصخور. لست بحاجة لتجهيز فأس التنقيب للتنقيب بها، لكن يمكن تجهيزها كسلاح في مأزق.
items.quest.pickaxe.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.
items.quest.ratskull.name=جمجمة جرذ عملاق
items.quest.ratskull.desc=جمجمة جرذ كبيرة بشكل مدهش. لتكون جائزة صيد رائعة، لو كان لديك جدار لتعليقها عليه.
###remains
items.remains.remainsitem.ac_use=استخدام
items.remains.remainsitem.discover_hint=يمكنك العثور على هذا الغرض في رفات بطل محدد من جولة سابقة مفقودة.
items.remains.bowfragment.name=شظية قوس
items.remains.bowfragment.desc=هذه الشظية الخشبية المكسورة كانت يوماً جزءاً من قوس الروح لصيادة مفقودة. ما زال بإمكانك الشعور بقليل من طاقة الطبيعة في الشظية، يمكنك استخدامها لتنمية بعض العشب الطويل حولك. فعل هذا سيدمر الشظية مع ذلك.
items.remains.brokenhilt.name=مقبض مكسور
items.remains.brokenhilt.desc=هذا المقبض المكسور يبدو أنه من سلاح مبارزة مهزومة. ما زال بإمكانك الشعور بقليل من القوة القتالية في المقبض، يمكنك استخدامه للحصول على قليل من الضرر الإضافي في ضربتي اشتباك قادمتين. فعل هذا سيدمر المقبض مع ذلك.
items.remains.brokenstaff.name=عصا مكسورة
items.remains.brokenstaff.desc=عصا الساحر هذه انكسرت نصفين بعد أن لقي صاحبها حتفه. ما زال بإمكانك الشعور بقليل من الطاقة السحرية في العصا، يمكنك استخدامها لمنح عصيك السحرية دفعة بسيطة من الشحنة. فعل هذا سيدمر العصا مع ذلك.
items.remains.cloakscrap.name=قطعة قماش
items.remains.cloakscrap.desc=هذه القطعة من القماش الشفاف تبدو أنها من عباءة ظلال لص متأخر. ما زال بإمكانك الشعور بقليل من الطاقة الغامضة فيها، يمكنك استخدامها لمنح قطعك الأثرية دفعة بسيطة من الشحنة. فعل هذا سيدمر القماش مع ذلك.
items.remains.sealshard.name=شظايا ختم
items.remains.sealshard.desc=هذه الشظايا الصغيرة من الشمع الأحمر تبدو أنها من ختم محارب ساقط. ما زال بإمكانك الشعور بقليل من الإرادة clinging to الختم، يمكنك استخدامها لمنح نفسك قليلاً من الحماية. فعل هذا سيدمر شظايا الختم مع ذلك.
items.remains.tornpage.name=صفحة ممزقة
items.remains.tornpage.desc=هذه الصفحة تبدو أنها مزقت من كتاب مقدس لكاهن منتهي الصلاحية. ما زال هناك قليل من الطاقة الإلهية clinging toها، يمكنك استخدامها لاستعادة قليل من الصحة. فعل هذا سيدمر الصفحة الممزقة مع ذلك.
