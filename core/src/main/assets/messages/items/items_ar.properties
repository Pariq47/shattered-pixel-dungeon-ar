items.rings.ring.equip_cursed=الخاتم يضيق حول إصبعك بألم!
items.rings.ring.unknown_desc=هذا الطوق المعدني مزين بحجر كريم كبير يتلألأ في الظلام. من يدري ما تأثيره عند لبسه؟
items.rings.ring.known=هذا %s
items.rings.ring.identify=أصبحت مألوفاً بما يكفي مع خاتمك لتعرفه.
items.rings.ring.cursed_worn=لأن هذا الخاتم ملعون، أنت عاجز عن نزعه.
items.rings.ring.curse_known=يمكنك الشعور بسحر خبيث يتربص داخل هذا الخاتم.
