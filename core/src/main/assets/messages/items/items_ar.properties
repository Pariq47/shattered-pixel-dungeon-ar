items.artifacts.driedrose$ghosthero.introduce=روحي مربوطة بهذه الوردة، كانت غالية علي جداً، هدية من حبيبي الذي تركته على السطح.\nلا أستطيع العودة إليه، لكن بفضلك لدي فرصة ثانية لإكمال رحلتي. عندما أقدر سأستجيب لندائك وأقاتل معك.\nما دمت تملك الوردة يمكنني سماع صوتك، لذا يمكنك استخدامها لتوجيهي عن بعد.\nلعلك تنجح حيث فشلت أنا...
