items.wands.cursedwand.supernova_positive=كرة طاقة ملتهبة تبدأ بالنمو، لكنها تشعر بالأمان بشكل ما.
items.wands.cursedwand.sinkhole=الأرض تبدأ بالانهيار من حولك!
items.wands.cursedwand.sinkhole_positive=الأرض تبدأ بالانهيار، لكنها تشعر بالصلابة الكافية تحتك.
items.wands.cursedwand.gravity=الجاذبية تبدأ فجأة بالجذب في اتجاهات عشوائية!
items.wands.cursedwand.gravity_positive=الجاذبية تبدأ فجأة بالجذب في اتجاهات عشوائية، لكن هذا لا يبدو أنه يؤثر عليك.
