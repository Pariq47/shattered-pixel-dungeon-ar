items.wands.wand.prompt=اختر موقعاً للإطلاق
items.wands.wand$placeholder.name=عصا سحرية
items.wands.wandofblastwave.name=عصا موجة الانفجار
items.wands.wandofblastwave.staff_name=صولجان موجة الانفجار
items.wands.wandofblastwave.ondeath=لقد قتلت نفسك بعصا موجة الانفجار الخاصة بك...
items.wands.wandofblastwave.knockback_ondeath=الاصطدام قتلك...
items.wands.wandofblastwave.desc=هذه العصا مصنوعة من نوع من الحجر المرمر، بحواف ذهبية وجوهرة سوداء دائرية عند الطرف. تشعر بثقلها في يدك.
items.wands.wandofblastwave.typical_stats_desc=هذه العصا تطلق سهماً ينفجر بعنف في الموقع المستهدف. قوة هذا الانفجار عادة تسبب _%1$d-%2$d ضرر_ وهي قوية بما يكفي لقذف معظم الأعداء بعيداً.
items.wands.wandofblastwave.stats_desc=هذه العصا تطلق سهماً ينفجر بعنف في الموقع المستهدف. قوة هذا الانفجار تسبب _%1$d-%2$d ضرر_ وهي قوية بما يكفي لقذف معظم الأعداء بعيداً.
items.wands.wandofblastwave.upgrade_stat_name_2=قوة القذف
items.wands.wandofblastwave.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً مشلولاً بصولجان موجة الانفجار، سيستهلك الشلل ليوجه انفجاراً من الضرر السحري الإضافي. لهذا فترة تهدئة قصيرة لكل عدو.
items.wands.wandofblastwave.eleblast_desc=انفجار عنصري بصولجان موجة الانفجار يسبب 67% ضرراً ويقذف كل الأعداء خارج منطقة الانفجار.
items.wands.wandofcorrosion.name=عصا التآكل
items.wands.wandofcorrosion.staff_name=صولجان التآكل
items.wands.wandofcorrosion.desc=هذه العصا لها جسم رمادي ينفتح على جوهرة برتقالية ساطعة.
items.wands.wandofcorrosion.stats_desc=هذه العصا تطلق سهماً ينفجر في سحابة من الغاز شديد التآكل في الموقع المستهدف. أي شيء يعلق داخل هذه السحابة سيتلقى ضرراً متزايداً مع الزمن، بدءاً من _%d ضرر._
items.wands.wandofcorrosion.upgrade_stat_name_1=ضرر التآكل
items.wands.wandofcorrosion.upgrade_stat_name_2=حجم الغاز
items.wands.wandofcorrosion.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان التآكل، لدى العدو فرصة أن يصبح مغطى بالوحل.
items.wands.wandofcorrosion.eleblast_desc=انفجار عنصري بصولجان التآكل يصيب الأعداء بـ4 أدوار من التآكل، بدءاً من 6 ضرر.
items.wands.wandofcorruption.name=عصا الفساد
items.wands.wandofcorruption.staff_name=صولجان الفساد
items.wands.wandofcorruption.already_corrupted=تلك الشخصية لا يمكن التأثير عليها أكثر.
items.wands.wandofcorruption.desc=هذه العصا تشع طاقة مظلمة فوضوية، إن لم يكن ذلك واضحاً بالفعل من الجمجمة الصغيرة المزخرفة على طرفها.
items.wands.wandofcorruption.stats_desc=هذه العصا تطلق انفجاراً من طاقة الفساد يضعف الأعداء وينحني بهم في النهاية إلى إرادتك. الأعداء قادرون على مقاومة الفساد، لكن الأعداء الضعفاء أسهل بكثير في إفسادهم من الأصحاء.
items.wands.wandofcorruption.upgrade_stat_name_1=قوة الفساد
items.wands.wandofcorruption.upgrade_stat_name_2=مدة التأثير السلبي
items.wands.wandofcorruption.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان الفساد، لدى العدو فرصة أن يصبح هائجاً.
items.wands.wandofcorruption.eleblast_desc=انفجار عنصري بصولجان الفساد يصيب الأعداء بـ5 أدوار من الهياج.
items.wands.wandofdisintegration.name=عصا التفكك
items.wands.wandofdisintegration.staff_name=صولجان التفكك
items.wands.wandofdisintegration.desc=هذه العصا مصنوعة من كتلة صلبة ملساء من السبج، مع ضوء بنفسجي عميق يجري على جانبها منتهياً عند الطرف. إنها تتوهج بطاقة تدميرية، منتظرة الانطلاق للأمام.
items.wands.wandofdisintegration.stats_desc=هذه العصا تطلق شعاعاً يخترق أي عائق، وسيصل أبعد كلما رُقيت. الشعاع يسبب _%1$d-%2$d ضرر،_ وسيوجه أيضاً ضرراً إضافياً لكل عدو وجدار يخترقه.
items.wands.wandofdisintegration.upgrade_stat_name_2=المدى الأقصى
items.wands.wandofdisintegration.bmage_desc=عندما يحمله _الساحر الحربي_، يصبح لصولجان التفكك مدى هجوم متزايد، وكأن لديه سحر الامتداد.
items.wands.wandofdisintegration.eleblast_desc=انفجار عنصري بصولجان التفكك يسبب 100% ضرر ويخترق الجدران.
items.wands.wandoffireblast.name=عصا انفجار اللهب
items.wands.wandoffireblast.staff_name=صولجان انفجار اللهب
items.wands.wandoffireblast.desc=هذه العصا مصنوعة من خشب مطلي بالأحمر مع ورق ذهبي مستخدم بسخاء لجعلها تبدو ملكية تماماً. إنها تطقطق وتصفّر عند الطرف، متلهفة لإطلاق سحرها القوي.
items.wands.wandoffireblast.stats_desc=هذه العصا تنفث مخروطاً من اللهب عند الاستخدام. هجومها التالي سيستهلك _%1$d شحنات_ ويسبب _%2$d-%3$d ضرر._ كلما استخدمت العصا شحنات أكثر، كان التأثير أكبر وأقوى.
items.wands.wandoffireblast.upgrade_stat_name_1=ضرر شحنة واحدة
items.wands.wandoffireblast.upgrade_stat_name_2=ضرر شحنتين
items.wands.wandoffireblast.upgrade_stat_name_3=ضرر 3 شحنات
items.wands.wandoffireblast.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان انفجار اللهب، هناك فرصة لإنتاج انفجار يؤذي الأعداء ويستهلك كل النار القريبة! هذه الفرصة تزداد كلما زادت النار المجاورة للعدو.
items.wands.wandoffireblast.eleblast_desc=انفجار عنصري بصولجان انفجار اللهب يسبب 100% ضرر، ويفتح الأبواب عنوة، ويشعل الأعداء والتضاريس.
items.wands.wandoffrost.name=عصا الصقيع
items.wands.wandoffrost.staff_name=صولجان الصقيع
items.wands.wandoffrost.desc=هذه العصا تبدو مصنوعة من نوع من الجليد السحري. تصبح أسطع نحو طرفها المستدير. تشعر ببرودتها الشديدة عند الإمساك، لكن يدك تبقى دافئة بشكل ما.
items.wands.wandoffrost.stats_desc=هذه العصا تطلق انفجارات من الطاقة الجليدية نحو أعدائك، مسببة _%1$d-%2$d ضرر_ ومبردة. التأثير يبدو أقوى في الماء. الأعداء المبردة أو المجمدة بالفعل تتلقى ضرراً أقل من هذه العصا.
items.wands.wandoffrost.upgrade_stat_name_2=مدة التبريد
items.wands.wandoffrost.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً مبرداً بصولجان الصقيع، لديه فرصة لتجميده فوراً. هذه الفرصة تصبح أكبر كلما زاد تبريده.
items.wands.wandoffrost.eleblast_desc=انفجار عنصري بصولجان الصقيع يسبب 100% ضرر، ويجمد الأعداء، ويخمد النيران.
items.wands.wandoflightning.name=عصا البرق
items.wands.wandoflightning.staff_name=صولجان البرق
items.wands.wandoflightning.ondeath=لقد قتلت نفسك بعصا البرق الخاصة بك...
items.wands.wandoflightning.desc=هذه العصا مصنوعة من معدن صلب، مما يجعلها ثقيلة بشكل مفاجئ. شوكتان تنحنيان معاً عند الطرف، والكهرباء تقفز بينهما.
items.wands.wandoflightning.stats_desc=هذه العصا ترسل برقاً قوياً يقفز عبر أي شيء تُطلق عليه، مسبباً _%1$d-%2$d ضرر._ هذه الكهرباء ستقفز إلى الشخصيات القريبة، وتنتشر بسهولة أكبر في الماء. القفزات من هذه العصا يمكن أن تؤذيك، لكنها لن تؤذي حلفاءك.
items.wands.wandoflightning.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان البرق، لديه فرصة لشحن نفسه كهربائياً لـ10 أدوار. أثناء الشحن، الساحر الحربي محصن ضد ضرر البرق وستقفز الكهرباء منه أبعد.
items.wands.wandoflightning.eleblast_desc=انفجار عنصري بصولجان البرق يسبب 100% ضرر، ويصعق الأعداء لـ5 أدوار، ويكهرب الماء.
items.wands.wandoflightning$lightningcharge.name=مشحون كهربائياً
items.wands.wandoflightning$lightningcharge.desc=الساحر الحربي مشحون حالياً بالطاقة، مانحاً إياه حصانة ضد صولجان البرق الخاص به ومزيداً من المدى لقفزات البرق منه.\nالأدوار المتبقية: %s.
items.wands.wandoflivingearth.name=عصا الأرض الحية
items.wands.wandoflivingearth.staff_name=صولجان الأرض الحية
items.wands.wandoflivingearth.desc=هذه العصا مصنوعة من صخرة غريبة، بأحزمة من الطاقة الصفراء المتوهجة. الصخور تبدو وكأنها تتحرك قليلاً عند قبضك على العصا، وكأنها تشعر بيدك.
items.wands.wandoflivingearth.stats_desc=هذه العصا ترسل سهاماً من الصخور السحرية على الأعداء، مسببة _%1$d-%2$d ضرر._ الصخور ستعيد التشكل حول المستخدم بعد ذلك، مانحة إياه درعاً بما يتناسب مع الضرر الموجه. إذا بُني درع كافٍ، سيتشكل إلى حارس صخري عند الإطلاق التالي للعصا.
items.wands.wandoflivingearth.upgrade_stat_name_2=الصحة القصوى للحارس
items.wands.wandoflivingearth.upgrade_stat_name_3=صد الحارس
items.wands.wandoflivingearth.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان الأرض الحية، بعض الضرر الموجه يُعاد كدرع صخري.
items.wands.wandoflivingearth.eleblast_desc=انفجار عنصري بصولجان الأرض الحية يسبب 50% ضرراً، ويشفي حارساً طينياً نشطاً لكل عدو مصاب.
items.wands.wandoflivingearth$rockarmor.name=درع صخري
items.wands.wandoflivingearth$rockarmor.desc=صخور سحرية تحيط بجسدك، عند مهاجمتك ستحاول الصد عنك، وستقلل الضرر الذي تتلقاه بنسبة 50%%. كل ضرر مصدود يكشط بعض الصخر مع ذلك.\nالدرع المتبقي: %1$d.\nإذا بُني صخر كافٍ حولك، الإطلاق التالي من عصا الأرض الحية سيجعل الصخور تتشكل إلى حارس يقاتل معك.\nالدرع المطلوب للحارس: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=هذا الحارس الطيني يستفيد أيضاً من قوة الكثرة. الأدوار المتبقية: %d.
items.wands.wandoflivingearth$earthguardian.name=حارس طيني
items.wands.wandoflivingearth$earthguardian.desc=الصخور من عصا الأرض الحية تشكلت إلى حارس طيني واقٍ! هذا الحامي الصخري سيهاجم الأعداء القريبين، مما سيجبرهم على مهاجمة الحارس بدلاً منك. عندما تختفي كل التهديدات القريبة، سيعيد الحارس التشكل حولك، وسيعود عند استخدامك التالي للعصا.
items.wands.wandoflivingearth$earthguardian.wand_info=قوة الحارس الدفاعية مربوطة بمستوى عصاك. إنه يصد حالياً _%1$d-%2$d ضرر._
items.wands.wandoflivingearth$earthguardian.discover_hint=يمكنك العثور على هذه الشخصية مع عصا سحرية محددة.
items.wands.wandofmagicmissile.name=عصا الصاروخ السحري
items.wands.wandofmagicmissile.staff_name=صولجان الصاروخ السحري
items.wands.wandofmagicmissile.desc=هذه العصا البسيطة إلى حد ما تطلق صواريخ من الطاقة السحرية الخالصة. رغم أن العصا نفسها تفتقد أي تأثيرات خاصة، إلا أن لديها شحنات متاحة أكثر ويمكنها تمكين العصي الأخرى وجيزاً عند ترقيتها.
items.wands.wandofmagicmissile.stats_desc=كل سهم من هذه العصا يسبب _%1$d-%2$d ضرر،_ وسيمكن العصي الأخرى وجيزاً إذا رُقيت.
items.wands.wandofmagicmissile.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان الصاروخ السحري، كل عصيه ستكسب شحنة إضافة إلى صولجانه.
items.wands.wandofmagicmissile.eleblast_desc=انفجار عنصري بصولجان الصاروخ السحري يسبب 50% ضرراً، ويمنح الساحر 15 دوراً من إعادة الشحن.
items.wands.wandofmagicmissile.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.wands.wandofmagicmissile$magiccharge.name=شحنة سحرية
items.wands.wandofmagicmissile$magiccharge.desc=عصا الصاروخ السحري الخاصة بك أعادت الطاقة إلى عصيك، معززة المستوى الفعال لإطلاقها التالي.\nعصيك معززة إلى: +%d.\nأدوار الشحنة السحرية المتبقية: %s.
items.wands.wandofprismaticlight.name=عصا الضوء المنشوري
items.wands.wandofprismaticlight.staff_name=صولجان الضوء المنشوري
items.wands.wandofprismaticlight.desc=هذه العصا مصنوعة من قطعة صلبة من البلور الشفاف، ككتلة طويلة من الزجاج الأملس. قطع صغيرة من الضوء الملون ترقص حول طرف العصا، متلهفة للانطلاق.
items.wands.wandofprismaticlight.stats_desc=هذه العصا تطلق أشعة من الضوء تقطع ظلام الزنزانة، كاشفة المناطق والفخاخ المخفية. الشعاع يمكنه تعميه الأعداء، ويسبب _%1$d-%2$d ضرر._ الأعداء الشيطانية والأموات أحياء ستحترق في ضوء العصا الساطع، متلقية ضرراً إضافياً.
items.wands.wandofprismaticlight.upgrade_stat_name_2=فرصة العمى
items.wands.wandofprismaticlight.upgrade_stat_name_3=مدة الضوء
items.wands.wandofprismaticlight.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان الضوء المنشوري، سيُصاب بالعرج لمدة تتدرج مع مستوى الصولجان.
items.wands.wandofprismaticlight.eleblast_desc=انفجار عنصري بصولجان الضوء المنشوري يسبب 67% ضرراً، ويكشف كل التضاريس في الانفجار، ويعمي الأعداء لـ5 أدوار.
items.wands.wandofregrowth.name=عصا إعادة النمو
items.wands.wandofregrowth.staff_name=صولجان إعادة النمو
items.wands.wandofregrowth.desc=هذه العصا مصنوعة من ساق رفيع من الخشب المنحوت ببراعة. بشكل ما ما زالت حية ونابضة، خضراء ساطعة كلب شجرة فتية. "عندما تتوقف الحياة، حياة جديدة تبدأ دائماً بالنمو... الدورة الأبدية تبقى دائماً!"
items.wands.wandofregrowth.stats_desc=عند الاستخدام، هذه العصا ستنفث طاقة إعادة نمو سحرية للخارج في مخروط، مسببة نمو العشب والجذور والنباتات النادرة. إطلاقها التالي سيستهلك _%1$d شحنات._ كلما استخدمت العصا شحنات أكثر، كان التأثير أكبر وأقوى.
items.wands.wandofregrowth.degradation=بعد _%d شحنات_ أخرى، ستبدأ هذه العصا بالفشل في إنتاج النباتات والعشب الطازج. هذا الحد يزداد برفع المستوى أو ترقية العصا.
items.wands.wandofregrowth.upgrade_stat_name_1=العشب لكل شحنة
items.wands.wandofregrowth.upgrade_stat_name_2=حد العشب الكلي
items.wands.wandofregrowth.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان إعادة النمو، وكلاهما واقف على العشب، سيكسب شفاءً عشبياً بما يتناسب مع الضرر الموجه.
items.wands.wandofregrowth.eleblast_desc=انفجار عنصري بصولجان إعادة النمو يجذر الأعداء وينمي العشب عشوائياً على منطقة الانفجار.
items.wands.wandofregrowth$dewcatcher.name=صائدة الندى
items.wands.wandofregrowth$dewcatcher.desc=صائدات الندى نباتات عجيبة تملأ نفسها بالندى السحري. تحاول التمويه كعشب لتجنب الانتباه، لكن انتفاخات الندى المجموع تكشفها.
items.wands.wandofregrowth$dewcatcher.discover_hint=يمكنك العثور على هذه النبتة مع عصا سحرية محددة.
items.wands.wandofregrowth$seedpod.name=قرن البذور
items.wands.wandofregrowth$seedpod.desc=قرون البذور نباتات سحرية تنتج بذوراً من أنواع نباتات أخرى، بدلاً من بذور خاصة بها. بشكل ما تنجح في الانتشار رغم عدم امتلاكها بذوراً خاصة بها.
items.wands.wandofregrowth$seedpod.discover_hint=يمكنك العثور على هذه النبتة مع عصا سحرية محددة.
items.wands.wandofregrowth$lotus.name=لوتس ذهبي
items.wands.wandofregrowth$lotus.desc=اللوتس الذهبي نبتة صوفية لا يمكن استحضارها إلا بعصا إعادة نمو قوية. هالتها تعزز كل النباتات وتأثيراتها، لكنها تحرق طاقتها وتموت بعد وقت قصير.
items.wands.wandofregrowth$lotus.wand_info=هذا اللوتس أُنتج بواسطة عصا إعادة نمو _+%1$d_. كل النباتات في تأثيرها ستُفعّل _فوراً_ إذا زُرعت على شخصية. النباتات سيكون لديها أيضاً _فرصة %2$d%%_ لإسقاط بذرتها، والأسهم المغموسة ستستخدم _متانة أقل بنسبة %3$d%%_.
items.wands.wandofregrowth$lotus.discover_hint=يمكنك العثور على هذه النبتة مع عصا سحرية محددة، بعد ترقيتها عدة مرات.
items.wands.wandoftransfusion.name=عصا نقل الحياة
items.wands.wandoftransfusion.staff_name=صولجان نقل الحياة
items.wands.wandoftransfusion.ondeath=لقد قتلت نفسك بعصا نقل الحياة الخاصة بك...
items.wands.wandoftransfusion.charged=صولجانك مشحون بطاقة حياة عدوك!
items.wands.wandoftransfusion.desc=عصا ذات شكل بسيط إلى حد ما، تبرز بسبب لونها الأرجواني الداكن وجوهرها الأسود الحالك عند الطرف.
items.wands.wandoftransfusion.stats_desc=عند الاستخدام على حلفاء أو أعداء مسحورين، هذه العصا ستمتص _%1$d من صحة المستخدم_ لتشفي أو تحمي الحليف بـ_%2$d صحة._ عند الاستخدام على أعداء، العصا ستسحرهم وجيزاً بينما تطبق _%3$d حماية_ على المستخدم. الأموات أحياء المعادون سيتلقون _%4$d-%5$d ضرر_ بدلاً من أن يُسحروا.
items.wands.wandoftransfusion.upgrade_stat_name_1=شفاء الحليف
items.wands.wandoftransfusion.upgrade_stat_name_2=الحماية الذاتية
items.wands.wandoftransfusion.upgrade_stat_name_3=ضرر الأموات أحياء
items.wands.wandoftransfusion.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً مسحوراً بصولجان نقل الحياة، سيكسب حماية وإطلاقه التالي بالصولجان لن يكلف أي صحة.
items.wands.wandoftransfusion.eleblast_desc=انفجار عنصري بصولجان نقل الحياة يسحر الأعداء، ويشفي الحلفاء، ويسبب 100% ضرر للأعداء الأموات أحياء.
items.wands.wandofwarding.name=عصا الحراسات
items.wands.wandofwarding.staff_name=صولجان الحراسات
items.wands.wandofwarding.no_more_wards=عصاك لا تستطيع إعالة المزيد من الحراسات.
items.wands.wandofwarding.bad_location=لا يمكنك وضع حراسة هناك.
items.wands.wandofwarding.desc=هذه العصا المعدنية القصيرة لديها جوهرة بنفسجية ساطعة تطفو فوق طرفها.
items.wands.wandofwarding.stats_desc=بدلاً من إيذاء عدو مباشرة، هذه العصا ستستدعي حراسات وحراساً ثابتين. الحراسات يمكن استدعاؤها في أي مكان، حتى عبر الجدران إذا كان لديك رؤية. هذه العصا تستطيع إعالة _%d طاقة_ من الحراسات في المرة.
items.wands.wandofwarding.upgrade_stat_name_1=ضرر الحراسة
items.wands.wandofwarding.upgrade_stat_name_2=طاقة الحراسة
items.wands.wandofwarding.bmage_desc=عندما يضرب _الساحر الحربي_ عدواً بصولجان الحراسات، كل الحراسات والحراس النشطين لديهم فرصة للشفاء.
items.wands.wandofwarding.eleblast_desc=انفجار عنصري بصولجان الحراسات يشفي كل الحراسات والحراس في منطقة الانفجار.
items.wands.wandofwarding$ward.desc_generic_ward=هذه الحراسة ستطلق تلقائياً على أي عدو يدخل مدى رؤيتها.\nإطلاق هذه الحراسة بعصا الحراسات الخاصة بك سيرقيها.\nالحراسات لديها عدد محدود من الإطلاقات قبل التلاشي.
items.wands.wandofwarding$ward.desc_generic_sentry=هذا الحارس لديه نفس قوة النيران كالحراسة، لكن لديه صحة بدلاً من عدد محدد من الشحنات. إنه يشبه الجوهرة عند طرف عصا الحراسات الخاصة بك.\nإطلاق هذا الحارس بعصا الحراسات الخاصة بك سيرقيه ويشفيه.\nهذا الحارس سينفق بعض الصحة في كل مرة يطلق على عدو، لكن يمكن شفاؤه باستخدام عصا الحراسات الخاصة بك عليه.
items.wands.wandofwarding$ward.name_1=حراسة صغرى
items.wands.wandofwarding$ward.desc_1=هذه الحراسة الأساسية ستطلق تلقائياً على أي عدو يدخل مدى رؤيتها، مسببة _%1$d-%2$d ضرر._\nإطلاق هذه الحراسة بعصا الحراسات الخاصة بك سيرقيها.\nهذه الحراسة ستطلق مرة واحدة فقط قبل التلاشي.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذه الحراسة.
items.wands.wandofwarding$ward.name_2=حراسة
items.wands.wandofwarding$ward.desc_2=هذه الحراسة المرقاة لديها نمط أكثر تعقيداً، ويمكنها الهجوم مرات متعددة. كل إطلاق من هذه الحراسة سيسبب _%1$d-%2$d ضرر._\nإطلاق هذه الحراسة بعصا الحراسات الخاصة بك سيرقيها.\nهذه الحراسة ستطلق ثلاث مرات قبل التلاشي.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذه الحراسة.
items.wands.wandofwarding$ward.name_3=حراسة كبرى
items.wands.wandofwarding$ward.desc_3=هذه الحراسة المرقاة بالكامل قادرة على الهجوم مرات أكثر من سابقاتها. كل إطلاق من هذه الحراسة سيسبب _%1$d-%2$d ضرر._\nإطلاق هذه الحراسة بعصا الحراسات الخاصة بك سيرقيها.\nهذه الحراسة ستطلق خمس مرات قبل التلاشي.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذه الحراسة.
items.wands.wandofwarding$ward.name_4=حارس أصغر
items.wands.wandofwarding$ward.desc_4=هذا الحارس الأصغر لديه نفس قوة النيران كالحراسة الكبرى، لكن لديه صحة بدلاً من عدد محدد من الشحنات. إنه يشبه الجوهرة عند طرف عصا الحراسات الخاصة بك. كل إطلاق من هذا الحارس سيسبب _%1$d-%2$d ضرر._\nإطلاق هذا الحارس بعصا الحراسات الخاصة بك سيرقيه ويشفيه.\nهذا الحارس سينفق بعض الصحة في كل مرة يطلق على عدو، لكن يمكن شفاؤه باستخدام عصا الحراسات الخاصة بك عليه.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذا الحارس.
items.wands.wandofwarding$ward.name_5=حارس
items.wands.wandofwarding$ward.desc_5=هذا الحارس المرقى أكبر وأكثر متانة من الحارس الأصغر. كل إطلاق من هذا الحارس سيسبب _%1$d-%2$d ضرر._\nإطلاق هذا الحارس بعصا الحراسات الخاصة بك سيرقيه ويشفيه.\nهذا الحارس سينفق بعض الصحة في كل مرة يطلق على عدو، لكن يمكن شفاؤه باستخدام عصا الحراسات الخاصة بك عليه.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذا الحارس.
items.wands.wandofwarding$ward.name_6=حارس أكبر
items.wands.wandofwarding$ward.desc_6=هذا الحارس المرقى بالكامل أكثر متانة بشكل ملحوظ من سابقيه. كل إطلاق من هذا الحارس سيسبب _%1$d-%2$d ضرر._\nإطلاق هذا الحارس بعصا الحراسات الخاصة بك سيشفيه.\nهذا الحارس سينفق بعض الصحة في كل مرة يطلق على عدو، لكن يمكن شفاؤه باستخدام عصا الحراسات الخاصة بك عليه.\nعصا الحراسات الخاصة بك تستخدم _%3$d طاقة_ لإعالة هذا الحارس.
items.wands.wandofwarding$ward.discover_hint=يمكنك العثور على هذه الشخصية مع عصا سحرية محددة.
items.wands.wandofwarding$ward.dismiss_title=صرف هذه الحراسة؟
items.wands.wandofwarding$ward.dismiss_body=يمكنك تبديد هذه الحراسة إذا لم تعد تريد من عصاك إعالتها. فعل ذلك يدمر الحراسة فوراً.\nصرف هذه الحراسة؟
items.wands.wandofwarding$ward.dismiss_confirm=نعم
items.wands.wandofwarding$ward.dismiss_cancel=لا
###weapon curses
items.weapon.curses.annoying.name=%s مزعج
items.weapon.curses.annoying.msg_1=أوه، هل نقاتل شيئاً ما؟!
items.weapon.curses.annoying.msg_2=نعم، أمسك بهم!
items.weapon.curses.annoying.msg_3=هي، استمع!
items.weapon.curses.annoying.msg_4=هل وصلنا إلى الزعيم بعد؟!
items.weapon.curses.annoying.msg_5=أوتش، لا ترجّني بهذه القوة!
items.weapon.curses.annoying.msg_6=مت، أيتها الحشرة!
items.weapon.curses.annoying.msg_7=ويههههههههههه!
items.weapon.curses.annoying.msg_8=هل يمكننا أخذ استراحة؟!
items.weapon.curses.annoying.msg_9=باو، هاها!
items.weapon.curses.annoying.msg_10=ضربة حسنة!
items.weapon.curses.annoying.msg_11=لم أرد أن أكون سلاحاً، أردت أن أكون فأس حطاب.
items.weapon.curses.annoying.msg_12=تذكر، الثقة المفرطة قاتل بطيء وخبيث.
items.weapon.curses.annoying.msg_13=كل قاعدتكم تنتمي إلينا!
items.weapon.curses.annoying.desc=الأسلحة المزعجة قادرة على الكلام، لكنها مفعمة بالطاقة أكثر من اللازم. ستجذب الانتباه إليك غالباً بدون قصد.
items.weapon.curses.annoying.elestrike_desc=ضربة عنصرية بلعنة الإزعاج لديها فرصة 20% لإصابة كل عدو في المدى بالهياج لـ6 أدوار.
items.weapon.curses.dazzling.name=%s مبهر
items.weapon.curses.dazzling.desc=الأسلحة المبهرة ستومض أحياناً بضوء مبهر، معمية كل ما يراها.
items.weapon.curses.dazzling.elestrike_desc=ضربة عنصرية بلعنة الإبهار لديها فرصة 50% لتعمية كل عدو في المدى لـ6 أدوار.
items.weapon.curses.displacing.name=%s مُزيح
items.weapon.curses.displacing.desc=الأسلحة المزاحة مشبعة بسحر نقل مكاني فوضوي، تملك القدرة على تحريف الأعداء حول الطابق عشوائياً.
items.weapon.curses.displacing.elestrike_desc=ضربة عنصرية بلعنة الإزاحة لديها فرصة 50% لنقل كل عدو في المدى مكانياً.
items.weapon.curses.explosive.name=%s متفجر
items.weapon.curses.explosive.warm=دافئ...
items.weapon.curses.explosive.hot=ساخن!
items.weapon.curses.explosive.desc=الأسلحة المتفجرة تبني القوة باطراد وتنفجر، مؤذية كل ما حولها.
items.weapon.curses.explosive.desc_cool=سلاحك حالياً بارد الملمس.
items.weapon.curses.explosive.desc_warm=سلاحك يبني الطاقة ويصبح دافئاً...
items.weapon.curses.explosive.desc_hot=سلاحك ساخن! إنه على وشك الانفجار!
items.weapon.curses.explosive.elestrike_desc=ضربة عنصرية بلعنة الانفجار لديها فرصة 50% لإحداث انفجار على عدو عشوائي في المدى.
items.weapon.curses.friendly.name=%s ودود
items.weapon.curses.friendly.desc=الأسلحة الودودة الأنسب للمسالمين، تفعل أحياناً سحراً يجعل القتال مستحيلاً.
items.weapon.curses.friendly.elestrike_desc=ضربة عنصرية بلعنة الود لديها فرصة 50% لفتنة كل عدو في المدى لـ6 أدوار.
items.weapon.curses.polarized.name=%s مستقطب
items.weapon.curses.polarized.desc=السلاح المستقطب متأثر بسحر يجعل هجومه إما يسبب ضرراً أكثر بنسبة 50%، أو لا ضرر إطلاقاً.
items.weapon.curses.polarized.elestrike_desc=ضربة عنصرية بلعنة الاستقطاب لديها فرصة 50% لتسبب 24-36 ضرراً لكل عدو في المدى.
items.weapon.curses.sacrificial.name=%s التضحية
items.weapon.curses.sacrificial.desc=الأسلحة التضحية ستطلب دماً من اللابس مقابل مهاجمة الأعداء. كلما كان اللابس أصح، زاد الدم الذي تأخذه اللعنة.
items.weapon.curses.sacrificial.elestrike_desc=ضربة عنصرية بلعنة التضحية تجعل البطل وكل عدو في المدى ينزفون 12 نقطة صحة.
items.weapon.curses.wayward.name=%s شارد
items.weapon.curses.wayward.desc=الأسلحة الشاردة تصبح أحياناً غير دقيقة للغاية. هذا السحر يدوم قليلاً عند تفعيله، لكن يمكن تبديده بتوجيه ضربة بالسلاح الشارد.
items.weapon.curses.wayward.elestrike_desc=ضربة عنصرية بلعنة الشرد لديها فرصة 50% لعن كل عدو في المدى لـ6 أدوار.
items.weapon.curses.wayward$waywardbuff.name=شارد
items.weapon.curses.wayward$waywardbuff.desc=سحر سلاحك الشارد فعل، جاعلاً إياه غير دقيق للغاية لفترة قصيرة. لاحظ أن هذا لا يؤثر على الهجمات المضمونة الإصابة، مثل هجمات المفاجأة. مهاجمة ناجحة بالسلاح الشارد ستمحو هذا التأثير فوراً.\nالأدوار المتبقية: %s.
###enchantments
items.weapon.enchantments.blazing.name=%s متقد
items.weapon.enchantments.blazing.desc=هذا السحر يجعل اللهب ينبعث من السلاح، مشعلاً الأعداء وموجهاً ضرراً إضافياً للأعداء المشتعلة بالفعل.
items.weapon.enchantments.blazing.elestrike_desc=ضربة عنصرية بسحر التقاد تنشر النار على كل بلاطة في المدى، تدوم 8 أدوار.
items.weapon.enchantments.blocking.name=%s صاد
items.weapon.enchantments.blocking.desc=الأسلحة الصادّة لديها فرصة لحمايتك وجيزاً بعد الهجوم بها.
items.weapon.enchantments.blocking.elestrike_desc=ضربة عنصرية بسحر الصد تمنح المبارزة 6 حماية إضافية لكل عدو في المدى.
items.weapon.enchantments.blocking$blockbuff.name=صاد
items.weapon.enchantments.blocking$blockbuff.desc=سحر الصد على سلاحك منحك تعزيزاً وجيزاً لقوتك الدفاعية!\nالحماية المتبقية: %d\nالأدوار المتبقية: %s.
items.weapon.enchantments.blooming.name=%s مزهر
items.weapon.enchantments.blooming.desc=الأسلحة المزهرة تحتوي سحراً سينمي نباتات على أو حول من تُضرب به.
items.weapon.enchantments.blooming.elestrike_desc=ضربة عنصرية بسحر الإزهار تنشر العشب على حتى 8 بلاطات في المدى، وتجذر كل الأعداء في المدى لـ6 أدوار.
items.weapon.enchantments.chilling.name=%s مبرد
items.weapon.enchantments.chilling.desc=الأعداء المضروبون بهذا السحر يُبرَّدون، مبطئاً حركتهم وهجماتهم.
items.weapon.enchantments.chilling.elestrike_desc=ضربة عنصرية بسحر التبريد تنشر هواء مبرداً على كل بلاطة في المدى، يدوم 8 أدوار.
items.weapon.enchantments.kinetic.name=%s حركي
items.weapon.enchantments.kinetic.desc=عند قتل عدو بسلاح حركي، أي قوة فائضة تُخزن في السلاح وستُطبق على الهجوم الناجح التالي.
items.weapon.enchantments.kinetic.elestrike_desc=ضربة عنصرية بسحر حركي تطبق 40% من الضرر المخزن على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.kinetic$conserveddamage.name=ضرر محفوظ
items.weapon.enchantments.kinetic$conserveddamage.desc=سلاحك خزن القوة الفائضة من ضربة قتل سابقة، وسيقوم بتطبيقها كضرر إضافي على هجومك التالي. الطاقة ستتلاشى ببطء مع الزمن مع ذلك.\nالضرر المحفوظ: %d.
items.weapon.enchantments.corrupting.name=%s مفسد
items.weapon.enchantments.corrupting.desc=هذا السحر القوي يملك القدرة على تحويل الأعداء إلى إرادتك. عند قتل عدو بهذا السلاح، هناك فرصة أن يُفسد بدلاً من الموت.
items.weapon.enchantments.corrupting.elestrike_desc=ضربة عنصرية بسحر الإفساد لديها فرصة 5-25% )بناء على الصحة المفقودة( لإفساد كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.elastic.name=%s مرن
items.weapon.enchantments.elastic.desc=الأسلحة المرنة لديها فرصة لقذف الأعداء بعيداً مسافات قصيرة.
items.weapon.enchantments.elastic.elestrike_desc=ضربة عنصرية بسحر المرونة تقذف كل الأعداء في المدى 5 بلاطات للخلف.
items.weapon.enchantments.grim.name=%s قاتم
items.weapon.enchantments.grim.desc=هذا السحر القوي يملك قوة تنفيذ عدو فوراً. التأثير أكثر احتمالاً للحدوث كلما كان العدو أضعف.
items.weapon.enchantments.grim.elestrike_desc=ضربة عنصرية بسحر القتامة لديها فرصة 6-30% )بناء على الصحة المفقودة( لقتل كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.lucky.name=%s محظوظ
items.weapon.enchantments.lucky.desc=الأعداء المقتولون بسلاح محظوظ لديهم فرصة لإسقاط غنائم إضافية.
items.weapon.enchantments.lucky.elestrike_desc=ضربة عنصرية بسحر الحظ لديها فرصة 12.5% لتوليد غنائم تحت كل عدو في المدى. هذا التأثير يمكن أن يفعل مرة واحدة فقط لكل عدو.
items.weapon.enchantments.projecting.name=%s ممتد
items.weapon.enchantments.projecting.desc=بهذا السحر الأسلحة القريبة تكسب مدى إضافياً. الأسلحة البعيدة ستخترق الجدران عند التصويب على أهداف قريبة.
items.weapon.enchantments.projecting.elestrike_desc=ضربة عنصرية بسحر الامتداد تسبب 30% ضرراً لكل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.shocking.name=%s صعق
items.weapon.enchantments.shocking.desc=الكهرباء تقفز من سلاح الصعق، مسببة ضرراً إضافياً لكل الأعداء القريبين.
items.weapon.enchantments.shocking.elestrike_desc=ضربة عنصرية بسحر الصعق تنشر الكهرباء على كل بلاطة في المدى، تدوم 8 أدوار.
items.weapon.enchantments.unstable.name=%s غير مستقر
items.weapon.enchantments.unstable.desc=هذا السحر يشع طاقة فوضوية، عاملاً كسحر مختلف مع كل ضربة.
items.weapon.enchantments.unstable.elestrike_desc=ضربة عنصرية بسحر عدم الاستقرار تطبق تأثير سحر عشوائي على كل عدو في المدى، عدا الهدف الأساسي.
items.weapon.enchantments.vampiric.name=%s مصاص
items.weapon.enchantments.vampiric.desc=هذا السحر القوي يمتص قوة الحياة من الأعداء مع كل ضربة، محولاً إياها إلى اللابس. التأثير أقوى كلما انخفضت صحة اللابس.
items.weapon.enchantments.vampiric.elestrike_desc=ضربة عنصرية بسحر مصاص الدماء تشفي المبارزة بـ2.5 نقطة صحة لكل عدو في المدى.
###melee weapons
items.weapon.melee.assassinsblade.name=نصل المغتال
items.weapon.melee.assassinsblade.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.assassinsblade.ability_name=تسلل
items.weapon.melee.assassinsblade.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء حمل نصل المغتال. تتيح هذه القدرة للمبارزة الوميض فوراً حتى 3 بلاطات بعيداً وتمنحها عادة _%d أدوار من التخفي._
items.weapon.melee.assassinsblade.ability_desc=يمكن للمبارزة _التسلل_ أثناء حمل نصل المغتال. تتيح هذه القدرة للمبارزة الوميض فوراً حتى 3 بلاطات بعيداً وتمنحها _%d أدوار من التخفي._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.assassinsblade.desc=نصل صغير متموج مصنوع من السبج، صعب الاستخدام رغم خفته، لكنه قاتل إذا وجد العلامة الصحيحة.
items.weapon.melee.battleaxe.name=فأس معركة
items.weapon.melee.battleaxe.stats_desc=هذا السلاح دقيق إلى حد ما.
items.weapon.melee.battleaxe.ability_name=ضربة ثقيلة
items.weapon.melee.battleaxe.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ بفأس المعركة. هذا الهجوم المركز يسبب عادة _%1$d-%2$d ضرر_ إذا فاجأ العدو، ويصيبه بالذهول لـ5 أدوار مما يقلل دقته ومراوغته بنسبة 50%%. الضربة الثقيلة تصيب دائماً لكنها تسبب ضرراً عادياً إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ بفأس المعركة. هذا الهجوم المركز يسبب _%1$d-%2$d ضرر_ إذا فاجأ العدو، ويصيبه بالذهول لـ5 أدوار مما يقلل دقته ومراوغته بنسبة 50%%. الضربة الثقيلة تصيب دائماً لكنها تسبب ضرراً عادياً إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.desc=الرأس الفولاذي الضخم لفأس المعركة هذه يضع ثقلاً كبيراً خلف كل ضربة واسعة.
items.weapon.melee.crossbow.name=قوس نشاب
items.weapon.melee.crossbow.typical_stats_desc=عادة هذا السلاح يعزز السهام المرمية لتسبب _%1$d-%2$d ضرر_ عند تجهيزه، ويمنحها حتى سحره.
items.weapon.melee.crossbow.stats_desc=هذا السلاح يعزز السهام المرمية لتسبب _%1$d-%2$d ضرر_ عند تجهيزه، ويمنحها حتى سحره.
items.weapon.melee.crossbow.ability_name=طلقة مشحونة
items.weapon.melee.crossbow.typical_ability_desc=يمكن للمبارزة _شحن_ قوس النشاب، جاعلاً هجومها العادي التالي به يصيب دائماً ويطبق واحداً من ثلاثة تأثيرات: الهجمات القريبة تقذف الأعداء بعيداً، السهام غير المغموسة تسبب عادة _+%1$d ضرر_، والسهام المغموسة تطبق تأثيرها في منطقة 7x7 وتدوم عادة _%2$d استخدامات إضافية_.
items.weapon.melee.crossbow.ability_desc=يمكن للمبارزة _شحن_ قوس النشاب، جاعلاً هجومها العادي التالي به يصيب دائماً ويطبق واحداً من ثلاثة تأثيرات: الهجمات القريبة تقذف الأعداء بعيداً، السهام غير المغموسة تسبب _+%1$d ضرر_، والسهام المغموسة تطبق تأثيرها في منطقة 7x7 وتدوم _%2$d استخدامات إضافية_.
items.weapon.melee.crossbow.desc=سلاح معقد إلى حد ما يطلق السهام بسرعات استثنائية. رغم أنه ليس مصمماً لذلك، ثقل قوس النشاب هذا وبنيته المتينة تجعله سلاحاً قريباً لائقاً أيضاً.
items.weapon.melee.crossbow.upgrade_ability_stat_name=تعزيز القدرة
items.weapon.melee.crossbow$chargedshot.name=مشحون
items.weapon.melee.crossbow$chargedshot.desc=المبارزة تركز القوة في قوس النشاب الخاص بها. هجومها التالي به سيصيب دائماً ويطبق واحداً من ثلاثة تأثيرات:
- الهجمات القريبة ستقذف الأعداء عدة بلاطات بعيداً.
- السهام غير المغموسة ستسبب ضرراً إضافياً.
- السهام المغموسة ستكسب استخدامات إضافية وتطبق تأثيرها في منطقة 7x7. تأثيرات السهام الإيجابية ستؤثر فقط على الحلفاء، والتأثيرات الضارة ستطبق فقط على الأعداء. لا يمكن للمبارزة استخدام هذه القدرة لتطبيق تأثيرات سهام إيجابية على نفسها.
items.weapon.melee.cudgel.name=هراوة
items.weapon.melee.cudgel.stats_desc=هذا السلاح دقيق إلى حد ما.
items.weapon.melee.cudgel.ability_name=ضربة ثقيلة
items.weapon.melee.cudgel.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ بالهراوة. هذا الهجوم المركز يسبب عادة _%1$d-%2$d ضرر_ إذا فاجأ العدو، ويصيبه بالذهول لـ5 أدوار مما يقلل دقته ومراوغته بنسبة 50%%. الضربة الثقيلة تصيب دائماً لكنها تسبب ضرراً عادياً إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ بالهراوة. هذا الهجوم المركز يسبب _%1$d-%2$d ضرر_ إذا فاجأ العدو، ويصيبه بالذهول لـ5 أدوار مما يقلل دقته ومراوغته بنسبة 50%%. الضربة الثقيلة تصيب دائماً لكنها تسبب ضرراً عادياً إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.desc=دبوس نحاسي صغير، صنع كأداة دفاع عن النفس للنبلاء أكثر منه سلاح مغامرة.
items.weapon.melee.cudgel.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.melee.dagger.name=خنجر
items.weapon.melee.dagger.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.dagger.ability_name=تسلل
items.weapon.melee.dagger.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء حمل الخنجر. تتيح هذه القدرة للمبارزة الوميض فوراً حتى 5 بلاطات بعيداً وتمنحها عادة _%d أدوار من التخفي._
items.weapon.melee.dagger.ability_desc=يمكن للمبارزة _التسلل_ أثناء حمل الخنجر. تتيح هذه القدرة للمبارزة الوميض فوراً حتى 5 بلاطات بعيداً وتمنحها _%d أدوار من التخفي._
items.weapon.melee.dagger.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dagger.desc=خنجر حديدي بسيط بمقبض خشبي بالٍ.
items.weapon.melee.dagger.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.weapon.melee.dirk.name=خنجر طويل
items.weapon.melee.dirk.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.dirk.ability_name=تسلل
items.weapon.melee.dirk.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء حمل الخنجر الطويل. تتيح هذه القدرة للمبارزة الوميض فوراً حتى 4 بلاطات بعيداً وتمنحها عادة _%d أدوار من التخفي._
