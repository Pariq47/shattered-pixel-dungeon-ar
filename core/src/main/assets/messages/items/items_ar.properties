items.artifacts.masterthievesarmband.level_up=عضادتك تصبح أقوى!
items.artifacts.masterthievesarmband.desc=هذه العضادة المخملية البنفسجية تحمل علامة سيد لصوص. هذا لا يعود إليك، لكنه على الأرجح لم يكن يعود لمستخدمه الأخير أيضاً.
items.artifacts.masterthievesarmband.desc_cursed=العضادة الملعونة مربوطة بمعصمك، وبشكل ما كيس ذهبك يبدو أنه يخف ببطء...
items.artifacts.masterthievesarmband.desc_worn=تشعر بقوة تتبنى في العضادة على معصمك كلما كسبت خبرة. يمكنك استخدام هذه القوة للسرقة من المتاجر، أو سلب الأعداء!\nسلب الأعداء يحدث فوراً، يشوشهم وجيزاً، ويمنحك فرصة للحصول على أي غنائم لديهم! هذه القوة أكثر فعالية ضد الأعداء غير المنتبهين. سلب نفس العدو مرات متعددة لا يمنح فرص غنائم أكثر.
