items.scrolls.scrollofidentify.desc=هذه اللفافة تكشف بشكل دائم كل أسرار غرض واحد.
items.scrolls.scrolloflullaby.name=لفافة التهويد
items.scrolls.scrolloflullaby.sooth=اللفافة تنطق لحناً مهدئاً. تشعر بنعاس شديد.
items.scrolls.scrolloflullaby.desc=قراءة هذه اللفافة تطلق لحناً مهدئاً سيغرق كل من يسمعه في نوم سحري عميق. للقارئ وحلفائه النوم مجدّد للصحة.
items.scrolls.scrollofmagicmapping.name=لفافة التخطيط السحري
items.scrolls.scrollofmagicmapping.layout=أنت الآن على علم بتخطيط الطابق.
items.scrolls.scrollofmagicmapping.desc=عند قراءة هذه اللفافة، ستُنقش صورة بوضوح بلوري في ذاكرتك، تنبهك بالتخطيط الدقيق للطابق وتكشف كل الأسرار المخفية. مواقع الأغراض والمخلوقات ستبقى مجهولة.
items.scrolls.scrollofmirrorimage.name=لفافة الصورة المرآتية
items.scrolls.scrollofmirrorimage.copies=اللفافة تشكل صوراً مرآتية لك.
items.scrolls.scrollofmirrorimage.no_copies=اللفافة تحاول خلق صور مرآتية لك، لكن لا مكان لها لتذهب.
items.scrolls.scrollofmirrorimage.desc=التعويذة على هذه اللفافة ستخلق توأمين وهْميين من القارئ. هذه الصور المرآتية تعمل كاستنساخ أضعف للقارئ، وستطارد أعداءها. ليس لديها متانة مع ذلك، وستتلاشى عند تلقي الضرر.
items.scrolls.scrollofretribution.name=لفافة العقاب
items.scrolls.scrollofretribution.blast=طاقة سحرية قوية تنفجر من اللفافة!
items.scrolls.scrollofretribution.desc=هذه اللفافة تحتوي طاقة تدميرية توجه معاناة القارئ للخارج في انفجار من القوة. كلما كان القارئ أضعف، كلما زاد الضرر الذي يسببه. عند صحة منخفضة جداً هذه اللفافة يمكنها قتل معظم الأعداء فوراً. استخدام اللفافة يفرض ثمناً على المستخدم مع ذلك، مسبباً العمى والإضعاف.
items.scrolls.scrollofrage.name=لفافة الغضب
items.scrolls.scrollofrage.roar=اللفافة تصدر زئيراً مثيراً للغضب يتردد صداه في كل الزنزانة!
items.scrolls.scrollofrage.desc=عند قراءتها بصوت عالٍ، هذه اللفافة ستطلق زئيراً عظيماً يجذب كل الأعداء للقارئ، ويثير غضب القريبين منهم.
items.scrolls.scrollofrecharging.name=لفافة إعادة الشحن
items.scrolls.scrollofrecharging.surge=دفعة من الطاقة تجري في جسدك، تنشط عصيك السحرية!
items.scrolls.scrollofrecharging.desc=القوة السحرية الخام المربوطة في هذه الرق ستشحن كل عصي المستخدم السحرية عبر الزمن عند إطلاقها.
items.scrolls.scrollofremovecurse.name=لفافة إزالة اللعنة
items.scrolls.scrollofremovecurse.inv_title=تطهير غرض
items.scrolls.scrollofremovecurse.cleansed=غرضك يتوهج بضوء مطهر، وطاقة خبيثة تتبدد!
items.scrolls.scrollofremovecurse.not_cleansed=غرضك يتوهج بضوء مطهر، لكن لا شيء يحدث.
items.scrolls.scrollofremovecurse.spirit=لفتك تحرر الروح المعذبة!
items.scrolls.scrollofremovecurse.desc=التعويذة على هذه اللفافة ستجرد فوراً أي لعنات من سلاح واحد أو خاتم أو عصا سحرية أو درع أو قطعة أثرية.
items.scrolls.scrollofteleportation.name=لفافة النقل المكاني
items.scrolls.scrollofteleportation.tele=في طرفة عين نُقلت إلى موقع آخر في الطابق.
items.scrolls.scrollofteleportation.no_tele=سحر النقل المكاني يفشل.
items.scrolls.scrollofteleportation.cant_reach=لا يمكنك الانتقال إلى هناك.
items.scrolls.scrollofteleportation.prompt=اختر موقعاً للنقل
items.scrolls.scrollofteleportation.desc=التعويذة على هذه الرق تنقل القارئ فوراً إلى موقع مختلف في طابق الزنزانة. اللفافة تعطي الأولوية للمناطق التي لم يسبق للقارئ زيارتها، رغم أنها لا تستطيع النقل عبر الأبواب المغلقة أو المتاريس. يمكنها، مع ذلك، كشف الأبواب المخفية التي تقود إلى مناطق جديدة.
items.scrolls.scrollofterror.name=لفافة الرعب
items.scrolls.scrollofterror.none=اللفافة تصدر وميضاً ساطعاً من الضوء الأحمر.
items.scrolls.scrollofterror.one=اللفافة تصدر وميضاً ساطعاً من الضوء الأحمر والـ%s يهرب!
items.scrolls.scrollofterror.many=اللفافة تصدر وميضاً ساطعاً من الضوء الأحمر والوحوش تهرب!
items.scrolls.scrollofterror.desc=عند قراءتها، هذه اللفافة ستصدر وميضاً من الضوء الأحمر يغرق كل الأعداء في مجال رؤيتك بالرعب، وسيستديرون ويهربون. مهاجمة عدو هارب ستقصر التأثير.
items.scrolls.scrolloftransmutation.name=لفافة التحول
items.scrolls.scrolloftransmutation.inv_title=تحويل غرض
items.scrolls.scrolloftransmutation.nothing=لا شيء مثير للاهتمام يحدث.
items.scrolls.scrolloftransmutation.morph=غرضك يتحول إلى شيء مختلف!
items.scrolls.scrolloftransmutation.desc=هذه اللفافة تحتوي سحر تحول قوي. عند استخدامها على غرض مؤهل ستحوله إلى غرض مختلف من نفس النوع. السحر سيحافظ حتى على الترقيات والسحر والنقوش. اللفافات والجرعات ستتحول إلى نظيرتها الغريبة، والعكس صحيح.
items.scrolls.scrollofupgrade.name=لفافة الترقية
items.scrolls.scrollofupgrade.inv_title=ترقية غرض
items.scrolls.scrollofupgrade.weaken_curse=لفافة الترقية تضعف اللعنة على غرضك.
items.scrolls.scrollofupgrade.remove_curse=لفافة الترقية تطهر اللعنة على غرضك!
items.scrolls.scrollofupgrade.desc=هذه اللفافة سترقي غرضاً واحداً أو مجموعة أسلحة مرمية. العصي السحرية ستزداد قوة وعدد الشحنات، الأسلحة والدروع ستسبب وتصد ضرراً أكثر، مجموعات الأسلحة المرمية ستُصلح بالكامل وتصبح أكثر متانة، وتأثيرات الخواتم ستشتد. يمكنها حتى إضعاف أو أحياناً إزالة اللعنات تماماً، رغم أنها ليست قوية كلفافة إزالة اللعنة. لسوء الحظ، سحر الترقية يمكنه أيضاً محو السحر أو النقوش على المعدات ذات المستوى الأعلى.
