items.ankh.desc=هذا الرمز القديم للخلود يمنح القدرة على العودة للحياة بعد الموت. معظم الأغراض ستُسقط حيث مت، لكن يمكن استردادها إذا عدت إليها. باستخدام قربة ماء ممتلئة، يمكن مباركة العنخ بقوة إضافية.
items.ankh.desc_blessed=هذا الرمز القديم للخلود يمنح القدرة على العودة للحياة بعد الموت. العنخ مبارك وهو الآن أقوى بكثير. العنخ سيضحي بنفسه لينقذك في لحظة خطر مميت.
items.ankh.discover_hint=يمكنك شراء هذا الغرض من متجر.
items.arcaneresin.name=راتنج سحري
items.arcaneresin.prompt=اختر عصا سحرية
items.arcaneresin.ac_apply=تطبيق
items.arcaneresin.level_too_high=تلك العصا السحرية قوية جداً على الراتنج لتحسينها.
items.arcaneresin.not_enough=ليس لديك راتنج كافٍ لذلك!
items.arcaneresin.apply=تغطي عصاك السحرية بالراتنج، مضيفاً لقوتها!
items.arcaneresin.desc=هذا المسحوق الناعم يتلألأ بين درجات البنفسجي والأبيض. يمكنه العمل كمضخم للطاقات السحرية، مضيفاً مستوى العصي السحرية عند تطبيقه عليها!
ترقية عصا سحرية تكلف 1 أو 2 أو 3 راتنج حسب المستوى الأولي للعصا. الراتنج يمكنه ترقية العصي السحرية حتى +3 كحد أقصى.
ترقيات الراتنج _تُستبدل بمصادر الترقية الأخرى_ مع ذلك )مثل لفافات الترقية(، ولا تُطبق عند حقن عصا سحرية في عصا الساحر.
items.arcaneresin.discover_hint=يمكنك صنع هذا الغرض عبر الخيمياء.
items.brokenseal.name=ختم مكسور
items.brokenseal.ac_affix=تثبيت
items.brokenseal.prompt=اختر درعاً
items.brokenseal.unknown_armor=يجب أن تعرف أولاً هل ذلك الدرع ملعون أم لا.
items.brokenseal.cursed_armor=الختم لن يُطبق على درع ملعون.
items.brokenseal.affix=تثبت الختم على درعك!
items.brokenseal.desc=ختم شمعي، يُثبت على الدرع كرمز للشجاعة. لديه رون حماية باهت محفور في الوسط، ومشقوق نصفين عبر المنتصف.
تذكار من موطنه، الختم يساعد المحارب على المثابرة. أثناء لبس الختم سيكسب المحارب فوراً حماية عندما يوشك على الإصابة بأقل من نصف صحته.
الختم يمكن _تثبيته على درع،_ ونقله بين الدروع. يمكنه حمل ترقية واحدة معه، طالما أن تلك الترقية طُبقت على الدرع أثناء تثبيت الختم عليه.
