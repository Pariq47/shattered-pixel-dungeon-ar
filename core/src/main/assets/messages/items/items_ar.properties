items.scrolls.scroll.cursed=كتاب تعويذك الملعون يمنعك من استدعاء سحر هذه اللفافة! لكن لفافة إزالة اللعنة قد تكون قوية بما يكفي لتعمل مع ذلك...
items.scrolls.scroll$placeholder.name=لفافة
items.scrolls.inventoryscroll.warning=هل تريد حقاً إلغاء استخدام هذه اللفافة؟ اللفافة لم تكن معرفة سابقاً، لذا ستُستهلك على أي حال.
