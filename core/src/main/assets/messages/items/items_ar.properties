items.rings.ringofaccuracy.name=خاتم الدقة
items.rings.ringofaccuracy.stats=عند لبسه، هذا الخاتم سيزيد دقتك بنسبة _%s%%._
items.rings.ringofaccuracy.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد دقتك بنسبة _%s%%._
items.rings.ringofaccuracy.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة دقتك بنسبة _%s%%_ بالمجموع.
items.rings.ringofaccuracy.upgrade_stat_name_1=تعزيز الدقة
items.rings.ringofaccuracy.desc=هذا الخاتم يزيد تركيزك، مما يجعل هجماتك تجد هدفها بسهولة. الخاتم الملعون سيجعل هجماتك تصعب عليها الإصابة بدلاً من ذلك.
items.rings.ringofarcana.name=خاتم الأسرار
items.rings.ringofarcana.stats=عند لبسه، هذا الخاتم سيزيد قوة السحر والنقوش بنسبة _%s%%._
items.rings.ringofarcana.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد قوة السحر والنقوش بنسبة _%s%%._
items.rings.ringofarcana.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة قوة السحر والنقوش بنسبة _%s%%_ بالمجموع.
items.rings.ringofarcana.upgrade_stat_name_1=تعزيز الأسرار
items.rings.ringofarcana.desc=هذا الخاتم يعزز السحر على الأسلحة والنقوش على الدروع، بما في ذلك اللعنات! يزيد أولاً من احتمال التفعيل، ثم يزيد من قوة التأثير عند وصول احتمال التفعيل لـ100%. الخاتم الملعون سيضعف السحر والنقوش واللعنات بدلاً من ذلك.
items.rings.ringofelements.name=خاتم العناصر
items.rings.ringofelements.stats=عند لبسه، هذا الخاتم سيوفر _%s%%_ مقاومة عنصرية.
items.rings.ringofelements.typical_stats=عند لبسه، هذا الخاتم عادة سيوفر _%s%%_ مقاومة عنصرية.
items.rings.ringofelements.combined_stats=خواتمك المجهزة تجمع قوتها، توفر _%s%%_ مقاومة عنصرية بالمجموع.
items.rings.ringofelements.upgrade_stat_name_1=المقاومة
items.rings.ringofelements.desc=هذا الخاتم يوفر مقاومة لمعظم التأثيرات العنصرية والسحرية، مقللاً الضرر ومدة التأثيرات السلبية. طبيعياً الخاتم الملعون سيزيد هذه التأثيرات سوءاً.
items.rings.ringofenergy.name=خاتم الطاقة
items.rings.ringofenergy.stats=عند لبسه، هذا الخاتم سيزيد سرعة شحنة العصي والقطع الأثرية والدروع البطولية بنسبة _%s%%._
items.rings.ringofenergy.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد سرعة شحنة العصي والقطع الأثرية والدروع البطولية بنسبة _%s%%._
items.rings.ringofenergy.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة سرعة الشحنة بنسبة _%s%%_ بالمجموع.
items.rings.ringofenergy.upgrade_stat_name_1=تعزيز الشحنة
items.rings.ringofenergy.desc=معداتك السحرية ستشحن أسرع في الحقل السريدي الذي يشع من هذا الخاتم. الخاتم الملعون سيبطئ الشحن بدلاً من ذلك.
items.rings.ringofevasion.name=خاتم المراوغة
items.rings.ringofevasion.stats=عند لبسه، هذا الخاتم سيزيد مراوغتك بنسبة _%s%%._
items.rings.ringofevasion.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد مراوغتك بنسبة _%s%%._
items.rings.ringofevasion.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة مراوغتك بنسبة _%s%%_ بالمجموع.
items.rings.ringofevasion.upgrade_stat_name_1=تعزيز المراوغة
items.rings.ringofevasion.desc=هذا الخاتم يسرع ردود فعل لابسه، مما يجعل إصابة الضربات به أصعب. الخاتم الملعون سيجعل إصابة المستخدم أسهل بدلاً من ذلك.
items.rings.ringofforce.name=خاتم القوة
items.rings.ringofforce.stats=عند عدم التسلح، وبقوتك الحالية، هذا الخاتم سيسبب _%1$d-%2$d ضرر._ مع سلاح مجهز، هذا الخاتم سيزيد الضرر بمقدار _%3$d._
items.rings.ringofforce.typical_stats=عند عدم التسلح، وبقوتك الحالية، عادة هذا الخاتم سيسبب _%1$d-%2$d ضرر._ مع سلاح مجهز، عادة هذا الخاتم سيزيد الضرر بمقدار _%3$d._
items.rings.ringofforce.combined_stats=خواتمك المجهزة تجمع قوتها، تسبب ما مجموعه _%1$d-%2$d ضرر_ بدون سلاح، أو تزيد الضرر بمقدار _%3$d_ مع سلاح.
items.rings.ringofforce.upgrade_stat_name_1=ضرر بدون سلاح
items.rings.ringofforce.upgrade_stat_name_2=تعزيز ضرر مسلح
items.rings.ringofforce.upgrade_stat_name_3=ضرر القدرة
items.rings.ringofforce.ability_name=وقفة المقاتل
items.rings.ringofforce.typical_ability_desc=يمكن للمبارزة اتخاذ _وقفة مقاتل_ بهذا الخاتم، مما يجعل هجماتها العادية تستخدم هذا الخاتم دائماً حتى مع سلاح مجهز. هذه الهجمات عادة ستسبب _%1$d-%2$d ضرر_ وسترث أيضاً سحر السلاح وتعزيزاته. هذه الوقفة تبطئ سرعة شحنة السلاح بنسبة 50%%.
items.rings.ringofforce.ability_desc=يمكن للمبارزة اتخاذ _وقفة مقاتل_ بهذا الخاتم، مما يجعل هجماتها العادية تستخدم هذا الخاتم دائماً حتى مع سلاح مجهز. هذه الهجمات ستسبب _%1$d-%2$d ضرر_ وسترث أيضاً سحر السلاح وتعزيزاته. هذه الوقفة تبطئ سرعة شحنة السلاح بنسبة 50%%.
items.rings.ringofforce.desc=هذا الخاتم يعزز قوة ضربات الاشتباك للابس. هذه القوة الإضافية ضعيفة جداً عند استخدام الأسلحة، لكن الهجوم بدون سلاح سيصبح أقوى بكثير. الخاتم الملعون سيضعف ضربات لابسه بدلاً من ذلك.
items.rings.ringofforce$brawlersstance.name=وقفة المقاتل
items.rings.ringofforce$brawlersstance.desc=أثناء هذه الوقفة هجمات المبارزة العادية ستستخدم خاتم القوة المجهز حتى عندما يكون لديها سلاح مجهز. هذه الهجمات تكسب ضرراً إضافياً وستظل تستخدم تعزيزات وسحر السلاح. الحفاظ على هذه الوقفة يتطلب تركيزاً، مما يقلل سرعة شحنة قدرة السلاح بنسبة 50%. يمكن تفعيل أو إلغاء هذه الوقفة باستخدام خاتم القوة، لكن تقليل سرعة الشحنة سيستمر لفترة قصيرة إذا فُعلت وأُلغيت بسرعة.
items.rings.ringoffuror.name=خاتم الهياج
items.rings.ringoffuror.stats=عند لبسه، هذا الخاتم سيزيد سرعة هجماتك بنسبة _%s%%._
items.rings.ringoffuror.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد سرعة هجماتك بنسبة _%s%%._
items.rings.ringoffuror.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة سرعة هجماتك بنسبة _%s%%_ بالمجموع.
items.rings.ringoffuror.upgrade_stat_name_1=تعزيز سرعة الهجوم
items.rings.ringoffuror.desc=هذا الخاتم يمنح لابسه هياجاً داخلياً، مما يتيح له الهجوم بسرعة أكبر. الخاتم الملعون سيبطئ سرعة هجوم لابسه بدلاً من ذلك.
items.rings.ringofhaste.name=خاتم العجلة
items.rings.ringofhaste.stats=عند لبسه، هذا الخاتم سيزيد سرعة حركتك بنسبة _%s%%._
items.rings.ringofhaste.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد سرعة حركتك بنسبة _%s%%._
items.rings.ringofhaste.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة سرعة حركتك بنسبة _%s%%_ بالمجموع.
items.rings.ringofhaste.upgrade_stat_name_1=تعزيز سرعة الحركة
items.rings.ringofhaste.desc=هذا الخاتم يقلل إجهاد الحركة على لابسه، مما يتيح له الجري بسرعات خارقة. الخاتم الملعون سيثقل لابسه بدلاً من ذلك.
items.rings.ringofmight.name=خاتم البأس
items.rings.ringofmight.stats=عند لبسه، هذا الخاتم سيزيد قوتك بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%._
items.rings.ringofmight.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد قوتك بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%._
items.rings.ringofmight.combined_stats=خواتمك المجهزة تجمع قوتها، تعزيز قوتك بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%_ بالمجموع.
items.rings.ringofmight.upgrade_stat_name_1=تعزيز القوة
items.rings.ringofmight.upgrade_stat_name_2=تعزيز الصحة القصوى
items.rings.ringofmight.desc=هذا الخاتم يعزز الصفات الجسدية للابسه، مانحاً إياه قوة وبنيان جسدي أكبر. الخاتم الملعون سيضعف لابسه.
items.rings.ringofsharpshooting.name=خاتم الرماية الدقيقة
items.rings.ringofsharpshooting.stats=عند لبسه، هذا الخاتم سيعزز ضرر أسلحتك المرمية وكأن مستواها زاد بمقدار _%1$d_، وسيزيد متانتها بنسبة _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=عند لبسه، هذا الخاتم عادة سيعزز ضرر أسلحتك المرمية وكأن مستواها زاد بمقدار _%1$d_ وسيزيد متانتها بنسبة _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=خواتمك المجهزة تجمع قوتها، تعزيز مستوى أسلحتك المرمية الفعال بمقدار _%1$d_ وزيادة متانتها بنسبة _%2$s%%_ بالمجموع.
items.rings.ringofsharpshooting.upgrade_stat_name_1=تعزيز ضرر المستوى
items.rings.ringofsharpshooting.upgrade_stat_name_2=تعزيز المتانة
items.rings.ringofsharpshooting.desc=هذا الخاتم يعزز دقة وتصويب لابسه، مما يجعل كل أسلحة المقذوفات أكثر ضرراً ومتانة. الخاتم الملعون سيكون له التأثير المعاكس.
items.rings.ringoftenacity.name=خاتم المثابرة
items.rings.ringoftenacity.stats=عند لبسه، هذا الخاتم سيقلل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%._
items.rings.ringoftenacity.typical_stats=عند لبسه، هذا الخاتم عادة سيقلل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%._
items.rings.ringoftenacity.combined_stats=خواتمك المجهزة تجمع قوتها، تقليل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%_ بالمجموع.
items.rings.ringoftenacity.upgrade_stat_name_1=مقاومة الضرر القصوى
items.rings.ringoftenacity.desc=عند لبسه، هذا الخاتم سيتيح للابسه مقاومة الضربات القاتلة عادة. كلما كان المستخدم أكثر جرحاً، كلما كان أكثر مقاومة للضرر. الخاتم الملعون سيجعل قتل لابسه أسهل على الأعداء بدلاً من ذلك.
items.rings.ringofwealth.name=خاتم الثراء
items.rings.ringofwealth.stats=عند لبسه، هذا الخاتم سيزيد حظك بنسبة _%s%%._
items.rings.ringofwealth.typical_stats=عند لبسه، هذا الخاتم عادة سيزيد حظك بنسبة _%s%%._
items.rings.ringofwealth.combined_stats=خواتمك المجهزة تجمع قوتها، زيادة حظك بنسبة _%s%%_ بالمجموع.
items.rings.ringofwealth.upgrade_stat_name_1=تعزيز الحظ
items.rings.ringofwealth.desc=هذا الخاتم يعمل كمغناطيس للكنوز، مما يزيد احتمال حمل الأعداء والحاويات لأغراض قيمة. الخاتم الملعون سيقلل فرصتك في الحصول على غنائم بدلاً من ذلك.
