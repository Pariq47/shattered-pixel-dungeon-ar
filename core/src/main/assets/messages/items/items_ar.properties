items.weapon.spiritbow.stats=القوس لا يمكن ترقيته مباشرة، لكنه سينمو قوة باطراد كلما ارتفع مستواك. في مستواك الحالي، السهام المرمية من القوس ستسبب _%1$d-%2$d ضرر_ وتتطلب _%3$d قوة_ لتُستخدم بشكل صحيح.
