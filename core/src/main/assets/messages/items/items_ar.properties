items.potions.potion.ac_drink=شرب
items.potions.potion.turquoise=جرعة فيروزية
items.potions.potion.crimson=جرعة قرمزية
items.potions.potion.azure=جرعة زرقاء سماوية
items.potions.potion.jade=جرعة يشمية
