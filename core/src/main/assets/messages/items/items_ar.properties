items.wands.wand.fizzles=عصاك تصدر أزيزاً خافتاً؛ لا بد أنها لا تملك شحنة كافية.
items.wands.wand.no_magic=عصاك تصدر أزيزاً خافتاً؛ لا يمكنك استخدام العصي أثناء حصانة السحر.
items.wands.wand.self_target=لا يمكنك استهداف نفسك!
items.wands.wand.identify=أصبحت مألوفاً بما يكفي مع عصاك لتعرفها.
