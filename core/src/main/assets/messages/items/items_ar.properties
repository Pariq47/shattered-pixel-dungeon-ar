###armor curses
items.armor.curses.antientropy.name=%s مضاد للإنتروبيا
items.armor.curses.antientropy.desc=لعنة معاداة الإنتروبيا تعمل ضد قوى الكون، جاذبة الطاقة إلى مرتديها وبعيداً عن محيطه. هذا يشعل النار في المرتدي لفترة وجيزة، لكنه يجمد كل ما حوله!
items.armor.curses.bulk.name=%s ضخم
items.armor.curses.bulk.desc=درع الضخامة يبدو أكبر وأكثر مهابة، لكنه لا يملك في الواقع دفاعاً معززاً. والأسوأ، أن الحجم الإضافي يجعل التحرك عبر المداخل صعباً للغاية.
items.armor.curses.corrosion.name=%s أكّال
items.armor.curses.corrosion.desc=درع التآكل قادر على الانفجار بسائل أكّال، يغطي كل ما في المنطقة بوحل حمضي لزج.
items.armor.curses.displacement.name=%s مُزيح
items.armor.curses.displacement.desc=لعنة الإزاحة تحاول نقل المرتدي إلى مكان آمن عند مهاجمته. لكنها فعالة أكثر من اللازم، إذ تنقل المستخدم عشوائياً في أنحاء الطابق.
items.armor.curses.metabolism.name=%s استقلابي
items.armor.curses.metabolism.desc=لعنة الاستقلاب تحول الشبع مباشرة إلى صحة عند إصابة المرتدي، مانحة دفعة شفاء، لكنها تسبب الجوع بسرعة.
items.armor.curses.multiplicity.name=%s متعدد
items.armor.curses.multiplicity.desc=درع ملعون بالتعدد يحتوي سحر نسخ خطير. سيخلق أحياناً صورة مرآتية للمرتدي، لكنه بنفس الاحتمال ينسخ المهاجم!
items.armor.curses.overgrowth.name=%s نامٍ
items.armor.curses.overgrowth.desc=درع النمو المفرط مغطى بنباتات مزهرة متنوعة. رغم أن هذا التأثير يبدو مثيراً للاهتمام، إلا أنه لا يفيد الدفاع شيئاً، وهذه النباتات ستفعّل عشوائياً في القتال!
items.armor.curses.stench.name=%s نتن
items.armor.curses.stench.desc=درع ملعون بالنتن سيطلق سحباً من الغاز الضار، الخطر على كل ما يعلق في السحابة.
###glyphs
items.armor.glyphs.affection.name=%s عاطفي
items.armor.glyphs.affection.desc=هذا النقش القوي يتلاعب بعقول المهاجمين، فاتناً إياهم مؤقتاً.
items.armor.glyphs.antimagic.name=%s مضاد للسحر
items.armor.glyphs.antimagic.desc=هذا النقش القوي يسمح للدرع بحماية مرتديه من الهجمات السحرية كما من الجسدية. هذا الدفاع السحري لا يتأثر بمستوى الدرع.
items.armor.glyphs.brimstone.name=%s كبريتي
items.armor.glyphs.brimstone.desc=هذا النقش يحمي المرتدي وممتلكاته من النار، مبطلاً ضررها وآثارها السلبية تماماً.
items.armor.glyphs.camouflage.name=%s مموه
items.armor.glyphs.camouflage.desc=هذا النقش يسمح للمرتدي بالاندماج في العشب الطويل، مانحاً إياه تخفياً مؤقتاً.
items.armor.glyphs.entanglement.name=%s متشابك
items.armor.glyphs.entanglement.desc=هذا النقش ينمي درعاً طينياً حول المرتدي لامتصاص الضرر، لكن هذا الدرع ينكسر إذا تحرك المرتدي.
items.armor.glyphs.flow.name=%s متدفق
items.armor.glyphs.flow.desc=هذا النقش يتلاعب بتدفق الماء حول المرتدي، جاعلاً إياه أسرع بكثير عند العبور خلاله.
items.armor.glyphs.obfuscation.name=%s مغبش
items.armor.glyphs.obfuscation.desc=هذا النقش يشوش صورة المرتدي، جاعلاً اكتشافه أصعب.
items.armor.glyphs.potential.name=%s كامن
items.armor.glyphs.potential.desc=هذا النقش يبني الطاقة عند الضرب، مانحاً شحنة لعصا المرتدي السحرية عند تفعيله.
items.armor.glyphs.repulsion.name=%s دافع
items.armor.glyphs.repulsion.desc=هذا النقش يرد القوة على المهاجمين، قاذفاً إياهم بعيداً.
items.armor.glyphs.stone.name=%s حجري
items.armor.glyphs.stone.desc=هذا النقش يحيط الدرع بحجر سحري ثقيل يجعل المراوغة مستحيلة، لكنه يصد الضرر بما يتناسب مع المراوغة.
items.armor.glyphs.swiftness.name=%s سريع
items.armor.glyphs.swiftness.desc=هذا النقش يعزز سرعة المرتدي كلما لم يكن قرب عدو.
items.armor.glyphs.thorns.name=%s شائك
items.armor.glyphs.thorns.desc=هذا النقش القوي يؤذي المهاجمين، جاعلاً إياهم ينزفون ببطء عند مهاجمة المرتدي.
items.armor.glyphs.viscosity.name=%s لزج
items.armor.glyphs.viscosity.deferred=مؤجل %d
items.armor.glyphs.viscosity$defereddamage.name=ضرر مؤجل
items.armor.glyphs.viscosity$defereddamage.ondeath=الضرر المؤجل قتلك...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=قُتل بضرر مؤجل
items.armor.glyphs.viscosity$defereddamage.desc=الضرر يُطبق ببطء عبر الزمن بدلاً من فوراً.\nالضرر المؤجل المتبقي: %d.
items.armor.glyphs.viscosity.desc=هذا النقش قادر على تخزين الضرر الموجه للمرتدي، تطبيقه عليه ببطء بدلاً من دفعة واحدة.
###armor
items.armor.armor.ac_detach=فصل
items.armor.armor.detach_seal=تفصل الختم عن درعك.
items.armor.armor.equip_cursed=الدرع ينقبض حولك بألم.
items.armor.armor.identify=أصبحت مألوفاً بما يكفي مع درعك لتعرفه.
items.armor.armor.hardening_gone=التصليب على هذا الدرع تلاشى!
items.armor.armor.incompatible=تفاعل أنواع مختلفة من السحر محا النقش على هذا الدرع!
items.armor.armor.curr_absorb=هذا الدرع من _المستوى %1$d_ يصد _%2$d-%3$d ضرر_ ويتطلب _%4$d قوة_ ليُستخدم بشكل صحيح.
items.armor.armor.avg_absorb=عادة هذا الدرع من _المستوى %1$d_ يصد _%2$d-%3$d ضرر_ ويتطلب _%4$d قوة_ ليُستخدم بشكل صحيح.
items.armor.armor.too_heavy=بسبب قوتك غير الكافية، لبس هذا الدرع سيقلل قدرتك على الحركة والمراوغة والدفاع.
items.armor.armor.probably_too_heavy=على الأرجح هذا الدرع ثقيل جداً عليك.
items.armor.armor.excess_str=بسبب قوتك الفائضة، أنت _أكثر مراوغة_ أثناء لبس هذا الدرع.
items.armor.armor.evasion=إنه معزز لتحسين _المراوغة._
items.armor.armor.defense=إنه معزز لتحسين _الدفاع._
items.armor.armor.inscribed=إنه منقوش بـ _%s._
items.armor.armor.glyph_hardened=لقد تم _تصليبه._
items.armor.armor.hardened_no_glyph=هذا الدرع تم _تصليبه،_ لكنه غير منقوش حالياً بأي نقش.
items.armor.armor.cursed_worn=لأن هذا الدرع ملعون، أنت عاجز عن نزعه.
items.armor.armor.cursed=يمكنك الشعور بسحر خبيث يتربص داخل هذا الدرع.
items.armor.armor.weak_cursed=رغم اللعنة، أنت قادر على نزع هذا الدرع.
items.armor.armor.not_cursed=هذا الدرع خالٍ من السحر الخبيث.
items.armor.armor.seal_attached=ختم المحارب المكسور مثبت على هذا الدرع. عندما يوشك على الإصابة بأقل من نصف صحته، سيمنحه _%d حماية_.
items.armor.armor.seal_transfer=ختم المحارب المكسور يجب تثبيته على درعه الملبوس حالياً ليفيده. هل تريد فصل الختم تلقائياً من الدرع الذي تنزعه وتثبيته على الدرع الذي تجهزه؟
items.armor.armor.seal_transfer_yes=نعم
items.armor.armor.seal_transfer_no=لا
items.armor.armor$glyph.glyph=نقش
items.armor.armor$glyph.killed=%s قتلك...
items.armor.armor$glyph.rankings_desc=قُتل بنقش
items.armor.armor$glyph.discover_hint=يمكنك العثور على غرض بهذا التأثير عشوائياً في الزنزانة، أو حاول تطبيقه على غرض بنفسك.
items.armor.classarmor.ac_ability=اختر قدرة
items.armor.classarmor.ac_transfer=نقل
items.armor.classarmor.no_ability=درعك حالياً بلا قدرة، ينبغي عليك اختيار واحدة!
items.armor.classarmor.not_equipped=تحتاج إلى لبس هذا الدرع لاستخدام قوته الخاصة!
items.armor.classarmor.low_charge=الدرع لا يملك شحنة كافية لاستخدام قوته الخاصة!
items.armor.classarmor.charge_use=استخدام القدرة الآن سيستهلك _%s_ شحنة.
items.armor.classarmor.transfer_title=نقل الدرع
items.armor.classarmor.transfer_desc=سحر تاج ملك الأقزام يمكن نقله إلى طقم درع آخر. لاحظ أن الدرع الأصلي سيُدمر في العملية.
items.armor.classarmor.transfer_prompt=اختر درعاً
items.armor.classarmor.transfer_cancel=إلغاء
items.armor.classarmor.transfer_complete=خصائص درعك البطولي تم نقلها!
items.armor.classarmor.discover_hint=يمكنك العثور على هذا الغرض بعد هزيمة زعيم الطابق 20 ببطل محدد.
items.armor.clericarmor.name=رداء البطل
items.armor.clericarmor.desc=أثناء لبس هذا المزيج من القماش والصفائح، يمكن للكاهن أداء قدرة خاصة.
items.armor.clotharmor.name=درع قماشي
items.armor.clotharmor.desc=هذا الدرع الخفيف يوفر حماية أساسية.
items.armor.clotharmor.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.armor.duelistarmor.name=صديرية البطلة
items.armor.duelistarmor.desc=أثناء لبس هذا الدرع الصفحي والعباءة، يمكن للمبارزة أداء قدرة خاصة.
items.armor.huntressarmor.name=عباءة البطلة
items.armor.huntressarmor.no_enemies=لا أعداء في مرأى
items.armor.huntressarmor.desc=أثناء لبس هذه العباءة، يمكن للصيادة أداء قدرة خاصة.
items.armor.leatherarmor.name=درع جلدي
items.armor.leatherarmor.desc=درع مصنوع من جلد وحوش مدبوغ. ليس خفيفاً كالدرع القماشي لكنه يوفر حماية أفضل.
items.armor.magearmor.name=جبة البطل
items.armor.magearmor.desc=أثناء لبس هذه الجبة الرائعة، يمكن للساحر أداء قدرة خاصة.
items.armor.mailarmor.name=درع حلقي
items.armor.mailarmor.desc=حلقات معدنية متشابكة تصنع بدلة قوية لكن مرنة.
items.armor.platearmor.name=درع صفحي
items.armor.platearmor.desc=صفائح معدنية هائلة موصولة معاً في بدلة توفر حماية لا مثيل لها لأي مغامر قوي بما يكفي لحمل وزنها المذهل.
items.armor.roguearmor.name=زي البطل
items.armor.roguearmor.desc=أثناء لبس هذا الزي الداكن، يمكن للص أداء قدرة خاصة.
items.armor.scalearmor.name=درع حرشفي
items.armor.scalearmor.desc=حراشف معدنية مخيطة على سترة جلدية تصنع درعاً مرناً ووقائياً.
items.armor.warriorarmor.name=درع صفحي بطولي
items.armor.warriorarmor.desc=أثناء لبس هذا الدرع الصفحي الثقيل، يمكن للمحارب أداء قدرة خاصة.
###artifacts
items.artifacts.alchemiststoolkit.name=عدة الخيميائي
items.artifacts.alchemiststoolkit.ac_brew=اختمر
items.artifacts.alchemiststoolkit.ac_energize=شحذ
items.artifacts.alchemiststoolkit.not_ready=عدتك لم تنتهِ من التسخين بعد.
items.artifacts.alchemiststoolkit.cursed=عدتك الملعونة تمنعك من استخدام الخيمياء!
items.artifacts.alchemiststoolkit.need_energy=تحتاج على الأقل 6 طاقة لذلك.
items.artifacts.alchemiststoolkit.energize_desc=كل 6 بلورات طاقة ستمنح العدة طاقة كافية لكسب مستوى، مما يزيد معدل توليد العدة للطاقة عبر الزمن، وسرعة تسخينها.\nكم طاقة تريد استخدام؟
items.artifacts.alchemiststoolkit.energize_1=6 طاقة: +1 مستوى
items.artifacts.alchemiststoolkit.energize_all=%1$d طاقة: +%2$d مستويات
items.artifacts.alchemiststoolkit.desc=هذه العدة تحتوي عدداً من الكواشف والأعشاب مع قارورة خلط صغيرة، تتيح الخيمياء أثناء التنقل. القارورة تحتوي ما يبدو بلورات طاقة خيميائية بشكل سائل.
items.artifacts.alchemiststoolkit.desc_cursed=العدة الملعونة ربطت نفسها بجنبك، وترفض أن تدعك تستخدم الخيمياء.
items.artifacts.alchemiststoolkit.desc_warming=العدة تسخن حالياً، وستكون جاهزة للاستخدام بعد قليل.
items.artifacts.alchemiststoolkit.desc_hint=العدة المجهزة تولد طاقة خيميائية ببطء كلما كسبت خبرة. يبدو أن المزيج في القارورة يمكن تعزيزه بإضافة بلورات طاقة إليه.
items.artifacts.artifact.cannot_wear_two=لا يمكنك لبس قطعتين أثريتين متطابقتين.
items.artifacts.artifact.equip_cursed=القطعة الأثرية ترتبط بك بألم.
items.artifacts.artifact.curse_known=يمكنك الشعور بسحر خبيث يتربص داخل القطعة الأثرية.
items.artifacts.artifact.not_cursed=هذه القطعة الأثرية خالية من السحر الخبيث.
items.artifacts.artifact.need_to_equip=تحتاج لتجهيز قطعتك الأثرية لفعل ذلك.
items.artifacts.capeofthorns.name=عباءة الأشواك
items.artifacts.capeofthorns.desc=هذه الصفائح المعدنية المنهارة من DM-300 تشكلت معاً في عباءة صلبة. يبدو أنها تخزن طاقة عميقة، ربما تملك بعض قوة DM-300؟
items.artifacts.capeofthorns.desc_inactive=العباءة تشعر بثقل مطمئن على كتفيك، يبدو أنها تكسب طاقة من الضرر الذي تتلقاه.
items.artifacts.capeofthorns.desc_active=العباءة تبدو وكأنها تطلق طاقة مخزنة، إنها تشع قوة حماية.
items.artifacts.capeofthorns$thorns.inert=عباءتك تصبح خاملة مجدداً.
items.artifacts.capeofthorns$thorns.radiating=عباءتك تبدأ بشع الطاقة، تشعر بالحماية!
items.artifacts.capeofthorns$thorns.levelup=عباءتك تصبح أقوى!
items.artifacts.capeofthorns$thorns.name=أشواك
items.artifacts.capeofthorns$thorns.desc=عباءتك تشع طاقة، محيطة إياك بمجال من قوة الصد!\nكل ضرر تتلقاه يقل أثناء فعالية تأثير الأشواك. إضافة لذلك، إذا كان المهاجم بجانبك، تُرد الكمية المخفضة على المهاجم.\nأدوار الأشواك المتبقية: %s.
items.artifacts.chaliceofblood.name=كأس الدم
items.artifacts.chaliceofblood.ac_prick=وخز
items.artifacts.chaliceofblood.yes=نعم، أعرف ما أفعله
items.artifacts.chaliceofblood.no=لا، لقد غيرت رأيي
items.artifacts.chaliceofblood.prick_warn=كل مرة تستخدم الكأس سيسحب المزيد من طاقة حياتك، لكنه سيعزز بالمقابل تجدد صحتك الطبيعي.\nالوخز حالياً سيوجه _%1$d-%2$d ضرر_، رغم أن هذا الضرر يمكن خفضه بـ _الصد الجسدي والسحري أو خفض الضرر._ بدون اعتبار تأثيرات خفض الضرر، وخز نفسك حالياً لديه _احتمال %3$s%%_ لاستنزاف قوة حياتك تماماً.\nهل أنت متأكد أنك تريد منح الكأس المزيد من طاقة الحياة؟
items.artifacts.chaliceofblood.onprick=توخز نفسك، وجوهر حياتك يتسرب إلى الكأس.
items.artifacts.chaliceofblood.ondeath=الكأس تمتص جوهر حياتك حتى الجفاف...
items.artifacts.chaliceofblood.desc=هذا الكأس الفضي اللامع مزين بغرابة بجواهر حادة عند الحافة.
items.artifacts.chaliceofblood.desc_cursed=الكأس الملعون ربط نفسه بيدك، ويثبط قدرتك على تجدد الصحة.
items.artifacts.chaliceofblood.desc_1=أثناء إمساكك الكأس، تشعر بدافع غريب لوخز نفسك على الجواهر الحادة.
items.artifacts.chaliceofblood.desc_2=بعض دمك متجمع في الكأس، تشعر بخفاء أن الكأس يغذيك بطاقة حياة، يزيد تجدد صحتك الطبيعي. ما زلت تريد جرح نفسك على الكأس، رغم علمك أنه سيؤلم.
items.artifacts.chaliceofblood.desc_3=الكأس ممتلئ حتى حافته بجوهر حياتك. يمكنك الشعور بالكأس يعيد صب طاقة الحياة فيك.
items.artifacts.cloakofshadows.name=عباءة الظلال
items.artifacts.cloakofshadows.ac_stealth=تخفٍ
items.artifacts.cloakofshadows.cooldown=عباءتك تحتاج %d أدوار إضافية لإعادة الشحن.
items.artifacts.cloakofshadows.cursed=لا يمكنك استخدام عباءة ملعونة.
items.artifacts.cloakofshadows.no_charge=عباءتك لم تشحن بما يكفي لتُستخدم بعد.
items.artifacts.cloakofshadows.desc=عباءة سحرية لا تقدر بثمن، سُرقت من الترسانة الملكية قبل سنوات عديدة بواسطة اللص. عند لبسها، يمكن استخدامها للتحول إلى غير مرئي تماماً لفترة قصيرة.\nكلما استُخدمت العباءة أكثر، صارت أقوى، ما يتيح للص أن يصبح غير مرئي بتواتر أكبر ولفترات أطول.
items.artifacts.cloakofshadows.discover_hint=أحد الأبطال يبدأ بهذا الغرض.
items.artifacts.cloakofshadows$cloakstealth.no_charge=عباءتك نفدت طاقتها.
