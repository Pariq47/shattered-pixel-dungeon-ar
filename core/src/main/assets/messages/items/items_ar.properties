###misc items
items.amulet.name=تميمة يندور
items.amulet.ac_end=إنهاء اللعبة
items.amulet.desc=تميمة يندور هي أقوى قطعة أثرية معروفة للبشر أو الأقزام. بلوراتها المتلألئة تحتوي قوة لا تصدق وعجيبة.
items.amulet.desc_origins=أصول التميمة مجهولة. التاريخ يقول أن ملك الأقزام تفاخر بأنه اكتشف القطعة الأثرية قبل وقت قصير من قطع حضارة الأقزام كل الاتصالات. كيف وجدها؟ كيف أخذها يوغ-دزيوا منه؟ أسئلة لوقت آخر ربما، كل ما يهم الآن أن التميمة لك!
items.amulet.desc_ascent=أصول التميمة مجهولة، لكن من الواضح أنها تأثرت بشدة بقوة يوغ-دزيوا. الزنزانة تبدو وكأنها تنحني لإرادة يوغ أثناء تنقلك فيها، جاعلة الأعداء أكثر عدداً وقوة بكثير! أنت أيضاً لم تعد قادراً على تفعيل التميمة أو التخلص منها، وكأنها ملعونة.
items.amulet.ascent_title=الصعود
items.amulet.ascent_desc=تبدأ بالشعور بقوة يوغ-دزيوا العظيمة والمرعبة تشع من التميمة. الصعود عائداً عبر الزنزانة كبشري قد يكون أصعب مما ظننت!
إذا واصلت الصعود بالتميمة ستصبح الزنزانة أخطر، والنقل المكاني بين الطوابق سيُعطّل، وستتمكن من الفوز باللعبة فقط بهزيمة الأعداء أثناء صعودك عبر الزنزانة!
يمكنك ترك التميمة هنا حالياً إذا أردت الصعود بدون بدء هذا التحدي، أو تفعيل التميمة قبل الصعود لإنهاء اللعبة بشكل عادي.
items.amulet.ascent_yes=واصل!
items.amulet.ascent_no=توقف حالياً
items.amulet.discover_hint=يمكنك العثور على هذا الغرض في قاع الزنزانة...
