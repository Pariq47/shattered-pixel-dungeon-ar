plants.blandfruitbush.name=فاكهة فاترة
plants.blandfruitbush.desc=ابنة عم بعيدة لتوت العفن، ثمرة شجيرة الفاكهة الفاترة التي تشبه الكمثرى طعمها كغبار متكتل. الثمرة مقززة وغير مغذية لكنها ليست سامة. ربما يمكن طهوها.
plants.blandfruitbush.discover_hint=يمكنك العثور على هذه النبتة عشوائياً في الزنزانة.
plants.blandfruitbush$seed.name=بذرة فاكهة فاترة

plants.blindweed.name=عشب العمى
plants.blindweed.desc=عند لمسه، يفنى عشب العمى في ومضة ضوء ساطعة. الومضة قوية بما يكفي لإرباك الرؤية لعدة ثوانٍ.
plants.blindweed.warden_desc=_الحارسة_ ستوجه طاقة عشب العمى إلى رداء مؤقت من التخفي، بدلاً من إصابتها بالارتباك.
plants.blindweed$seed.name=بذرة عشب العمى

plants.mageroyal.name=زهرة الساحر
plants.mageroyal.refreshed=تشعر بالانتعاش.
plants.mageroyal.desc=تحتوي أزهار زهرة الساحر الشائكة على مادة كيميائية معروفة بخصائصها كعامل معادل قوي. أي شيء يدوس على هذه النبتة سيتطهر من العديد من التأثيرات السلبية.
plants.mageroyal.warden_desc=بالإضافة إلى تأثير التطهير، ستصبح _الحارسة_ محصنة مؤقتاً ضد كل التأثيرات المرتبطة بالمنطقة عند دوس زهرة الساحر.
plants.mageroyal$seed.name=بذرة زهرة الساحر

plants.earthroot.name=جذر الأرض
plants.earthroot.desc=عندما يلمس مخلوق جذر الأرض، تخلق جذوره نوعاً من الدروع الطبيعية الثابتة حوله.
plants.earthroot.warden_desc=ستتحرك جذور نبتة جذر الأرض مع _الحارسة_، مانحة إياها درع الجلد الشجري المتحرك.
plants.earthroot$seed.name=بذرة جذر الأرض
plants.earthroot$armor.name=درع عشبي
plants.earthroot$armor.desc=نوع من الدروع الطبيعية الثابتة المصنوعة من اللحاء والخيوط.\n\nسيصد هذا الدرع العشبي %d ضرر من أي ضربة جسدية، حتى تنفد متانته في النهاية وينهار.\n\nبما أن الدرع ثابت، فإن التحرك سيسبب تفككه وضياعه.\n\nالدرع المتبقي: %d.

plants.fadeleaf.name=ورقة التلاشي
plants.fadeleaf.desc=لمس ورقة التلاشي سينقل أي مخلوق إلى مكان عشوائي في الطابق الحالي.
plants.fadeleaf.warden_desc=تأثير الانتقال لورقة التلاشي أكثر قوة لـ_الحارسة_، حيث ينقلها عائداً إلى نهاية طابق الزنزانة السابق.
plants.fadeleaf$seed.name=بذرة ورقة التلاشي

plants.firebloom.name=زهرة النار
plants.firebloom.desc=عندما يلمس شيء ما زهرة النار، تنفجر ألسنة اللهب منه.
plants.firebloom.warden_desc=عندما تدوس _الحارسة_ زهرة النار، ستُحقن لفترة وجيزة بقوة اللهب بدلاً من أن تتأذى.
plants.firebloom$seed.name=بذرة زهرة النار

plants.icecap.name=قبعة الجليد
plants.icecap.desc=عند لمسها، تطلق قبعة الجليد نفخة من حبوب اللقاح المتجمدة. تأثير التجميد أقوى بكثير إذا كانت البيئة رطبة.
plants.icecap.warden_desc=عندما تدوس _الحارسة_ قبعة الجليد، ستُحقن لفترة وجيزة بقوة الصقيع بدلاً من أن تتأذى.
plants.icecap$seed.name=بذرة قبعة الجليد

plants.plant.warden_desc=لا تملك هذه النبتة أي تأثير خاص عند استخدامها من قبل الحارسة.
plants.plant.discover_hint=يمكنك العثور على هذه النبتة عشوائياً في الزنزانة، أو زراعتها من بذرتها المرتبطة.
plants.plant$seed.seed_of=بذرة %s
plants.plant$seed.ac_plant=ازرع
plants.plant$seed.info=ارمِ هذه البذرة إلى المكان الذي تريد أن تنمو فيه النبتة.\n\n%s
plants.plant$seed$placeholder.name=بذرة

plants.rotberry.name=توت العفن
plants.rotberry.desc=ثمار شجيرة توت العفن الصغيرة طعمها كالموت الحلو الحلو. على مدى بضع سنوات، ستنمو شجيرة توت العفن هذه لتصبح قلب عفن آخر. عند دوسها، ستنتج توتة العفن الصغيرة نفخة صغيرة من الغاز السام.
plants.rotberry.warden_desc=عادةً ما تنتج شجيرة توت العفن القليل من الغاز فقط عند دوسها، لكن _الحارسة_ قادرة على تسخير طاقتها لتعزيز قوتها مؤقتاً!
plants.rotberry.discover_hint=يمكنك زراعة هذه النبتة من بذرتها المرتبطة خلال مهمة محددة.
plants.rotberry$seed.name=بذرة توت العفن
plants.rotberry$seed.discover_hint=يمكنك العثور على هذا الغرض خلال مهمة محددة.

plants.sorrowmoss.name=طحلب الحزن
plants.sorrowmoss.desc=طحلب الحزن هو زهرة )وليس طحلباً( بتلات حادة كالشفرة، مغطاة بسم قاتل.
plants.sorrowmoss.warden_desc=عندما تدوس _الحارسة_ طحلب الحزن، ستُحقن لفترة وجيزة بقوة السم بدلاً من أن تتأذى.
plants.sorrowmoss$seed.name=بذرة طحلب الحزن

plants.starflower.name=زهرة النجم
plants.starflower.desc=نبتة نادرة، يُقال إن زهرة النجم تمنح قوة مقدسة لمن يلمسها.
plants.starflower.warden_desc=بالإضافة إلى كونها مباركة، ستكسب _الحارسة_ كمية كبيرة من إعادة شحن العصي عندما تدوس زهرة النجم.
plants.starflower$seed.name=بذرة زهرة النجم

plants.stormvine.name=كرومة العاصفة
plants.stormvine.desc=تؤثر الجاذبية على نبتة كرومة العاصفة بشكل غريب، مما يسمح لخيوطها الزرقاء الرقيقة بـ'التعلق' في الهواء. أي شيء يعلق في الكرومة يتأثر بهذا، ويصاب بالارتباك.
plants.stormvine.warden_desc=_الحارسة_ قادرة على التحكم في تأثير الجاذبية لكرومة العاصفة، وستطفو لفترة وجيزة عندما تدوس واحدة.
plants.stormvine$seed.name=بذرة كرومة العاصفة

plants.sungrass.name=عشب الشمس
plants.sungrass.desc=عشب الشمس مشهور بخصائص عصارة الشفائية البطيئة لكنها الفعالة.
plants.sungrass.warden_desc=يمكن لـ_الحارسة_ تلقي الشفاء من عشب الشمس المدوس حتى لو ابتعدت عنه.
plants.sungrass$seed.name=بذرة عشب الشمس
plants.sungrass$health.name=شفاء عشبي
plants.sungrass$health.desc=يمتلك عشب الشمس خصائص شفائية ممتازة، رغم أنه أبطأ بكثير من جرعة الشفاء.\n\nالابتعاد عن النبتة سيكسر تأثير الشفاء.\n\nالشفاء المتبقي: %d.

plants.swiftthistle.name=شوك سريع
plants.swiftthistle.desc=عند دوسه، سيسرع الشوك السريع لفترة وجيزة تدفق الزمن حوله، مما يسمح للدائس بتنفيذ عدة إجراءات فوراً.
plants.swiftthistle.warden_desc=بالإضافة إلى اكتساب إجراءات فورية، ستحصل _الحارسة_ أيضاً على دفعة عجلة وجيزة عند دوس الشوك السريع.
plants.swiftthistle$seed.name=بذرة شوك سريع
plants.swiftthistle$timebubble.name=فقاعة زمنية
plants.swiftthistle$timebubble.desc=فقاعة صغيرة من الزمن المتسارع، تسمح بتنفيذ الإجراءات فوراً. الهجوم أو استخدام السحر سيكسر هذا التأثير مع ذلك.\n\nالأدوار المتبقية: %s.
