windows.wndsadghost.give_item=من فضلك خذ أحد هذه الأغراض، فهي عديمة الفائدة بالنسبة لي الآن... ربما ستساعدك في رحلتك...\n\nأيضاً... هناك غرض مفقود في هذه الزنزانة وهو عزيز جداً علي... إذا وجدت... يوماً ما... وردتي......
