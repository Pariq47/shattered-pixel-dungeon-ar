windows.wndblacksmith.smith=_الحدادة (%d معروف):_ يمكنني محاولة صياغة سلاح أو درع لك من الصفر. سيكون من فئة أعلى وربما مرقى، وستحصل على بعض الخيارات حول ما ستحصل عليه.
