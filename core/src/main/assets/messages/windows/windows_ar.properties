windows.wndblacksmith.prompt=حسناً، الاتفاق هو الاتفاق. إليك ما يمكنني فعله لك. أنا أعمل فقط مع الأغراض المعرفة وغير الملعونة.\n\n_المعروف الحالي: %d_
