windows.wndwandmaker.berry=أوه، أرى أن لديك التوتة! آمل ألا تكون نبتة توت العفن قد سببت لك الكثير من المتاعب. كما وعدت، يمكنك اختيار واحدة من عصيّ عالية الجودة.
