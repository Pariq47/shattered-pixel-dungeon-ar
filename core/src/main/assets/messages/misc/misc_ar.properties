challenges.no_food=نظام غذائي
challenges.no_food_desc=الطعام شحيح بالفعل، لكن عليك مراقبة حصصك أيضاً!\n\n- الطعام وقرن الوفرة فعالان بثلث فقط في إشباع الجوع\n- مصادر الشبع الأخرى لا تتأثر
challenges.no_armor=إيماني درعي
challenges.no_armor_desc=ستحتاج إيماناً بنفسك، فدرعك لن يفعل الكثير!\n\n- قوة الصد الأساسية مخفضة لكل الدروع عدا القماشية\n- كل الدروع تكسب الآن صدّاً قليلاً جداً عند ترقيتها\n- قوة الحارس الطيني الدفاعية مخفضة بشكل كبير أيضاً
challenges.no_healing=رهاب الأدوية
challenges.no_healing_desc=جرعات الشفاء مفيدة بالتأكيد، لكن لسوء الحظ أنت تعاني من حساسية منها!\n\n- جرعات الشفاء، والأغراض التي تستخدم جرعات الشفاء في وصفتها، وثمار الشمس ستسمم البطل بدلاً من شفائه\n- الأخلاط غير المستقرة لا يمكنها تسميم البطل أو شفاؤه عشوائياً\n- هذه الأغراض ما زالت تعمل طبيعياً للشخصيات الأخرى.
challenges.no_herbalism=أرض قاحلة
challenges.no_herbalism_desc=يبدو أنه لم يتبق ماء نظيف في هذه الزنزانة الملعونة...\n\n- تُزال قطرات الندى\n- تُزال النباتات\n- البذور ما زالت تظهر، لكنها لن تتجذر
challenges.swarm_intelligence=ذكاء السرب
challenges.swarm_intelligence_desc=انتبه، وحوش الزنزانة تصبح أذكى!\n\n- عندما يلاحظك عدو، تنجذب الأعداء القريبون إلى ذلك الموقع
challenges.darkness=في الظلام
challenges.darkness_desc=إنها زنزانة في النهاية!\n\n- مسافة الرؤية العادية مخفضة بشكل كبير\n- تظهر شعلة في كل طابق\n- مصادر الضوء الأخرى فعاليتها 1/5
challenges.no_scrolls=رموز محظورة
challenges.no_scrolls_desc=رمز معين أصبح أصعب في العثور عليه. لسوء الحظ، إنه دائماً الأكثر فائدة.\n\n- يُزال نصف لفافات الترقية في الزنزانة
challenges.champion_enemies=أبطال معادون
challenges.champion_enemies_desc=لست الوحيد الذي يمكنه رفع مستواه!\n\nالأعداء العاديون لديهم فرصة 1/8 للظهور مع تعزيز بطل خاص في الطابق 1، تتزايد إلى 1/6 في الطابق 21.\n\n- الأبطال يستيقظون إذا ظهروا نياماً\n- البطل يعرف متى يظهر بطل معادٍ\n- لا يمكن تحويل الأبطال إلى حلفاء\n\nهناك ستة أنواع من الأعداء الأبطال:\n_متقد )برتقالي(:_ +25% ضرر قريب، يشعل عند الإصابة، ينشر اللهب عند الموت، لا يمكنه إشعال بلاطات الماء\n_ممتد )بنفسجي(:_ +25% ضرر قريب، +3 مدى قريب\n_مضاد للسحر )أخضر(:_ -50% ضرر متلقى، مناعة ضد التأثيرات السحرية\n_عملاق )أزرق(:_ -80% ضرر متلقى، +1 مدى قريب، لا يمكنه التحرك في الأنفاق\n_مبارك )أصفر(:_ دقة ومراوغة 4 أضعاف\n_نامٍ )أحمر(:_ +20% دقة ومراوغة وضرر وصحة فعالة. يزداد بنسبة 1% كل 4 أدوار.
challenges.stronger_bosses=زعماء أشد شراسة
challenges.stronger_bosses_desc=الزعماء أشد صلابة بكثير مع هذا التحدي!\n\n_غو:_ +20% صحة\n_-_ الشفاء في الماء يتزايد، إلى 3/دور\n_-_ يتضخم في دور واحد بدلاً من 2\n_تينغو:_ +25% صحة\n_-_ المرحلة 1: الفخاخ أكثر فتكاً بكثير\n_-_ المرحلة 2: القدرات أكثر تكراراً\n_DM-300:_ +33% صحة\n_-_ الأبراج أصلب و3 منها تتفعل\n_-_ القدرات أقوى وأكثر تكراراً\n_-_ DM-300 أسرع عند الشحن الفائق\n_-_ الأسلاك المكشوفة أكثر شيوعاً بمرتين\n_ملك الأقزام:_ +50% صحة\n_-_ الأتباع أقوى في كل المراحل\n_-_ المرحلة 1: قدرات واستدعاءات أسرع\n_-_ المرحلة 2: تابعان إضافيان كل جولة\n_-_ المرحلة 3: صحة مضاعفة، استدعاءات أسرع\n_يوغ-دزيوا:_\n_-_ تُستدعى قبضتان في كل مرة!\n_-_ +60% ضرر الليزر\n_-_ أتباع أقوى

