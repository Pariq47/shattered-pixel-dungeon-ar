actors.buffs.preparation.name=استعداد
actors.buffs.preparation.action_name=ضربة مستعدة
actors.buffs.preparation.desc=المغتال ينتظر بصبر، مستعداً للضرب من الظلال.
actors.buffs.preparation.desc_dmg=هجومه التالي سيسبب _%1$d%% ضرراً إضافياً،_ وسيُعدم الأعداء العاديين الذين صحتهم أقل من _%2$d%%_، أو الزعماء الذين صحتهم أقل من _%3$d%%._
actors.buffs.preparation.desc_dmg_likely=الهجوم سيكون أيضاً أكثر احتمالاً لتوجيه كمية أكبر من الضرر.
actors.buffs.preparation.desc_blink=هو قادر على الوميض نحو عدو قبل ضربه، بأقصى مسافة _%d._
actors.buffs.preparation.desc_invis_time=الأدوار المقضاها غير مرئي: _%d._
