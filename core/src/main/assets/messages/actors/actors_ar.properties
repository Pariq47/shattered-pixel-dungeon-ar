actors.blobs.fire.name=نار
actors.blobs.fire.desc=نار مستعرة هنا.
actors.blobs.foliage.name=أوراق الشجر
actors.blobs.foliage.desc=أشعة من الضوء تخترق ظلام الحديقة تحت الأرض.
actors.blobs.freezing.name=هواء متجمد
actors.blobs.freezing.desc=الهواء بارد بشكل غير طبيعي هنا.
actors.blobs.goowarn.name=طاقة مظلمة
actors.blobs.goowarn.desc=ذرات من الطاقة المظلمة تحتشد هنا!
actors.blobs.inferno.name=جحيم
actors.blobs.inferno.desc=جحيم مستعر هنا.
