actors.blobs.paralyticgas.desc=سحابة من غاز الشلل تعصف هنا.
actors.blobs.regrowth.name=إعادة النمو
actors.blobs.sacrificialfire.name=نار التضحية
actors.blobs.sacrificialfire.desc=هناك مذبح هنا تشتعل فوقه نار التضحية. أي مخلوق يُقتل هنا سيُستهلك كقربان لأرواح الزنزانة.
ربما تُمنح مكافأة إذا قُدمت تضحيات كافية؟
actors.blobs.sacrificialfire.worthy=النار تلتهم قربانك وتزداد قوة.
actors.blobs.sacrificialfire.unworthy=النار تلتهم قربانك، لكنها لا تتغير.
actors.blobs.sacrificialfire.reward=النار تتوهج ثم تتبدد، تاركة مكافأة خلفها!
actors.blobs.smokescreen.name=ستار دخاني
actors.blobs.smokescreen.desc=سحابة من الدخان الأسود الكثيف تعصف هنا.
actors.blobs.stenchgas.name=غاز النتّن
actors.blobs.stenchgas.desc=سحابة من النتّن الكريه تعصف هنا.
actors.blobs.stormcloud.name=سحب عاصفة
actors.blobs.stormcloud.desc=سحابة من بخار الماء المتصاعد تعصف هنا.
actors.blobs.toxicgas.name=غاز سام
actors.blobs.toxicgas.desc=سحابة خضراء من الغاز السام تعصف هنا.
actors.blobs.toxicgas.rankings_desc=اختنق بالغاز السام
actors.blobs.toxicgas.ondeath=لقد مت من الغاز السام...
actors.blobs.corrosivegas.name=غاز أكّال
actors.blobs.corrosivegas.desc=سحابة من الغاز الأكّال القاتل تعصف هنا.
actors.blobs.waterofawareness.name=ماء الإدراك
actors.blobs.waterofawareness.procced=أثناء احتسائك رشفة، تشعر بالمعرفة تتدفق إلى عقلك.
actors.blobs.waterofawareness.desc=قوة المعرفة تشع من ماء هذا البئر. الشرب من البئر سيعرف تماماً كل الأغراض المجهزة، ويعرف اللعنات على كل الأغراض في حقيبتك، ويكشف كل الأغراض في الطابق الحالي.
actors.blobs.waterofhealth.name=ماء الصحة
actors.blobs.waterofhealth.procced=أثناء احتسائك رشفة، تشعر بجراحك تلتئم تماماً.
actors.blobs.waterofhealth.desc=قوة الصحة تشع من ماء هذا البئر. الشرب من هذا البئر سيشفي جراحك، ويشبع جوعك، ويطهر اللعنات عن أي أغراض ملبوسة.
actors.blobs.web.name=شبكة عنكبوت
actors.blobs.web.desc=شبكة سميكة تغطي كل شيء هنا. أي شيء يلمس الشبكة أو يُرمى عبرها سيكسرها، لكنه سيعلق في مكانه أيضاً.
###buffs
actors.buffs.adrenaline.name=أدرينالين
actors.buffs.adrenaline.desc=اندفاع من القوة الجسدية، الأدرينالين يعزز كل من سرعة الهجوم والحركة.
الأدرينالين يتيح لهدفه الجري بسرعة مضاعفة، والهجوم بسرعة 1.5 مرة.
الأدوار المتبقية: %s.
actors.buffs.adrenalinesurge.name=اندفاع القوة
actors.buffs.adrenalinesurge.desc=اندفاع من القوة العظيمة، لكن للأسف ليس دائماً.
تعزيز القوة: +%d.
الأدوار حتى يضعف التعزيز: %s.
actors.buffs.amok.name=هياج
actors.buffs.amok.desc=الهياج يسبب حالة من الغضب والارتباك الشديدين لهدفه.
عندما يهيج مخلوق، سيهاجم أي شيء قريب منه، سواء كان صديقاً أو عدواً.
أدوار الهياج المتبقية: %s.
actors.buffs.arcanearmor.name=درع سحري
actors.buffs.arcanearmor.desc=درع رقيق يحيط بك، يصدر بعض الضرر من الهجمات السحرية.
درعك السحري معزز حالياً بمقدار: 0-%d.
الأدوار حتى يضعف الدرع السحري: %s.
actors.buffs.artifactrecharge.name=إعادة شحن القطع الأثرية
actors.buffs.artifactrecharge.desc=الطاقة تجري فيك، مما يزيد من معدل شحن قطعك الأثرية المجهزة.
كل قطعة أثرية تتأثر بشكل مختلف قليلاً، لكنها جميعاً ستكسب شحنة أسرع بكثير من المعتاد.
الأدوار المتبقية: %s.
actors.buffs.ascensionchallenge.name=لعنة التميمة
actors.buffs.ascensionchallenge.desc=بطريقة ما يحافظ يوغ-دزيوا على تأثيره على هذا العالم من خلال التميمة، ويحاول إيقاف صعودك!
قوة يوغ تجعل الزنزانة أكثر خطراً بكثير، مما يزيد عدد الأعداء ويجعلهم أقوى! هذه القوة ستستمر في التراكم إذا تُركت بدون رادع، ويمكن إضعافها بهزيمة الأعداء الذين عززتهم قوة يوغ.
actors.buffs.ascensionchallenge.desc_clear=الطاقة المظلمة المشعة من التميمة تم إضعافها بأقصى قدر ممكن حالياً.
actors.buffs.ascensionchallenge.desc_beckon=التميمة _تنادي الأعداء البعيدين حالياً،_ لتنبيههم بموقعك.
actors.buffs.ascensionchallenge.desc_haste=التميمة _تسرع الأعداء البعيدين حالياً،_ مما يتيح لهم الوصول إليك أسرع!
actors.buffs.ascensionchallenge.desc_slow=التميمة _تبطئك حالياً،_ وتلغي تأثيرات تعزيز السرعة!
actors.buffs.ascensionchallenge.desc_damage=الطاقة من التميمة أصبحت قوية لدرجة أنها _تؤذيك مباشرة!_
actors.buffs.ascensionchallenge.beckon=التميمة تبدأ بمناداة الأعداء البعيدين.
actors.buffs.ascensionchallenge.haste=التميمة تبدأ بتسريع الأعداء البعيدين!
actors.buffs.ascensionchallenge.slow=التميمة تبدأ بالشعور وكأنها ثقل من الرصاص في حقيبتك!
actors.buffs.ascensionchallenge.damage=التميمة تبدأ بإشعاع طاقة مظلمة. إنها تحرق!
actors.buffs.ascensionchallenge.weaken_info=يمكن إضعاف لعنة التميمة بهزيمة المزيد من الأعداء.
actors.buffs.ascensionchallenge.weaken_info_no_kills=إذا هزمت أعداء ستضعف لعنة التميمة!
actors.buffs.ascensionchallenge.weaken=يمكنك الشعور بلعنة التميمة تضعف قليلاً.
actors.buffs.ascensionchallenge.break=تأخذ لحظة لالتقاط أنفاسك وتشعر بجراحك تبدأ بالالتئام!
actors.buffs.ascensionchallenge.almost=تشعر بقبضة يوغ على التميمة تبدأ بالضعف، أنت قريب جداً!
actors.buffs.ascensionchallenge.on_kill=الطاقة المظلمة تستهلكك...
actors.buffs.barkskin.name=جلد شجري
actors.buffs.barkskin.desc=جلدك متصلب، يشعر بخشونة وصلابة مثل لحاء الشجر.
الجلد المتصلب يزيد درعك الفعال، مما يتيح لك الدفاع بشكل أفضل ضد الهجمات الجسدية.
درعك معزز حالياً بمقدار: 0-%d.
الأدوار حتى يضعف الجلد الشجري: %s.
إذا تلقيت الجلد الشجري من مصادر متعددة، فقط الأقوى هو الذي سيُطبق.
actors.buffs.barrier.name=حاجز
actors.buffs.barrier.desc=فقاعة قوة متينة تصد كل الضرر.
الحاجز سيتلقى الضرر بدلاً مما يحميه طالما هناك حماية متبقية. الحماية ستتلاشى أيضاً ببطء عبر الزمن.
الحماية المتبقية: %d.
actors.buffs.berserk.angered=غاضب
actors.buffs.berserk.berserk=يهيج
actors.buffs.berserk.exhausted=مرهق
actors.buffs.berserk.recovering=يتعافى
actors.buffs.berserk.angered_desc=شدة إصابات البرسيرك تقوي ضرباته. كلما تلقى البرسيرك ضرراً جسدياً، سيبني غضبه، مما يمنحه ضرراً إضافياً. الضرر الذي يصده الدرع يُحتسب أيضاً لبناء الغضب.
الغضب سيتلاشى عبر الزمن. كلما انخفضت صحة البرسيرك، كلما استمر لفترة أطول.
عند 100%% غضب، يمكن للبرسيرك الهياج، مما يمنحه حماية بناءً على مستوى درعه وصحته المفقودة. أثناء الهياج، تتلاشى حمايته عبر الزمن وبمجرد نفادها سيضطر للراحة قبل بناء الغضب مجدداً.
الغضب الحالي: _%1$.0f%%_
_+%2$.0f%%_ ضرر
درع الهياج عند الدرع والصحة الحاليين: _%3$d_
actors.buffs.berserk.berserk_desc=الخوف والشك يتلاشان، تاركين فقط الغضب. في هذه الحالة يكون البرسيرك قوياً للغاية، _يوجه +50%% ضرر ويكسب حماية إضافية،_ لكنه يفقد الحماية أيضاً كل دور.
عندما تنخفض كل حمايته إلى 0، سينتهي الهياج.
بعد الهياج، سيحتاج البرسيرك للتعافي قبل أن يتمكن من بناء الغضب مجدداً.
الحماية المتبقية: %d
actors.buffs.berserk.recovering_desc=القوة الداخلية لها حدود. يجب على البرسيرك الراحة قبل استخدام غضبه مجدداً.
أثناء التعافي لا يبني البرسيرك أي غضب من تلقي الضرر.
actors.buffs.berserk.recovering_desc_turns=الأدوار حتى التعافي: _%d_
actors.buffs.berserk.recovering_desc_levels=المستويات حتى التعافي: _%.2f_
actors.buffs.berserk.rankings_desc=هائج حتى الموت
actors.buffs.berserk.action_name=هياج
actors.buffs.berserk.no_seal=تحتاج ختمك المكسور للهياج!
actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=لقد نزفت حتى الموت...
actors.buffs.bleeding.heromsg=أنت تنزف!
actors.buffs.bleeding.rankings_desc=نزف حتى الموت
actors.buffs.bleeding.desc=ذلك الجرح يسرب كمية مقلقة من الدم.
النزيف يسبب ضرراً كل دور. كل دور يقل الضرر بمقدار عشوائي، حتى يتوقف النزيف في النهاية.
ضرر النزيف الحالي: %d.
actors.buffs.bless.name=مبارك
actors.buffs.bless.desc=اندفاع كبير من التركيز، يقول البعض أنه مستوحى من الآلهة.
المباركة تزيد الدقة والمراوغة بنسبة 25%%، مما يجعل المباركين أكثر فعالية في القتال.
أدوار المباركة المتبقية: %s.
actors.buffs.blindness.name=أعمى
actors.buffs.blindness.heromsg=أنت أعمى!
actors.buffs.blindness.desc=العمى يحول العالم المحيط إلى ضباب مظلم.
أثناء العمى، ينخفض مدى رؤية الشخصية إلى بلاطة واحدة، مما يجعل الهجمات بعيدة المدى عديمة الفائدة ويجعل من السهل جداً فقدان أثر الأعداء البعيدين. إضافة لذلك، البطل الأعمى غير قادر على قراءة اللفافات أو الكتب.
أدوار العمى المتبقية: %s.
actors.buffs.buff.heromsg=
actors.buffs.burning.name=محترق
actors.buffs.burning.heromsg=أنت تشتعل!
actors.buffs.burning.burnsup=%s يحترق!
actors.buffs.burning.ondeath=لقد احترقت حتى الموت...
actors.buffs.burning.rankings_desc=احترق حتى الرماد
actors.buffs.burning.desc=قليل من الأشياء أكثر إزعاجاً من الابتلاع باللهب.
النار ستوجه ضرراً كل دور حتى تُخمد بالماء أو تنتهي. يمكن إخماد النار بالدخول في الماء، أو من تناثر جرعة متحطمة.
إضافة لذلك، النار قد تشعل التضاريس أو الأغراض القابلة للاشتعال التي تلامسها.
أدوار الاحتراق المتبقية: %s.
actors.buffs.championenemy.warn=تشعر بحضور مميت.
actors.buffs.championenemy$blazing.name=بطل متقد
actors.buffs.championenemy$blazing.desc=الأبطال المتقدون يوجهون ضرراً قريباً أكثر بنسبة 25%، ويشعلون الأعداء الذين يهاجمونهم، ومحصنون ضد النار، وينشرون النار حولهم عند موتهم. لكنهم لا يستطيعون نشر النار على الماء.
actors.buffs.championenemy$projecting.name=بطل ممتد
actors.buffs.championenemy$projecting.desc=الأبطال الممتدون يوجهون ضرراً قريباً أكثر بنسبة 25% ولديهم +3 مدى هجوم.
actors.buffs.championenemy$antimagic.name=بطل مضاد للسحر
actors.buffs.championenemy$antimagic.desc=الأبطال المضادون للسحر يتلقون ضرراً أقل بنسبة 50% ومحصنون تماماً ضد التأثيرات السحرية.
actors.buffs.championenemy$giant.name=بطل عملاق
actors.buffs.championenemy$giant.desc=الأبطال العملاقون يتلقون ضرراً أقل بنسبة 80% ولديهم +1 مدى هجوم، لكنهم لا يستطيعون التحرك عبر المساحات المغلقة.
actors.buffs.championenemy$blessed.name=بطل مبارك
actors.buffs.championenemy$blessed.desc=الأبطال المبارك لديهم دقة ومراوغة مضاعفة 4 مرات.
actors.buffs.championenemy$growing.name=بطل نامٍ
actors.buffs.championenemy$growing.desc=الأبطال النامون يكتسبون تعزيزاً متزايداً باطراد للدقة، المراوغة، الضرر الجسدي، وخفض الضرر المتلقى.
تعزيز الدقة/المراوغة/الضرر الحالي: %1$d%%
خفض الضرر الحالي: %2$d%%
actors.buffs.charm.name=مفتون
actors.buffs.charm.heromsg=أنت مفتون!
actors.buffs.charm.cant_attack=أنت مفتون بذلك العدو ولا تستطيع مهاجمته.
actors.buffs.charm.desc=الفتنة سحر تلاعبي يمكنه جعل الأعداء يعشقون بعضهم مؤقتاً.
الشخصيات المتأثرة بالفتنة غير قادرة على مهاجمة العدو الذي فتنت به مباشرة. مهاجمة أهداف أخرى ما زالت ممكنة مع ذلك. صدمة الألم ستقلل مدة الفتنة.
أدوار الفتنة المتبقية: %s.
actors.buffs.chill.name=مبرد
actors.buffs.chill.freezes=%s يتجمد!
actors.buffs.chill.desc=ليس متجمداً تماماً، لكنه بارد جداً مع ذلك.
الأهداف المبردة تنفذ كل الأفعال ببطء أكثر، اعتماداً على عدد الأدوار المتبقية في التأثير. في أسوأ حالاته، يعادل هذا البطء.
أدوار التبريد المتبقية: %1$s.
السرعة μειώτηκαν بنسبة: %2$s%%
actors.buffs.combo.name=تتابع
actors.buffs.combo.action_name=هجوم تتابعي
actors.buffs.combo.combo=%d تتابع ضربات!
actors.buffs.combo.bad_target=يجب أن تستهدف عدواً في مدى الهجوم.
actors.buffs.combo.prompt=اختر هدفاً للهجوم.
actors.buffs.combo.desc=المصارع يبني زخماً كلما وجه ضربات ناجحة. كل هجوم يزيد عداد التتابع بواحد، لكن أخذ وقت طويل بين الضربات سيعيد عداد التتابع إلى 0. طالما لدى المصارع تتابع، أي حماية يمتلكها من ختمه المكسور لن تبدأ بالتلاشي.
بناء التتابع يفتح هجمات تتابعية خاصة لا يمكن أن تخطئ! هجوم مختلف يفتح عند 2، 4، 6، 8، و 10 تتابع. بعض الحركات تعيد التتابع وبعضها لا، لكن كل حركة يمكن استخدامها مرة واحدة فقط لكل جلسة تتابع.
التتابع الحالي: %1$d.
الأدوار حتى يضيع التتابع: %2$s.
actors.buffs.combo$combomove.clobber.name=ضربة قاضية
actors.buffs.combo$combomove.clobber.desc=يدفع العدو للخلف بلاطتين، لكن لا يسبب ضرراً ولا يمكنه الدفع في الحفر. يزيد التتابع بـ 1.
actors.buffs.combo$combomove.clobber.empower_desc=يدفع العدو للخلف _3 بلاطات، يسبب دواراً، ويمكنه الدفع في الحفر،_ لكن لا يسبب ضرراً. يزيد التتابع بـ 1.
actors.buffs.combo$combomove.slam.name= Slam
actors.buffs.combo$combomove.slam.desc=يسبب %d%% (التتابع*20%%) من قوة صد الضرر لديك كضرر إضافي. يعيد التتابع عند الاستخدام.
actors.buffs.combo$combomove.slam.empower_desc=_يقفز حتى %1$d بلاطة_ ويسبب %2$d%% (التتابع*20%%) من قوة صد الضرر لديك كضرر إضافي. يعيد التتابع عند الاستخدام.
actors.buffs.combo$combomove.parry.name=صد
actors.buffs.combo$combomove.parry.desc=يصصد الهجوم التالي خلال دور واحد عند التفعيل، ويرد عليه فوراً. يعيد التتابع إذا لم يُصد أي شيء.
actors.buffs.combo$combomove.parry.empower_desc=يصصد _كل الهجمات_ خلال دور واحد عند التفعيل، ويرد عليها فوراً. يعيد التتابع إذا لم يُصد أي شيء.
actors.buffs.combo$combomove.crush.name=سحق
actors.buffs.combo$combomove.crush.desc=يسبب %d%% (التتابع*25%%) ضرراً للهدف الأساسي، ونصف ذلك الضرر لكل الأعداء الآخرين في منطقة 7x7. يعيد التتابع عند الاستخدام.
actors.buffs.combo$combomove.crush.empower_desc=_يقفز حتى %1$d بلاطة_ ويسبب %2$d%% (التتابع*25%%) ضرراً للهدف الأساسي، ونصف ذلك الضرر لكل الأعداء الآخرين في منطقة 7x7. يعيد التتابع عند الاستخدام.
actors.buffs.combo$combomove.fury.name=غضب
actors.buffs.combo$combomove.fury.desc=يضرب العدو مرة واحدة لكل تتابع لديك، كل ضربة تسبب 60% ضرر ويمكنها تفعيل السحر. يعيد التتابع عند الاستخدام.
actors.buffs.combo$combomove.fury.empower_desc=_يقفز حتى %d بلاطة_ ويضرب العدو مرة واحدة لكل تتابع لديك، كل ضربة تسبب 60%% ضرر ويمكنها تفعيل السحر. يعيد التتابع عند الاستخدام.
actors.buffs.corruption.name=فاسد
actors.buffs.corruption.desc=الفساد يتسرب إلى جوهر الكائن، محرفاً إياه ضد طبيعته السابقة.
المخلوقات الفاسدة ستهاجم حلفاءها، وتتجاهل أعداءها السابقين. الفساد مؤذٍ أيضاً، وسيسبب ببطء هلاك هدفه.
الفساد دائم، تأثيراته تنتهي فقط بالموت.
actors.buffs.cripple.name=أعرج
actors.buffs.cripple.heromsg=أنت أعرج!
actors.buffs.cripple.desc=أنت متأكد تقريباً أن الأرجل ليس من المفترض أن تنحني بهذه الطريقة.
العرج يخفض سرعة الحركة إلى النصف، مما يجعل التحرك بلاطة يأخذ دورين عادة بدلاً من واحد.
أدوار العرج المتبقية: %s.
actors.buffs.daze.name=ذهول
actors.buffs.daze.heromsg=أنت في ذهول!
actors.buffs.daze.desc=طنين الأذن وتشوش الرؤية يجعلان القتال صعباً.
أثناء الذهول، تنخفض الدقة والمراوغة بنسبة 50%%، مما يجعل توجيه وتجنب الضربات أصعب بكثير.
أدوار الذهول المتبقية: %s.
actors.buffs.degrade.name=متدهور
actors.buffs.degrade.heromsg=معداتك تشعر بالضعف!
actors.buffs.degrade.desc=السحر المظلم القوي يستنزف القوة التي طبقتها لفافات الترقية على معداتك!
أثناء التدهور، ستُعامل المعدات المرقاة وكأنها مستوى أقل مما هي عليه فعلياً. _كل ترقية بعد +3 تصبح أضعف بشكل أسي من السابقة._ أوصاف أغراضك ستتغير لتعكس مستوى قوتها المنخفض.
التدهور لا يؤثر على متطلبات القوة، شحنات العصي، متانة أسلحة الرمي، أو القطع الأثرية.
أدوار التدهور المتبقية: %s. استخدام لفافة ترقية أو إزالة لعنة سينهي التدهور فوراً.
actors.buffs.doom.name=هالك
actors.buffs.doom.desc=من الصعب الاستمرار عندما يبدو أن الكون يريدك ميتاً.
الشخصيات الهالكة ستتلقى +67% ضرر من كل المصادر.
الهلاك دائم، تأثيراته تنتهي فقط بالموت.
actors.buffs.dread.name=رهبة
actors.buffs.dread.desc=رعب عظيم لدرجة أنه سيجعل هدفه يهرب من الزنزانة بالكامل!
المخلوقات المتأثرة بالرهبة ستهرب من خصمها بسرعة عالية، وستختفي من الزنزانة بالكامل بمجرد أن تبتعد عن الأنظار. الأعداء الذين يُهزمون بهذه الطريقة يمنحون نصف الخبرة ولا يسقطون أغراضاً. صدمة الألم ستقلل مدة الرهبة.
أدوار الرهبة المتبقية: %d.
actors.buffs.drowsy.name=نعاس
actors.buffs.drowsy.desc=قوة سحرية تجعل من الصعب البقاء مستيقظاً، بعد بضعة أدوار، سيسقط الهدف في نوم سحري عميق.
البطل يمكنه مقاومة النعاس بتلقي الضرر أو بأن يكون بصحة كاملة.
الأدوار حتى النوم: %s.
actors.buffs.earthimbue.name=مشبع بالأرض
actors.buffs.earthimbue.desc=أنت مشبع بقوة الأرض!
كل الهجمات الجسدية ستزيح الأرض تحت العدو، مسببة له العرج لفترة قصيرة.
أدوار التشبع بالأرض المتبقية: %s.
actors.buffs.enhancedrings.name=خواتم معززة
actors.buffs.enhancedrings.desc=القطعة الأثرية التي استخدمها اللص مؤخراً تعزز خواتمه، مانحة إياها +1 مستوى.
الأدوار المتبقية: %s.
actors.buffs.fireimbue.name=مشبع بالنار
actors.buffs.fireimbue.desc=أنت مشبع بقوة النار!
كل الهجمات الجسدية لديها فرصة لإشعال الأعداء. إضافة لذلك، أنت محصن تماماً ضد تأثيرات النار.
أدوار التشبع بالنار المتبقية: %s.
actors.buffs.foresight.name=استبصار
actors.buffs.foresight.desc=أنت قادر بطريقة ما على رؤية تخطيط التضاريس المحيطة بعقلك.
أثناء تأثير الاستبصار، كل البلاطات في مدى واسع تُكشف لك، بما في ذلك أي فخاخ أو أبواب مخفية.
أدوار الاستبصار المتبقية: %s.
actors.buffs.frost.name=متجمد
actors.buffs.frost.freezes=%s يتجمد!
actors.buffs.frost.desc=لا يُخلط بينه وبين التجمد الصلب، هذا التجميد الأكثر اعتدالاً يغلف الهدف بالجليد فحسب.
التجميد يعمل بشكل مشابه للشلل، مما يجعل من المستحيل على الهدف التصرف. على عكس الشلل، يُلغاء التجميد فوراً إذا تلقى الهدف ضرراً، حيث سيتحطم الجليد.
أدوار التجمد المتبقية: %s.
actors.buffs.frostimbue.name=مشبع بالصقيع
actors.buffs.frostimbue.desc=أنت مشبع بقوة جليدية!
كل الهجمات الجسدية ستراكم التبريد على الأعداء بثبات. إضافة لذلك، أنت محصن تماماً ضد البرد.
أدوار التشبع بالصقيع المتبقية: %s.
actors.buffs.fury.name=غاضب
actors.buffs.fury.heromsg=أنت تصبح غاضباً!
actors.buffs.fury.desc=أنت غاضب، الأعداء لن يعجبهم هذا.
غضب عظيم يشتعل داخلك، مما يزيد الضرر الذي تسببه بالهجمات الجسدية بنسبة 50%%.
هذا الغضب سيستمر طالما أنك مجروح وصحتك أقل من 50%%.
actors.buffs.blobimmunity.name=حاجز التنقية
actors.buffs.blobimmunity.desc=بعض القوة الغريبة تغلفك بحاجز واقي رقيق، يحجب كل التأثيرات المحمولة جواً الضارة.
أنت محصن ضد كل التأثيرات المرتبطة بمنطقة بينما يستمر هذا الحاجز.
أدوار الحصانة المتبقية: %s.
actors.buffs.gravitychaostracker.name=فوضى الجاذبية
actors.buffs.gravitychaostracker.desc_intro=كل بضعة أدوار، كل الشخصيات في طابق الزنزانة الحالي ستُقذف في اتجاه عشوائي.
actors.buffs.gravitychaostracker.desc_positive=أنت وحلفاؤك تبدو محصنين ضد هذا مع ذلك.
actors.buffs.gravitychaostracker.desc_duration=ليس واضحاً كم سيستمر التأثير، لكنه لا يمكن أن يستمر للأبد.
actors.buffs.greaterhaste.name=عجلة كبرى
actors.buffs.greaterhaste.desc=دفعة لا تصدق من السرعة، للحظة يبدو وكأن كل شيء آخر يقف ثابتاً.
أثناء تأثير العجلة الكبرى، أفعال الحركة لا تستغرق أي وقت على الإطلاق، لكن الأفعال الأخرى ما زالت تُنفذ بالسرعة العادية. كل خطوة حركة تستهلك دوراً من العجلة الكبرى.
أدوار العجلة الكبرى المتبقية: %d.
actors.buffs.haste.name=عجلة
actors.buffs.haste.desc=الطاقة تجري في عضلاتك، تتيح لك الجري بسرعات لا تصدق!
أثناء تأثير العجلة، ستجري بسرعة 3 أضعاف، لكنك ستنفذ كل الأفعال الأخرى بالسرعة العادية.
أدوار العجلة المتبقية: %s.
actors.buffs.healing.name=التئام
actors.buffs.healing.desc=علاج سحري يسبب التئام الجراح وتجدد اللحم.
كل دور ستتجدد الصحة بثبات حتى ينتهي تأثير الشفاء. كمية الشفاء قد تتلاشى عبر الزمن.
الشفاء التالي: %d.
الشفاء المتبقي: %d.
actors.buffs.herodisguise.name=تنكر
actors.buffs.herodisguise.desc=سحر وهمي غيّر مظهرك الجسدي! التأثير تجميلي بحت، لكنه يشعر بغرابة بالغة رغم ذلك.
أدوار التنكر المتبقية: %s.
actors.buffs.hex.name=مسحور
actors.buffs.hex.heromsg=لقد أُصبت بسحر!
actors.buffs.hex.desc=سحر مظلم يستنزف التركيز، مما يجعل الهدف مشوشاً قليلاً.
السحر يقلل الدقة والمراوغة بنسبة 20%%، مما يجعل الهدف أقل فعالية في القتال.
أدوار السحر المتبقية: %s.
actors.buffs.holdfast.name=ثبات
actors.buffs.holdfast.desc=المحارب يثبت موقعه، مما يزيد درعه بمقدار %1$d-%2$d ويبطئ معدل تلاشي بعض التأثيرات الإيجابية بنسبة %3$d%%. سيستمر هذا حتى يتحرك.
actors.buffs.hunger.hungry=جائع
actors.buffs.hunger.starving=يتضور جوعاً
actors.buffs.hunger.onhungry=أنت جائع.
actors.buffs.hunger.onstarving=أنت تتضور جوعاً!
actors.buffs.hunger.ondeath=لقد مت جوعاً...
actors.buffs.hunger.cursedhorn=القرن الملعون يسرق بعض طاقة الطعام بينما تأكل.
actors.buffs.hunger.rankings_desc=مات جوعاً
actors.buffs.hunger.desc_intro_hungry=يمكنك الشعور بمعدتك تنادي بالطعام، لكن الأمر ليس عاجلاً جداً بعد.
actors.buffs.hunger.desc_intro_starving=أنت جائع لدرجة أن هذا يؤلم.
actors.buffs.hunger.desc=
الجوع يزداد ببطء بينما تقضي الوقت في الزنزانة، في النهاية ستبدأ بالتضور جوعاً. أثناء التضور ستفقد الصحة ببطء بدلاً من تجديدها.
التقتيت مهم! إذا كان لديك صحة فائضة، التضور ليس فكرة سيئة إذا كان يعني أن هناك المزيد من الطعام لاحقاً. التقتيت الفعال يمكن أن يجعل الطعام يدوم أطول بكثير!
actors.buffs.invisibility.name=غير مرئي
actors.buffs.invisibility.desc=أنت ممزوج تماماً مع التضاريس المحيطة، مما يجعلك مستحيل الرؤية.
أثناء التخفي، الأعداء عاجزون عن مهاجمتك أو ملاحقتك. الهجمات الجسدية والتأثيرات السحرية )مثل اللفافات والعصي السحرية( ستلغي التخفي فوراً.
أدوار التخفي المتبقية: %s.
actors.buffs.invulnerability.name=حصين
actors.buffs.invulnerability.desc=هذه الشخصية مشبعة بقوة حماية عظيمة، مانحة إياها فترة قصيرة من الحصانة!
الأدوار المتبقية: %s.
actors.buffs.levitation.name=طافٍ
actors.buffs.levitation.desc=قوة سحرية ترفعك فوق الأرض، مما يجعلك تشعر بانعدام الوزن.
الشخصيات الطافية تتحرك بصمت وتتجاهل كل التأثيرات الأرضية. الفخاخ لن تُفعّل، الماء لن يخمد النار، النباتات لن تُداس، الجذور ستخطئ، والحفر ستُحلق فوقها. احذر، فكل هذه الأشياء يمكن أن تدخل حيز التنفيذ في الثانية التي ينتهي فيها الطفو!
أدوار الطفو المتبقية: %s.
actors.buffs.lifelink.name=رابط الحياة
actors.buffs.lifelink.ondeath=ضرر رابط الحياة قتلك...
actors.buffs.lifelink.desc=قوة حياة هذه الشخصية مرتبطة بشخصية أخرى قريبة. أي ضرر يُتلقى يُشارك بينهما.
كلما تلقت هذه الشخصية ضرراً، نصفه سيُوَجَّه إلى هدف رابط الحياة بدلاً من ذلك.
أدوار رابط الحياة المتبقية: %s.
actors.buffs.light.name=مضاء
actors.buffs.light.desc=حتى في أحلك الزنزانات، ضوء ثابت بجانبك دائماً ما يكون مريحاً.
الضوء يساعد في إبقاء الظلام بعيداً، مما يتيح لك رؤية مسافة معقولة رغم البيئة.
أدوار الإنارة المتبقية: %s.
actors.buffs.lockedfloor.name=الطابق مقفل
actors.buffs.lockedfloor.desc=الطابق الحالي مقفل، وأنت عاجز عن مغادرته!
بينما يكون الطابق مقفلاً، لن يزداد جوعك ولن تتلقى ضرراً من الجوع. إضافة لذلك، إذا لم تعمل على هزيمة زعيم هذا الطابق، تأثيرات التجدد السلبية ستتوقف أيضاً.
إضافة لذلك، إذا أُعدت للحياة بواسطة عنخ غير مبارك بينما الطابق مقفل، فسيُصفّر.
اقتل زعيم هذا الطابق لكسر القفل.
actors.buffs.lostinventory.name=حقيبة مفقودة
actors.buffs.lostinventory.desc=حقيبتك فُقدت في مكان ما في الزنزانة! لن تتمكن من التقاط أو استخدام معظم الأغراض حتى تستعيدها.
actors.buffs.magicalsight.name=رؤية سحرية
actors.buffs.magicalsight.desc=بطريقة ما أنت قادر على الرؤية بعقلك، بدلاً من عينيك.
أثناء نشاط الرؤية السحرية، ستتمكن من الرؤية عبر كل التضاريس في مدى 12 بلاطة.
أدوار الرؤية السحرية المتبقية: %s.
actors.buffs.magicalsleep.name=نوم سحري
actors.buffs.magicalsleep.toohealthy=أنت بصحة جيدة جداً، وتقاوم الرغبة في النوم.
actors.buffs.magicalsleep.fallasleep=تسقط في نوم سحري عميق.
actors.buffs.magicalsleep.wakeup=تستيقظ وأنت تشعر بالانتعاش والصحة.
actors.buffs.magicalsleep.desc=هذه الشخصية سقطت في نوم سحري عميق لن تستيقظ منه طبيعياً.
النوم السحري مشابه للنوم العادي، باستثناء أن الضرر فقط هو ما سيسبب استيقاظ الهدف.
للبطل وحلفائه، النوم السحري لديه بعض الخصائص الترميمية، مما يتيح لهم الشفاء بسرعة أثناء الراحة.
actors.buffs.magicimmune.name=حصانة سحرية
actors.buffs.magicimmune.desc=كل التأثيرات السحرية فقدت قبضتها عليك، أنت محصن تماماً ضدها.
أثناء الحصانة السحرية، كل التأثيرات السحرية الضارة والنافعة لن تُطبق عليك، بما في ذلك اللعنات، السحر، العصي، اللفافات، الخواتم، القطع الأثرية، إلخ. قدرات الدروع البطولية قوية بما يكفي لتعمل بغض النظر عن هذا التأثير.
أدوار الحصانة السحرية المتبقية: %s.
actors.buffs.mindvision.name=رؤية العقول
actors.buffs.mindvision.desc=بطريقة ما أنت قادر على رؤية كل المخلوقات في هذا الطابق عبر عقلك. إنه شعور غريب.
كل الشخصيات في هذا الطابق مرئية لك طالما لديك رؤية العقول. رؤية مخلوق عبر رؤية العقول تُحتسب كرؤيته أو كونه قريباً لأغراض العديد من التأثيرات السحرية.
أدوار رؤية العقول المتبقية: %s.
actors.buffs.momentum.momentum=يبني الزخم
actors.buffs.momentum.running=الجري الحر
actors.buffs.momentum.resting=يتعافى
actors.buffs.momentum.action_name=جري حر
actors.buffs.momentum.momentum_desc=أثناء تحركه، يبني العداء الحر زخماً، والذي يمكنه إنفاقه لبدء الجري الحر.
كل شحنة زخم تمنح دورين من الجري الحر، ويمكن للعداء الحر بناء حتى 10 شحنات. الزخم يُفقد بسرعة عندما يتوقف العداء الحر عن الحركة.
شحنة الزخم الحالية: %d.
actors.buffs.momentum.running_desc=أثناء تحركه، يبني العداء الحر زخماً، والذي يمكنه إنفاقه لبدء الجري الحر.
أثناء الجري الحر، يتحرك العداء الحر بسرعة مضاعفة ويكسب مراوغة إضافية بناءً على مستواه.
الأدوار المتبقية: %d.
actors.buffs.momentum.resting_desc=أثناء تحركه، يبني العداء الحر زخماً، والذي يمكنه إنفاقه لبدء الجري الحر.
العداء الحر يحتاج وقتاً لاستعادة قدرته على التحمل قبل بناء الزخم مجدداً.
الأدوار المتبقية: %d.
actors.buffs.monkenergy.name=طاقة
actors.buffs.monkenergy.action=قدرات الراهب
actors.buffs.monkenergy.desc=أثناء هزيمتها للأعداء، تكسب الراهبة طاقة يمكنها استخدامها في مجموعة متنوعة من القدرات. معظم الأعداء يمنحون طاقة واحدة عند هزيمتهم، والراهبة لا تفقد الطاقة عبر الزمن.
الطاقة الحالية: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=الراهبة استخدمت قدرة مؤخراً، ويجب أن تنتظر قبل استخدام أخرى.
فترة التهدئة الحالية: %d أدوار.
actors.buffs.monkenergy$monkability$flurry.name=وابل من الضربات
actors.buffs.monkenergy$monkability$flurry.desc=ضربتان فوريَتان تسببان %1$d-%2$d ضرر وتتجاهلان الدرع. لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$flurry.empower_desc=ضربتان فوريَتان تسببان %1$d-%2$d ضرر، تتجاهلان الدرع، _وتستخدمان سحر سلاحك._ لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$focus.name=تركيز
actors.buffs.monkenergy$monkability$focus.desc=الراهبة تأخذ دوراً للتركيز، مما يتيح لها صد الهجوم التالي الموجه ضدها.
actors.buffs.monkenergy$monkability$focus.empower_desc=الراهبة _تتركز فوراً،_ مما يتيح لها صد الهجوم التالي الموجه ضدها.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=مركزة
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=الراهبة مركزة على محيطها، تتوقع الهجوم التالي الموجه ضدها. أثناء التركيز، هي مضمونة لصد الهجوم القادم التالي.
actors.buffs.monkenergy$monkability$dash.name=اندفاع
actors.buffs.monkenergy$monkability$dash.prompt=اختر موقعاً
actors.buffs.monkenergy$monkability$dash.desc=اندفاع فوري حتى 4 بلاطات بعيداً. هذه القدرة يمكنها تجاوز المخاطر، لكن ليس عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dash.empower_desc=اندفاع فوري حتى _8 بلاطات_ بعيداً. هذه القدرة يمكنها تجاوز المخاطر، لكن ليس عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dragonkick.name=ركلة التنين
actors.buffs.monkenergy$monkability$dragonkick.desc=ركلة مدمرة تسبب %1$d-%2$d ضرر وتتجاهل الدرع. الركلة تقذف الهدف بعيداً وتشلّه لكل بلاطة يسافر فيها.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=ركلة مدمرة تسبب _%1$d-%2$d ضرر_ وتتجاهل الدرع. الركلة تقذف _كل الأهداف المجاورة_ بعيداً وتشلّها لكل بلاطة يسافرون فيها.
actors.buffs.monkenergy$monkability$meditate.name=تأمل
actors.buffs.monkenergy$monkability$meditate.desc=الراهبة تركز الطاقة في جسدها لـ5 أدوار. هذا يمسح معظم التأثيرات السلبية ويمنحها 8 أدوار من إعادة شحن العصي والقطع الأثرية.
actors.buffs.monkenergy$monkability$meditate.empower_desc=الراهبة تركز الطاقة في جسدها لـ5 أدوار. هذا يمسح معظم التأثيرات السلبية ويمنحها 8 أدوار من إعادة شحن العصي والقطع الأثرية. _هي أيضاً تكسب 80% مقاومة ضرر أثناء التأمل، وتُشفى ببطء بمقدار 20% من صحتها المفقودة._
actors.buffs.ooze.name=وحل أكّال
actors.buffs.ooze.heromsg=الوحل الأكّال يأكل لحمك. اغسله!
actors.buffs.ooze.ondeath=لقد ذبت...
actors.buffs.ooze.rankings_desc=ذاب
actors.buffs.ooze.desc=هذا الحمض اللزج يلتصق باللحم، ويذيبه ببطء.
الوحل سيسبب ضرراً ثابتاً عبر الزمن، لكن يمكن غسله فوراً في الماء.
