actors.buffs.revealedchar.name=مكشوف
actors.buffs.revealedchar.desc=هذه الشخصية مكشوفة للبطل، ستكون مرئية بغض النظر عن مكان وجودها.
الأدوار المتبقية: %s.
actors.buffs.roots.name=متجذر
actors.buffs.roots.heromsg=لا يمكنك الحركة!
actors.buffs.roots.desc=الجذور )سحرية أو طبيعية( تمسك بالأقدام، مجبرة إياها على النزول إلى الأرض.
الجذور تقفل الهدف في مكانه، مما يجعل الحركة ومعظم قدرات الحركة مستحيلة. الأفعال الأخرى لا تتأثر، بما في ذلك تأثيرات النقل المكاني.
أدوار التجذر المتبقية: %s.
actors.buffs.scrollempower.name=تمكين اللفافات
actors.buffs.scrollempower.desc=الطاقة من اللفافة التي قرأها الساحر مؤخراً تعزز عصيه!
تعزيز المستوى: +%1$d.
الإطلاقات المتبقية: %2$d.
actors.buffs.shadows.name=مندمج الظلال
actors.buffs.shadows.desc=أنت ممزوج بالظلال حولك، مما يمنحك التخفي ويبطئ استقلابك.
أثناء التخفي، الأعداء عاجزون عن مهاجمتك أو ملاحقتك. معظم الهجمات الجسدية والتأثيرات السحرية )مثل اللفافات والعصي السحرية( ستلغي التخفي فوراً. إضافة لذلك، أثناء الاندماج بالظلال، معدل جوعك يتباطأ.
ستبقى مندماج الظلال حتى تترك الظلال أو يلمسك عدو.
actors.buffs.slow.name=مبطأ
actors.buffs.slow.desc=سحر التبطيء يؤثر على معدل زمن الهدف، بالنسبة له كل شيء يتحرك بسرعة فائقة.
الشخصية المبطأة تنفذ كل الأفعال في ضعف الوقت الذي ستأخذه عادة.
أدوار التبطيء المتبقية: %s.
actors.buffs.snipersmark.name=علامة القناص
actors.buffs.snipersmark.action_name_snapshot=لقطة سريعة
actors.buffs.snipersmark.action_name_volley=وابل
actors.buffs.snipersmark.action_name_sniper=طلقة قناص
actors.buffs.snipersmark.desc=القناصة مركزة على الهدف الذي هاجمته مؤخراً. هي قادرة على تنفيذ هجوم خاص بقوسها والذي سيختلف بناءً على كيفية تعزيز القوس.
القوس غير المعزز سيطلق _لقطة سريعة،_ والتي تسبب ضرراً مخفضاً لكن لا تأخذ أي وقت للإطلاق.
القوس المعزز للسرعة سيطلق _وابلاً_ من ثلاثة أسهم. كل سهم سيسبب ضرراً مخفضاً، لكن ما زال يمكنه تفعيل السحر. هذا الوابل يأخذ دوراً واحداً للإطلاق.
القوس المعزز للضرر سيطلق _طلقة قناص._ هذه الطلقة مضمونة الإصابة، تسبب ضرراً إضافياً بناءً على المسافة من الهدف، وتأخذ دورين للإطلاق.
الأدوار المتبقية: %s.
actors.buffs.soulmark.name=علامة الروح
actors.buffs.soulmark.desc=الساحر الحربي استغل روح هذا المخلوق، مما يتيح له الشفاء عندما يتلقى ضرراً جسدياً.
أدوار علامة الروح المتبقية: %s.
actors.buffs.stamina.name=قدرة احتمال
actors.buffs.stamina.desc=لديك قدرة احتمال لا تنتهي، مما يتيح حركة أسرع!
أثناء تأثير قدرة الاحتمال، ستجري بسرعة +50%%، لكنك ستنفذ كل الأفعال الأخرى بالسرعة العادية.
أدوار قدرة الاحتمال المتبقية: %s.
actors.buffs.vulnerable.name=هش
actors.buffs.vulnerable.heromsg=تشعر بالهشاشة!
actors.buffs.vulnerable.desc=سحر الهشاشة يزيد كل الضرر الجسدي الذي تتلقاه الشخصية بنسبة 33%%، بعد أن يُخفض ذلك الضرر بواسطة الدرع.
أدوار الهشاشة المتبقية: %s.
actors.buffs.terror.name=مرعوب
actors.buffs.terror.desc=الرعب سحر تلاعبي يجبر هدفه على ذعر لا يمكن السيطرة عليه.
الشخصيات المروعة تُجبر على الهروب من خصمها، محاولة وضع أكبر عدد ممكن من الأبواب والجدران بينها. صدمة الألم ستقلل مدة الرعب، مع ذلك.
أدوار الرعب المتبقية: %s.
actors.buffs.toxicimbue.name=مشبع بالسم
actors.buffs.toxicimbue.desc=أنت مشبع بطاقة سامة!
أثناء تحركك، غاز سام سينبعث منك باستمرار، مؤذياً أعداءك. أنت محصن ضد الغاز السام والسم لمدة التأثير، وكذلك لبضعة أدوار afterward.
أدوار التشبع بالسم المتبقية: %s.
actors.buffs.corrosion.name=تآكل
actors.buffs.corrosion.heromsg=أنت تذوب!
actors.buffs.corrosion.ondeath=لقد ذبت...
actors.buffs.corrosion.rankings_desc=ذاب
actors.buffs.corrosion.desc=حمض قوي يذيب اللحم والمعدن والعظم بمعدل ينذر بالخطر.
ضرر التآكل يزداد عبر الزمن، بينما يستمر الهدف في الذوبان.
أدوار التآكل المتبقية: %1$s.
ضرر التآكل الحالي: %2$d.
actors.buffs.vertigo.name=دوار
actors.buffs.vertigo.desc=المشي في خط مستقيم يمكن أن يكون صعباً عندما يدور العالم كله.
أثناء تأثير الدوار، الشخصيات التي تحاول الحركة ستذهب في اتجاه عشوائي، بدلاً من الاتجاه الذي قصدت الذهاب إليه.
أدوار الدوار المتبقية: %s.
actors.buffs.wandempower.name=عصي ممكّنة
actors.buffs.wandempower.desc=عصيك الموجهة للضرر مُمكنة، مما يزيد كمية الضرر الذي تسببه لبضع ضربات.
الضرر الإضافي: %1$d.
الضربات المتبقية: %2$d.
actors.buffs.weakness.name=مُضعف
actors.buffs.weakness.heromsg=تشعر بالضعف!
actors.buffs.weakness.desc=كل شيء يبدو أثقل بكثير فجأة.
سحر الإضعاف يقلل القوة الجسدية للشخصية، مما يسبب لها توجيه ضرر مخفض بنسبة 33%%.
أدوار الضعف المتبقية: %s.
actors.buffs.wellfed.name=شبعان
actors.buffs.wellfed.desc=تشعر بالرضا والامتلاء تماماً.
أنت شبعان، جوعك لن يزداد، وستشفي كمية إضافية من الصحة عبر الزمن.
الأدوار المتبقية: %d.
