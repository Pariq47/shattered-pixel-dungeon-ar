الضربات المتبقية: %2$d.
actors.buffs.pincushion.name=وسادة دبابيس
actors.buffs.pincushion.desc=أسلحة الرمي التي استخدمتها ضد هذه الشخصية عالقة بها حالياً وستسقط على الأرض بعد هزيمتها.
الأغراض التالية متصلة حالياً:
actors.buffs.poison.name=مسموم
actors.buffs.poison.heromsg=أنت مسموم!
actors.buffs.poison.ondeath=لقد مت من السم...
actors.buffs.poison.rankings_desc=استسلم للسم
actors.buffs.poison.desc=السم يشق طريقه عبر الجسد، مما يعطل وظائفه الداخلية ببطء.
