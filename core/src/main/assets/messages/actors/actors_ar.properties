actors.hero.abilities.mage.warpbeacon.window_cancel=إلغاء
actors.hero.abilities.mage.warpbeacon.short_desc=يضع الساحر _منارة انتقال_ في موقعه الحالي، والتي يمكنه العودة إليها فوراً.
actors.hero.abilities.mage.warpbeacon.desc=يضع الساحر منارة، والتي يمكنه الانتقال إليها وقتما يشاء. وضع المنارة يأخذ دوراً واحداً، لكن الانتقال إليها فوري.
لا يمكن للساحر الانتقال بين الطوابق افتراضياً، أو استخدام المنارة للوصول إلى أماكن لا يمكن الوصول إليها مثل الغرف المقفلة. يمكن للساحر الانتقال إلى الأعداء، مما سيدفعهم جانباً.
actors.hero.abilities.rogue.smokebomb.name=قنبلة دخانية
actors.hero.abilities.rogue.smokebomb.fov=يمكنك القفز فقط إلى موقع فارغ في مجال رؤيتك.
actors.hero.abilities.rogue.smokebomb.prompt=اختر موقعاً للقفز إليه
actors.hero.abilities.rogue.smokebomb$ninjalog.name=طعم خشبي
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=بطريقة ما، الأعداء مقتنعون بسهولة أن هذا الطعم الخشبي هو اللص الحقيقي!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=يمكنك العثور على هذه الشخصية مع قدرة درع بطل محددة.
actors.hero.abilities.rogue.smokebomb.short_desc=يرمي اللص _قنبلة دخانية_ أثناء القفز بعيداً. يعمي الأعداء القريبين من موقعه القديم.
actors.hero.abilities.rogue.smokebomb.desc=يرمي اللص قنبلة دخانية ويقفز حتى 6 بلاطات بعيداً. يمكنه القفز عبر المخاطر والأعداء، لكن ليس عبر التضاريس الصلبة مثل الجدران.
الأعداء الملاصقون لموقع اللص القديم سيُعمون لـ5 أدوار.
actors.hero.abilities.rogue.deathmark.name=علامة الموت
actors.hero.abilities.rogue.deathmark.ally_target=يمكنك تعليم الأعداء فقط
actors.hero.abilities.rogue.deathmark.short_desc=يضع اللص _علامة موت_ على عدو مختار. الأعداء المعلّمون يتلقون ضرراً إضافياً، لكن لا يمكنهم الموت حتى تنتهي العلامة.
actors.hero.abilities.rogue.deathmark.desc=يضع اللص علامة على عدو مختار، مسبباً له تلقي 25% ضرراً إضافياً. تُطبق العلامة فوراً وتدوم لـ5 أدوار.
الأعداء المعلّمون يتلقون ضرراً إضافياً لكنهم عاجزون عن الموت حتى انتهاء العلامة. إذا كان العدو يملك 0 صحة عند انتهاء العلامة، سيموت فوراً.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=معلّم للموت
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=هذا العدو تم تعليمه، مسبباً له تلقي 25%% ضرراً إضافياً، لكنه أيضاً يجعله عاجزاً عن الموت حتى انتهاء العلامة.
الأدوار المتبقية: %s.
actors.hero.abilities.rogue.shadowclone.name=استنساخ الظل
actors.hero.abilities.rogue.shadowclone.short_desc=يستدعي اللص _استنساخ الظل_، والذي يمكن توجيهه لمساعدته في القتال.
actors.hero.abilities.rogue.shadowclone.desc=يستدعي اللص محاكياً ظلياً لنفسه، يمكن توجيهه لمساعدته في القتال. توجيه استنساخ الظل لا يكلف أي شحنة.
الاستنساخ يملك 80 صحة، بلا درع، ويسبب 10-20 ضرر. يمكن تحسين كل هذه الصفات بالمواهب، بحيث يستفيد الاستنساخ من الأسلحة والدروع التي يملكها البطل.
actors.hero.abilities.rogue.shadowclone$shadowally.name=لص الظل
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=يتحرك استنساخك إلى ذلك الموقع.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=يتحرك استنساخك ليتبعك.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=يتحرك استنساخك للهجوم!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=نسخة من اللص، مصنوعة من ظلام ظلي. تقف ثابتة تماماً، بعيون فارغة وخصال صغيرة من الظلام تتصاعد منها كالبخار.
الاستنساخ ليس نسخة مثالية من اللص، لكنه ما زال مقاتلاً لائقاً، ويمكنه الاستفادة من معدات اللص بالمواهب الصحيحة.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=يمكنك العثور على هذه الشخصية مع قدرة درع بطل محددة.
actors.hero.abilities.huntress.spectralblades.name=شفرات طيفية
actors.hero.abilities.huntress.spectralblades.short_desc=ترمي الصيادة _شفرات طيفية_ على هدف، مسببة ضرراً يعتمد على سلاحها القريب المجهز حالياً.
actors.hero.abilities.huntress.spectralblades.desc=ترمي الصيادة شفرة طيفية على عدو، والتي تعمل كضربة بعيدة المدى من سلاحها القريب. كل التأثيرات العادية للسلاح القريب ستُفعل، بما في ذلك السحر.
actors.hero.abilities.huntress.naturespower.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower.short_desc=تستدعي الصيادة _قوة الطبيعة_، مما يزيد سرعة حركتها ومعدل إطلاق قوسها لفترة قصيرة.
actors.hero.abilities.huntress.naturespower.desc=تعزز الصيادة نفسها وقوسها مؤقتاً بقوة الطبيعة! هذا يدوم لـ8 أدوار.
خلال هذا الوقت، تتحرك الصيادة بسرعة مضاعفة، وتهاجم أسرع بنسبة 33% بقوسها. تأثيرات القوس الإضافية لا تُفعل إذا كانت القناصة تستخدم هجماتها الخاصة.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=الصيادة معززة مؤقتاً، مما يزيد سرعة حركتها وسرعة هجومها بقوسها.
الأدوار المتبقية: %s.
actors.hero.abilities.huntress.spirithawk.name=صقر الروح
actors.hero.abilities.huntress.spirithawk.no_space=لا توجد مساحة فارغة بالقرب منك.
actors.hero.abilities.huntress.spirithawk.short_desc=تستدعي الصيادة أليف _صقر الروح_، والذي يمكنه مساعدتها في استكشاف المواقع وتشتيت الأعداء.
actors.hero.abilities.huntress.spirithawk.desc=تستدعي الصيادة أليفاً صقر روح، يمكن توجيهه باستخدام القدرة مجدداً أثناء استدعائه. الصقر يدوم لـ100 دور، وتوجيه الصقر لا يكلف أي شحنة.
الصقر لديه صحة وقوة هجوم ضئيلتان، لكنه سريع، مراوغ، ودقيق. يشارك مجال رؤيته بالكامل مع الصيادة في كل الأوقات. إنه محصن ضد كل التأثيرات المرتبطة بمنطقة، مثل النار والغاز السام. لن يهاجم إلا إذا وُجه تحديداً لذلك.
actors.hero.abilities.huntress.spirithawk$hawkally.name=صقر الروح
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=يتحرك صقرك إلى ذلك الموقع.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=يتحرك صقرك ليتبعك.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=يتحرك صقرك للهجوم!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=صقر سحري، استدعته الصيادة. يتوهج بلون أزرق أثيري ساطع، رأسه يتحرك باستمرار بينما يمسح المنطقة.
رغم أنه ليس مقاتلاً قوياً، إلا أن سرعته ورؤيته تجعلانه ممتازاً للاستكشاف وتشتيت الأعداء.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=الأدوار المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=المراوغات المضمونة المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=يمكنك العثور على هذه الشخصية مع قدرة درع بطل محددة.
actors.hero.abilities.duelist.challenge.name=تحدي
actors.hero.abilities.duelist.challenge.prompt=اختر عدواً لتحديه
actors.hero.abilities.duelist.challenge.already_dueling=يمكنك الدخول في مبارزة واحدة فقط في كل مرة.
actors.hero.abilities.duelist.challenge.ally_target=يمكنك تحدي الأعداء فقط.
actors.hero.abilities.duelist.challenge.unreachable_target=يجب أن تكون قادراً على الوصول إلى هدفك.
actors.hero.abilities.duelist.challenge.distant_target=ذلك العدو بعيد جداً للتحدي.
actors.hero.abilities.duelist.challenge.short_desc=تتحدي المبارزة عدواً قريباً في مبارزة، مما يجمد كل الأعداء الآخرين مؤقتاً.
actors.hero.abilities.duelist.challenge.desc=تتحدي المبارزة عدواً قريباً في مبارزة. يُجبر ذلك العدو على قتالها بينما يتجمد كل الأعداء الآخرين مؤقتاً في الزمن.
يجب أن يكون الهدف قابلاً للوصول وضمن 5 بلاطات من المبارزة. المبارزة تستمر حتى مرور 10 أدوار، أو موت العدو، أو ابتعاد المبارزة أكثر من 5 بلاطات عن العدو.
الأعداء المتجمدون محصنون. حلفاء المبارزة لا يتجمدون بهذه القدرة، لكن إذا استُهدف زعيم فلن يتجمد أتباعه أيضاً.
actors.hero.abilities.duelist.challenge$duelparticipant.name=مشارك في مبارزة
actors.hero.abilities.duelist.challenge$duelparticipant.desc=هذه الشخصية تشارك في مبارزة. هي، وأي من حلفائها أو أتباعها، مسموح لها بالتصرف بشكل طبيعي بينما يتجمد الآخرون.
المبارزة ستستمر لفترة محددة، حتى يموت أحد المشاركين، أو حتى يبتعد المشاركون أكثر من 5 بلاطات عن بعضهم.
الأدوار المتبقية: %d.
actors.hero.abilities.duelist.elementalstrike.name=ضربة عنصرية
actors.hero.abilities.duelist.elementalstrike.short_desc=تنفذ المبارزة _ضربة عنصرية_، ناشرة تأثيراً في منطقة مخروطية يعتمد على سحر سلاحها.
actors.hero.abilities.duelist.elementalstrike.desc=تضرب المبارزة عدواً أو موقعاً، منفذة هجوماً عادياً مضمون الإصابة وناشرة تأثيراً سحرياً ينتقل حتى 4 بلاطات في مخروط بزاوية 65 درجة. هذا التأثير السحري يختلف بناءً على السحر الموجود على سلاح المبارزة الأساسي.
actors.hero.abilities.duelist.elementalstrike.generic_desc=الضربة العنصرية بدون سحر ستطلق دفعة صغيرة من السحر، مسببة 6-12 ضرراً لكل الأعداء في المدى.
actors.hero.abilities.duelist.feint.name=خدعة
actors.hero.abilities.duelist.feint.prompt=اختر موقعاً للاندفاع إليه
actors.hero.abilities.duelist.feint.too_far=ذلك الموقع ليس ملاصقاً لك.
actors.hero.abilities.duelist.feint.bad_location=لا يمكنك الانتقال إلى ذلك الموقع.
actors.hero.abilities.duelist.feint.short_desc=تنفذ المبارزة _خدعة_، مموهة بهجوم أثناء اندفاعها إلى بلاطة ملاصقة. الأعداء سيهاجمون صورتها اللاحقة، تاركين أنفسهم مكشوفين لهجوم مضاد.
actors.hero.abilities.duelist.feint.desc=تموه المبارزة بهجوم أثناء اندفاعها إلى بلاطة ملاصقة، تاركة صورة لحظية لاحقة لنفسها. الأعداء الذين كانوا يهاجمون المبارزة سيهاجمون صورتها اللاحقة بدلاً من ذلك.
الأعداء الذين يهاجمون الصورة اللاحقة يصابون بالارتباك، مما يلغي فعلهم التالي ويتركهم مكشوفين لهجوم مفاجئ.
actors.hero.abilities.cleric.ascendedform.name=الهيئة المتسامية
actors.hero.abilities.cleric.ascendedform.short_desc=يتخذ الكاهن _هيئة متسامية_، مكتسباً تعاويذ جديدة، مدى هجوم، وحماية.
actors.hero.abilities.cleric.ascendedform.desc=يشع الكاهن طاقة مقدسة من نفسه، متخذاً هيئة مشعة ممتدة لـ10 أدوار. أثناء هذه الهيئة يمكن للكاهن إلقاء تعاويذ جديدة، يكتسب 2 مدى هجوم، 30 حماية، وأي تعاويذ إضافية يلقيها ستمنح 10 حماية لكل شحنة كتاب مقدس مستخدمة.
الحماية من الهيئة المتسامية وتعاويذها لا تتلاشى طبيعياً، لكنها ستتبدد فوراً عند انتهاء الهيئة المتسامية. يمكن إعادة استخدام القدرة لتجديد مدة الهيئة المتسامية.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=الهيئة المتسامية
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=طاقة مشعة تنبعث من جسد الكاهن. أثناء هذه الهيئة يكتسب الكاهن 2 مدى هجوم (من الطاقة المقدسة المشعة منه)، و10 حماية كلما أنفق شحنة كتاب مقدس. يمكنه أيضاً إلقاء التعاويذ التي تُفتح عبر مواهب الهيئة المتسامية.
الدرع الممنوح من الهيئة المتسامية وتعاويذها لن يتلاشى طبيعياً، لكنه سيتبدد فوراً عند انتهاء الهيئة المتسامية.
الحماية الحالية: %1$d.
الأدوار المتبقية: %2$d.
actors.hero.abilities.cleric.trinity.name=الثالوث
actors.hero.abilities.cleric.trinity.no_imbue=الثالوث ليس لديه تأثير محدد لأي من هيئاته حالياً، استخدم إحدى تعاويذه!
actors.hero.abilities.cleric.trinity.no_duplicate=لا يمكن للثالوث نسخ تأثير مجهز لديك بالفعل!
actors.hero.abilities.cleric.trinity.ench_glyph_use=الثالوث سيطبق هذا التأثير لـ_%1$d أدوار_ بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=الثالوث سيطبق هذا التأثير _القوي_ لـ_%1$d أدوار_ بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.wand_use=الثالوث سيطلق هذه العصا السحرية بمستوى _+%1$d_ بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.wand_multi_use=الثالوث سيطلق هذه العصا _متعددة الشحنات_ بمستوى _+%1$d_ بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.thrown_use=الثالوث سيرمي هذا السلاح بمستوى _+%1$d_ بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.ring_use=الثالوث سيطبق تأثير هذا الخاتم بمستوى _+%1$d_ لـ20 دوراً، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=الثالوث سيطبق تأثير الخيمياء عن بعد لهذه القطعة الأثرية، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=الثالوث سيطبق تأثير تجديد الصحة السلبي لهذه القطعة الأثرية بمستوى _+%1$d_ لـ20 دوراً، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.driedrose_use=الثالوث سيستخدم تأثير هذه القطعة الأثرية لاستدعاء شبح ودود مفسد بصحة شبح بمستوى _+%1$d_، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.etherealchains_use=الثالوث سيطبق تأثير إلقاء السلاسل لهذه القطعة الأثرية بمدى يصل إلى _+%1$d_، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.hornofplenty_use=الثالوث سيطبق تأثير التناول كوجبة خفيفة لهذه القطعة الأثرية، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=الثالوث سيطبق تأثير سرقة الأعداء لهذه القطعة الأثرية بمستوى _+%1$d_، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=الثالوث سيطبق تأثير التجذير لهذه القطعة الأثرية مع بذرة ضارة عشوائية، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.skeletonkey_use=الثالوث سيطبق تأثير الإدراج لهذه القطعة الأثرية، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=الثالوث سيطبق تأثير الاستبصار لهذه القطعة الأثرية بمستوى _+%1$d_، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=الثالوث سيطبق تأثير تجميد الزمن لهذه القطعة الأثرية بمدة _%1$d_ أدوار، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=الثالوث سيطبق تأثير اللفافة العشوائي لهذه القطعة الأثرية مع فرصة _%1$d/10_ لتقديم النسخة الغريبة بدون تكلفة إضافية، بتكلفة _%2$s شحنة._
actors.hero.abilities.cleric.trinity.cost=تكلفة شحنة هذه القدرة تختلف، لكنها غالباً ما تكون _%d._
actors.hero.abilities.cleric.trinity.short_desc=يكتسب الكاهن _ثالوثاً_ من القدرات، والتي تحاكي المعدات التي رآها ويمكن تعيينها باستخدام تعاويذ جديدة.
actors.hero.abilities.cleric.trinity.desc=يكتسب الكاهن _ثالوثاً_ من قدرات الدروع، والتي يمكن تعيينها لتأثيرات أغراض متنوعة باستخدام ثلاث تعاويذ جديدة. كل من هذه التعاويذ تركز على محاكاة تأثيرات أنواع مختلفة من المعدات التي عرفها الكاهن خلال هذه الجولة: هيئة الجسد (الأسلحة والدروع)، هيئة العقل (العصي السحرية وأسلحة الرمي)، وهيئة الروح (الخواتم والقطع الأثرية).
كل هيئة من الثالوث يمكن حقنها بتأثير واحد في كل مرة، ويختار الكاهن أيهما يفعل عند استخدام الثالوث. لن يكرر الثالوث تأثير شيء مجهز لديك بالفعل.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=اختر أي هيئة من الثالوث لاستخدامها. يمكن أن تكون تأثيرات الهيئات المختلفة نشطة في وقت واحد.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_هيئة الجسد: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_هيئة العقل: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_هيئة الروح: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=اختر تأثيراً ليُحقن في الثالوث. ستُعرض معلومات إضافية قبل التأكيد.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=تعيين لهيئة الجسد
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=تعيين لهيئة العقل
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=تعيين لهيئة الروح
actors.hero.abilities.cleric.powerofmany.name=قوة الكثرة
actors.hero.abilities.cleric.powerofmany.prompt_default=اختر حليفاً أو موقعاً
actors.hero.abilities.cleric.powerofmany.prompt_ally=وجه حليفك الضوئي
actors.hero.abilities.cleric.powerofmany.ally_exists=لديك حليف معزز بالفعل.
actors.hero.abilities.cleric.powerofmany.no_vision=لا يمكنك استهداف موقع لا تستطيع رؤيته.
actors.hero.abilities.cleric.powerofmany.only_allies=يمكنك تعزيز الحلفاء فقط.
actors.hero.abilities.cleric.powerofmany.short_desc=يوجه الكاهن _قوة الكثرة_، معززاً حليفاً موجوداً أو خالقاً حليفاً جديداً.
actors.hero.abilities.cleric.powerofmany.desc=يوجه الكاهن _قوة الكثرة_، والتي إما تعزز حليفاً موجوداً أو تخلق حليفاً معززاً جديداً لـ100 دور. استهداف مساحة فارغة يخلق حليفاً جديداً.
أثناء التعزز بقوة الكثرة، أي حليف يوجه +25% ضرراً، ويتلقى -25% ضرراً، ويشارك رؤيته مع الكاهن. يكتسبون أيضاً 25 حماية عند استخدام القدرة.
يكتسب الكاهن أيضاً ثلاث تعاويذ جديدة لا يمكن إلقاؤها إلا مع حليف معزز. لن تنتهي قوة الكثرة بينما إحدى هذه التعاويذ نشطة.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=قوة الكثرة
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=هذا الحليف تم تعزيزه بقوة الكثرة، مما يمنحه +25%% ضرراً موجهاً و-25%% ضرراً متلقياً. سيشاركون أيضاً مدى رؤيتهم مع الكاهن، ويمكنهم الاستفادة من تعاويذ قوة الكثرة.
قوة الكثرة ستستمر عندما يختبئ حلفاء مثل الصور المنشورية، لكن مدتها ستستمر في التناقص.
الأدوار المتبقية: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=حليف ضوئي
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=يتحرك حليفك إلى ذلك الموقع.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=يتحرك حليفك ليتبعك.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=يتحرك حليفك للهجوم!
actors.hero.abilities.cleric.powerofmany$lightally.desc=نسخة من أحد رفاق الكاهن المغامرين، مصنوعة من ضوء صلب. رغم أن لها شكل بطل آخر، إلا أنها لا تملك أي من قدراتهم الفريدة. سيستمر هذا الحليف طالما أن قوة الكثرة مطبقة عليه.
يمكن توجيه هذا الحليف بدون تكلفة عبر إعادة استخدام قدرة درع قوة الكثرة.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=يمكنك العثور على هذه الشخصية مع قدرة درع بطل محددة.
actors.hero.abilities.ratmogrify.name=مسخ جرذي
actors.hero.abilities.ratmogrify.cant_transform=لا يمكنك مسخ هذا جرذياً!
actors.hero.abilities.ratmogrify.too_strong=ذلك العدو قوي جداً لمسخه جرذياً!
actors.hero.abilities.ratmogrify.short_desc=يقوم البطل بـ_مسخ جرذي_ لعدو! يحوله هذا مؤقتاً إلى جرذ بلا قدرات.
actors.hero.abilities.ratmogrify.desc=يحول البطل عدواً إلى جرذ لـ6 أدوار! لا يمكن مسخ الزعماء، الحلفاء، والجرذان جرذياً.
الأعداء الممسوخون جرذياً يحتفظون بإحصائياتهم الأصلية، لكن لا يملكون أي قدرات.
actors.hero.abilities.ratmogrify$transmograt.name=%s ممسوخ جرذياً
actors.hero.abilities.ratmogrify$transmograt.desc=هذا العدو تم تحويله إلى جرذ. تحسين كبير، إذا سألتني! - ملك الجرذان
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=قُتل بواسطة: عدو ممسوخ جرذياً
###cleric spells
actors.hero.spells.auraofprotection.name=هالة الحماية
actors.hero.spells.auraofprotection.short_desc=تعزز الدفاع للفارس المقدس والحلفاء القريبين.
actors.hero.spells.auraofprotection.desc=يبدأ الفارس المقدس بإشعاع طاقة واقية في هالة متلألئة حول نفسه لـ20 دوراً. أي حليف ضمن بلاطتين من الفارس المقدس (بما في ذلك نفسه) يتلقى %1$d%% ضرراً أقل، ويكتسب تأثير نقش درع الفارس المقدس بقوة +%2$d%%.
يحدث هذا الخفض في الضرر قبل تأثيرات خفض الضرر الأخرى (مثل الدرع). تعزيز قوة النقش سيُطبق دائماً، لكن هذه التعويذة لا يمكنها أن تسبب تطبيق نقش الفارس المقدس أكثر من مرة إذا كانت الشخصية تستفيد منه بالفعل (مثل الفارس المقدس نفسه، أو صورة منشورية).
actors.hero.spells.auraofprotection$aurabuff.name=هالة الحماية
actors.hero.spells.auraofprotection$aurabuff.desc=الفارس المقدس يشع طاقة واقية حول نفسه.
أي حليف قريب (بما في ذلك الفارس المقدس نفسه) يتلقى ضرراً مخفضاً ويكتسب تأثير نقش درع الفارس المقدس بقوة معززة.
الأدوار المتبقية: %s.
actors.hero.spells.beamingray.name=شعاع ساطع
actors.hero.spells.beamingray.no_space=لا توجد مساحة لحليفك ليظهر هناك.
actors.hero.spells.beamingray.out_of_range=ذلك الموقع بعيد عن المدى.
actors.hero.spells.beamingray.short_desc=ينقل حليفك ويمنح ضرراً إضافياً.
actors.hero.spells.beamingray.desc=يوجه الكاهن القوة الموجودة على حليفه إلى شعاع من الضوء ينقله إلى موقع. إذا اصطدم الشعاع بعدو سيضع الحليف بالقرب منه ويوجهه نحو العدو.
الشعاع لديه مدى أقصى يبلغ %1$d بلاطات، وسيزيد ضرر قوة الكثرة الإضافي إلى +%2$d%% لـ10 أدوار ضد أقرب عدو ضمن 4 بلاطات. يمكن للشعاع الساطع حتى نقل الحلفاء غير القادرين على الحركة عادة، لكن مداه يُخفض إلى النصف في هذه الحالات.
actors.hero.spells.beamingray$beamingrayboost.name=شعاع ساطع
actors.hero.spells.beamingray$beamingrayboost.desc=هذا الحليف تم نقله مؤخراً بواسطة الشعاع الساطع، مما يمنحه ضرراً إضافياً ضد أقرب عدو بعد النقل. قوة الكثرة أيضاً لن تنتهي عندما يكون هذا التعزيز نشطاً.
الأدوار المتبقية: %s.
actors.hero.spells.blessspell.name=مباركة
actors.hero.spells.blessspell.short_desc=تبارك وتحمي الكاهن، تبارك وتشفي الآخرين.
actors.hero.spells.blessspell.desc=يضع الكاهن مباركة مقدسة على نفسه أو شخصية أخرى يمكنه رؤيتها.
عند إلقائها على نفسه يكون التأثير أضعف، مانحاً %1$d أدوار من المباركة و%2$d حاجزاً.
عند إلقائها على شخصيات أخرى تكون التعويذة أقوى، مانحة %3$d أدوار من المباركة و%4$d شفاء. يُحول الشفاء الزائد إلى حاجز.
actors.hero.spells.bodyform.name=هيئة الجسد
actors.hero.spells.bodyform.short_desc=تعين الثالوث لسحر أو نقش.
actors.hero.spells.bodyform.desc=يختار الكاهن سحراً أو نقشاً عرفه في هذه الجولة ويحقن الثالوث بتأثيره.
عند استخدام الثالوث، يكتسب الكاهن تأثير السحر أو النقش المختار لـ%d أدوار. هذا السحر أو النقش المؤقت سيعمل مع أي تأثير يعمل معه السحر أو النقش العادي.
هذه التعويذة تستبدل أي تأثير جسد آخر محقون فيه الثالوث حالياً.
actors.hero.spells.bodyform$bodyformbuff.name=هيئة الجسد
actors.hero.spells.bodyform$bodyformbuff.desc=هيئة الجسد للثالوث تمنحك حالياً قوة سحر أو نقش، وكأنك مجهز به على سلاحك أو درعك الحالي.
لاحظ أن هيئة الجسد لا يمكنها توفير نسخة أخرى من تأثير تستفيد منه بالفعل.
التأثير الحالي: %1$s.
الأدوار المتبقية: %2$s.
actors.hero.spells.cleanse.name=تطهير
actors.hero.spells.cleanse.short_desc=تمسح التأثيرات السلبية وتمنح حماية.
actors.hero.spells.cleanse.desc=يمسح الكاهن كل تأثيرات الحالة الضارة على نفسه والحلفاء المرئيين. بعد انتهاء التعويذة تكتسب كل الشخصيات المتأثرة أيضاً %1$d أدوار من حصانة التأثيرات السلبية، و%2$d حاجزاً.
actors.hero.spells.clericspell.prompt=اختر هدفاً
actors.hero.spells.clericspell.no_target=لا يوجد هدف هناك.
actors.hero.spells.clericspell.invalid_target=لا يمكنك استهداف ذلك الموقع.
actors.hero.spells.clericspell.invalid_enemy=لا يمكنك استهداف ذلك العدو.
actors.hero.spells.clericspell.charge_cost=تكلفة الشحنة: %d
actors.hero.spells.divinesense.name=حاسة إلهية
actors.hero.spells.divinesense.short_desc=اكتساب رؤية عقول مؤقتة في مدى واسع.
actors.hero.spells.divinesense.desc=يركز الكاهن حواسه على محيطه، مكتسباً رؤية عقول بمدى %d بلاطات لـ50 دوراً. هذه التعويذة لا تأخذ أي وقت للإلقاء.
actors.hero.spells.divinesense$divinesensetracker.name=حاسة إلهية
actors.hero.spells.divinesense$divinesensetracker.desc=هذه الشخصية قادرة مؤقتاً على رؤية المخلوقات القريبة الأخرى بعقلها!
الأدوار المتبقية: %s.
actors.hero.spells.divineintervention.name=تدخل إلهي
actors.hero.spells.divineintervention.short_desc=تعزيز هائل للحماية للكاهن والحلفاء.
actors.hero.spells.divineintervention.desc=يصب الكاهن كمية هائلة من القوة من كتابه في نفسه وحلفائه، معززاً الجميع إلى %1$d حماية وممداً الهيئة المتسامية بـ%2$d أدوار. القوة الدفاعية المذهلة لهذه التعويذة تُوازنها تكلفتها العالية جداً من الشحنات.
تماماً مثل الحماية الأخرى الممنوحة من الهيئة المتسامية، هذه الحماية لا تتلاشى طبيعياً، لكنها ستنتهي فوراً عند انتهاء الهيئة المتسامية.
actors.hero.spells.flash.name=وميض
actors.hero.spells.flash.prompt=اختر موقعاً
actors.hero.spells.flash.short_desc=الانتقال الفوري إلى موقع قريب.
actors.hero.spells.flash.desc=يوجه الكاهن هيئته المتسامية إلى موقع قريب وينتقل إليه. يمكن للوميض نقل الكاهن إلى أي موقع مكتشف في المدى وغير مشغول. تكلف هذه التعويذة شحنات كتاب أكثر كلما استُخدمت في نفس الهيئة المتسامية.
actors.hero.spells.guidinglight.name=نور هادٍ
actors.hero.spells.guidinglight.short_desc=يسبب ضرراً سحرياً بعيد المدى ويضمن الإصابة.
actors.hero.spells.guidinglight.desc=يطلق الكاهن برقية من الطاقة السحرية تضرب هدفاً، مسببة 2-8 ضرر ومضيئة إياه. الهجوم الجسدي التالي غير المرهق ضد عدو مضاء مضمون الإصابة.
actors.hero.spells.guidinglight.desc_priest=_هذه التعويذة أقوى عندما يلقيها القس._ الإلقاء الأول للتعويذة كل 50 دوراً لا يكلف شحنات كتاب، وسيُستهلك الإشعاع بواسطة العصي السحرية، الشخصيات الأخرى، والقطع الأثرية التي تؤثر مباشرة على الأعداء. عند استخدام الإشعاع بهذه الطريقة، يسبب ضرراً سحرياً إضافياً يساوي مستوى القس + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=نور هادٍ
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=سيتمكن القس من إلقاء النور الهادي مجاناً مجدداً بعد مرور 50 دوراً.
الأدوار المتبقية: %s.
actors.hero.spells.guidinglight$illuminated.name=مضاء
actors.hero.spells.guidinglight$illuminated.desc=هذه الشخصية تتوهج نتيجة إصابتها بالنور الهادي. رغم أن الوهج ليس قوياً بما يكفي لإضاءة المنطقة المحيطة، إلا أن التأثير السحري سيجعل توجيه الضربات إليها أسهل بكثير للكاهن.
actors.hero.spells.guidinglight$illuminated.desc_priest=يمكن للقس أيضاً استهلاك الإشعاع باستخدام العصي السحرية، ضربات الحلفاء، أو تأثيرات بعض القطع الأثرية. استخدام الإشعاع بهذه الطريقة سيسبب ضرراً سحرياً إضافياً يساوي مستوى القس + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=الأبطال الآخرون ما زال بإمكانهم استخدام الإشعاء للاستفادة من موهبة الضوء الحارق، لكنهم لن يكتسبوا أي دقة.
actors.hero.spells.hallowedground.name=أرض مقدسة
actors.hero.spells.hallowedground.prompt=اختر موقعاً
actors.hero.spells.hallowedground.short_desc=تشفي الحلفاء، تبطئ الأعداء، وتنشر العشب في منطقة.
actors.hero.spells.hallowedground.desc=يركز القس سحره الإلهي في الأرض القريبة، خالقاً منطقة %1$dx%1$d من التضاريس المقدسة لـ20 دوراً.
عند إلقائها، هذه التعويذة تشفي كل الحلفاء بـ15 صحة (الحلفاء الأصحاء والقس يكتسبون حماية)، وتُجذر الأعداء وجيزاً، وتنشر عشباً قصيراً.
التضاريس المقدسة تشفي الحلفاء بـ1 صحة لكل دور (الحلفاء الأصحاء والقس يكتسبون حماية)، وتسبب العرج للأعداء، وتسبب عشوائياً نمو العشب الطويل.
التضاريس المقدسة تُدمر بالنار، وستنتج عشباً محروثاً إذا تم تعطيل تأثيرات التجدد السلبية أو إذا لم يكتسب القس خبرة لفترة.
actors.hero.spells.hallowedground$hallowedterrain.desc=الأرض تم تقديسها هنا. الأرض المقدسة تبطئ الأعداء، تشفي الحلفاء، وتسبب انتشار العشب.
actors.hero.spells.holyintuition.name=حدس مقدس
actors.hero.spells.holyintuition.prompt=اختر غرضاً
actors.hero.spells.holyintuition.cursed=تشعر بسحر خبيث يتربص داخل هذا الغرض.
actors.hero.spells.holyintuition.uncursed=هذا الغرض خالٍ من السحر الخبيث.
actors.hero.spells.holyintuition.short_desc=يعرف ما إذا كان الغرض ملعوناً أم لا.
actors.hero.spells.holyintuition.desc=يركز الكاهن حواسه على غرض ويحدد ما إذا كان ملعوناً أم لا بدون الحاجة لتجهيزه.
actors.hero.spells.holylance.name=رمح مقدس
actors.hero.spells.holylance.short_desc=يسبب ضرراً سحرياً بعيد المدى ثقيلاً.
actors.hero.spells.holylance.desc=يركز القس كمية كبيرة من الطاقة في رمح مدمر مرمي مصنوع من الضوء. هذا الرمح يسبب %1$d-%2$d ضرراً ويسبب دائماً ضرراً أقصى للأموات أحياء والأهداف الشيطانية.
هذه التعويذة مكلفة جداً، ولديها فترة تهدئة 30 دوراً.
actors.hero.spells.holylance$lancecooldown.name=تهدئة الرمح المقدس
actors.hero.spells.holylance$lancecooldown.desc=القس ألقى الرمح المقدس مؤخراً، ويجب أن ينتظر قبل إلقائه مجدداً.
الأدوار المتبقية: %s.
actors.hero.spells.holyward.name=حراسة مقدسة
actors.hero.spells.holyward.glyph_name=%s من الضوء
actors.hero.spells.holyward.glyph_desc=هذا النقش يزيد قليلاً من كمية الضرر الذي يمكن للدرع صده.
actors.hero.spells.holyward.short_desc=تتجاوز النقوش مؤقتاً لتعزيز صد الدرع.
actors.hero.spells.holyward.desc=يحقن الكاهن درعه الملبوس بنقوش من الضوء المقدس، مما يزيد صد الدرع للضرر بمقدار 1. هذه التعويذة لا تأخذ أي وقت للإلقاء.
هذا النقش يدوم لـ50 دوراً، وسيتجاوز أي نقش نافع يمتلكه الدرع طوال المدة. سيستفيد الكاهن من هذا التأثير حتى لو لم يكن لديه درع.
actors.hero.spells.holyward.desc_paladin=_هذه التعويذة أقوى عندما يلقيها الفارس المقدس._ يُزيد الصد الإضافي للضرر إلى 3، ولا تتجاوز التعويذة النقوش الموجودة بعد الآن، وإلقاء تعاويذ أخرى أثناء نشاط الحراسة المقدسة سيمد مدتها بـ10 أدوار لكل شحنة مستخدمة.
actors.hero.spells.holyward$holyarmbuff.name=حراسة مقدسة
actors.hero.spells.holyward$holyarmbuff.desc=الكاهن حقن درعه الملبوس بطاقة مقدسة، متجاوزاً مؤقتاً أي نقش موجود ومسبباً للدرع صد نقطة ضرر إضافية واحدة.
الأدوار المتبقية: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=الفارس المقدس حقن درعه الملبوس بطاقة مقدسة، مسبباً للدرع صد 3 نقاط ضرر إضافية.
إلقاء تعاويذ أخرى أثناء نشاط الحراسة المقدسة سيمد مدتها بـ10 أدوار لكل شحنة مستخدمة.
الأدوار المتبقية: %s.
actors.hero.spells.holyweapon.name=سلاح مقدس
actors.hero.spells.holyweapon.ench_name=%s مقدس
actors.hero.spells.holyweapon.ench_desc=الأعداء المضروبون بسلاح مقدس سيتلقون ضرراً سحرياً إضافياً.
actors.hero.spells.holyweapon.short_desc=تتجاوز السحر مؤقتاً لتعزيز الضرر.
actors.hero.spells.holyweapon.desc=يسحر الكاهن سلاحه الملبوس بطاقة مقدسة، مسبباً للسلاح توجيه 2 ضرر سحري إضافي في كل مرة يضرب بها عدواً. هذه التعويذة لا تأخذ أي وقت للإلقاء.
هذا السحر يدوم لـ50 دوراً، وسيتجاوز أي سحر نافع يمتلكه السلاح طوال المدة. الضربات بدون سلاح يمكنها أيضاً الاستفادة من هذا التأثير.
actors.hero.spells.holyweapon.desc_paladin=_هذه التعويذة أقوى عندما يلقيها الفارس المقدس._ يُزيد الضرر السحري الإضافي إلى 6، ولا تتجاوز التعويذة السحر الموجود بعد الآن، وإلقاء تعاويذ أخرى أثناء نشاط السلاح المقدس سيمد مدتها بـ10 أدوار لكل شحنة مستخدمة.
actors.hero.spells.holyweapon$holywepbuff.name=سلاح مقدس
actors.hero.spells.holyweapon$holywepbuff.desc=الكاهن حقن سلاحه الملبوس بطاقة مقدسة، متجاوزاً مؤقتاً أي سحر موجود ومسبباً للسلاح توجيه 2 ضرر سحري إضافي في كل هجوم.
الأدوار المتبقية: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=الفارس المقدس حقن سلاحه الملبوس بطاقة مقدسة، مسبباً لهجماته توجيه 6 ضرر سحري إضافي.
إلقاء تعاويذ أخرى أثناء نشاط السلاح المقدس سيمد مدتها بـ10 أدوار لكل شحنة مستخدمة.
الأدوار المتبقية: %s.
actors.hero.spells.judgement.name=قضاء
actors.hero.spells.judgement.short_desc=يضر كل الأعداء المرئيين.
actors.hero.spells.judgement.desc=يضرب الكاهن بقبضته على الأرض، مسبباً انفجاراً من الضوء يضر كل الأعداء الذين يمكنه رؤيتهم. هذا يسبب %1$d-%2$d ضرر كقاعدة أساسية، لكنه يسبب أيضاً 33%% ضرراً إضافياً لكل تعويذة ألقاها الكاهن منذ دخوله الهيئة المتسامية (أو منذ آخر إلقاء للقضاء).
حالياً القضاء سيسبب %3$d-%4$d ضرر.
actors.hero.spells.layonhands.name=لمسة الشفاء
actors.hero.spells.layonhands.short_desc=تشفي فوراً شخصية ملاصقة أو تحمي الفارس المقدس.
actors.hero.spells.layonhands.desc=يوجه الفارس المقدس طاقة مقدسة عبر يديه، شافياً أو حامياً أي شيء يلمسه.
يمكن للفارس المقدس إلقاء هذه التعويذة على أي شخصية ملاصقة لمنحها %1$d شفاء، أو على نفسه لاكتساب %1$d حماية. يُحول الشفاء الزائد من هذه التعويذة إلى حماية.
تُلقى هذه التعويذة فورياً ويمكن إلقاؤها بشكل متكرر، لكن لا يمكنها منح أكثر من حماية تساوي ثلاثة إلقاءات في المرة الواحدة.
actors.hero.spells.lifelinkspell.name=رابط الحياة
actors.hero.spells.lifelinkspell.short_desc=تشارك الضرر مع حليف، وتقلل ضرره المتلقى.
actors.hero.spells.lifelinkspell.desc=يقوي الكاهن الرابط بين نفسه وحليفه المعزز. بهذا الرابط المعزز، أي ضرر متلقى سيُشارك بين البطل وحليفه لـ%1$d أدوار، وسيُزيد تعزيز قوة الكثرة الدفاعي إلى -%2$d%% ضرراً متلقياً. لاحظ أن الضرر يُشارك بعد الدرع، لكن قبل خفض ضرر قوة الكثرة.
أثناء نشاط هذا التأثير، تعاويذ الكاهن النافعة من المستوى 3 أو أقل ستُطبق على كل من الكاهن وحليفه إذا كانت ستُطبق على أحدهما فقط.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=حماية رابط الحياة
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=الكاهن ألقى رابط الحياة مؤخراً على هذا الحليف.
بالإضافة إلى فوائد رابط الحياة العادية، هذه الشخصية تتلقى أيضاً ضرراً مخفضاً، أي تعاويذ كاهن إيجابية تُطبق على كل من الكاهن وهذا الحليف بدلاً من واحد فقط، وقوة الكثرة لن تنتهي بينما هذا التعزيز نشط.
الأدوار المتبقية: %s.
actors.hero.spells.mindform.name=هيئة العقل
actors.hero.spells.mindform.short_desc=تعين الثالوث لعصا سحرية أو سلاح رمي.
actors.hero.spells.mindform.desc=يختار الكاهن عصا سحرية أو أسلحة رمي عرفها في هذه الجولة ويحقن الثالوث بتأثيرها.
عند استخدام الثالوث، يمكن للكاهن تنفيذ هجوم واحد وكأنه يستخدم الغرض المختار بمستوى +%d. سيُفعل هذا كل التأثيرات التي سيُفعلها استخدام ذلك النوع من الأغراض عادة.
هذه التعويذة تستبدل أي تأثير عقل آخر محقون فيه الثالوث حالياً.
actors.hero.spells.mnemonicprayer.name=صلاة الذاكرة
actors.hero.spells.mnemonicprayer.short_desc=تمدد التعزيزات/التأثيرات السلبية على حليف/عدو، وتعيد تطبيق الإشعاع.
actors.hero.spells.mnemonicprayer.desc=يتلو القس صلاة تمدد مدة كل التعزيزات أو التأثيرات السلبية على هدف محدد بـ%1$d أدوار. هذه التعويذة لا تأخذ أي وقت للإلقاء. التأثيرات الإيجابية ستدوم أطول على الحلفاء (بما في ذلك القس نفسه)، والتأثيرات الضارة ستدوم أطول على الأعداء.
صلاة الذاكرة يمكنها تمديد نسخة محددة من تعزيز أو تأثير سلبي مرة واحدة فقط، ولا يمكنها تمديد التعزيزات الممنوحة من قدرات الدروع.
actors.hero.spells.radiance.name=إشراق
actors.hero.spells.radiance.short_desc=تضيء وتذهل وجيزاً الأعداء المرئيين.
actors.hero.spells.radiance.desc=ينفجر القس بضوء مقدس، مذهلاً كل الأعداء المرئيين لـ3 أدوار. إذا كان العدو مضاء بالفعل، الإشراق سيفعل ضرر الإشعاع الإضافي ثم يطبق تأثير الإشعاع السلبي. الإشراق سيسبب أيضاً توهج القس لـ100 دور إذا كان الطابق الحالي مظلماً.
actors.hero.spells.recallinscription.name=استحضار النقش
actors.hero.spells.recallinscription.short_desc=تكرر حجراً رونياً أو لفافة استُخدمت مؤخراً.
actors.hero.spells.recallinscription.desc=يستخدم الكاهن سحراً مقدساً لإعادة إلقاء تأثير رمز سحري موجود على حجر روني أو لفافة استخدمها في آخر %s أدوار.
لا يمكن استخدام استحضار النقش لتكرار لفافات الترقية. تكلفة شحنة هذه التعويذة تختلف بناءً على الغرض الذي استُخدم مؤخراً: 2 للحجر الروني، 3 للفافة، 4 للفافة الغريبة. تُضاعف تكلفة الشحنة هذه أيضاً عند تكرار لفافة التحول، أو أغراض الخيمياء التي يجب صنعها باستخدام التحول أو الترقية.
actors.hero.spells.recallinscription$useditemtracker.name=رمز مستخدم مؤخراً
actors.hero.spells.recallinscription$useditemtracker.desc=الكاهن استخدم مؤخراً غرضاً يعمل مع تعويذة استحضار النقش. يمكن للكاهن إلقاء التعويذة لتكرار تأثير الغرض.
الغرض المستخدم: %1$s.
الأدوار المتبقية: %2$s.
actors.hero.spells.shieldoflight.name=درع الضوء
actors.hero.spells.shieldoflight.short_desc=تمنح درعاً مؤقتاً ضد هدف.
actors.hero.spells.shieldoflight.desc=يخلق الكاهن حاجزاً رقيقاً من الضوء بين نفسه وعدو، مما يزيد قوة صد درعه ضد ذلك العدو بمقدار %1$d-%2$d لـ5 أدوار.
هذه التعويذة لا تأخذ أي وقت للإلقاء، لكن لا يمكن استخدامها ضد أهداف متعددة في وقت واحد.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=درع الضوء
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=حاجز رقيق من الضوء يقف بين هذه الشخصية وعدو. ليس قوياً بما يكفي لصد الهجمات تماماً، لكنه سيخففها.
الأدوار المتبقية: %s
actors.hero.spells.spiritform.name=هيئة الروح
actors.hero.spells.spiritform.short_desc=تعين الثالوث لخاتم أو قطعة أثرية.
actors.hero.spells.spiritform.desc=يختار الكاهن خاتماً أو قطعة أثرية عرفها في هذه الجولة (باستثناء الكتاب المقدس) ويحقن الثالوث بتأثيرها.
إذا اختير خاتم، فمنح الثالوث تأثير ذلك الخاتم بمستوى +%1$d لـ20 دوراً.
إذا اختيرت قطعة أثرية، فالثالوث يكرر تأثير تلك القطعة الأثرية بمستوى +%2$d. كل قطعة أثرية لديها سلوكيات محددة وتكاليف شحنات درع مختلفة عند استخدامها مع الثالوث.
هذه التعويذة تستبدل أي تأثير روح آخر محقون فيه الثالوث حالياً.
actors.hero.spells.spiritform$spiritformbuff.name=هيئة الروح
actors.hero.spells.spiritform$spiritformbuff.desc=هيئة الروح للثالوث تمنحك حالياً قوة غرض، وكأنك مجهز به.
لاحظ أن هيئة الروح لا يمكنها توفير نسخة أخرى من تأثير تستفيد منه بالفعل.
التأثير الحالي: %1$s.
الأدوار المتبقية: %2$s.
actors.hero.spells.smite.name=بطش
actors.hero.spells.smite.short_desc=تضمن الإصابة مع ضرر إضافي وقوة سحر.
actors.hero.spells.smite.desc=يحقن الفارس المقدس ضربة قريبة بقوة تدميرية بارّة.
بالإضافة إلى توجيه ضرر قريب عادي، البطش يجعل الهجمات غير المرهقة مضمونة الإصابة، لديه +300%% قوة سحر، ويسبب %1$d - %2$d ضرراً سحرياً إضافياً.
الضرر السحري الإضافي للبطش يتدرج مع مستوى الفارس المقدس، وسيسبب دائماً ضرراً سحرياً إضافياً أقصى ضد الأعداء الأموات أحياء أو الشيطانية.
actors.hero.spells.stasis.name=سبات
actors.hero.spells.stasis.short_desc=تزيل الحليف من الزنزانة وتحافظ عليه.
actors.hero.spells.stasis.desc=يركز الكاهن ارتباطه بحليفه نحو نفسه، مسبباً احتجاز الحليف مؤقتاً في نوع من السبات الطاقي داخل الكاهن. سيُحفظ الحليف حتى %d أدوار، مع عدم تأثر كل التأثيرات الإيجابية عليه بوقته في السبات.
سيظهر الحليف بجانب الكاهن عندما ينتهي السبات طبيعياً أو يمكنه إعادة إلقاء التعويذة فوراً بدون تكلفة لإنهاء التأثير مبكراً. يمكن للسبات حتى نقل الحلفاء غير القادرين على الحركة، لكن لا يمكنه نقلهم بين الطوابق.
actors.hero.spells.stasis$stasisbuff.name=حليف في سبات
actors.hero.spells.stasis$stasisbuff.left_behind=حليفك غير القادر على الحركة تُرك خلفك.
actors.hero.spells.stasis$stasisbuff.desc=الكاهن لديه حالياً حليف مخزن في السبات. كل التأثيرات الإيجابية على هذا الحليف تُحفظ، بما في ذلك قوة الكثرة، وسيظهر مجدداً بجانب الكاهن عندما ينتهي التأثير. يمكن أيضاً إنهاء التأثير مبكراً بإعادة إلقاء السبات.
الحليف في السبات: %1$s.
الأدوار المتبقية: %2$s.
actors.hero.spells.sunray.name=شعاع الشمس
actors.hero.spells.sunray.short_desc=تسبب ضرراً سحرياً بعيد المدى وتعمي هدفاً مرة واحدة.
actors.hero.spells.sunray.desc=يطلق الكاهن شعاعاً من الضوء المبهر على هدف، مسبباً %1$d-%2$d ضرر ومعمياً إياه لـ%3$d أدوار. شعاع الشمس يسبب دائماً ضرراً أقصى للأهداف الأموات أحياء والشيطانية.
بعد الإصابة بهذه التعويذة ستتأقلم رؤية العدو، مما يمنعه من التعمي بواسطتها مجدداً. مع ذلك، إذا ضُرب مجدداً وهو أعمى بهذه التعويذة، فسيكون الضوء طاغياً ويشله بدلاً من ذلك.
actors.hero.spells.walloflight.name=جدار الضوء
actors.hero.spells.walloflight.short_desc=تخلق جداراً يسد الأعداء.
actors.hero.spells.walloflight.desc=يخلق الفارس المقدس جداراً مصنوعاً من ألواح من الضوء الصلب مباشرة أمام نفسه بسمك بلاطة واحدة، عرض %1$d بلاطات، ويدوم لـ20 دوراً.
هذا الجدار يعمل تماماً كالجدار العادي، باستثناء أنه يمكن الرؤية من خلاله. الأعداء Caught in the wall عند خلقه سيُذهلون وجيزاً ويُدفعون للخلف إذا أمكن. أي شيء عالق في الجدار سيتمكن من الخروج منه.
يمكن إلقاء الجدار في أي من الاتجاهات الأساسية الأربعة أو القطرية الأربعة. إذا كان جدار نشط بالفعل، يمكن إعادة استخدام التعويذة مجاناً لإزالة الجدار فوراً.
actors.hero.spells.walloflight.early_end=أنت تبدد جدار الضوء.
actors.hero.spells.walloflight$lightwall.desc=ألواح متلألئة من الضوء تسد المرور هنا.
###main hero
actors.hero.hero.name=أنت
actors.hero.hero.leave=لا يمكنك المغادرة بعد، بقية الزنزانة تنتظر في الأسفل!
actors.hero.hero.level_up=ارتقاء مستوى!
actors.hero.hero.new_level=ارتقاء مستوى! +دقة، +مراوغة، +5 صحة!
actors.hero.hero.new_talent=+1 نقطة موهبة!
actors.hero.hero.unspent=لديك نقاط موهبة غير منفقة!
actors.hero.hero.level_cap=لا يمكنك أن تصبح أقوى، لكن خبراتك تمنحك دفعة من القوة!
actors.hero.hero.you_now_have=التقطت: %s.
actors.hero.hero.you_cant_have=لا يمكنك حمل: %s.
actors.hero.hero.locked_chest=هذا الصندوق مقفل وليس لديك مفتاح مطابق.
actors.hero.hero.locked_door=ليس لديك مفتاح مطابق.
actors.hero.hero.noticed_smth=لاحظت شيئاً ما.
actors.hero.hero.wait=...
actors.hero.hero.search=بحث
actors.hero.hero.search_distracted=من الصعب التركيز، البحث مرهق.
actors.hero.hero.key_distracted=لا يمكنك فتح القفل تماماً، سيتعين عليك الاستمرار في المحاولة.
actors.hero.hero.pain_resist=الألم يساعدك على مقاومة الرغبة في النوم.
actors.hero.hero.revive=العنخ ينفجر بطاقة مانحة للحياة!
###classes
actors.hero.heroclass.warrior=المحارب
actors.hero.heroclass.warrior_desc_short=يتحمل المحارب ضرراً إضافياً بفضل الحماية الممنوحة من _ختمه المكسور_. يمكن نقل الختم بين الدروع و_ينقل ترقية واحدة_.
actors.hero.heroclass.warrior_desc=يبدأ المحارب بـ_ختم مكسور فريد_ يمنحه دفعة من الحماية عندما تكون صحته أقل من النصف. يمكن نقل الختم بين الدروع، ويمكنه _نقل ترقية واحدة_ معه.
يبدأ المحارب أيضاً بـ_سيف قصير بالٍ_، _ثلاثة أحجار رمي_، درع قماش، قربة ماء، وكيس مخملي.
المحارب يعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات الشفاء
_-_ لفافات الغضب
actors.hero.heroclass.warrior_unlock=المحارب مفتوح تلقائياً.
actors.hero.heroclass.mage=الساحر
actors.hero.heroclass.mage_desc_short=الساحر خبير في الأسرار ويحمل _عصا سحرية_ أقوى من العصا العادية. يمكن _حقن العصا بأي عصا سحرية_ يجدها الساحر.
actors.hero.heroclass.mage_desc=يبدأ الساحر بـ_عصا فريدة_، والتي تشحن أسرع بكثير من العصا السحرية وتمتلك شحنة إضافية واحدة. يمكن _حقن العصا بأي عصا سحرية_ يجدها الساحر في الزنزانة.
يبدأ الساحر أيضاً بـ_عصا صاروخ سحري_ محقونة في عصاه، درع قماش، قربة ماء، وكيس مخملي.
الساحر يعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات اللهب السائل
_-_ لفافات الترقية
actors.hero.heroclass.mage_unlock=لفتح الساحر _استخدم لفافة ترقية لجعل غرض أقوى_.
actors.hero.heroclass.rogue=اللص
actors.hero.heroclass.rogue_desc_short=يمكن للص مراوغة الأعداء والضرب من التخفي باستخدام _عباءة ظلاله_. يمكنه أيضاً _اكتشاف الأسرار والفخاخ_ من مسافة أكبر.
actors.hero.heroclass.rogue_desc=يبدأ اللص بـ_عباءة ظلال فريدة_، والتي يمكنه استخدامها ليصبح غير مرئي حسب الرغبة.
يمكن للص _اكتشاف الأسرار والفخاخ_ من مسافة أكبر.
يبدأ اللص أيضاً بـ_خنجر_، _ثلاثة سكاكين رمي_، درع قماش، قربة ماء، وكيس مخملي.
اللص يعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات التخفي
_-_ لفافات التخطيط السحري
actors.hero.heroclass.rogue_unlock=لفتح اللص _نفذ 10 هجمات مفاجئة في جولة واحدة_.
actors.hero.heroclass.huntress=الصيادة
actors.hero.heroclass.huntress_desc_short=الصيادة سيدة أسلحة الرمي وتملك _قوساً سحرياً_ بأسهم لا نهائية. يمكنها أيضاً السفر عبر العشب الطويل _بدون دعسه_.
actors.hero.heroclass.huntress_desc=تبدأ الصيادة بـ_قوس روح فريد_، والذي يمكنه إطلاق عدد لا نهائي من الأسهم المستحضرة.
يمكن للصيادة السفر عبر العشب الطويل _بدون دعسه_.
تبدأ الصيادة أيضاً بـ_قفازات مرصعة_، درع قماش، قربة ماء، وكيس مخملي.
الصيادة تعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات رؤية العقول
_-_ لفافات التهويد
actors.hero.heroclass.huntress_unlock=لفتح الصيادة _أصيّبي الأعداء بأسلحة الرمي 10 مرات في جولة واحدة_.
actors.hero.heroclass.duelist=المبارزة
actors.hero.heroclass.duelist_desc_short=المبارزة سيدة أسلحة يمكنها استخدام سلاحها لتفعيل _قدرة سلاح خاصة_. هذه القدرة الخاصة _مختلفة لكل سلاح_.
actors.hero.heroclass.duelist_desc=تبدأ المبارزة بـ_سيف رفيع فريد_ بقدرة خاصة تشحن عبر الزمن.
كل سلاح في اللعبة لديه _قدرة خاصة مختلفة_ يمكن للمبارزة استخدامها.
تبدأ المبارزة أيضاً بـ_شوكتين رمي_، درع قماش، قربة ماء، وكيس مخملي.
المبارزة تعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات القوة
_-_ لفافات الصورة المرآتية
actors.hero.heroclass.duelist_unlock=لفتح المبارزة _جهزي سلاحاً من المستوى 2 أو أعلى بدون عقوبة قوة_.
actors.hero.heroclass.cleric=الكاهن
actors.hero.heroclass.cleric_desc_short=الكاهن ملقي تعاويذ إلهي يستخدم _كتابه المقدس_ الفريد لتوجيه السحر الإلهي. يمكنه _تعلم وتطوير التعاويذ_ عبر المواهب.
actors.hero.heroclass.cleric_desc=يبدأ الكاهن بـ_كتاب مقدس فريد_، والذي يمكنه استخدامه لإلقاء تعاويذ متنوعة.
معظم مواهب الكاهن تركز حول تعلم أو تطوير التعاويذ.
يبدأ الكاهن أيضاً بـ_هراوة_، درع قماش، قربة ماء، وكيس مخملي.
الكاهن يعرف تلقائياً:
_-_ لفافات التعرف
_-_ جرعات النقاء
_-_ لفافات إزالة اللعنة
actors.hero.heroclass.cleric_unlock=لفتح الكاهن _طهر اللعنة تماماً عن أي قطعة معدات ملعونة_.
###subclasses
actors.hero.herosubclass.berserker=البرسيرك
actors.hero.herosubclass.berserker_short_desc=يبني _البرسيرك_ الغضب كلما تلقى ضرراً. الغضب يزيد ضرره ويمكن تفعيله عند 100% لاكتساب حماية إضافية.
actors.hero.herosubclass.berserker_desc=يكتسب البرسيرك الغضب كلما تلقى ضرراً جسدياً، بما في ذلك الضرر الذي يصد درعه! الغضب يتلاشى ببطء عبر الزمن، لكنه يتلاشى ببطء أكثر إذا كانت صحته منخفضة.
يمكن للغضب أن يسبب توجيه البرسيرك حتى +50% ضرر. عند الغضب الأقصى يمكنه الهياج، مكتسباً دفعة من الحماية ومحتفظاً بغضبه طالما لديه حماية متبقية. الحماية تتدرج مع مستوى درع البرسيرك، ويمكن تعزيزها بشكل هائل إذا كانت صحته منخفضة. يحتاج البرسيرك وقتاً للتعافي بعد هياجه.
actors.hero.herosubclass.gladiator=المصارع
actors.hero.herosubclass.gladiator_short_desc=يبني _المصارع_ التتابع عندما ينفذ هجمات ناجحة. يمكنه إنفاق التتابع لاستخدام قدرات فريدة.
actors.hero.herosubclass.gladiator_desc=يبني المصارع نقطة تتابع واحدة في كل مرة ينفذ فيها هجوماً ناجحاً بسلاح قريب أو رمي. إذا لم ينفذ المصارع هجوماً ناجحاً خلال 5 أدوار (15 دوراً بعد القتل)، يُصفّر تتابعه.
أثناء بناء التتابع يمكن للمصارع استخدام مجموعة من القدرات المضمونة الإصابة:
2 تتابع: دفع العدو للخلف، يحافظ على التتابع
4 تتابع: توجيه ضرر بناءً على الدرع
6 تتابع: صد، يحافظ على التتابع
8 تتابع: إيذاء الهدف والأعداء القريبين
10 تتابع: الهجوم مرة لكل تتابع
actors.hero.herosubclass.battlemage=الساحر الحربي
actors.hero.herosubclass.battlemage_short_desc=يستحضر _الساحر الحربي_ تأثيرات إضافية عند القتال القريب بعصاه. هذه التأثيرات تعتمد على العصا السحرية المحقونة في عصاه.
actors.hero.herosubclass.battlemage_desc=يكتسب الساحر الحربي تأثيراً إضافياً في كل مرة يضرب فيها قريباً بعصاه، وكأن عصاه تمتلك سحراً إضافياً. هذه التأثيرات تعتمد على العصا السحرية المحقونة في عصاه، كل عصا سحرية لها تأثيرها الخاص. بالإضافة لتأثيرات العصا السحرية، عصا الساحر الحربي ستكسب أيضاً 0.5 شحنة عندما يضرب بها.
actors.hero.herosubclass.warlock=الساحر المظلم
actors.hero.herosubclass.warlock_short_desc=لدى _الساحر المظلم_ فرصة لتعليم الأعداء بعلامة الروح بعصيه. سيُشفى كلما وجه ضرراً جسدياً للأعداء المعلمين.
actors.hero.herosubclass.warlock_desc=لدى الساحر المظلم فرصة لإلحاق علامة روح بالشخصيات عندما يستخدم العصي السحرية عليهم. فرصة تطبيق علامة الروح ومدتها تزداد مع مستوى العصا السحرية.
عندما يُعلم عدو بعلامة الروح، سيُشفى الساحر المظلم بنقطتي صحة لكل 5 ضرر يوجهه إليهم، لكن فقط بالهجمات من الأسلحة القريبة أو المرمية، وليس من العصي السحرية!
actors.hero.herosubclass.assassin=المغتال
actors.hero.herosubclass.assassin_short_desc=يمكن لـ_المغتال_ تحضير ضربة قاتلة أثناء تخفيه. كلما انتظر أطول، كلما كان الهجوم أقوى.
actors.hero.herosubclass.assassin_desc=يحضر المغتال ضربته التالية عندما يصبح غير مرئي. كلما حضر أطول، كلما كان هجومه التالي أقوى. التحضير يبنى حتى 9 أدوار.
بعد التحضير، يوجه المغتال ضرراً إضافياً في هجومه التالي، يمكنه الوميض نحو هدفه، ويمكنه حتى قتل الأعداء الضعفاء بما يكفي فوراً.
actors.hero.herosubclass.freerunner=العداء الحر
actors.hero.herosubclass.freerunner_short_desc=يبني _العداء الحر_ الزخم أثناء جريه، والذي يمكن استخدامه لبدء الجري الحر. هذا يمنحه سرعة ومراوغة إضافيتين لفترة قصيرة.
actors.hero.herosubclass.freerunner_desc=أثناء تحرك العداء الحر يبنى رصات من الزخم. يمكنه اكتساب حتى 10 زخم بعد الجري لـ10 أدوار، لكنه يفقده بسرعة إذا توقف عن الحركة. يمكن للعداء الحر استخدام زخمه لبدء الجري الحر، بدورين لكل نقطة زخم.
أثناء الجري الحر يتحرك العداء الحر بسرعة مضاعفة، ويكتسب مراوغة إضافية تتناسب مع مستواه. بمجرد انتهاء الجري الحر هناك فترة تهدئة قبل أن يمكن بناء الزخم مجدداً.
actors.hero.herosubclass.sniper=القناصة
actors.hero.herosubclass.sniper_short_desc=يمكن لـ_القناصة_ اختراق الدرع بهجماتها بعيدة المدى. بعد الضرب بسلاح رمي يمكنها المتابعة بهجوم خاص من قوسها.
actors.hero.herosubclass.sniper_desc=القناصة سيدة القتال بعيد المدى، والتي تخترق هجماتها بعيدة المدى درع العدو. عندما تهاجم عدواً بسلاح رمي، تضع عليه علامة قناص، مما يتيح لها المتابعة بهجوم خاص من قوسها. هذا الهجوم الخاص يختلف بناءً على كيفية تعزيز قوسها.
القوس غير المعزز سيطلق لقطة سريعة تسبب ضرراً مخفضاً لكنها تُطلق فوراً. قوس السرعة سيطلق وابلاً من ثلاثة أسهم تسبب ضرراً مخففاً، ما زال يمكنها تفعيل السحر، وتأخذ دوراً واحداً للإطلاق. قوس الضرر سيطلق طلقة قناص مضمونة الإصابة، تسبب ضرراً إضافياً بناءً على المسافة، وتأخذ دورين للإطلاق.
actors.hero.herosubclass.warden=الحارسة
actors.hero.herosubclass.warden_short_desc=يمكن لـ_الحارسة_ الرؤية عبر العشب الطويل وتكتسب تأثيرات إضافية عندما تزرع البذور وتدوس النباتات.
actors.hero.herosubclass.warden_desc=الحارسة لديها ارتباط قوي بالطبيعة يمنحها مجموعة من التأثيرات الإضافية المتعلقة بالعشب والنباتات. يمكنها الرؤية عبر العشب الطويل والمحروث وكأنه مساحة فارغة.
تسبب الحارسة نمو العشب حول أي بذرة ترميها أو تزرعها، وتكتسب تأثيرات خاصة عند دوس النباتات. هذه التأثيرات الخاصة تستبدل تأثيرات النبات العادية، مما يعني أنه لا يوجد نبات ضار لها أن تدوسه.
actors.hero.herosubclass.champion=البطلة
actors.hero.herosubclass.champion_short_desc=يمكن لـ_البطلة_ استخدام سلاحين وتحصل على شحنات سلاح أكثر. هجماتها العادية تستخدم سلاحها الأساسي، لكن يمكنها تبديل الأسلحة واستخدام قدرة أي منهما.
actors.hero.herosubclass.champion_desc=البطلة سيدة الأسلحة القريبة والتي يمكنها تجهيز سلاح ثانوي بالإضافة لأساسيها. هجماتها العادية تستخدم سلاحها الأساسي، لكن يمكنها تبديل سلاحها الأساسي فوراً واستخدام قدرة أي من السلاحين.
تكتسب أيضاً شحنتين إضافيتين كحد أقصى لشحنات قدرة السلاح و+50% سرعة شحنة قدرة السلاح.
actors.hero.herosubclass.monk=الراهبة
actors.hero.herosubclass.monk_short_desc=تبني _الراهبة_ الطاقة أثناء القتال. يمكن إنفاق هذه الطاقة على مجموعة من القدرات الفريدة.
actors.hero.herosubclass.monk_desc=الراهبة سيدة التقنية الجسدية. أثناء هزيمتها للأعداء، تكتسب طاقة يمكن استخدامها على مجموعة من القدرات الدفاعية والنفعيّة. هذه الطاقة لا تتلاشى عبر الزمن، لكن لها حداً أقصى يعتمد على مستوى الراهبة.
1 طاقة: ضربتان سريعتان بالقبضتين
2 طاقة: التركيز لمراوغة الهجوم التالي
3 طاقة: اندفاع فوري قريب
4 طاقة: ركل عدو بعيداً
5 طاقة: التأمل لمسح الحالات واستعادة شحنة العصي والقطع الأثرية
actors.hero.herosubclass.priest=القس
actors.hero.herosubclass.priest_short_desc=يكتسب _القس_ تعاويذ جديدة بعيدة المدى ونسخة معززة من النور الهادي.
actors.hero.herosubclass.priest_desc=يكتسب القس مجموعة من التعاويذ الجديدة والمطورة التي تركز على القتال بعيد المدى والتآزر مع الأغراض السحرية.
يمكن للقس إلقاء _النور الهادي_ مجاناً مرة كل 50 دوراً، يضيء الأعداء المستهدفين مباشرة بأي من تعاويذه، ويمكنه استهلاك تأثير الإشعاع السلبي مع الحلفاء، العصي السحرية، وبعض القطع الأثرية لضرر إضافي يساوي مستواه + 5.
يكتسب القس أيضاً تعويذة _الإشراق_، والتي تبدد الظلام وتؤثر على كل الأعداء المرئيين، مفعلة ومطبقة الإشعاع ومذهلة إياهم وجيزاً بتكلفة شحنتين.
actors.hero.herosubclass.paladin=الفارس المقدس
actors.hero.herosubclass.paladin_short_desc=يكتسب _الفارس المقدس_ تعاويذ جديدة قريبة المدى ونسخاً معززة من السلاح المقدس والحراسة المقدسة.
actors.hero.herosubclass.paladin_desc=يكتسب الفارس المقدس مجموعة من التعاويذ الجديدة والمطورة التي تركز على القتال القريب والتآزر مع الأسلحة والدروع.
تعاويذ _السلاح المقدس_ و_الحراسة المقدسة_ للفارس المقدس تمنح تعزيزات أكبر، ولا تتجاوز السحر والنقوش الموجودة بعد الآن، ويمكن تمديدها بإلقاء تعاويذ أخرى.
يكتسب الفارس المقدس أيضاً تعويذة _البطش_، والتي تتيح له تنفيذ ضربة قريبة مضمونة الإصابة مع ضرر إضافي وقوة سحر.
