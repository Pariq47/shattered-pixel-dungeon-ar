#warrior
actors.hero.talent.hearty_meal.title=وجبة دسمة
actors.hero.talent.hearty_meal.desc=_+1:_ تناول الطعام يشفي المحارب بـ_4 صحة_ عندما تكون صحته 33% أو أقل.
_+2:_ تناول الطعام يشفي المحارب بـ_6 صحة_ عندما تكون صحته 33% أو أقل.
actors.hero.talent.veterans_intuition.title=حدس المحارب القديم
actors.hero.talent.veterans_intuition.desc=_+1:_ المحارب يعرف الأسلحة _أسرع بـ1.75 مرة_ والدروع _أسرع بـ2.5 مرة_.
_+2:_ المحارب يعرف الأسلحة _أسرع بـ2.5 مرة_ والدروع _عندما يجهزها_.
actors.hero.talent.provoked_anger.title=غضب مُثار
actors.hero.talent.provoked_anger.desc=_+1:_ عندما تُكسر أي حماية مطبقة على المحارب بالضرر، هجومه الجسدي التالي يوجه _3 ضرر إضافي_.
_+2:_ عندما تُكسر أي حماية مطبقة على المحارب بالضرر، هجومه الجسدي التالي يوجه _5 ضرر إضافي_.
actors.hero.talent.iron_will.title=إرادة حديدية
actors.hero.talent.iron_will.desc=_+1:_ الدرع المقدم من ختم المحارب _يزداد بمقدار 1_.
_+2:_ الدرع المقدم من ختم المحارب _يزداد بمقدار 2_.
actors.hero.talent.iron_will.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ ستمنح بشكل سلبي نسخة بحد أقصى للحماية 1 أو 2 من تأثير ختم المحارب المكسور.
actors.hero.talent.iron_stomach.title=معدة حديدية
actors.hero.talent.iron_stomach.desc=_+1:_ تناول الطعام يأخذ من المحارب دوراً واحداً ويمنحه _مقاومة ضرر 75%_ أثناء الأكل.
_+2:_ تناول الطعام يأخذ من المحارب دوراً واحداً ويمنحه _مقاومة ضرر 100%_ أثناء الأكل.
actors.hero.talent.liquid_willpower.title=قوة إرادة سائلة
actors.hero.talent.liquid_willpower.desc=_+1:_ يكسب المحارب _حماية تساوي 6.5% من صحته القصوى_ عند شرب أو رمي جرعة أو خليط أو إكسير.
_+2:_ يكسب المحارب _حماية تساوي 10% من صحته القصوى_ عند شرب أو رمي جرعة أو خليط أو إكسير.
تتضاعف كمية الحماية عند استخدام جرعات القوة أو الخبرة، أو أغراض الخيمياء التي يجب صنعها باستخدام تلك الجرعات.
لأغراض الخيمياء ذات كميات الإنتاج الأعلى )مثل الخليط المائي(، لدى هذه الموهبة فرصة للتفعيل بناءً على عدد ذلك الغرض المنتج.
actors.hero.talent.runic_transference.title=نقل رونى
actors.hero.talent.runic_transference.desc=_+1:_ ختم المحارب المكسور يمكنه نقل _النقوش العادية_ بنفس الطريقة التي ينقل بها الترقية.
_+2:_ ختم المحارب المكسور يمكنه نقل _النقوش العادية والقوية ونقوش اللعن_ بنفس الطريقة التي ينقل بها الترقية.
يمكن للختم نقل النقوش فقط إذا طُبقت على الدرع أثناء تثبيت الختم.
actors.hero.talent.runic_transference.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستساعد النقوش على درعك بدلاً من ذلك على مقاومة الإزالة بلفافات الترقية. ستبدأ النقوش بالضياع عند الترقية من المستوى 6 )بدلاً من 4( عند +1، أو المستوى 7 )بدلاً من 4( عند +2. المستوى الذي تُفقد فيه النقوش بشكل مضمون يبقى دون تغيير عند +8.
actors.hero.talent.lethal_momentum.title=زخم قاتل
actors.hero.talent.lethal_momentum.desc=_+1:_ عندما يوجه المحارب ضربة قاضية لعدو بسلاح جسدي، لديها _فرصة 67%_ لأخذ 0 أدوار.
_+2:_ عندما يوجه المحارب ضربة قاضية لعدو بسلاح جسدي، لديها _فرصة 100%_ لأخذ 0 أدوار.
actors.hero.talent.improvised_projectiles.title=مقذوفات مرتجلة
actors.hero.talent.improvised_projectiles.desc=_+1:_ يمكن للمحارب تعميه عدو لـ_دورين_ برمي أي غرض ليس سلاح رمي عليه. لهذه تهدئة 50 دوراً.
_+2:_ يمكن للمحارب تعميه عدو لـ_3 أدوار_ برمي أي غرض ليس سلاح رمي عليه. لهذه تهدئة 50 دوراً.
actors.hero.talent.hold_fast.title=ثبات
actors.hero.talent.hold_fast.desc=_+1:_ عندما ينتظر المحارب يكسب _1-2 درع_ ويبطئ اضمحلال التتابع والحماية بنسبة _50%_ حتى يتحرك.
_+2:_ عندما ينتظر المحارب يكسب _2-4 درع_ ويبطئ اضمحلال التتابع والحماية بنسبة _75%_ حتى يتحرك.
_+3:_ عندما ينتظر المحارب يكسب _3-6 درع_ ويبطئ اضمحلال التتابع والحماية بنسبة _100%_ حتى يتحرك.
actors.hero.talent.strongman.title=رجل قوي
actors.hero.talent.strongman.desc=_+1:_ قوة المحارب _تزداد بنسبة 8%_، مقربة للأسفل.
_+2:_ قوة المحارب _تزداد بنسبة 13%_، مقربة للأسفل.
_+3:_ قوة المحارب _تزداد بنسبة 18%_، مقربة للأسفل.
actors.hero.talent.endless_rage.title=غضب لا نهائي
actors.hero.talent.endless_rage.desc=_+1:_ يمكن للبرسيرك بلوغ حد أقصى _116% غضب_.
_+2:_ يمكن للبرسيرك بلوغ حد أقصى _133% غضب_.
_+3:_ يمكن للبرسيرك بلوغ حد أقصى _150% غضب_.
كل نقطة غضب فوق 100% تزيد حماية الهياج بنسبة 1% وتقلل التهدئة بنسبة 1%، لكنها لا تزيد تعزيز الضرر فوق +50%.
actors.hero.talent.deathless_fury.title=غضب لا يموت
actors.hero.talent.deathless_fury.desc=_+1:_ يُفعّل الهياج تلقائياً إذا كان البرسيرك على وشك الموت وغضبه 100% أو أكثر، لكن لديه تهدئة _3 مستويات بطل_ عندما يحدث هذا.
_+2:_ يُفعّل الهياج تلقائياً إذا كان البرسيرك على وشك الموت وغضبه 100% أو أكثر، لكن لديه تهدئة _مستويي بطل_ عندما يحدث هذا.
_+3:_ يُفعّل الهياج تلقائياً إذا كان البرسيرك على وشك الموت وغضبه 100% أو أكثر، لكن لديه تهدئة _مستوى بطل واحد_ عندما يحدث هذا.
لاحظ أن البرسيرك سيموت مع ذلك إذا كانت صحته 0 عند انتهاء الهياج.
actors.hero.talent.enraged_catalyst.title=محفز غاضب
actors.hero.talent.enraged_catalyst.desc=_+1:_ سحر ولعنات سلاح البرسيرك تُفعّل أكثر كلما زاد غضبه، بحد أقصى _15% أكثر_ عند 100% غضب.
_+2:_ سحر ولعنات سلاح البرسيرك تُفعّل أكثر كلما زاد غضبه، بحد أقصى _30% أكثر_ عند 100% غضب.
_+3:_ سحر ولعنات سلاح البرسيرك تُفعّل أكثر كلما زاد غضبه، بحد أقصى _45% أكثر_ عند 100% غضب.
actors.hero.talent.cleave.title=شطر
actors.hero.talent.cleave.desc=_+1:_ الوقت الإضافي الذي يكسبه المصارع عند القتل يزداد إلى _30 دوراً_، من 15.
_+2:_ الوقت الإضافي الذي يكسبه المصارع عند القتل يزداد إلى _45 دوراً_، من 15.
_+3:_ الوقت الإضافي الذي يكسبه المصارع عند القتل يزداد إلى _60 دوراً_، من 15.
actors.hero.talent.lethal_defense.title=دفاع قاتل
actors.hero.talent.lethal_defense.desc=_+1:_ عندما يقتل المصارع عدواً بحركة تتابع، تهدئة حماية ختمه المكسور _تقل بمقدار 50 دوراً_.
_+2:_ عندما يقتل المصارع عدواً بحركة تتابع، تهدئة حماية ختمه المكسور _تقل بمقدار 100 دور_.
_+3:_ عندما يقتل المصارع عدواً بحركة تتابع، تهدئة حماية ختمه المكسور _تقل بمقدار 150 دور_.
يمكن لهذه الموهبة خفض تهدئة الدرع إلى -150 دوراً كحد أدنى، مما يعني أنه سيكون متاحاً فوراً مجدداً بمجرد تفعيله.
actors.hero.talent.enhanced_combo.title=تتابع معزز
actors.hero.talent.enhanced_combo.desc=_+1:_ عندما يكون تتابع المصارع 7 أو أعلى، يزداد مدى دفع الضربة القاضية إلى 3، وتسبب الدوار، ويمكنها دفع الأعداء إلى الحفر.
_+2:_ إضافة لفوائد +1، عندما يكون تتابع المصارع 9 أو أعلى يعمل الصد على هجمات متعددة.
_+3:_ إضافة لفوائد +1 و+2، يمكن للمصارع القفز حتى مسافة تساوي التتابع/3 بلاطات عند استخدام الارتطام أو السحق أو الغضب.
actors.hero.talent.body_slam.title=ارتطام جسدي
actors.hero.talent.body_slam.desc=_+1:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يتلقون ضرراً يساوي _1-4 زائد 25%_ من قوة صد ضرره.
_+2:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يتلقون ضرراً يساوي _2-8 زائد 50%_ من قوة صد ضرره.
_+3:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يتلقون ضرراً يساوي _3-12 زائد 75%_ من قوة صد ضرره.
_+4:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يتلقون ضرراً يساوي _4-16 زائد 100%_ من قوة صد ضرره.
actors.hero.talent.impact_wave.title=موجة ارتطام
actors.hero.talent.impact_wave.desc=_+1:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يُدفعون _بلاطتين_ للخلف ولديهم _فرصة 25%_ ليصبحوا هشين لـ5 أدوار.
_+2:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يُدفعون _3 بلاطات_ للخلف ولديهم _فرصة 50%_ ليصبحوا هشين لـ5 أدوار.
_+3:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يُدفعون _4 بلاطات_ للخلف ولديهم _فرصة 75%_ ليصبحوا هشين لـ5 أدوار.
_+4:_ عندما يهبط المحارب بعد القفز، كل الأعداء الملاصقين يُدفعون _5 بلاطات_ للخلف ولديهم _فرصة 100%_ ليصبحوا هشين لـ5 أدوار.
actors.hero.talent.double_jump.title=قفزة مزدوجة
actors.hero.talent.double_jump.desc=_+1:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، تلك القفزة لديها _تكلفة شحنة مخفضة بنسبة 16%_.
_+2:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، تلك القفزة لديها _تكلفة شحنة مخفضة بنسبة 30%_.
_+3:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، تلك القفزة لديها _تكلفة شحنة مخفضة بنسبة 40%_.
_+4:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، تلك القفزة لديها _تكلفة شحنة مخفضة بنسبة 50%_.
actors.hero.talent.expanding_wave.title=موجة متوسعة
actors.hero.talent.expanding_wave.desc=_+1:_ يزداد مدى الموجة الصادمة إلى _6 بلاطات_ من 5، وعرضها إلى _75 درجة_ من 60.
_+2:_ يزداد مدى الموجة الصادمة إلى _7 بلاطات_ من 5، وعرضها إلى _90 درجة_ من 60.
_+3:_ يزداد مدى الموجة الصادمة إلى _8 بلاطات_ من 5، وعرضها إلى _105 درجة_ من 60.
_+4:_ يزداد مدى الموجة الصادمة إلى _9 بلاطات_ من 5، وعرضها إلى _120 درجة_ من 60.
actors.hero.talent.striking_wave.title=موجة ضاربة
actors.hero.talent.striking_wave.desc=_+1:_ الموجة الصادمة لديها _فرصة 30%_ لاستخدام تأثيرات عند الإصابة مثل السحر والتتابع أيضاً.
_+2:_ الموجة الصادمة لديها _فرصة 60%_ لاستخدام تأثيرات عند الإصابة مثل السحر والتتابع أيضاً.
_+3:_ الموجة الصادمة لديها _فرصة 90%_ لاستخدام تأثيرات عند الإصابة مثل السحر والتتابع أيضاً.
_+4:_ الموجة الصادمة لديها _فرصة 100%_ لاستخدام تأثيرات عند الإصابة مثل السحر والتتابع أيضاً، وتمنح السحر _+20% قوة_.
actors.hero.talent.shock_force.title=قوة صادمة
actors.hero.talent.shock_force.desc=_+1:_ الموجة الصادمة توجه _ضرراً أكثر بنسبة 20%_ ولديها _فرصة 25%_ للصعق بدلاً من العرج.
_+2:_ الموجة الصادمة توجه _ضرراً أكثر بنسبة 40%_ ولديها _فرصة 50%_ للصعق بدلاً من العرج.
_+3:_ الموجة الصادمة توجه _ضرراً أكثر بنسبة 60%_ ولديها _فرصة 75%_ للصعق بدلاً من العرج.
_+4:_ الموجة الصادمة توجه _ضرراً أكثر بنسبة 80%_ ولديها _فرصة 100%_ للصعق بدلاً من العرج.
actors.hero.talent.sustained_retribution.title=انتقام مستدام
actors.hero.talent.sustained_retribution.desc=_+1:_ المحارب يوجه _115% ضرر إضافي_ موزعاً على _ضربتين_، بدلاً من 100% ضرر إضافي في ضربة واحدة.
_+2:_ المحارب يوجه _130% ضرر إضافي_ موزعاً على _3 ضربات_، بدلاً من 100% ضرر إضافي في ضربة واحدة.
_+3:_ المحارب يوجه _145% ضرر إضافي_ موزعاً على _4 ضربات_، بدلاً من 100% ضرر إضافي في ضربة واحدة.
_+4:_ المحارب يوجه _160% ضرر إضافي_ موزعاً على _5 ضربات_، بدلاً من 100% ضرر إضافي في ضربة واحدة.
actors.hero.talent.shrug_it_off.title=تجاهلها
actors.hero.talent.shrug_it_off.desc=_+1:_ خفض ضرر المحارب أثناء الصمود _يزداد إلى 60%_، من 50%.
_+2:_ خفض ضرر المحارب أثناء الصمود _يزداد إلى 68%_، من 50%.
_+3:_ خفض ضرر المحارب أثناء الصمود _يزداد إلى 74%_، من 50%.
_+4:_ خفض ضرر المحارب أثناء الصمود _يزداد إلى 80%_، من 50%.
actors.hero.talent.even_the_odds.title=تكافؤ الفرص
actors.hero.talent.even_the_odds.desc=_+1:_ المحارب يوجه _5% ضرر إضافي_ لكل عدو ضمن بلاطتين عند انتهاء الصمود.
_+2:_ المحارب يوجه _10% ضرر إضافي_ لكل عدو ضمن بلاطتين عند انتهاء الصمود.
_+3:_ المحارب يوجه _15% ضرر إضافي_ لكل عدو ضمن بلاطتين عند انتهاء الصمود.
_+4:_ المحارب يوجه _20% ضرر إضافي_ لكل عدو ضمن بلاطتين عند انتهاء الصمود.
#mage
actors.hero.talent.empowering_meal.title=وجبة ممكِنة
actors.hero.talent.empowering_meal.desc=_+1:_ تناول الطعام يمنح الساحر _2 ضرر إضافي_ في المرات الثلاث التالية التي يوجه فيها ضرراً بعصا.
_+2:_ تناول الطعام يمنح الساحر _3 ضرر إضافي_ في المرات الثلاث التالية التي يوجه فيها ضرراً بعصا.
actors.hero.talent.scholars_intuition.title=حدس العالم
actors.hero.talent.scholars_intuition.desc=_+1:_ الساحر يعرف العصي _أسرع بـ3 مرات_.
_+2:_ الساحر يعرف العصي _عندما يستخدمها_.
actors.hero.talent.lingering_magic.title=سحر باقٍ
actors.hero.talent.lingering_magic.desc=_+1:_ عندما يطلق الساحر بعصا أو صولجان، هجومه الجسدي التالي يوجه _1-2 ضرر إضافي_.
_+2:_ عندما يطلق الساحر بعصا أو صولجان، هجومه الجسدي التالي يوجه _2 ضرر إضافي_.
actors.hero.talent.backup_barrier.title=حاجز احتياطي
actors.hero.talent.backup_barrier.desc=_+1:_ يكسب الساحر _3 حماية_ كلما أنفق آخر شحنة في صولجانه.
_+2:_ يكسب الساحر _5 حماية_ كلما أنفق آخر شحنة في صولجانه.
actors.hero.talent.backup_barrier.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستُفعّل بدلاً من ذلك من عصا البطل ذات المستوى الأعلى.
actors.hero.talent.energizing_meal.title=وجبة منشطة
actors.hero.talent.energizing_meal.desc=_+1:_ تناول الطعام يأخذ من الساحر دوراً واحداً ويمنحه _5 أدوار من إعادة شحن العصي_.
_+2:_ تناول الطعام يأخذ من الساحر دوراً واحداً ويمنحه _8 أدوار من إعادة شحن العصي_.
actors.hero.talent.inscribed_power.title=قوة منقوشة
actors.hero.talent.inscribed_power.desc=_+1:_ عندما يقرأ الساحر لفافة أو يستخدم غرض تعويذة، _إطلاقا العصا التاليان_ له يكسبان +2 مستوى.
_+2:_ عندما يقرأ الساحر لفافة أو يستخدم غرض تعويذة، _الإطلاقات الثلاثة التالية_ لعصاه تكسب +2 مستوى.
يتضاعف عدد الإطلاقات المعززة عند استخدام لفافة ترقية أو تحول، أو أغراض الخيمياء التي يجب صنعها باستخدام تلك اللفافات.
لأغراض الخيمياء ذات كميات الإنتاج الأعلى )مثل معظم التعويذات(، لدى هذه الموهبة فرصة للتفعيل بناءً على عدد ذلك الغرض المنتج.
actors.hero.talent.wand_preservation.title=حفظ العصي
actors.hero.talent.wand_preservation.desc=_+1:_ عندما يحقن الساحر عصا جديدة في صولجانه، تُعاد العصا القديمة عند +0، _لكن يمكن فعل هذا مرة واحدة فقط._
_+2:_ عندما يحقن الساحر عصا جديدة في صولجانه، تُعاد العصا القديمة عند +0، _يمكن تكرار هذا بتهدئة مستوى بطل واحد._
actors.hero.talent.wand_preservation.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستزيد بدلاً من ذلك كمية الراتنج السحري المكتسبة عند وضع عصا في قدر الخيمياء بمقدار 1 عند +1، أو بمقدار 2 عند +2.
actors.hero.talent.arcane_vision.title=رؤية سحرية
actors.hero.talent.arcane_vision.desc=_+1:_ عندما يطلق الساحر على عدو، يكسب رؤية عقول عليه لـ_10 أدوار_.
_+2:_ عندما يطلق الساحر على عدو، يكسب رؤية عقول عليه لـ_15 دوراً_.
actors.hero.talent.shield_battery.title=بطارية درعية
actors.hero.talent.shield_battery.desc=_+1:_ يمكن للساحر استهداف نفسه بعصا لتحويل كل شحناتها إلى حماية بمعدل _4% من الصحة القصوى لكل شحنة_.
_+2:_ يمكن للساحر استهداف نفسه بعصا لتحويل كل شحناتها إلى حماية بمعدل _6% من الصحة القصوى لكل شحنة_.
actors.hero.talent.desperate_power.title=قوة يائسة
actors.hero.talent.desperate_power.desc=_+1:_ عصي الساحر وصلجانه تكسب _+1 مستوى_ في إطلاقها الأخير عندما تبقى على شحنتها الأخيرة.
_+2:_ عصي الساحر وصلجانه تكسب _+2 مستوى_ في إطلاقها الأخير عندما تبقى على شحنتها الأخيرة.
_+3:_ عصي الساحر وصلجانه تكسب _+3 مستوى_ في إطلاقها الأخير عندما تبقى على شحنتها الأخيرة.
actors.hero.talent.ally_warp.title=انتقال الحليف
actors.hero.talent.ally_warp.desc=_+1:_ يمكن للساحر اختيار حليف لتبديل الأماكن معه فوراً، بمدى _بلاطتين_.
_+2:_ يمكن للساحر اختيار حليف لتبديل الأماكن معه فوراً، بمدى _4 بلاطات_.
_+3:_ يمكن للساحر اختيار حليف لتبديل الأماكن معه فوراً، بمدى _6 بلاطات_.
لا يمكن للساحر تبديل الأماكن مع حلفاء غير قادرين على الحركة.
actors.hero.talent.empowered_strike.title=ضربة ممكّنة
actors.hero.talent.empowered_strike.desc=_+1:_ أول ضربة قريبة للساحر الحربي بصولجانه بعد الإطلاق به توجه _+16% ضرر_ ويكسب تأثير الصولجان الإضافي _+50% قوة_.
_+2:_ أول ضربة قريبة للساحر الحربي بصولجانه بعد الإطلاق به توجه _+33% ضرر_ ويكسب تأثير الصولجان الإضافي _+100% قوة_.
_+3:_ أول ضربة قريبة للساحر الحربي بصولجانه بعد الإطلاق به توجه _+50% ضرر_ ويكسب تأثير الصولجان الإضافي _+150% قوة_.
actors.hero.talent.mystical_charge.title=شحنة صوفية
actors.hero.talent.mystical_charge.desc=_+1:_ الضرب بالصولجان يمنح الساحر الحربي _0.5 دور_ من إعادة شحن القطع الأثرية.
_+2:_ الضرب بالصولجان يمنح الساحر الحربي _دوراً واحداً_ من إعادة شحن القطع الأثرية.
_+3:_ الضرب بالصولجان يمنح الساحر الحربي _1.5 دور_ من إعادة شحن القطع الأثرية.
actors.hero.talent.excess_charge.title=شحنة فائضة
actors.hero.talent.excess_charge.desc=_+1:_ عندما يكون صولجان الساحر الحربي مشحوناً بالكامل، إطلاقه التالي يمنحه _0.67 حماية_ لكل مستوى من الصولجان.
_+2:_ عندما يكون صولجان الساحر الحربي مشحوناً بالكامل، إطلاقه التالي يمنحه _1.33 حماية_ لكل مستوى من الصولجان.
_+3:_ عندما يكون صولجان الساحر الحربي مشحوناً بالكامل، إطلاقه التالي يمنحه _2 حماية_ لكل مستوى من الصولجان.
actors.hero.talent.soul_siphon.title=شفط الأرواح
actors.hero.talent.soul_siphon.desc=_+1:_ الضرر الجسدي الموجه من شخصيات أخرى يفعّل علامة روح الساحر المظلم بفعالية _13%_.
_+2:_ الضرر الجسدي الموجه من شخصيات أخرى يفعّل علامة روح الساحر المظلم بفعالية _27%_.
_+3:_ الضرر الجسدي الموجه من شخصيات أخرى يفعّل علامة روح الساحر المظلم بفعالية _40%_.
actors.hero.talent.soul_eater.title=آكل الأرواح
actors.hero.talent.soul_eater.desc=_+1:_ علامة الروح تمنح _0.33 دور_ من الشبع لكل ضرر جسدي موجه. الأعداء المعلمون بعلامة الروح لديهم _فرصة 10%_ لتفعيل تأثيرات عند الأكل عند موتهم.
_+2:_ علامة الروح تمنح _0.67 دور_ من الشبع لكل ضرر جسدي موجه. الأعداء المعلمون بعلامة الروح لديهم _فرصة 20%_ لتفعيل تأثيرات عند الأكل عند موتهم.
_+3:_ علامة الروح تمنح _دوراً واحداً_ من الشبع لكل ضرر جسدي موجه. الأعداء المعلمون بعلامة الروح لديهم _فرصة 30%_ لتفعيل تأثيرات عند الأكل عند موتهم.
actors.hero.talent.necromancers_minions.title=أتباع النيكرومانسر
actors.hero.talent.necromancers_minions.desc=_+1:_ عندما يموت عدو معلم بعلامة الروح، لدى الساحر المظلم _فرصة 13%_ لإقامته كشبح فاسد.
_+2:_ عندما يموت عدو معلم بعلامة الروح، لدى الساحر المظلم _فرصة 27%_ لإقامته كشبح فاسد.
_+3:_ عندما يموت عدو معلم بعلامة الروح، لدى الساحر المظلم _فرصة 40%_ لإقامته كشبح فاسد.
actors.hero.talent.blast_radius.title=نصف قطر الانفجار
actors.hero.talent.blast_radius.desc=_+1:_ يزداد نصف قطر الانفجار العنصري إلى _5 بلاطات_، من 4.
_+2:_ يزداد نصف قطر الانفجار العنصري إلى _6 بلاطات_، من 4.
_+3:_ يزداد نصف قطر الانفجار العنصري إلى _7 بلاطات_، من 4.
_+4:_ يزداد نصف قطر الانفجار العنصري إلى _8 بلاطات_، من 4.
actors.hero.talent.elemental_power.title=قوة عنصرية
actors.hero.talent.elemental_power.desc=_+1:_ تزداد قوة الانفجار العنصري بنسبة _25%_.
_+2:_ تزداد قوة الانفجار العنصري بنسبة _50%_.
_+3:_ تزداد قوة الانفجار العنصري بنسبة _75%_.
_+4:_ تزداد قوة الانفجار العنصري بنسبة _100%_.
actors.hero.talent.reactive_barrier.title=حاجز تفاعلي
actors.hero.talent.reactive_barrier.desc=_+1:_ يكسب الساحر _2.5 حماية_ لكل شخصية متأثرة بالانفجار العنصري، بحد أقصى 5 شخصيات.
_+2:_ يكسب الساحر _5 حماية_ لكل شخصية متأثرة بالانفجار العنصري، بحد أقصى 6 شخصيات.
_+3:_ يكسب الساحر _7.5 حماية_ لكل شخصية متأثرة بالانفجار العنصري، بحد أقصى 7 شخصيات.
_+4:_ يكسب الساحر _10 حماية_ لكل شخصية متأثرة بالانفجار العنصري، بحد أقصى 8 شخصيات.
actors.hero.talent.wild_power.title=قوة برية
actors.hero.talent.wild_power.desc=_+1:_ عند استخدام السحر البري، تُعزز العصي بمقدار _2 أو 3، حتى +4_.
_+2:_ عند استخدام السحر البري، تُعزز العصي بمقدار _3، حتى +5_.
_+3:_ عند استخدام السحر البري، تُعزز العصي بمقدار _3 أو 4، حتى +6_.
_+4:_ عند استخدام السحر البري، تُعزز العصي بمقدار _4، حتى +7_.
actors.hero.talent.fire_everything.title=أطلق كل شيء
actors.hero.talent.fire_everything.desc=_+1:_ السحر البري يطلق الآن _5 مرات_ بدلاً من 4، ولكل عصا _فرصة 25%_ لتكون قابلة للاستخدام 3 مرات.
_+2:_ السحر البري يطلق الآن _6 مرات_ بدلاً من 4، ولكل عصا _فرصة 50%_ لتكون قابلة للاستخدام 3 مرات.
_+3:_ السحر البري يطلق الآن _7 مرات_ بدلاً من 4، ولكل عصا _فرصة 75%_ لتكون قابلة للاستخدام 3 مرات.
_+4:_ السحر البري يطلق الآن _8 مرات_ بدلاً من 4، ولكل عصا _فرصة 100%_ لتكون قابلة للاستخدام 3 مرات.
actors.hero.talent.conserved_magic.title=سحر محفوظ
actors.hero.talent.conserved_magic.desc=_+1:_ كل إطلاق من السحر البري يستخدم الآن _0.33 شحنة_ بدلاً من 0.5، والسحر البري لديه _فرصة 25%_ لعدم استهلاك دور.
_+2:_ كل إطلاق من السحر البري يستخدم الآن _0.225 شحنة_ بدلاً من 0.5، والسحر البري لديه _فرصة 50%_ لعدم استهلاك دور.
_+3:_ كل إطلاق من السحر البري يستخدم الآن _0.15 شحنة_ بدلاً من 0.5، والسحر البري لديه _فرصة 75%_ لعدم استهلاك دور.
_+4:_ كل إطلاق من السحر البري يستخدم الآن _0.1 شحنة_ بدلاً من 0.5، والسحر البري لديه _فرصة 100%_ لعدم استهلاك دور.
actors.hero.talent.telefrag.title=سحق انتقالي
actors.hero.talent.telefrag.desc=_+1:_ إذا انتقل الساحر داخل شخصية أخرى يوجه لها _10-15 ضرر_، لكنه يتلقى أيضاً _5 ضرر_.
_+2:_ إذا انتقل الساحر داخل شخصية أخرى يوجه لها _20-30 ضرر_، لكنه يتلقى أيضاً _10 ضرر_.
_+3:_ إذا انتقل الساحر داخل شخصية أخرى يوجه لها _30-45 ضرر_، لكنه يتلقى أيضاً _15 ضرر_.
_+4:_ إذا انتقل الساحر داخل شخصية أخرى يوجه لها _40-60 ضرر_، لكنه يتلقى أيضاً _20 ضرر_.
لا يمكن قتل البطل بواسطة هذه الموهبة، ويمكن خفض الضرر الذاتي بتأثيرات مقاومة السحر.
actors.hero.talent.remote_beacon.title=منارة عن بعد
actors.hero.talent.remote_beacon.desc=_+1:_ يمكن للساحر وضع منارة في أي موقع ضمن _4 بلاطات_.
_+2:_ يمكن للساحر وضع منارة في أي موقع ضمن _8 بلاطات_.
_+3:_ يمكن للساحر وضع منارة في أي موقع ضمن _12 بلاطة_.
_+4:_ يمكن للساحر وضع منارة في أي موقع ضمن _16 بلاطة_.
لا يمكن للساحر وضع منارات في مواقع غير قابلة للوصول.
actors.hero.talent.longrange_warp.title=انتقال بعيد المدى
actors.hero.talent.longrange_warp.desc=_+1:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحنة _150%_.
_+2:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحنة _117%_.
_+3:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحنة _83%_.
_+4:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحنة _50%_.
لا يمكن للساحر استخدام الانتقال بعيد المدى لمغادرة طابق مقفل.
#huntress
actors.hero.talent.natures_bounty.title=وفرة الطبيعة
actors.hero.talent.natures_bounty.desc=_+1:_ يمكن للصيادة العثور على _4 توتات_ مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.
_+2:_ يمكن للصيادة العثور على _6 توتات_ مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.
التوتات تُؤكل بسرعة، وتعيد كمية صغيرة من الشبع، وقد تحتوي على بذرة قابلة للاستخدام.
actors.hero.talent.survivalists_intuition.title=حدس البقاء
actors.hero.talent.survivalists_intuition.desc=_+1:_ تعرف الصيادة أسلحة الرمي _أسرع بـ3 مرات_.
_+2:_ تعرف الصيادة أسلحة الرمي _عندما تصيب بها_.
actors.hero.talent.followup_strike.title=ضربة متابعة
actors.hero.talent.followup_strike.desc=_+1:_ عندما تصيب الصيادة عدواً بقوسها أو سلاح رمي، هجومها القريب التالي ضد نفس العدو يوجه _ضرراً إضافياً بمقدار 2_.
_+2:_ عندما تصيب الصيادة عدواً بقوسها أو سلاح رمي، هجومها القريب التالي ضد نفس العدو يوجه _ضرراً إضافياً بمقدار 3_.
actors.hero.talent.natures_aid.title=عون الطبيعة
actors.hero.talent.natures_aid.desc=_+1:_ تكتسب الصيادة 0-2 درع من الجلد الشجري، والذي يتلاشى كل _3 أدوار_ عندما يُفعّل تأثير نبتة في مجال رؤيتها.
_+2:_ تكتسب الصيادة 0-2 درع من الجلد الشجري، والذي يتلاشى كل _5 أدوار_ عندما يُفعّل تأثير نبتة في مجال رؤيتها.
actors.hero.talent.invigorating_meal.title=وجبة منعشة
actors.hero.talent.invigorating_meal.desc=_+1:_ تناول الطعام يأخذ من الصيادة دوراً واحداً )التوتات تُؤكل فوراً( ويمنحها _دوراً واحداً من العجلة_.
_+2:_ تناول الطعام يأخذ من الصيادة دوراً واحداً )التوتات تُؤكل فوراً( ويمنحها _دورين من العجلة_.
actors.hero.talent.liquid_nature.title=طبيعة سائلة
actors.hero.talent.liquid_nature.desc=_+1:_ عندما تشرب الصيارة أو ترمي جرعة، خليطاً، أو إكسيراً، _ينبت حتى 4 بلاطات عشب_ في المنطقة المحيطة، وتُجذر الأعداء الملاصقون لـ_دور واحد_.
_+2:_ عندما تشرب الصيادة أو ترمي جرعة، خليطاً، أو إكسيراً، _ينبت حتى 6 بلاطات عشب_ في المنطقة المحيطة، وتُجذر الأعداء الملاصقون لـ_دورين_.
تتضاعف كمية العشب ومدة التجذير عند استخدام جرعات القوة، الخبرة، أو أغراض الخيمياء التي يجب صنعها باستخدام تلك الجرعات.
لأغراض الخيمياء ذات كميات الإنتاج الأعلى )مثل الخليط المائي(، لدى هذه الموهبة فرصة للتفعيل بناءً على عدد ذلك الغرض المنتج.
actors.hero.talent.rejuvenating_steps.title=خطوات التجديد
actors.hero.talent.rejuvenating_steps.desc=_+1:_ عندما تخطو الصيادة على عشب قصير أو جمر، ينبت ليصبح عشباً طويلاً والذي تحرثه الصيادة فوراً. لهذه الموهبة _تهدئة 10 أدوار_.
_+2:_ عندما تخطو الصيادة على عشب قصير أو جمر، ينبت ليصبح عشباً طويلاً والذي تحرثه الصيادة فوراً. لهذه الموهبة _تهدئة 5 أدوار_.
ستنتج هذه الموهبة عشباً محروثاً إذا تم تعطيل تأثيرات التجدد السلبية أو إذا لم يكتسب البطل خبرة لفترة طويلة.
actors.hero.talent.heightened_senses.title=حواس حادة
actors.hero.talent.heightened_senses.desc=_+1:_ تكتسب الصيادة رؤية العقول على الشخصيات ضمن _بلاطتين من موقعها_.
_+2:_ تكتسب الصيادة رؤية العقول على الشخصيات ضمن _3 بلاطات من موقعها_.
actors.hero.talent.durable_projectiles.title=مقذوفات متينة
actors.hero.talent.durable_projectiles.desc=_+1:_ أسلحة الرمي تمتلك _متانة إضافية بنسبة 50%_ عندما تستخدمها الصيادة.
_+2:_ أسلحة الرمي تمتلك _متانة إضافية بنسبة 75%_ عندما تستخدمها الصيادة.
actors.hero.talent.point_blank.title=مدى الصفر
actors.hero.talent.point_blank.desc=_+1:_ عندما تستخدم الصيادة قوسها أو سلاح رمي في المدى القريب، تصبح دقتها _-25%_، بدلاً من -50%.
_+2:_ عندما تستخدم الصيادة قوسها أو سلاح رمي في المدى القريب، تصبح دقتها _عادية_، بدلاً من -50%.
_+3:_ عندما تستخدم الصيادة قوسها أو سلاح رمي في المدى القريب، تصبح دقتها _+25%_، بدلاً من -50%.
لاحظ أن أسلحة الرمي أو قوس الروح تمتلك دائماً دقة +50% عند استخدامها عن بُعد.
actors.hero.talent.seer_shot.title=طلقة العراف
actors.hero.talent.seer_shot.desc=_+1:_ عندما تطلق الصيادة سهماً على الأرض، يمنح رؤية في منطقة 3x3 حولها لـ_5 أدوار_. لهذه الموهبة تهدئة 20 دوراً.
_+2:_ عندما تطلق الصيادة سهماً على الأرض، يمنح رؤية في منطقة 3x3 حولها لـ_10 أدوار_. لهذه الموهبة تهدئة 20 دوراً.
_+3:_ عندما تطلق الصيادة سهماً على الأرض، يمنح رؤية في منطقة 3x3 حولها لـ_15 دوراً_. لهذه الموهبة تهدئة 20 دوراً.
actors.hero.talent.seer_shot.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستتفعل بدلاً من ذلك من أي سلاح رمي.
actors.hero.talent.farsight.title=نظر بعيد
actors.hero.talent.farsight.desc=_+1:_ مدى رؤية القناصة _يزداد بنسبة 25%_.
_+2:_ مدى رؤية القناصة _يزداد بنسبة 50%_.
_+3:_ مدى رؤية القناصة _يزداد بنسبة 75%_.
actors.hero.talent.shared_enchantment.title=سحر مشترك
actors.hero.talent.shared_enchantment.desc=_+1:_ أسلحة الرمي لديها _فرصة 33%_ لاستخدام السحر الموجود على قوس القناصة.
_+2:_ أسلحة الرمي لديها _فرصة 67%_ لاستخدام السحر الموجود على قوس القناصة.
_+3:_ أسلحة الرمي لديها _فرصة 100%_ لاستخدام السحر الموجود على قوس القناصة.
يمكن أن يتفعل سحر القوس بالإضافة إلى أي سحر يمتلكه سلاح الرمي بالفعل.
actors.hero.talent.shared_upgrades.title=ترقيات مشتركة
actors.hero.talent.shared_upgrades.desc=_+1:_ عندما تهاجم القناصة بسلاح رمي مرقى، كل مستوى يزيد مدة علامة القناص بمقدار دور واحد وضرر هجومها الخاص بنسبة 16%، بحد أقصى _دورين و+33% ضرر عند +2_.
_+2:_ عندما تهاجم القناصة بسلاح رمي مرقى، كل مستوى يزيد مدة علامة القناص بمقدار دور واحد وضرر هجومها الخاص بنسبة 16%، بحد أقصى _4 أدوار و+67% ضرر عند +4_.
_+3:_ عندما تهاجم القناصة بسلاح رمي مرقى، كل مستوى يزيد مدة علامة القناص بمقدار دور واحد وضرر هجومها الخاص بنسبة 16%، بحد أقصى _6 أدوار و+100% ضرر عند +6_.
actors.hero.talent.durable_tips.title=رؤوس متينة
actors.hero.talent.durable_tips.desc=_+1:_ السهام المغموسة تمتلك _متانة مضاعفة_ عندما تستخدمها الحارسة.
_+2:_ السهام المغموسة تمتلك _متانة 3 أضعاف_ عندما تستخدمها الحارسة.
_+3:_ السهام المغموسة تمتلك _متانة 4 أضعاف_ عندما تستخدمها الحارسة.
actors.hero.talent.barkskin.title=جلد شجري
actors.hero.talent.barkskin.desc=_+1:_ عندما تخطو الحارسة في العشب، تكتسب درعاً شجرياً بنسبة _0-50% من مستواها_ والذي يتلاشى كل دور.
_+2:_ عندما تخطو الحارسة في العشب، تكتسب درعاً شجرياً بنسبة _0-100% من مستواها_ والذي يتلاشى كل دور.
_+3:_ عندما تخطو الحارسة في العشب، تكتسب درعاً شجرياً بنسبة _0-150% من مستواها_ والذي يتلاشى كل دور.
actors.hero.talent.shielding_dew.title=ندى واقي
actors.hero.talent.shielding_dew.desc=_+1:_ قطرات الندى يمكنها حماية الحارسة عندما تكون صحتها كاملة، بحد أقصى _20% من صحتها القصوى_.
_+2:_ قطرات الندى يمكنها حماية الحارسة عندما تكون صحتها كاملة، بحد أقصى _40% من صحتها القصوى_.
_+3:_ قطرات الندى يمكنها حماية الحارسة عندما تكون صحتها كاملة، بحد أقصى _60% من صحتها القصوى_.
actors.hero.talent.fan_of_blades.title=مروحة الشفرات
actors.hero.talent.fan_of_blades.desc=_+1:_ الشفرات الطيفية يمكنها إصابة _هدف إضافي واحد_ بنسبة 50% من الضرر. يجب أن يكون الهدف مرئياً وضمن مخروط بزاوية _30 درجة_.
_+2:_ الشفرات الطيفية يمكنها إصابة _هدفين إضافيين_ بنسبة 50% من الضرر. يجب أن تكون الأهداف مرئية وضمن مخروط بزاوية _60 درجة_.
_+3:_ الشفرات الطيفية يمكنها إصابة _3 أهداف إضافية_ بنسبة 50% من الضرر. يجب أن تكون الأهداف مرئية وضمن مخروط بزاوية _90 درجة_.
_+4:_ الشفرات الطيفية يمكنها إصابة _4 أهداف إضافية_ بنسبة 50% من الضرر. يجب أن تكون الأهداف مرئية وضمن مخروط بزاوية _120 درجة_.
actors.hero.talent.projecting_blades.title=شفرات ممتدة
actors.hero.talent.projecting_blades.desc=_+1:_ الشفرات الطيفية تمتلك _دقة إضافية بنسبة 25%_، ويمكنها اختراق حتى _بلاطتين صلبتين_.
_+2:_ الشفرات الطيفية تمتلك _دقة إضافية بنسبة 50%_، ويمكنها اختراق حتى _4 بلاطات صلبة_.
_+3:_ الشفرات الطيفية تمتلك _دقة إضافية بنسبة 75%_، ويمكنها اختراق حتى _6 بلاطات صلبة_.
_+4:_ الشفرات الطيفية تمتلك _دقة إضافية بنسبة 100%_، ويمكنها اختراق حتى _8 بلاطات صلبة_.
actors.hero.talent.spirit_blades.title=شفرات روحية
actors.hero.talent.spirit_blades.desc=_+1:_ الشفرات الطيفية لديها _فرصة 30%_ لاستخدام السحر الموجود على قوس الروح أيضاً.
_+2:_ الشفرات الطيفية لديها _فرصة 60%_ لاستخدام السحر الموجود على قوس الروح أيضاً.
_+3:_ الشفرات الطيفية لديها _فرصة 90%_ لاستخدام السحر الموجود على قوس الروح أيضاً.
_+4:_ الشفرات الطيفية لديها _فرصة 100%_ لاستخدام السحر الموجود على قوس الروح أيضاً، وتمنح كل سحر _قوة إضافية بنسبة 10%_.
actors.hero.talent.growing_power.title=قوة نامية
actors.hero.talent.growing_power.desc=_+1:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _38% و 125%_، من 33% و 100%.
_+2:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _42% و 150%_، من 33% و 100%.
_+3:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _46% و 175%_، من 33% و 100%.
_+4:_ تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة تزداد إلى _50% و 200%_، من 33% و 100%.
actors.hero.talent.natures_wrath.title=غضب الطبيعة
actors.hero.talent.natures_wrath.desc=_+1:_ أثناء نشاط قوة الطبيعة، طلقات قوس الروح لديها _فرصة 8%_ لتفعيل تأثير نبتة ضارة عشوائية.
_+2:_ أثناء نشاط قوة الطبيعة، طلقات قوس الروح لديها _فرصة 17%_ لتفعيل تأثير نبتة ضارة عشوائية.
_+3:_ أثناء نشاط قوة الطبيعة، طلقات قوس الروح لديها _فرصة 25%_ لتفعيل تأثير نبتة ضارة عشوائية.
_+4:_ أثناء نشاط قوة الطبيعة، طلقات قوس الروح لديها _فرصة 33%_ لتفعيل تأثير نبتة ضارة عشوائية.
النباتات التي يمكن تفعيلها هي: عشب العمى، زهرة النار، قبعة الجليد، طحلب الحزن، وكرومة العاصفة.
actors.hero.talent.wild_momentum.title=زخم بري
actors.hero.talent.wild_momentum.desc=_+1:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بـ_دور واحد_. يمكن تمديدDuration بحد أقصى _دورين_.
_+2:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بـ_دورين_. يمكن تمديد المدة بحد أقصى _4 أدوار_.
_+3:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بـ_3 أدوار_. يمكن تمديد المدة بحد أقصى _6 أدوار_.
_+4:_ قتل عدو بقوس الروح يطيل مدة قوة الطبيعة بـ_4 أدوار_. يمكن تمديد المدة بحد أقصى _8 أدوار_.
actors.hero.talent.eagle_eye.title=عين النسر
actors.hero.talent.eagle_eye.desc=_+1:_ مدى رؤية صقر الروح يزداد إلى _7 بلاطات_ من 6.
_+2:_ مدى رؤية صقر الروح يزداد إلى _8 بلاطات_ من 6.
_+3:_ مدى رؤية صقر الروح يزداد إلى _9 بلاطات_ من 6، ويكتسب _بلاطتين_ من رؤية العقول.
_+4:_ مدى رؤية صقر الروح يزداد إلى _10 بلاطات_ من 6، ويكتسب _3 بلاطات_ من رؤية العقول.
actors.hero.talent.go_for_the_eyes.title=استهدف العيون
actors.hero.talent.go_for_the_eyes.desc=_+1:_ هجمات صقر الروح تعمي الأعداء لـ_دورين_.
_+2:_ هجمات صقر الروح تعمي الأعداء لـ_5 أدوار_.
_+3:_ هجمات صقر الروح تعمي الأعداء لـ_5 أدوار_ وتصيبهم بالعرج لـ_دورين_.
_+4:_ هجمات صقر الروح تعمي الأعداء لـ_5 أدوار_ وتصيبهم بالعرج لـ_5 أدوار_.
actors.hero.talent.swift_spirit.title=روح سريعة
actors.hero.talent.swift_spirit.desc=_+1:_ سرعة حركة صقر الروح تزداد إلى _2.5 بلاطة_ من 2، وهو مضمون لمراوغة أول _هجومين_ ضده.
_+2:_ سرعة حركة صقر الروح تزداد إلى _3 بلاطات_ من 2، وهو مضمون لمراوغة أول _4 هجمات_ ضده.
_+3:_ سرعة حركة صقر الروح تزداد إلى _3.5 بلاطة_ من 2، وهو مضمون لمراوغة أول _6 هجمات_ ضده.
_+4:_ سرعة حركة صقر الروح تزداد إلى _4 بلاطات_ من 2، وهو مضمون لمراوغة أول _8 هجمات_ ضده.
#duelist
actors.hero.talent.strengthening_meal.title=وجبة مقوية
actors.hero.talent.strengthening_meal.desc=_+1:_ تناول الطعام يمنح المبارزة 3 ضرر إضافي في _المرتين التاليتين_ التي تصيب فيها عدواً بهجوم جسدي.
_+2:_ تناول الطعام يمنح المبارزة 3 ضرر إضافي في _المرات الثلاث التالية_ التي تصيب فيها عدواً بهجوم جسدي.
actors.hero.talent.adventurers_intuition.title=حدس المغامر
actors.hero.talent.adventurers_intuition.desc=_+1:_ تعرف المبارزة الأسلحة _أسرع بـ2.5 مرة_ والدروع _أسرع بـ1.75 مرة_.
_+2:_ تعرف المبارزة الأسلحة _عندما تجهزها_ والدروع _أسرع بـ2.5 مرة_.
actors.hero.talent.patient_strike.title=ضربة صبورة
actors.hero.talent.patient_strike.desc=_+1:_ إذا انتظرت المبارزة قبل تنفيذ هجوم قريب، ستوجه _1-2 ضرر إضافي_.
_+2:_ إذا انتظرت المبارزة قبل تنفيذ هجوم قريب، ستوجه _ضرراً إضافياً بمقدار 2_.
actors.hero.talent.aggressive_barrier.title=حاجز هجومي
actors.hero.talent.aggressive_barrier.desc=_+1:_ تكتسب المبارزة _3 حماية_ عندما تستخدم قدرة سلاح وتكون صحتها 50% أو أقل.
_+2:_ تكتسب المبارزة _5 حماية_ عندما تستخدم قدرة سلاح وتكون صحتها 50% أو أقل.
actors.hero.talent.aggressive_barrier.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنح بدلاً من ذلك حماية عند تنفيذ هجوم قريب والصحة منخفضة، مع تهدئة 50 دوراً.
actors.hero.talent.focused_meal.title=وجبة مركزة
actors.hero.talent.focused_meal.desc=_+1:_ تناول الطعام يأخذ من المبارزة دوراً واحداً ويمنحها _0.67 شحنة_ على أسلحتها.
_+2:_ تناول الطعام يأخذ من المبارزة دوراً واحداً ويمنحها _شحنة واحدة_ على أسلحتها.
actors.hero.talent.focused_meal.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنح بدلاً من ذلك ضرراً إضافياً لضربتهم التالية يساوي مستواهم/3 عند +1، أو مستواهم/2 عند +2.
actors.hero.talent.liquid_agility.title=رشاقة سائلة
actors.hero.talent.liquid_agility.desc=_+1:_ عند شرب أو رمي جرعة، خليط، أو إكسير، تمتلك المبارزة _مراوغة مضاعفة 3 مرات_، ولديها _دقة مضاعفة 3 مرات_ في هجومها القريب التالي خلال 5 أدوار.
_+2:_ عند شرب أو رمي جرعة، خليط، أو إكسير، تمتلك المبارزة _مراوغة لا نهائية_، ولديها _دقة لا نهائية_ في هجومها القريب التالي خلال 5 أدوار.
يستمر هذا التعزيز لدور وهجوم إضافيين عند استخدام جرعات القوة، الخبرة، أو أغراض الخيمياء التي يجب صنعها باستخدام تلك الجرعات.
لأغراض الخيمياء ذات كميات الإنتاج الأعلى )مثل الخليط المائي(، لدى هذه الموهبة فرصة للتفعيل بناءً على عدد ذلك الغرض المنتج.
actors.hero.talent.weapon_recharging.title=إعادة شحن السلاح
actors.hero.talent.weapon_recharging.desc=_+1:_ تكتسب المبارزة شحنة سلاح واحدة كل _15 دوراً_ عندما تكون تحت تأثير تعزيزات إعادة شحن العصي أو القطع الأثرية.
_+2:_ تكتسب المبارزة شحنة سلاح واحدة كل _10 أدوار_ عندما تكون تحت تأثير تعزيزات إعادة شحن العصي أو القطع الأثرية.
actors.hero.talent.weapon_recharging.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستسبب بدلاً من ذلك توجيههم لضرر قريب إضافي بنسبة 5% أثناء إعادة الشحن عند +1، أو 7.5% عند +2.
actors.hero.talent.lethal_haste.title=عجلة قاتلة
actors.hero.talent.lethal_haste.desc=_+1:_ عندما توجه المبارزة ضربة قاضية لعدو بقدرة سلاح، تكتسب حركة فورية لمدة _3 أدوار_.
_+2:_ عندما توجه المبارزة ضربة قاضية لعدو بقدرة سلاح، تكتسب حركة فورية لمدة _5 أدوار_.
actors.hero.talent.lethal_haste.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستتفعل بدلاً من ذلك مع هجمات السلاح العادية، مع تهدئة 100 دور.
actors.hero.talent.swift_equip.title=تجهيز سريع
actors.hero.talent.swift_equip.desc=_+1:_ يمكن للمبارزة تبديل سلاحها المجهز فوراً _مرة واحدة_ كل 20 دوراً.
_+2:_ يمكن للمبارزة تبديل سلاحها المجهز فوراً _مرتين_ كل 20 دوراً.
إذا كانت المبارزة تمتلك هذه الموهبة ولم تكن في فترة التهدئة، فإن الاستخدام السريع لسلاح غير مجهز سيقوم بتجهيزه.
actors.hero.talent.precise_assault.title=هجوم دقيق
actors.hero.talent.precise_assault.desc=_+1:_ عندما تستخدم المبارزة قدرة سلاح، تكتسب _دقة مضاعفة_ في هجومها القريب التالي خلال 5 أدوار.
_+2:_ عندما تستخدم المبارزة قدرة سلاح، تكتسب _دقة مضاعفة 5 مرات_ في هجومها القريب التالي خلال 5 أدوار.
_+3:_ عندما تستخدم المبارزة قدرة سلاح، تكتسب _دقة لا نهائية_ في هجومها القريب التالي خلال 5 أدوار.
actors.hero.talent.precise_assault.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستزيد بدلاً من ذلك دقة الهجوم القريب بنسبة 10% عند +1، 20% عند +2، أو 30% عند +3.
actors.hero.talent.deadly_followup.title=متابعة قاتلة
actors.hero.talent.deadly_followup.desc=_+1:_ عندما تصيب المبارزة عدواً بسلاح رمي، ستوجه _ضرراً قريباً أكثر بنسبة 10%_ ضده لمدة 5 أدوار.
_+2:_ عندما تصيب المبارزة عدواً بسلاح رمي، ستوجه _ضرراً قريباً أكثر بنسبة 20%_ ضده لمدة 5 أدوار.
_+3:_ عندما تصيب المبارزة عدواً بسلاح رمي، ستوجه _ضرراً قريباً أكثر بنسبة 30%_ ضده لمدة 5 أدوار.
actors.hero.talent.varied_charge.title=شحنة متنوعة
actors.hero.talent.varied_charge.desc=_+1:_ تستعيد البطلة فوراً _0.17 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.
_+2:_ تستعيد البطلة فوراً _0.33 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.
_+3:_ تستعيد البطلة فوراً _0.5 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.
actors.hero.talent.twin_upgrades.title=ترقيات توأم
actors.hero.talent.twin_upgrades.desc=_+1:_ إذا كان أحد سلاحين مجهزين لدى البطلة مستوى أقل وهو _أقل بفئتين أو أكثر_ من السلاح الآخر، فسيُعزز إلى مستوى السلاح الآخر.
_+2:_ إذا كان أحد سلاحين مجهزين لدى البطلة مستوى أقل وهو _أقل بفئة واحدة أو أكثر_ من السلاح الآخر، فسيُعزز إلى مستوى السلاح الآخر.
_+3:_ إذا كان أحد سلاحين مجهزين لدى البطلة مستوى أقل وهو _من نفس الفئة أو أقل_ من السلاح الآخر، فسيُعزز إلى مستوى السلاح الآخر.
actors.hero.talent.combined_lethality.title=فتك مشترك
actors.hero.talent.combined_lethality.desc=_+1:_ إذا هاجمت البطلة بسلاح قريب فوراً بعد استخدام قدرة سلاح مختلف، فسيُعدم هذا الهجوم أي عدو غير زعيم تبقى على _صحة أقل من 13%_.
_+2:_ إذا هاجمت البطلة بسلاح قريب فوراً بعد استخدام قدرة سلاح مختلف، فسيُعدم هذا الهجوم أي عدو غير زعيم تبقى على _صحة أقل من 27%_.
_+3:_ إذا هاجمت البطلة بسلاح قريب فوراً بعد استخدام قدرة سلاح مختلف، فسيُعدم هذا الهجوم أي عدو غير زعيم تبقى على _صحة أقل من 40%_.
يمكن أن يكون هذا الهجوم هجوماً قريباً عادياً، أو جزءاً من قدرة سلاح.
actors.hero.talent.unencumbered_spirit.title=روح غير مثقلة
actors.hero.talent.unencumbered_spirit.desc=_+1:_ تكتسب الراهبة _طاقة أكثر بنسبة 50%_ لكل قطعة معدات من _الفئة 3 أو أقل_ تستخدمها.
_+2:_ تكتسب الراهبة _طاقة أكثر بنسبة 75%_ لكل قطعة معدات من _الفئة 2 أو أقل_ تستخدمها. فائدة الفئة 3 تبقى دون تغيير.
_+3:_ تكتسب الراهبة _طاقة أكثر بنسبة 100%_ لكل قطعة معدات من _الفئة 1 أو أقل_ تستخدمها. فوائد الفئتين 2 و 3 تبقى دون تغيير. تكتسب أيضاً درع قماش وقفازات مرصعة مجاناً.
لاحظ أن هذه الموهبة لا تمنح أي فائدة من كونك أعزل أو الهجوم بخاتم القوة.
actors.hero.talent.monastic_vigor.title=حيوية رهبانية
actors.hero.talent.monastic_vigor.desc=_+1:_ إذا كان لدى الراهبة _100% طاقة_، فإن قدراتها تُمكن.
_+2:_ إذا كان لدى الراهبة _80% طاقة أو أكثر_، فإن قدراتها تُمكن.
_+3:_ إذا كان لدى الراهبة _60% طاقة أو أكثر_، فإن قدراتها تُمكن.
عند التمكين:
- الوابل يطبق سحر سلاحك
- التركيز فوري
- الاندفاع يكتسب +4 مدى
- ركلة التنين توجه +50% ضرر وتطبق تأثير القذف والشلل على كل الأعداء الملاصقين
- التأمل يشفي ببطء 20% من الصحة المفقودة ويمنح 80% مقاومة ضرر.
actors.hero.talent.combined_energy.title=طاقة مشتركة
actors.hero.talent.combined_energy.desc=_+1:_ إذا استخدمت الراهبة قدرة سلاح وقدرة تتطلب _4 طاقة أو أكثر_ خلال 5 أدوار من بعضها، تستعيد طاقة واحدة مُنفقة.
_+2:_ إذا استخدمت الراهبة قدرة سلاح وقدرة تتطلب _3 طاقة أو أكثر_ خلال 5 أدوار من بعضها، تستعيد طاقة واحدة مُنفقة.
_+3:_ إذا استخدمت الراهبة قدرة سلاح وقدرة تتطلب _2 طاقة أو أكثر_ خلال 5 أدوار من بعضها، تستعيد طاقة واحدة مُنفقة.
actors.hero.talent.close_the_gap.title=سد الفجوة
actors.hero.talent.close_the_gap.desc=_+1:_ تومض المبارزة _حتى بلاطتين_ نحو هدفها عند بدء مبارزة.
_+2:_ تومض المبارزة _حتى 3 بلاطات_ نحو هدفها عند بدء مبارزة.
_+3:_ تومض المبارزة _حتى 4 بلاطات_ نحو هدفها عند بدء مبارزة.
_+4:_ تومض المبارزة _حتى 5 بلاطات_ نحو هدفها عند بدء مبارزة.
يمكن لهذا الوميض تجاوز المخاطر والأعداء، لكن ليس التضاريس الصلبة مثل الجدران. يُؤخذ الوميض في الاعتبار عند تحديد ما إذا كان العدو في المدى ليتم تحديه.
actors.hero.talent.invigorating_victory.title=انتصار منعش
actors.hero.talent.invigorating_victory.desc=_+1:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، تشفى بـ_5 صحة زائد 30% من الضرر_ الذي تلقته أثناء المبارزة.
_+2:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، تشفى بـ_10 صحة زائد 50% من الضرر_ الذي تلقته أثناء المبارزة.
_+3:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، تشفى بـ_15 صحة زائد 65% من الضرر_ الذي تلقته أثناء المبارزة.
_+4:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، تشفى بـ_20 صحة زائد 75% من الضرر_ الذي تلقته أثناء المبارزة.
actors.hero.talent.elimination_match.title=مباراة إقصاء
actors.hero.talent.elimination_match.desc=_+1:_ إذا تحدت المبارزة مجدداً خلال 3 أدوار من انتهاء مبارزة، يكون لذلك التحدي _تكلفة شحنة مخفضة بنسبة 16%_.
_+2:_ إذا تحدت المبارزة مجدداً خلال 3 أدوار من انتهاء مبارزة، يكون لذلك التحدي _تكلفة شحنة مخفضة بنسبة 30%_.
_+3:_ إذا تحدت المبارزة مجدداً خلال 3 أدوار من انتهاء مبارزة، يكون لذلك التحدي _تكلفة شحنة مخفضة بنسبة 40%_.
_+4:_ إذا تحدت المبارزة مجدداً خلال 3 أدوار من انتهاء مبارزة، يكون لذلك التحدي _تكلفة شحنة مخفضة بنسبة 50%_.
actors.hero.talent.elemental_reach.title=مدى عنصري
actors.hero.talent.elemental_reach.desc=_+1:_ مدى الضربة العنصرية يزداد إلى _5 بلاطات_ من 4، وعرضها يزداد إلى _75 درجة_ من 65.
_+2:_ مدى الضربة العنصرية يزداد إلى _6 بلاطات_ من 4، وعرضها يزداد إلى _85 درجة_ من 65.
_+3:_ مدى الضربة العنصرية يزداد إلى _7 بلاطات_ من 4، وعرضها يزداد إلى _95 درجة_ من 65.
_+4:_ مدى الضربة العنصرية يزداد إلى _8 بلاطات_ من 4، وعرضها يزداد إلى _105 درجات_ من 65.
actors.hero.talent.striking_force.title=قوة ضاربة
actors.hero.talent.striking_force.desc=_+1:_ قوة تأثير الضربة العنصرية تزداد بنسبة _30%_.
_+2:_ قوة تأثير الضربة العنصرية تزداد بنسبة _60%_.
_+3:_ قوة تأثير الضربة العنصرية تزداد بنسبة _90%_.
_+4:_ قوة تأثير الضربة العنصرية تزداد بنسبة _120%_.
actors.hero.talent.directed_power.title=قوة موجهة
actors.hero.talent.directed_power.desc=_+1:_ الهجوم المباشر من الضربة العنصرية يكتسب _قوة سحر إضافية بنسبة 30%_ لكل عدو في مدى تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.
_+2:_ الهجوم المباشر من الضربة العنصرية يكتسب _قوة سحر إضافية بنسبة 60%_ لكل عدو في مدى تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.
_+3:_ الهجوم المباشر من الضربة العنصرية يكتسب _قوة سحر إضافية بنسبة 90%_ لكل عدو في مدى تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.
_+4:_ الهجوم المباشر من الضربة العنصرية يكتسب _قوة سحر إضافية بنسبة 120%_ لكل عدو في مدى تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.
actors.hero.talent.feigned_retreat.title=تراجع مفتعل
actors.hero.talent.feigned_retreat.desc=_+1:_ إذا هاجم عدو الصورة اللاحقة للمبارزة، تكتسب _دورين_ من العجلة.
_+2:_ إذا هاجم عدو الصورة اللاحقة للمبارزة، تكتسب _4 أدوار_ من العجلة.
_+3:_ إذا هاجم عدو الصورة اللاحقة للمبارزة، تكتسب _6 أدوار_ من العجلة.
_+4:_ إذا هاجم عدو الصورة اللاحقة للمبارزة، تكتسب _8 أدوار_ من العجلة.
actors.hero.talent.expose_weakness.title=كشف الضعف
actors.hero.talent.expose_weakness.desc=_+1:_ الأعداء الذين يهاجمون الصورة اللاحقة للمبارزة يصبحون ضعفاء وهشين لـ_دورين_.
_+2:_ الأعداء الذين يهاجمون الصورة اللاحقة للمبارزة يصبحون ضعفاء وهشين لـ_4 أدوار_.
_+3:_ الأعداء الذين يهاجمون الصورة اللاحقة للمبارزة يصبحون ضعفاء وهشين لـ_6 أدوار_.
_+4:_ الأعداء الذين يهاجمون الصورة اللاحقة للمبارزة يصبحون ضعفاء وهشين لـ_8 أدوار_.
actors.hero.talent.counter_ability.title=قدرة مضادة
actors.hero.talent.counter_ability.desc=_+1:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فوراً _0.38 شحنة_.
_+2:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فوراً _0.77 شحنة_.
_+3:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فوراً _1.13 شحنة_.
_+4:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من مهاجمة صورتها اللاحقة، ستستعيد فوراً _1.5 شحنة_.
#cleric
actors.hero.talent.satiated_spells.title=تعويذات الشبع
actors.hero.talent.satiated_spells.desc=_+1:_ تناول الطعام يجعل الكاهن يكتسب _3 حماية_ في المرة التالية التي يلقي فيها تعويذة.
_+2:_ تناول الطعام يجعل الكاهن يكتسب _5 حماية_ في المرة التالية التي يلقي فيها تعويذة.
actors.hero.talent.satiated_spells.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنح بدلاً من ذلك حماية فوراً، والتي ستبدأ بالتلاشي طبيعياً بعد 10 أدوار.
actors.hero.talent.holy_intuition.title=حدس مقدس
actors.hero.talent.holy_intuition.desc=_+1:_ يمكن للكاهن إلقاء _الحدس المقدس_، تعويذة تكشف ما إذا كان الغرض ملعوناً بتكلفة _3 شحنات_.
_+2:_ يمكن للكاهن إلقاء _الحدس المقدس_، تعويذة تكشف ما إذا كان الغرض ملعوناً بتكلفة _شحنتين_.
actors.hero.talent.holy_intuition.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستتيح بدلاً من ذلك للبطل معرفة حالة اللعنة على غرض ملعون قبل تجهيزه مباشرة، بنسبة 15% من الوقت عند +1 أو 25% من الوقت عند +2.
actors.hero.talent.searing_light.title=ضوء حارق
actors.hero.talent.searing_light.desc=_+1:_ الهجمات الجسدية للكاهن على الأعداء المضاءين بواسطة _النور الهادي_ توجه _+3 ضرر_.
_+2:_ الهجمات الجسدية للكاهن على الأعداء المضاءين بواسطة _النور الهادي_ توجه _+5 ضرر_.
actors.hero.talent.searing_light.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنح بدلاً من ذلك ضررها الإضافي بعد استخدام عصا أو قطعة أثرية على عدو، مع تهدئة 20 دوراً.
actors.hero.talent.shield_of_light.title=درع الضوء
actors.hero.talent.shield_of_light.desc=_+1:_ يمكن للكاهن إلقاء _درع الضوء_، تعويذة تُلقى فوراً وتمنحه _2-4 درع_ ضد هدف لمدة 5 أدوار بتكلفة شحنة واحدة.
_+2:_ يمكن للكاهن إلقاء _درع الضوء_، تعويذة تُلقى فوراً وتمنحه _3-6 درع_ ضد هدف لمدة 5 أدوار بتكلفة شحنة واحدة.
actors.hero.talent.shield_of_light.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستقلل بدلاً من ذلك الضرر الجسدي المتلقى من عدوك المستهدف بمقدار 1، بنسبة 33% من الوقت عند +1 أو 50% من الوقت عند +2.
actors.hero.talent.enlightening_meal.title=وجبة منيرة
actors.hero.talent.enlightening_meal.desc=_+1:_ تناول الطعام يأخذ من الكاهن دوراً واحداً ويمنحه _0.67 شحنة_ على كتابه المقدس.
_+2:_ تناول الطعام يأخذ من الكاهن دوراً واحداً ويمنحه _شحنة واحدة_ على كتابه المقدس.
actors.hero.talent.enlightening_meal.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنح بدلاً من ذلك دورين من إعادة شحن العصي والقطع الأثرية عند +1، أو 3 أدوار عند +2. لا يمكن استخدام هذا لجعل قرن الوفرة يشحن نفسه.
actors.hero.talent.recall_inscription.title=استحضار النقش
actors.hero.talent.recall_inscription.refunded=تم استرداد غرضك!
actors.hero.talent.recall_inscription.desc=_+1:_ يمكن للكاهن إلقاء _استحضار النقش_، تعويذة تتيح له تكرار تأثير آخر حجر روني أو لفافة استخدمها خلال _10 أدوار_.
_+2:_ يمكن للكاهن إلقاء _استحضار النقش_، تعويذة تتيح له تكرار تأثير آخر حجر روني أو لفافة استخدمها خلال _300 دور_.
لا يمكن استخدام استحضار النقش مع لفافات الترقية. تكلفة شحنة هذه التعويذة تختلف بناءً على الغرض الذي استُخدم مؤخراً: 2 للحجر الروني، 3 للفافة، 4 للفافة الغريبة. تُضاعف تكلفة الشحنة هذه أيضاً عند استخدامها مع لفافة التحول، أو أغراض الخيمياء التي يجب صنعها باستخدام التحول أو الترقية.
actors.hero.talent.recall_inscription.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستسترد بدلاً من ذلك أي لفافة أو حجر روني بنسبة 10% من الوقت عند +1 أو 15% من الوقت عند +2. لفافات الترقية مستثناة من هذا التأثير.
actors.hero.talent.sunray.title=شعاع الشمس
actors.hero.talent.sunray.desc=_+1:_ يمكن للكاهن إلقاء _شعاع الشمس_، تعويذة توجه _4-8 ضرر_ وتعمي الهدف لـ_4 أدوار_، بتكلفة شحنة واحدة.
_+2:_ يمكن للكاهن إلقاء _شعاع الشمس_، تعويذة توجه _6-12 ضرر_ وتعمي الهدف لـ_6 أدوار_، بتكلفة شحنة واحدة.
يمكن لشعاع الشمس أن يعمي كل هدف مرة واحدة فقط، لكن إذا كان الهدف أعمى بالفعل بسبب شعاع الشمس فسيشله بدلاً من ذلك. شعاع الشمس يوجه دائماً ضرراً أقصى للأعداء الشيطانية والأموات أحياء.
actors.hero.talent.sunray.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستسبب بدلاً من ذلك أن تعمي العصي والقطع الأثرية الأعداء لـ4 أدوار، بنسبة 15% من الوقت عند +1 أو 25% من الوقت عند +2.
actors.hero.talent.divine_sense.title=حاسة إلهية
actors.hero.talent.divine_sense.desc=_+1:_ يمكن للكاهن إلقاء _الحاسة الإلهية_، تعويذة تمنحه _8 بلاطات_ من رؤية العقول لمدة 50 دوراً ولا تأخذ أي وقت للإلقاء، بتكلفة شحنتين.
_+2:_ يمكن للكاهن إلقاء _الحاسة الإلهية_، تعويذة تمنحه _12 بلاطة_ من رؤية العقول لمدة 50 دوراً ولا تأخذ أي وقت للإلقاء، بتكلفة شحنتين.
actors.hero.talent.divine_sense.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستمنحه بدلاً من ذلك رؤية العقول للحظة وجيزة بعد استخدام عصا أو قطعة أثرية بمدى 3 بلاطات عند +1 أو 5 بلاطات عند +2.
actors.hero.talent.bless.title=مباركة
actors.hero.talent.bless.desc=_+1:_ يمكن للكاهن إلقاء _المباركة_، تعويذة تمنح _6 أدوار من المباركة و10 حماية_ عند إلقائها على نفسه أو _10 أدوار من المباركة و10 شفاء_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.
_+2:_ يمكن للكاهن إلقاء _المباركة_، تعويذة تمنح _10 أدوار من المباركة و15 حماية_ عند إلقائها على نفسه أو _15 دوراً من المباركة و15 شفاء_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.
يُحول الشفاء الزائد من هذه التعويذة إلى حماية.
actors.hero.talent.bless.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستعزز بدلاً من ذلك الدقة والمراوغة للبطل وكل الحلفاء بنسبة 3% عند +1 أو 5% عند +2.
actors.hero.talent.cleanse.title=تطهير
actors.hero.talent.cleanse.desc=_+1:_ يمكن للكاهن إلقاء _التطهير_، تعويذة _تمسح تأثيرات الحالة السلبية_ من الكاهن وأي حلفاء قريبين، وتمنحهم _10 حماية_، بتكلفة شحنتين.
_+2:_ يمكن للكاهن إلقاء _التطهير_، تعويذة _تمنح 3 أدوار من حصانة التأثيرات السلبية_ للكاهن وأي حلفاء قريبين، وتمنحهم _20 حماية_، بتكلفة شحنتين.
_+3:_ يمكن للكاهن إلقاء _التطهير_، تعويذة _تمنح 5 أدوار من حصانة التأثيرات السلبية_ للكاهن وأي حلفاء قريبين، وتمنحهم _30 حماية_، بتكلفة شحنتين.
actors.hero.talent.cleanse.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستطهر بدلاً من ذلك تأثيرات الحالة السلبية على البطل بعد استخدام عصا أو قطعة أثرية، بنسبة 10/20/30% من الوقت عند +1/+2/+3.
actors.hero.talent.light_reading.title=قراءة الضوء
actors.hero.talent.light_reading.desc=_+1:_ يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزاً، لكنه يشحن بـ_سرعة 25%_ عندما يكون غير مجهز.
_+2:_ يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزاً، لكنه يشحن بـ_سرعة 50%_ عندما يكون غير مجهز.
_+3:_ يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزاً، لكنه يشحن بـ_سرعة 75%_ عندما يكون غير مجهز.
actors.hero.talent.light_reading.meta_desc=_إذا اكتُسبت هذه الموهبة من بطل آخر_ فستزيد بدلاً من ذلك سرعة شحن كل العصي بنسبة 7/13/20% عند +1/+2/+3.
actors.hero.talent.holy_lance.title=رمح مقدس
actors.hero.talent.holy_lance.desc=_+1:_ يمكن للقس إلقاء _الرمح المقدس_، تعويذة مدمرة توجه _30-55 ضرر_ بتكلفة 4 شحنات.
_+2:_ يمكن للقس إلقاء _الرمح المقدس_، تعويذة مدمرة توجه _45-83 ضرر_ بتكلفة 4 شحنات.
_+3:_ يمكن للقس إلقاء _الرمح المقدس_، تعويذة مدمرة توجه _60-110 ضرر_ بتكلفة 4 شحنات.
الرمح المقدس يوجه دائماً ضرراً أقصى للأعداء الشيطانية والأموات أحياء. الرمح المقدس لديه تهدئة 30 دوراً قبل أن يمكن إلقاؤه مجدداً.
actors.hero.talent.hallowed_ground.title=أرض مقدسة
actors.hero.talent.hallowed_ground.desc=_+1:_ يمكن للقس إلقاء _الأرض المقدسة_، تعويذة تقدس التضاريس في _منطقة 3x3_ لمدة 20 دوراً، بتكلفة شحنتين.
_+2:_ يمكن للقس إلقاء _الأرض المقدسة_، تعويذة تقدس التضاريس في _منطقة 5x5_ لمدة 20 دوراً، بتكلفة شحنتين.
_+3:_ يمكن للقس إلقاء _الأرض المقدسة_، تعويذة تقدس التضاريس في _منطقة 7x7_ لمدة 20 دوراً، بتكلفة شحنتين.
عند إلقائها، الأرض المقدسة تشفي الحلفاء بـ15 صحة، تجذر الأعداء وجيزاً، وتنشر عشباً قصيراً. بعد ذلك، تشفي الحلفاء ببطء، تسبب العرج للأعداء، وتسبب نمو العشب الطويل عشوائياً. الأرض المقدسة تمنح حماية للقس بدلاً من الشفاء وتُدمر بالنار.
actors.hero.talent.mnemonic_prayer.title=صلاة الذاكرة
actors.hero.talent.mnemonic_prayer.desc=_+1:_ يمكن للقس إلقاء _صلاة الذاكرة_، تعويذة تمدد التعزيزات/التأثيرات السلبية على حليف/عدو لـ_3 أدوار_ بتكلفة شحنة واحدة.
_+2:_ يمكن للقس إلقاء _صلاة الذاكرة_، تعويذة تمدد التعزيزات/التأثيرات السلبية على حليف/عدو لـ_4 أدوار_ بتكلفة شحنة واحدة.
_+3:_ يمكن للقس إلقاء _صلاة الذاكرة_، تعويذة تمدد التعزيزات/التأثيرات السلبية على حليف/عدو لـ_5 أدوار_ بتكلفة شحنة واحدة.
صلاة الذاكرة لا تأخذ أي وقت للإلقاء. يمكن لصلاة الذاكرة تمديد نسخة محددة من تعزيز/تأثير سلبي مرة واحدة فقط، ولا يمكنها تمديد التعزيزات الممنوحة من قدرات الدروع.
actors.hero.talent.lay_on_hands.title=لمسة الشفاء
actors.hero.talent.lay_on_hands.desc=_+1:_ يمكن للفارس المقدس إلقاء _لمسة الشفاء_، تعويذة تشفي فوراً شخصية قريبة بـ_15 صحة_، أو تمنح الفارس المقدس _15 حماية_، بتكلفة شحنة واحدة.
_+2:_ يمكن للفارس المقدس إلقاء _لمسة الشفاء_، تعويذة تشفي فوراً شخصية قريبة بـ_20 صحة_، أو تمنح الفارس المقدس _20 حماية_، بتكلفة شحنة واحدة.
_+3:_ يمكن للفارس المقدس إلقاء _لمسة الشفاء_، تعويذة تشفي فوراً شخصية قريبة بـ_25 صحة_، أو تمنح الفارس المقدس _25 حماية_، بتكلفة شحنة واحدة.
يُحول الشفاء الزائد من هذه التعويذة إلى حماية. يمكن إلقاء لمسة الشفاء بشكل متكرر، لكن لا يمكنها تطبيق أكثر من حماية تساوي ثلاثة إلقاءات في المرة الواحدة.
actors.hero.talent.aura_of_protection.title=هالة الحماية
actors.hero.talent.aura_of_protection.desc=_+1:_ يمكن للفارس المقدس إلقاء _هالة الحماية_، تعويذة تمنح الفارس المقدس وكل الحلفاء ضمن بلاطتين _مقاومة ضرر بنسبة 20%_ وتأثير نقش درع الفارس المقدس بـ_قوة +50%_ لمدة 20 دوراً، بتكلفة شحنتين.
_+2:_ يمكن للفارس المقدس إلقاء _هالة الحماية_، تعويذة تمنح الفارس المقدس وكل الحلفاء ضمن بلاطتين _مقاومة ضرر بنسبة 30%_ وتأثير نقش درع الفارس المقدس بـ_قوة +75%_ لمدة 20 دوراً، بتكلفة شحنتين.
_+3:_ يمكن للفارس المقدس إلقاء _هالة الحماية_، تعويذة تمنح الفارس المقدس وكل الحلفاء ضمن بلاطتين _مقاومة ضرر بنسبة 40%_ وتأثير نقش درع الفارس المقدس بـ_قوة +100%_ لمدة 20 دوراً، بتكلفة شحنتين.
actors.hero.talent.wall_of_light.title=جدار الضوء
actors.hero.talent.wall_of_light.desc=_+1:_ يمكن للفارس المقدس إلقاء _جدار الضوء_، تعويذة تخلق جداراً صلباً _بعرض 3 بلاطات_ أمام الفارس المقدس يدفع الأعداء بعيداً ويدوم لـ20 دوراً، بتكلفة 3 شحنات.
_+2:_ يمكن للفارس المقدس إلقاء _جدار الضوء_، تعويذة تخلق جداراً صلباً _بعرض 5 بلاطات_ أمام الفارس المقدس يدفع الأعداء بعيداً ويدوم لـ20 دوراً، بتكلفة 3 شحنات.
_+3:_ يمكن للفارس المقدس إلقاء _جدار الضوء_، تعويذة تخلق جداراً صلباً _بعرض 7 بلاطات_ أمام الفارس المقدس يدفع الأعداء بعيداً ويدوم لـ20 دوراً، بتكلفة 3 شحنات.
يمكن وضع الجدار في الاتجاهات الأساسية أو القطرية، يمكن أن يوجد جدار واحد فقط في كل مرة.
actors.hero.talent.divine_intervention.title=تدخل إلهي
actors.hero.talent.divine_intervention.desc=_+1:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _التدخل الإلهي_، والذي يعزز الكاهن وكل الحلفاء حتى _150 حماية_ ويمدد الهيئة المتسامية بـ_3 أدوار_.
_+2:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _التدخل الإلهي_، والذي يعزز الكاهن وكل الحلفاء حتى _200 حماية_ ويمدد الهيئة المتسامية بـ_4 أدوار_.
_+3:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _التدخل الإلهي_، والذي يعزز الكاهن وكل الحلفاء حتى _250 حماية_ ويمدد الهيئة المتسامية بـ_5 أدوار_.
_+4:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _التدخل الإلهي_، والذي يعزز الكاهن وكل الحلفاء حتى _300 حماية_ ويمدد الهيئة المتسامية بـ_6 أدوار_.
التدخل الإلهي يكلف 5 شحنات كتاب كاملة، ويمكن إلقاؤه مرة واحدة فقط في نفس الهيئة المتسامية.
actors.hero.talent.judgement.title=قضاء
actors.hero.talent.judgement.desc=_+1:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _القضاء_، والذي يوجه _10-20 ضرر_ لكل الأعداء المرئيين.
_+2:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _القضاء_، والذي يوجه _15-30 ضرر_ لكل الأعداء المرئيين.
_+3:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _القضاء_، والذي يوجه _20-40 ضرر_ لكل الأعداء المرئيين.
_+4:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _القضاء_، والذي يوجه _25-50 ضرر_ لكل الأعداء المرئيين.
القضاء يكلف 3 شحنات كتاب. القضاء يوجه +33% ضرر لكل تعويذة ألقاها الكاهن منذ دخوله الهيئة المتسامية أو منذ آخر إلقاء للقضاء.
actors.hero.talent.flash.title=وميض
actors.hero.talent.flash.desc=_+1:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _الوميض_ للانتقال الفوري حتى _3 بلاطات_ بعيداً.
_+2:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _الوميض_ للانتقال الفوري حتى _4 بلاطات_ بعيداً.
_+3:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _الوميض_ للانتقال الفوري حتى _5 بلاطات_ بعيداً.
_+4:_ أثناء الهيئة المتسامية، يمكن للكاهن إلقاء _الوميض_ للانتقال الفوري حتى _6 بلاطات_ بعيداً.
الوميض يكلف شحنتي كتاب في البداية، وشحنة إضافية واحدة لكل استخدام في نفس الهيئة المتسامية.
actors.hero.talent.body_form.title=هيئة الجسد
actors.hero.talent.body_form.desc=يمكن للكاهن إلقاء _هيئة الجسد_، والتي تحقن الثالوث بقوة سحر أو نقش عرفه الكاهن في هذه الجولة، بتكلفة شحنتين.
_+1:_ عند استخدام الثالوث، يكتسب الكاهن التأثير المختار لـ_20 دوراً_.
_+2:_ عند استخدام الثالوث، يكتسب الكاهن التأثير المختار لـ_27 دوراً_.
_+3:_ عند استخدام الثالوث، يكتسب الكاهن التأثير المختار لـ_33 دوراً_.
_+4:_ عند استخدام الثالوث، يكتسب الكاهن التأثير المختار لـ_40 دوراً_.
يمكن حقن الثالوث بتأثير جسد واحد فقط في كل مرة. تكلفة شحنة درع الثالوث أعلى إذا كان النقش المختار نادراً وقوياً.
actors.hero.talent.mind_form.title=هيئة العقل
actors.hero.talent.mind_form.desc=يمكن للكاهن إلقاء _هيئة العقل_، والتي تحقن الثالوث بقوة عصا سحرية أو سلاح رمي استخدمه الكاهن في هذه الجولة، بتكلفة 3 شحنات.
_+1:_ عند استخدام الثالوث، يستخدم الكاهن تأثير الإطلاق أو الرمي للغرض المختار، وكأنه _+3_.
_+2:_ عند استخدام الثالوث، يستخدم الكاهن تأثير الإطلاق أو الرمي للغرض المختار، وكأنه _+4_.
_+3:_ عند استخدام الثالوث، يستخدم الكاهن تأثير الإطلاق أو الرمي للغرض المختار، وكأنه _+5_.
_+4:_ عند استخدام الثالوث، يستخدم الكاهن تأثير الإطلاق أو الرمي للغرض المختار، وكأنه _+6_.
يمكن حقن الثالوث بتأثير عقل واحد فقط في كل مرة.
actors.hero.talent.spirit_form.title=هيئة الروح
actors.hero.talent.spirit_form.desc=يمكن للكاهن إلقاء _هيئة الروح_، والتي تحقن الثالوث بقوة خاتم أو قطعة أثرية عرفها الكاهن في هذه الجولة )باستثناء الكتاب المقدس(، بتكلفة 4 شحنات.
_+1:_ عند استخدام الثالوث، سيكتسب الكاهن تأثير خاتم بمستوى _+1_ لمدة 20 دوراً، أو سيفعل تأثير قطعة أثرية بمستوى _+4_.
_+2:_ عند استخدام الثالوث، سيكتسب الكاهن تأثير خاتم بمستوى _+2_ لمدة 20 دوراً، أو سيفعل تأثير قطعة أثرية بمستوى _+6_.
_+3:_ عند استخدام الثالوث، سيكتسب الكاهن تأثير خاتم بمستوى _+3_ لمدة 20 دوراً، أو سيفعل تأثير قطعة أثرية بمستوى _+8_.
_+4:_ عند استخدام الثالوث، سيكتسب الكاهن تأثير خاتم بمستوى _+4_ لمدة 20 دوراً، أو سيفعل تأثير قطعة أثرية بمستوى _+10_.
يمكن حقن الثالوث بتأثير روح واحد فقط في كل مرة. القطع الأثرية لديها تأثيرات وتكاليف شحنات درع متنوعة عند تفعيلها بواسطة الثالوث.
actors.hero.talent.beaming_ray.title=شعاع ساطع
actors.hero.talent.beaming_ray.desc=يمكن للكاهن إلقاء _الشعاع الساطع_ من حليف معزز بتكلفة شحنة واحدة. يمكن لهذا الشعاع اختراق الجدران وينقل الحليف إلى موقع مستهدف. إذا كان هناك عدو في ذلك الموقع، يظهر الحليف بجوار العدو وسيستهدفه. يمكن للشعاع الساطع حتى نقل الحلفاء غير القادرين على الحركة عادة، لكن مداه يُخفض إلى النصف عند فعل ذلك.
_+1:_ الشعاع الساطع لديه مدى أقصى يبلغ _4 بلاطات_، ويزيد تعزيز قوة الكثرة إلى _+35% ضرر_ ضد أقرب عدو لمدة 10 أدوار.
_+2:_ الشعاع الساطع لديه مدى أقصى يبلغ _8 بلاطات_، ويزيد تعزيز قوة الكثرة إلى _+40% ضرر_ ضد أقرب عدو لمدة 10 أدوار.
_+3:_ الشعاع الساطع لديه مدى أقصى يبلغ _12 بلاطة_، ويزيد تعزيز قوة الكثرة إلى _+45% ضرر_ ضد أقرب عدو لمدة 10 أدوار.
_+4:_ الشعاع الساطع لديه مدى أقصى يبلغ _16 بلاطة_، ويزيد تعزيز قوة الكثرة إلى _+50% ضرر_ ضد أقرب عدو لمدة 10 أدوار.
actors.hero.talent.life_link.title=رابط الحياة
actors.hero.talent.life_link.desc=يمكن للكاهن إلقاء _رابط الحياة_ بين نفسه وحليف معزز بتكلفة شحنتين. هذه التعويذة تسبب مشاركة الضرر بين الكاهن وحليفه، وتسبب تطبيق تعويذات الكاهن النافعة من المستوى 3 أو أقل على كليهما إذا كان أحدهما سيتأثر بها.
_+1:_ رابط الحياة يدوم لـ_10 أدوار_ ويزيد تعزيز قوة الكثرة إلى _-35% ضرراً متلقياً_.
_+2:_ رابط الحياة يدوم لـ_13 دوراً_ ويزيد تعزيز قوة الكثرة إلى _-40% ضرراً متلقياً_.
_+3:_ رابط الحياة يدوم لـ_17 دوراً_ ويزيد تعزيز قوة الكثرة إلى _-45% ضرراً متلقياً_.
_+4:_ رابط الحياة يدوم لـ_20 دوراً_ ويزيد تعزيز قوة الكثرة إلى _-50% ضرراً متلقياً_.
actors.hero.talent.stasis.title=سبات
actors.hero.talent.stasis.desc=يمكن للكاهن إلقاء _السبات_ على حليف معزز بتكلفة شحنتين. السبات يزيل الحليف مؤقتاً من الزنزانة ويحفظ الوقت المتبقي على كل التعزيزات، بما في ذلك قوة الكثرة. سيظهر الحليف بجوارك عندما ينتهي التأثير. يمكن إعادة إلقاء السبات فوراً وبدون تكلفة لإنهاء التأثير مبكراً. السبات يعمل على الحلفاء غير القادرين على الحركة، لكن لا يمكنه نقلهم بين طوابق الزنزانة.
_+1:_ السبات يدوم بحد أقصى _60 دوراً_.
_+2:_ السبات يدوم بحد أقصى _90 دوراً_.
_+3:_ السبات يدوم بحد أقصى _120 دوراً_.
_+4:_ السبات يدوم بحد أقصى _150 دوراً_.
يمكن للكاهن أيضاً إلقاء الشعاع الساطع عندما يكون الحليف في سبات لاستدعائه مجدداً، أو إلقاء رابط الحياة لتطبيق تأثيره مسبقاً. الحلفاء لا يستفيدون من رابط الحياة أثناء وجودهم في السبات مع ذلك.
#universal
actors.hero.talent.heroic_energy.title=طاقة بطولية
actors.hero.talent.heroic_energy.rat_title=طاقة جرذية بطولية
actors.hero.talent.heroic_energy.desc=_+1:_ قدرة درع البطل لديها _تكلفة شحنة مخفضة بنسبة 12%_.
_+2:_ قدرة درع البطل لديها _تكلفة شحنة مخفضة بنسبة 23%_.
_+3:_ قدرة درع البطل لديها _تكلفة شحنة مخفضة بنسبة 32%_.
_+4:_ قدرة درع البطل لديها _تكلفة شحنة مخفضة بنسبة 40%_.
actors.hero.talent.ratsistance.title=مقاومة جرذية
actors.hero.talent.ratsistance.desc=_+1:_ الأعداء الممسوخون جرذياً المعادون يوجهون _ضرراً أقل بنسبة 10%_.
_+2:_ الأعداء الممسوخون جرذياً المعادون يوجهون _ضرراً أقل بنسبة 19%_.
_+3:_ الأعداء الممسوخون جرذياً المعادون يوجهون _ضرراً أقل بنسبة 27%_.
_+4:_ الأعداء الممسوخون جرذياً المعادون يوجهون _ضرراً أقل بنسبة 35%_.
actors.hero.talent.ratlomacy.title=دبلوماسية جرذية
actors.hero.talent.ratlomacy.desc=_+1:_ استخدام مسخ جرذي على عدو ممسوخ جرذياً يجعله ودوداً ويجعل التحول دائماً.
_+2:_ استخدام مسخ جرذي على عدو ممسوخ جرذياً يجعله ودوداً، يجعل التحول دائماً، ويمنحه _دورين_ من الأدرينالين.
_+3:_ استخدام مسخ جرذي على عدو ممسوخ جرذياً يجعله ودوداً، يجعل التحول دائماً، ويمنحه _4 أدوار_ من الأدرينالين.
_+4:_ استخدام مسخ جرذي على عدو ممسوخ جرذياً يجعله ودوداً، يجعل التحول دائماً، ويمنحه _6 أدوار_ من الأدرينالين.
actors.hero.talent.ratforcements.title=تعزيزات جرذية
actors.hero.talent.ratforcements.desc=_+1:_ استخدام مسخ جرذي على نفسك _يستدعي جرذاً جرابياً حليفاً واحداً_ بجوارك.
_+2:_ استخدام مسخ جرذي على نفسك _يستدعي جرذين جرابيين حليفين_ بجوارك.
_+3:_ استخدام مسخ جرذي على نفسك _يستدعي 3 جرذان جرابية حليفة_ بجوارك.
_+4:_ استخدام مسخ جرذي على نفسك _يستدعي 4 جرذان جرابية حليفة_ بجوارك.
###npcs
actors.npcs.blacksmith.name=الحداد
actors.npcs.blacksmith.desc=هذا الحداد القزم يبدو ككل الأقزام: قامة طويلة ولحية رمادية شعثاء. جلده وعيناه يتوهجان بلون الجمر.
actors.npcs.blacksmith.gold_1=مرحباً أيها الإنسان! أتريد أن تكون مفيداً، هاه؟ خذ هذه الفأس واستخرج لي _15 قطعة من الذهب الداكن_ من الجدران في الأسفل. ماذا تقصد كيف سأدفع لك؟ يا جشع...\nحسناً، حسناً، ليس لدي مال لأدفعه، لكن يمكنني القيام ببعض أعمال الحدادة لك. اعتبر نفسك محظوظاً، أنا الحداد الوحيد هنا.
actors.npcs.blacksmith.gold_2=الذهب الداكن. 15 قطعة. بصراحة، هل هذا صعب جداً؟
actors.npcs.blacksmith.crystal_1=مرحباً أيها الإنسان! أتريد أن تكون مفيداً، هاه؟ خذ هذه الفأس وحطّم لي _6 قطع بلورية_ من الجدران في الأسفل. ماذا تقصد كيف سأدفع لك؟ يا جشع...\nحسناً، حسناً، ليس لدي مال لأدفعه، لكن يمكنني القيام ببعض أعمال الحدادة لك. اعتبر نفسك محظوظاً، أنا الحداد الوحيد هنا.
actors.npcs.blacksmith.crystal_2=القطع البلورية. 6 قطع. بصراحة، هل هذا صعب جداً؟
actors.npcs.blacksmith.crystal_3=هذه البلورات نقية! حسناً، ربما تكون بلورات عادية، لكنني سأخذها على أي حال.
actors.npcs.blacksmith.find_lost_item=مرحباً أيها الإنسان! أتريد أن تكون مفيداً، هاه؟ لقد فقدت شيئاً في المنجم بالأسفل عندما هرب الجميع. من فضلك أعده لي!
actors.npcs.blacksmith.lost_item=إنه _%s_ خاص بي. يجب أن يكون في مكان ما في المنجم بالأسفل. ربما تحت بعض الأنقاض، لا أعرف!
actors.npcs.blacksmith.pickaxe=لا أستطيع إعطاءك فأساً، أنت تحمل الكثير من الأشياء بالفعل! لكن إذا كنت تحمل فأس تنقيب بالفعل، يمكنني ترقيتها لك.
actors.npcs.blacksmith.thanks=حسناً، إذا كنت تريد شيئاً آخر، عد لاحقاً. لدي الكثير من العمل هنا.
actors.npcs.blacksmith.desc_lose=يبدو أن الحداد استسلم للبحث عن غرضه المفقود. إنه يجمع أغراضه ويستعد للمغادرة.
actors.npcs.blacksmith.desc_get_pickaxe=يبدو أن الحداد ما زال يبحث عن غرضه المفقود، لكنه أعطاك فأس تنقيب لتستخدمها في البحث.\n"هذه الفأس قوية بما يكفي لتحطيم الأنقاض، لكن انتبه، لا تستخدمها على الجدران الصلبة، ستؤذي يدك فقط!"
actors.npcs.blacksmith.desc_upgrade=يبدو أن الحداد ما زال يبحث عن غرضه المفقود، لكنه أعطاك فأس تنقيب لتستخدمها في البحث.\n"هذه الفأس قوية بما يكفي لتحطيم الأنقاض، لكن انتبه، لا تستخدمها على الجدران الصلبة، ستؤذي يدك فقط!"\n"أيضاً، أجريت بعض التحسينات على فأسك أثناء حملك لها. إنها أقوى قليلاً الآن!"
actors.npcs.blacksmith.get_pickaxe=شكراً لك! إليك فأسك.
actors.npcs.blacksmith.reminder=هل وجدت غرضي بعد؟ إنه _%s_، يجب أن يكون تحت بعض الأنقاض في المنجم.
actors.npcs.blacksmith.reminder_crystal=هل حطمت البلورات بعد؟ أحتاج _%d أخرى_.
actors.npcs.blacksmith.reminder_lost=هل وجدت غرضي بعد؟ إنه _%s_، يجب أن يكون تحت بعض الأنقاض في المنجم.
actors.npcs.ghost.name=الشبح الحزين
actors.npcs.ghost.rat_1=مرحباً أيها المغامر... ذات يوم كنت مثلك - قوياً وواثقاً... لكنني مت هنا... لا أستطيع مغادرة هذا المكان... ليس طالما أنني أملك ما أحتاجه... إنه معي... جرذ نتن... سرق وردتي الثمينة...
actors.npcs.ghost.rat_2=أرجوك... ساعدني... اعثر على الجرذ النتّن... إنه في مكان ما هنا... في المجاري... كن حذراً، رائحته الكريهة تشلّ، لا تستنشقها كثيراً...
actors.npcs.ghost.gnoll_1=مرحباً أيها المغامر... ذات يوم كنت مثلك - قوياً وواثقاً... لكنني مت هنا... لا أستطيع مغادرة هذا المكان... ليس طالما أنني أملك ما أحتاجه... إنه معي... جنول محتال... سرق وردتي الثمينة...
actors.npcs.ghost.gnoll_2=أرجوك... ساعدني... اعثر على الجنول المحتال... إنه في مكان ما هنا... في المجاري... كن حذراً، إنه لا يقاتل بنزاهة...
actors.npcs.ghost.crab_1=مرحباً أيها المغامر... ذات يوم كنت مثلك - قوياً وواثقاً... لكنني مت هنا... لا أستطيع مغادرة هذا المكان... ليس طالما أنني أملك ما أحتاجه... إنه معي... سرطان عجوز... سرق وردتي الثمينة...
actors.npcs.ghost.crab_2=أرجوك... ساعدني... اعثر على السرطان العجوز... إنه في مكان ما هنا... في المجاري... كن حذراً، قشرته سميكة جداً...
actors.npcs.ghost.find_rose=أرجوك... ساعدني... اعثر على وردتي... إنها في مكان ما هنا... في الزنزانة... كن حذراً...
actors.npcs.ghost.give_rose=نعم! نعم، هذه هي! أرجوك أعطني إياها! ويمكنك الاحتفاظ بأي شيء وجدته معها، لم أعد أحتاجه...
actors.npcs.ghost.def_verb=راوغ
actors.npcs.ghost.desc=الشبح بالكاد مرئي. يبدو كنقطة من الضوء الضعيف بلا شكل مع وجه حزين.
actors.npcs.imp.name=القزم الطموح
actors.npcs.imp.golems_1=هل أنت مغامر؟ أحب الأبطال! يمكن دائماً الاعتماد عليهم إذا كان هناك شيء يحتاج للقتل. أليس كذلك؟ مقابل مكافأة بالطبع ؛)\nفي حالتي، يمكن أن تكون _الغولمات_ هي التي تحتاج للقتل. كما ترى، سأبدأ عملاً صغيراً هنا، لكن هذه الغولمات الغبية سيئة للأعمال! من الصعب جداً التفاوض مع كتل متجولة من الجرانيت، اللعنة عليها! لذا من فضلك، اقتل... لنقل _6 منها_ وستكون المكافأة لك.
actors.npcs.imp.golems_2=كيف يسير صيد الغولمات الخاص بك؟
actors.npcs.imp.monks_1=هل أنت مغامر؟ أحب الأبطال! يمكن دائماً الاعتماد عليهم إذا كان هناك شيء يحتاج للقتل. أليس كذلك؟ مقابل مكافأة بالطبع ;)\nفي حالتي، يمكن أن يكون _الرهبان_ هم الذين يحتاجون للقتل. كما ترى، سأبدأ عملاً صغيراً هنا، لكن هؤلاء المجانين سيئون للأعمال! من الصعب جداً التفاوض مع رهبان متجولين، اللعنة عليهم! لذا من فضلك، اقتل... لنقل _8 منهم_ وستكون المكافأة لك.
actors.npcs.imp.monks_2=أوه، ما زلت حياً! أعلم أن كياكوني أفضل ;) آسف، آسف، أنا أمزح فقط!
actors.npcs.imp.cya=أراك، %s!
actors.npcs.imp.desc=القزم الطموح يريد أن يصبح تاجراً. إنه يحتاج إلى رأس مال لبدء عمله.
actors.npcs.ratking.name=ملك الجرذان
actors.npcs.ratking.not_sleeping=أنا لا أنام!
actors.npcs.ratking.what_is_it=ماذا؟ ليس لدي وقت لهذه التفاهات. مملكتي لن تحكم نفسها!
actors.npcs.ratking.gold_1=مهلاً! أنت تبدو شخصاً قوياً... اسمع، أنا ملك الجرذان، ولدي مشكلة ملكية! خزانتي فارغة تماماً لأن رعيتي الجرذان لا تدفع ضرائبها! لذا افعل شيئاً مفيداً لي: أحضر لي _100 ذهب_ وسأكافئك بما يليق بملك.
actors.npcs.ratking.gold_2=هل أحضرت ذهبي؟ لا؟ حسناً، عد عندما تحضره!
actors.npcs.ratking.crown_1=مهلاً! أنت تبدو شخصاً قوياً... اسمع، أنا ملك الجرذان، ولدي مشكلة ملكية! رعيتي لا تحترمني بما يكفي! لذا افعل شيئاً مفيداً لي: أحضر لي _تاجاً_ وسأكافئك بما يليق بملك.
actors.npcs.ratking.crown_2=هل أحضرت تاجي؟ لا؟ حسناً، عد عندما تحضره!
actors.npcs.ratking.crown_3=تاج! يا له من تاج جميل! الآن رعيتي ستحترمني بالتأكيد! خذ مكافأتك، أيها البطل!
actors.npcs.ratking.desc_crown=ملك الجرذان يبدو أكثر سعادة قليلاً الآن، ويرتدي تاجاً صغيراً جداً.
actors.npcs.ratking.desc_armor=ملك الجرذان يبدو أكثر سعادة قليلاً الآن، ويرتدي درعاً صغيراً جداً.
actors.npcs.ratking.desc=هذا الجرذ أكبر قليلاً من الجرذ الجرابي العادي. إنه يرتدي تاجاً صغيراً على رأسه.
actors.npcs.sheep.name=خروف
actors.npcs.sheep.baa_1=ماع!
actors.npcs.sheep.baa_2=ماع ماع!
actors.npcs.sheep.baa_3=ماع! ماع! ماع!
actors.npcs.sheep.baa_4=ماع... ماع...
actors.npcs.sheep.baa_5=ماع ماع ماع ماع ماع!
actors.npcs.sheep.baa_6=ماع.
actors.npcs.sheep.desc=هذا خروف سحري أبيض. مشكلته أنه لا يمكنك قتله. سيقف هناك محدقاً فيك بشكل مخيف حتى يتلاشى سحرياً، ثم ينام.
actors.npcs.shopkeeper.name=صاحب المتجر
actors.npcs.shopkeeper.thief=أيها اللص، أيها اللص!
actors.npcs.shopkeeper.sell=اختر غرضاً للبيع
actors.npcs.shopkeeper.desc=هذا الرجل السمين يبدو أكثر ملاءمة للتجارة في مدينة كبيرة من زنزانة. أسعاره تفسر لماذا يفضل التجارة هنا.
actors.npcs.wandmaker.name=صانع العصي العجوز
actors.npcs.wandmaker.intro_1=أوه، مرحباً بك أيها الزائر في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_warrior=أوه، مرحباً لك أيها المحارب في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_mage=أوه، مرحباً لك أيها الساحر في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_rogue=أوه، مرحباً لك أيها اللص في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_huntress=أوه، مرحباً لك أيتها الصيادة في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_duelist=أوه، مرحباً لك أيتها المبارزة في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.intro_cleric=أوه، مرحباً لك أيها الكاهن في هذا المكان البغيض! آمل أنك لم تتعب نفسك كثيراً للوصول إلى هنا؟ كما ترى، أنا محاصر هنا، كما أنت تماماً.\nنعم، أنا أيضاً أريد المغادرة، لكنني لا أستطيع ترك عملي غير المكتمل. ربما يمكنك مساعدتي؟ لدي مهمة صغيرة لك، إذا كنت مهتماً.
actors.npcs.wandmaker.dust_1=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _غبار جثة_ من الهياكل العظمية الملعونة هنا. إنها لعنة ضعيفة تمنعها من التحلل بشكل صحيح.
actors.npcs.wandmaker.dust_2=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _غبار جثة_ من الهياكل العظمية الملعونة هنا. إنها لعنة ضعيفة تمنعها من التحلل بشكل صحيح.
actors.npcs.wandmaker.ember_1=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _جمراً عنصرياً_ من عنصري نار فتى. يمكنك العثور عليها في أماكن باردة جداً، البرد يبقيها هادئة.
actors.npcs.wandmaker.ember_2=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _جمراً عنصرياً_ من عنصري نار فتى. يمكنك العثور عليها في أماكن باردة جداً، البرد يبقيها هادئة.
actors.npcs.wandmaker.berry_1=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _بذرة توت العفن_ من نبتة توت العفن. إنها نبتة خبيثة، لذا كن حذراً عند الاقتراب منها.
actors.npcs.wandmaker.berry_2=أوه، كم هو لطيف منك أن تأتي! فيما يخص المهمة، أحتاج _بذرة توت العفن_ من نبتة توت العفن. إنها نبتة خبيثة، لذا كن حذراً عند الاقتراب منها.
actors.npcs.wandmaker.reminder_dust=هل وجدت غبار الجثة بعد؟ لا لا، لا تتعجل، خذ وقتك.
actors.npcs.wandmaker.reminder_ember=هل وجدت الجمر العنصري بعد؟ لا لا، لا تتعجل، خذ وقتك.
actors.npcs.wandmaker.reminder_berry=هل وجدت بذرة توت العفن بعد؟ لا لا، لا تتعجل، خذ وقتك.
actors.npcs.wandmaker.def_verb=راوغ
actors.npcs.wandmaker.desc=هذا رجل عجوز في مقتبل العمر بملامح قلق، يرتدي عباءة رثة. يمكنه مساعدة البطل بمعلومات ومهام ومكافآت.
###mobs
actors.mobs.acidic.name=بربري كاوي
actors.mobs.acidic.desc=هذه الكتلة الضخمة من الجلد الأكّال تشبه البربري الجنول، لكن جلدها الأخضر اللزج يسبب حروقاً مؤلمة عند اللمس، ويسقط منها وحل أكّال عند موتها.
actors.mobs.albino.name=جرذ أبيض
actors.mobs.albino.desc=هذا نوع نادر من الجرذان الجرابية، بفراء أبيض تماماً وعيون حمراء. لأنه نادر جداً، يسقط غنائم أفضل من الجرذان العادية.
actors.mobs.bandit.name=لص مجنون
actors.mobs.bandit.desc=اللصوص الذين فشلوا في سرقة ضحاياهم يصبحون مجانين في النهاية. هذا اللص المجنون يسرق غرضاً ثم يحاول الهرب، لكنه سيقاتل بشراسة إذا حوصر.
actors.mobs.bat.name=خفاش مصاص دماء
actors.mobs.bat.desc=هذه المخلوقات الصغيرة السريعة والمزعجة تفضل مهاجمة الأهداف من مسافة، وتمتص قوة الحياة من كل قضمة لتشفى نفسها.
actors.mobs.bee.name=نحلة ذهبية
actors.mobs.bee.desc=رغم صغر حجمها، تميل النحل الذهبية إلى حماية عشها بشراسة. هذه النحلة بالذات يبدو أنها عقدت صفقة مع شخص ما.
actors.mobs.brute.name=بربري جنول
actors.mobs.brute.desc=البرابرة هم أكبر وأقوى وأبطأ الجرول. عندما يُجرحون بشدة، يدخلون في حالة غضب، مما يمنحهم ضرراً إضافياً وخفضاً للضرر المتلقى.
actors.mobs.causticslime.name=سائل كاوي
actors.mobs.causticslime.desc=هذا السائل الهلامي اكتسب خصائص أكّالة من البيئة الحمضية حول غو. كل هجوم منه يترك وحلاً أكّالاً يلتصق بضحيته.
actors.mobs.crab.name=سرطان مجاري
actors.mobs.crab.desc=هذه السرطانات الضخمة هي في أعلى السلسلة الغذائية في المجاري. إنها سريعة جداً ودرعها السميك يصدر ضربات ثقيلة.
actors.mobs.crystalguardian.name=حارس بلوري
actors.mobs.crystalguardian.desc=هذه التماثيل البلورية الضخمة وُضعت هنا لحماية مناجم الأقزام. إنها بطيئة لكن ضرباتها مدمرة، ويمكنها استدعاء أشباح بلورية لمساعدتها.
actors.mobs.crystalwisp.name=شبح بلوري
actors.mobs.crystalwisp.desc=هذه الكائنات الصغيرة من البلور الحي تطير بسرعة وتطلق شحنات بلورية حادة على أي متطفل. إنها هشة لكنها سريعة.
actors.mobs.demon.name=شيطان حاضن
actors.mobs.demon.desc=هذه الشياطين هي أتباع يوغ-دزيوا. إنها تستدعي أتباعاً إضافيين وتهاجم من مسافة بسحر مظلم.
actors.mobs.demonspawner.name=بائض الشياطين
actors.mobs.demonspawner.desc=هذه الكتلة اللحمية النباضة تولد الشياطين باستمرار. لا يمكنها الدفاع عن نفسها، لكنها لن تتوقف عن الإنتاج ما دامت حية.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.desc=هذه الآلة الصغيرة كانت تُستخدم في المناجم لإشعال المتفجرات. إنها تطلق شحنات كهربائية مؤلمة على أي متطفل.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.desc=هذه الآلة الكبيرة صُممت لحفر الأنفاق. إنها تطلق شعاع حفر قوي على الأعداء، لكنها بطيئة الحركة.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.desc=هذه الآلة المحدثة أقوى من DM-200، وتطلق شحنات كهربائية متسلسلة تصعق عدة أهداف.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.desc=هذه الآلة الضخمة هي أقوى آلات تعدين الأقزام. إنها تطلق صواريخ وشحنات كهربائية، ويمكنها الاتصال بأسلاك الطاقة لشحن نفسها.
actors.mobs.dwarfguard.name=حارس قزم
actors.mobs.dwarfguard.desc=هؤلاء الحراس المدرعون كانوا يحمون متروبوليس الأقزام. ما زالوا يقومون بواجبهم حتى بعد موت أسيادهم.
actors.mobs.dwarfmonk.name=راهب قزم
actors.mobs.dwarfmonk.desc=هؤلاء الرهبان هم فنانون قتاليون كرسوا أنفسهم لحماية ملكهم. ضرباتهم سريعة ومركزة، ويمكنهم نزع سلاح خصومهم.
actors.mobs.ebonymimic.name=مقلد أبني
actors.mobs.ebonymimic.desc=هذا المقلد النادر مصنوع من خشب الأبنوس الداكن. إنه أقوى من المقلد العادي ويسقط غنائم أفضل، لكنه يختبئ ببراعة أكبر.
actors.mobs.elemental$fireelemental.name=عنصري نار
actors.mobs.elemental$fireelemental.desc=عنصري النار هو تجسيد حي للنار. إنه يشعل كل ما يلمسه ولا يمكن إخماده إلا بالماء.
actors.mobs.elemental$newbornfireelemental.name=عنصري نار وليد
actors.mobs.elemental$newbornfireelemental.desc=عنصري النار هذا حديث الولادة، لذا فهو أضعف وأصغر من البالغين. لكنه ما زال يشعل كل ما يلمسه.
actors.mobs.elemental$frostelemental.name=عنصري صقيع
actors.mobs.elemental$frostelemental.desc=عنصري الصقيع هو تجسيد حي للجليد. إنه يبرد كل ما يلمسه ويبطئ حركته.
actors.mobs.elemental$newbornfrostelemental.name=عنصري صقيع وليد
actors.mobs.elemental$newbornfrostelemental.desc=عنصري الصقيع هذا حديث الولادة، لذا فهو أضعف وأصغر من البالغين. لكنه ما زال يبرد كل ما يلمسه.
actors.mobs.elemental$shockelemental.name=عنصري صعق
actors.mobs.elemental$shockelemental.desc=عنصري الصعق هو تجسيد حي للكهرباء. إنه يصعق كل ما يلمسه ويقفز ضرره بين الأهداف القريبة.
actors.mobs.elemental$newbornshockelemental.name=عنصري صعق وليد
actors.mobs.elemental$newbornshockelemental.desc=عنصري الصعق هذا حديث الولادة، لذا فهو أضعف وأصغر من البالغين. لكنه ما زال يصعق كل ما يلمسه.
actors.mobs.elemental$chaoselemental.name=عنصري فوضى
actors.mobs.elemental$chaoselemental.desc=عنصري الفوضى هو تجسيد حي للسحر الخام غير المستقر. هجماته تطبق تأثيرات عشوائية من كل العناصر.
actors.mobs.elemental$newbornchaoselemental.name=عنصري فوضى وليد
actors.mobs.elemental$newbornchaoselemental.desc=عنصري الفوضى هذا حديث الولادة، لذا فهو أضعف وأصغر من البالغين. لكنه ما زال يطبق تأثيرات عشوائية.
actors.mobs.eyeball.name=كرة عين
actors.mobs.eyeball.desc=هذه الكرة العائمة من اللحم والعين تحدق فيك باستمرار. نظرتها تسبب ضرراً سحرياً متراكماً يصعب الشفاء منه.
actors.mobs.fetidrat.name=جرذ نتن
actors.mobs.fetid.desc=هذا الجرذ الضخم تنبعث منه رائحة كريهة تشل من يستنشقها. إنه يحرس شيئاً ثميناً في المجاري.
actors.mobs.fetidrat.desc=هذا الجرذ الضخم تنبعث منه رائحة كريهة تشل من يستنشقها. إنه يحرس شيئاً ثميناً في المجاري.
actors.mobs.ghoul.name=غول جنول
actors.mobs.ghoul.desc=هذه الجرول الميتة أحياءاً تعود للحياة بقوة سحرية مظلمة. إنها تنهض مجدداً ما لم تُقتل بضربة قاضية أو تُحرق.
actors.mobs.gnoll.name=كشاف جنول
actors.mobs.gnoll.desc=الجرول هم مخلوقات تشبه الضباع تسكن الزنزانة. الكشافون هم أضعف أفراد القبيلة، لكنهم ما زالوا خطرين في مجموعات.
actors.mobs.gnollgeomancer.name=جيومانسر جنول
actors.mobs.gnollgeomancer.desc=هذا الجنول الساحر يتحكم بالصخور والتضاريس. إنه يرفع الجدران ويسقط الصخور على أعدائه من مسافة.
actors.mobs.golem.name=غولم
actors.mobs.golem.desc=هذه الكتلة الضخمة من الحجر والسحر كانت أداة تعدين للأقزام. إنها بطيئة لكن ضرباتها مدمرة ودرعها سميك جداً.
actors.mobs.goo.name=غو
actors.mobs.goo.desc=هذه الكتلة الضخمة من الوحل الحي هي حارس الزنزانة الأول. إنها تمتص الماء لتكبر وتصبح أقوى، ويمكنها التمدد لإطلاق هجمات بعيدة.
actors.mobs.greatcrab.name=سرطان عظيم
actors.mobs.greatcrab.desc=هذا السرطان العملاق هو أقدم وأقوى سرطانات المجاري. قشرته السميكة تصد معظم الهجمات، لكنه بطيء جداً.
actors.mobs.guard.name=حارس سجن
actors.mobs.guard.desc=هؤلاء الحراس كانوا يحرسون السجن قبل أن يتحولوا إلى وحوش. ما زالوا يرتدون دروعهم ويحملون رماحهم، ويهاجمون أي متطفل.
actors.mobs.hermitcrab.name=سرطان الناسك
actors.mobs.hermitcrab.def_verb=صد
actors.mobs.hermitcrab.desc=لسبب ما، قرر هذا السرطان المجاري ارتداء الجزء العلوي المكسور من برميل على رأسه! الوزن الإضافي أبطأه إلى السرعة العادية، لكنه منحه أيضاً دفاعاً أكبر بكثير. تسمع شيئاً ما يتدحرج داخل البرميل...
actors.mobs.mimic.name=المقلد
actors.mobs.mimic.reveal=هذا الصندوق هو مقلد!
actors.mobs.mimic.hidden_hint=هناك شيء غريب بشأن هذا الصندوق... الاقتراب منه ومحاولة فتحه قد يكون فكرة سيئة.
actors.mobs.mimic.desc=المقلدون هم مخلوقات سحرية يمكنها اتخاذ أي شكل تريده. في الزنزانات، يختارون دائماً شكل صندوق كنز تقريباً، lure in المغامرين المطمئنين.
لدى المقلدين عضة مؤذية، لكنهم غالباً ما يحملون كنوزاً أكثر من الصناديق العادية.
actors.mobs.mimic.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.
actors.mobs.necromancer.name=النيكرومانسر
actors.mobs.necromancer.desc=لقد تجمع هؤلاء السحرة المظلمون المتدربون في السجن، لأنه المكان المثالي لممارسة حرفتهم الشريرة.
سيستحضر النيكرومانسر الهياكل العظمية ويقويها لتقاتل من أجله. قتل النيكرومانسر سيقتل أيضاً الهيكل العظمي الذي يستحضره.
actors.mobs.necromancer$necroskeleton.name=هيكل النيكرومانسر
actors.mobs.necromancer$necroskeleton.desc=هذا الهيكل العظمي تم استدعاؤه بواسطة نيكرومانسر. يتصرف تماماً مثل الهيكل العظمي العادي، وسيموت عندما يُقتل النيكرومانسر الذي استدعاه.
actors.mobs.mob.died=تسمع شيئاً ما يموت في المسافة.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=قُتل بواسطة: %s
actors.mobs.mob.discover_hint=يمكنك العثور على هذا العدو في منطقة محددة من الزنزانة.
actors.mobs.monk.name=راهب قزم
actors.mobs.monk.def_verb=صد
actors.mobs.monk.parried=تصدى
actors.mobs.monk.desc=هؤلاء الرهبان هم متعصبون كرسوا أنفسهم لحماية ملكهم من خلال القوة الجسدية. إخلاصهم عظيم لدرجة أنهم تنازلوا تماماً عن عقولهم لملكهم، والآن يتجولون في مدينة الأقزام مثل الزومبي بلا عقل.
يعتمد الرهبان فقط على فن القتال اليدوي، وقادرون على استخدام قبضاتهم العارية للهجوم والدفاع. عندما يركزون، سيتصدون للهجوم الجسدي التالي الموجه ضدهم، حتى لو كان مضمون الإصابة. يبني الرهبان التركيز بسرعة أكبر أثناء الحركة، وببطء أكثر في القتال المباشر.
actors.mobs.monk$focus.name=مركز
actors.mobs.monk$focus.desc=هذا الراهب مركز تماماً على هدفه، ويبدو أنه يتوقع حركاته قبل أن ينفذها.
أثناء التركيز، الهجوم الجسدي التالي الموجه ضد هذه الشخصية مضمون الخطأ، بغض النظر عن الظروف. التصدي لهذا الهجوم سيستهلك تركيز الراهب، وسيحتاج إلى بنائه مجدداً للتصدي لهجوم آخر. يبني الرهبان التركيز بسرعة أكبر أثناء حركتهم.
actors.mobs.phantompiranha.name=بيرانا شبحية
actors.mobs.phantompiranha.teleport_away=البيرانا الشبحية تنتقل بعيداً...
actors.mobs.phantompiranha.desc=البيرانا الشبحية هي سلالة نادرة من البيرانا بقدرات سحرية وأجسام شفافة مخيفة. إنها قادرة على الانتقال الفوري أثناء مهاجمتها، إما للهروب أو للاقتراب بسرعة من عدوها!
رغم أنها مزعجة في القتال، إلا أن لحمها مطلوب جداً لخصائصه السحرية.
actors.mobs.piranha.name=بيرانا عملاقة
actors.mobs.piranha.desc=تُربى هذه الأسماك آكلة اللحوم خصيصاً لحماية المناطق المغمورة. عضتها قاتلة، لذا من الأفضل تجنب مواجهتها مباشرة.
actors.mobs.piranha.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.
actors.mobs.pylon.name=برج طاقة
actors.mobs.pylon.desc_inactive=برج طاقة، يهدف إلى المساعدة في تنظيم الكهرباء التي تشغل الآلات في هذه المنطقة.
البرج حالياً غير نشط ومحصن ضد الضرر.
actors.mobs.pylon.desc_active=برج طاقة، يهدف إلى المساعدة في تنظيم الكهرباء التي تشغل الآلات في هذه المنطقة. البرج حالياً يفيض بالطاقة الكهربائية، هذا لا بد أنه ما يشحن DM-300!
في هذه الحالة تكون الأبراج عرضة للخطر، لكنها ستقوس الكهرباء إلى الخلايا القريبة في نمط عقارب الساعة. بسبب بنائها المعدني الثقيل، الأبراج مقاومة لكميات كبيرة من الضرر.
actors.mobs.rat.name=جرذ جرابي
actors.mobs.rat.desc=الجرذان الجرابية هي سكان مجاري عدوانيون لكنهم ضعفاء إلى حد ما. لديهم عضة مؤذية، لكنهم يشكلون خطراً على الحياة فقط بأعداد كبيرة.
actors.mobs.ripperdemon.name=شيطان ممزق
actors.mobs.ripperdemon.leap=الشيطان الممزق يستعد للقفز!
actors.mobs.ripperdemon.desc=هذه المخلوقات المروعة هي نتيجة استخدام القوات الشيطانية للعديد من جثث الأقزام في هذه المنطقة. الممزقون هم مخلوقات غولية هزيلة تشبه الأقزام، لكن بأجسام مكسورة ومخالب حادة طويلة مصنوعة من العظم.
الشياطين الممزقة ليست متينة بشكل خاص، لكنها خفيفة وخطيرة. إنها قادرة على القفز لمسافات كبيرة للوصول بسرعة إلى الأهداف قبل تمزيقها بمخالبها.
actors.mobs.rotheart.name=قلب العفن
actors.mobs.rotheart.desc=ثمرة توت العفن فريدة جداً. بدلاً من التعفن وتوفير العناصر الغذائية، تنمو الثمرة وتتصلب وتغلف البذرة. توفر الحماية للأعضاء الداخلية التي تنمو داخل الثمرة. يشار إلى هذه الكرة العملاقة باسم قلب نبتة توت العفن البالغة.
actors.mobs.rotheart.discover_hint=يمكنك العثور على هذا العدو خلال مهمة محددة.
actors.mobs.rotlasher.name=سوط العفن
actors.mobs.rotlasher.desc=سوط العفن هو جزء من هيكل جذر نبتة توت العفن الناضجة، وأيضاً وسيلتهم الأساسية للدفاع. الأسواط عمياء ومثبتة في الأرض، لكنها ستهاجم بعنف أي تهديد قريب بعد أخذ لحظة لاكتشافه. عندما لا يكون هناك أعداء قريبون، تقف بلا حراك، محاولة الاندماج مع الغطاء النباتي المحيط.
actors.mobs.rotlasher.discover_hint=يمكنك العثور على هذا العدو خلال مهمة محددة.
actors.mobs.scorpio.name=عقرب
actors.mobs.scorpio.desc=هذه المخلوقات الشيطانية العملاقة الشبيهة بالعناكب تتجنب القتال القريب، مفضلة إطلاق أشواك مسننة مشلولة من مسافات بعيدة.
actors.mobs.senior.name=راهب كبير
actors.mobs.senior.desc=هؤلاء الرهبان هم متعصبون كرسوا أنفسهم لحماية ملكهم من خلال القوة الجسدية. إخلاصهم عظيم لدرجة أنهم تنازلوا تماماً عن عقولهم لملكهم، والآن يتجولون في مدينة الأقزام مثل الزومبي بلا عقل.
هذا الراهب أتقن فن القتال اليدوي، وقادر على اكتساب التركيز أثناء الحركة بسرعة أكبر بكثير من الرهبان العاديين. عندما يركزون، سيتصدون للهجوم الجسدي التالي الموجه ضدهم، حتى لو كان مضمون الإصابة.
actors.mobs.shaman.name=شامان جنول
actors.mobs.shaman.bolt_kill=البرق السحري قتلك...
actors.mobs.shaman.desc=شامانات الجنول هم جنول أذكياء يستخدمون تعاويذ المعركة للتعويض عن نقص قوتهم. لديهم مكانة محترمة جداً في مجتمع الجنول، رغم قوتهم الأضعف.
actors.mobs.shaman$redshaman.spell_desc=هذا الشامان يرتدي قناعاً أحمر، وسيستخدم سحراً _يضعف قوة هجومك_ مؤقتاً.
actors.mobs.shaman$blueshaman.spell_desc=هذا الشامان يرتدي قناعاً أزرق، وسيستخدم سحراً _يزيد الضرر الذي تتلقاه_ مؤقتاً.
actors.mobs.shaman$purpleshaman.spell_desc=هذا الشامان يرتدي قناعاً بنفسجياً، وسيستخدم سحراً _يقلل دقتك ومراوغتك_ مؤقتاً.
actors.mobs.armoredbrute.name=بربري مدرع
actors.mobs.armoredbrute.desc=غالباً ما يرتدي كبار البرابرة دروعاً قوية لإظهار مكانتهم. الدروع تجعل هؤلاء البرابرة أكثر مقاومة للضرر الجسدي، وانضباطهم الأكبر يعني أنهم يمكن أن يهيجوا لفترة أطول قبل الاستسلام لجراحهم.
actors.mobs.skeleton.name=هيكل عظمي
actors.mobs.skeleton.explo_kill=لقد قُتلت بانفجار العظام...
actors.mobs.skeleton.def_verb=صد
actors.mobs.skeleton.desc=الهياكل العظمية مكونة من عظام المغامرين التعساء وسجناء الزنزانة، تُحركها انبعاثات السحر الشرير من الأعماق. بعد أن تتلقى ضرراً كافياً، ستتحلل الهياكل العظمية في انفجار من العظام. الشظايا الناتجة ضارة بأي شيء قريب، لكن الدرع فعال جداً في تخفيفها.
actors.mobs.slime.name=سلايم
actors.mobs.slime.def_verb=صد
actors.mobs.slime.desc=السلايم هي مخلوقات غريبة وسحرية قليلاً ذات غشاء خارجي مطاطي ولب سائل. توفر مجاري المدينة لهم إمدادات وفيرة من الماء والعناصر الغذائية.
بسبب غشائهم الخارجي المرن، من الصعب توجيه أكثر من _6 ضرر_ للسلايم من أي هجوم واحد.
actors.mobs.snake.name=ثعبان مجاري
actors.mobs.snake.hint=حاول استخدام زر الفحص على ثعبان لتتعلم كيف تواجههم.
actors.mobs.snake.desc=هذه الثعابين ضخمة الحجم وقادرة على الانزلاق بسرعة لتفادي الضربات، مما يجعلها صوبة الإصابة. الهجمات السحرية أو هجمات المفاجأة قادرة على مباغتتها.
يمكنك تنفيذ هجوم مفاجئ بالهجوم أثناء وجودك خارج مجال رؤية الثعبان. إحدى الطرق هي أن تدع الثعبان يطاردك عبر مدخل ثم _تضربه مباشرة بعد أن يتحرك إلى الباب._
actors.mobs.spectralnecromancer.name=نيكرومانسر طيفي
actors.mobs.spectralnecromancer.desc=بينما تعتبر الهياكل العظمية الخبز والزبدة للنيكرومانسر، يفضل البعض البحث عن أتباع أقل جسدية. اختار النيكرومانسر الطيفي الأشباح كأتباع مفضلين!
الأشباح الفردية ليست قوية كالهياكل العظمية، لكن هؤلاء النيكرومانسر لا يخافون من استدعاء عدد كبير منهم!
actors.mobs.spinner.name=غازلة الكهف
actors.mobs.spinner.desc=تحاول عناكب الكهف الفروية الخضراء تجنب القتال المباشر. بدلاً من ذلك، تفضل الانتظار من مسافة بعيدة بينما يكافح ضحيتها في شباك العنكبوت التي تفرزها، لتموت ببطء من عضتها السامة. إنها قادرة على إطلاق شباكها لمسافات كبيرة، وستحاول سد أي مسار تسلكه فريستها.
actors.mobs.statue.name=تمثال متحرك
actors.mobs.statue.def_verb=صد
actors.mobs.statue.desc=قد تظن أنه مجرد تمثال آخر من تماثيل الزنزانة الجامدة، لكن عينيه المتوهجتين باللون الأحمر تكشفانه.
actors.mobs.statue.desc_weapon=بينما التمثال نفسه مصنوع من الحجر، إلا أن _%s_ الذي يحمله يبدو حقيقياً.
actors.mobs.statue.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.
actors.mobs.succubus.name=سوكيوبوس
actors.mobs.succubus.desc=السوكيوبوس هي شياطين متحولة تتلاعب بعقول فرائسها. هذه اتخذت شكل بشري قوطي شاحب، ربما لجذب سحرة الأقزام؟
قد تسحر السوكيوبوس عدوها مؤقتاً عند الهجوم، مما يجعل عدوها غير قادر على مهاجمتها مباشرة. عندما تهاجم السوكيوبوس عدواً مسحوراً، ستسرق بعضاً من طاقة حياته.
actors.mobs.swarm.name=سرب ذباب
actors.mobs.swarm.desc=سرب الذباب القاتل يطن بغضب. كل هجوم غير سحري سيقسمه إلى سربين أصغر لكنهما خطيران بنفس القدر.
actors.mobs.tengu.name=تينغو
actors.mobs.tengu.notice_gotcha=أمسكت بك، %s!
actors.mobs.tengu.interesting=لنجعل هذا مثيراً...
actors.mobs.tengu.notice_have=لديك الآن، %s!
actors.mobs.tengu.defeated=حراً أخيراً...
actors.mobs.tengu.rankings_desc=اغتيل بواسطة تينغو
actors.mobs.tengu.desc=قاتل مشهور وغامض، سمي نسبة إلى القناع المثبت على وجهه.
تينغو مقيد بأصفاد كبيرة على معصميه وركبتيه، رغم أنه يبدو أنه تخلص من سلاسله منذ وقت طويل.
سيحاول استخدام الفخاخ، السحر الخادع، والهجمات الدقيقة للقضاء على الشيء الوحيد الذي يوقف هروبه: أنت.
actors.mobs.tengu$bombability$bombblob.desc=سحابة من الدخان الساخن جداً تتصاعد هنا. احذر، إنها على وشك الانفجار!
actors.mobs.tengu$bombability$bombitem.name=قنبلة دخانية
actors.mobs.tengu$bombability$bombitem.cant_pickup=إنها ملتصقة بالأرض، لا يمكنك تحريكها!
actors.mobs.tengu$bombability$bombitem.desc=ألقى تينغو قنبلة دخانية غريبة الشكل هنا، والتي تصاعد منها دخان ساخن كثيف. إنها تصدر صوت تكات عالي، وكأنها تعد للانفجار!
القنبلة ثبتت نفسها في الأرض، لذا لا يمكنك التقاطها.
actors.mobs.tengu$fireability$fireblob.desc=ألقى تينغو مسحوقاً ناعماً يبدو أنه يشتعل في البخار هنا، إنه على وشك الاشتعال!
actors.mobs.tengu$shockerability$shockerblob.desc=طاقة كهربائية تتراكم هنا، أي شيء يقف على هذه البلاطة سيُصعق في الدور التالي!
actors.mobs.tengu$shockerability$shockeritem.name=جهاز صعق
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=إنه يطلق الكثير من الكهرباء، لا يمكنك الإمساك به!
actors.mobs.tengu$shockerability$shockeritem.desc=ألقى تينغو آلة غريبة هنا، يبدو أنها مصنوعة من أجزاء DM-100. الآلة تقوس الكهرباء حولها باستمرار، لكنها تبدو وكأنها تسير في نمط يمكن التنبؤ به.
مع كل الكهرباء المتقوسة حولها، لا توجد طريقة لالتقاط هذا.
actors.mobs.thief.name=لص مجنون
actors.mobs.thief.stole=اللص سرق %s منك!
actors.mobs.thief.carries=
اللص يحمل _%s._ مسروق بوضوح.
actors.mobs.thief.escapes=اللص يهرب بـ %s الخاص بك!
actors.mobs.thief.desc=رغم أن هؤلاء السجناء يتجولون بحرية خارج زنازينهم، إلا أن هذا المكان لا يزال سجنهم. بمرور الوقت، أخذ هذا المكان عقولهم فضلاً عن حريتهم. منذ زمن بعيد، نسي هؤلاء اللصوص وقطاع الطرق المجانين من هم ولماذا يسرقون.
هؤلاء الأعداء أكثر عرضة للسرقة والهروب من القتال. تأكد من إبقائهم في مرمى البصر، أو قد لا ترى غرضك المسروق أبداً.
actors.mobs.tormentedspirit.name=روح معذبة
actors.mobs.tormentedspirit.desc=الأرواح المعذبة هي أرواح طيبة بطبيعتها أُصيبت بلعنة. طالما أنهم ملعونون سيهاجمون تماماً مثل الشبح، وهم أقوى أيضاً!
قد يكون من الممكن تطهير اللعنة باستخدام الغرض الصحيح أثناء الوقوف بجانب الروح. إذا رُفعت اللعنة فسيكون الروح ممتناً بالتأكيد...
actors.mobs.tormentedspirit.thank_you=شكراً لك...
actors.mobs.vaultrat.desc=هذا الجرذ لديه بعض التغييرات السلوكية لاختبار ذكاء أعداء القبو الجدد:
_-_ يمكن 'سماع' حركته عبر الجدران
_-_ سيتجول على طول دورية محددة مسبقاً
_-_ أثناء التجول لديه مدى اكتشاف منخفض بشدة خلف الاتجاه الذي يتحرك فيه.
_-_ أثناء النوم مدى اكتشافه أيضاً ينخفض
_-_ عندما يكتشفك سيقوم بـ'التحقيق' قبل التبديل إلى الصيد. الأعداء المحققون يتحركون نحوك لكن لا يهاجمون ومن السهل فقدانهم خلف الأبواب والزوايا.
actors.mobs.npcs.vaultsentry.name=حارس القبو الماسح
actors.mobs.npcs.vaultsentry.desc=هذا الحارس يمسح المنطقة في نمط. _بما أن هذه مجرد منطقة اختبار، فلن يفعل الحارس شيئاً إذا اكتشفك._
actors.mobs.npcs.vaultlaser.name=حارس القبو الليزري
actors.mobs.npcs.vaultlaser.desc=هذا الحارس يطلق أشعة ليزر على فترات منتظمة. _بما أن هذه مجرد منطقة اختبار، فالأشعة لن تؤذيك فعلياً._
actors.mobs.warlock.name=ساحر أقزام مظلم
actors.mobs.warlock.bolt_kill=برق الظلام قتلك...
actors.mobs.warlock.desc=مع تحول اهتمامات الأقزام من الهندسة إلى الفنون السحرية، صعد السحرة المظلمون إلى السلطة في المدينة. بدأوا بالسحر العنصري، لكنهم سرعان ما تحولوا إلى علم الشياطين واستحضار الأرواح. أقوى هؤلاء السحرة استولى على عرش مدينة الأقزام، وسُمح لرفاقه بمواصلة ممارسة سحرهم المظلم، طالما أنهم تنازلوا عن إرادتهم الحرة له.
هؤلاء السحرة يمتلكون سحراً تعطيلياً قوياً، وقادرون على عرقلة سحر الترقية المطبق على معداتك مؤقتاً. كلما كان الغرض مرقياً أكثر، كلما تأثر بشدة.
actors.mobs.wraith.name=شبح
actors.mobs.wraith.desc=الشبح هو روح انتقامية لخاطئ، تم تدنيس قبره. لكونه كياناً أثيرياً، من الصعب جداً إصابته بسلاح عادي.
actors.mobs.wraith.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.
actors.mobs.yogdzewa.name=يوغ-دزيوا
actors.mobs.yogdzewa.notice=أنا. أراك.
actors.mobs.yogdzewa.darkness=الظلام يقترب أكثر...
actors.mobs.yogdzewa.hope=أملك. هو. مجرد. وهم!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogdzewa.desc=يوغ-دزيوا هو إله قديم؛ وحش عظيم يمتد إلى عوالم الفانين ويلتهمها لتغذية نموه اللانهائي. لا بد أن الأقزام قد جذبوا انتباه هذا الرعب الكوني أثناء لعبهم بالسحر المظلم، وهم يحاولون احتواءه منذ ذلك الحين.
يوغ-دزيوا ينشأ من بُعد من الفوضى السحرية الخام، ولا يمكنه جلب شكله الحقيقي إلى هذا العالم. بدلاً من ذلك، خلق تجسيدات واستدعى أتباعاً شياطين لتنفيذ أوامره هنا.
هذه العين العملاقة هي النقطة المحورية لقوة يوغ-دزيوا في هذا العالم. ورغم أن العين نفسها غير قادرة على الحركة، إلا أنها قادرة على إطلاق أشعة قوية من السحر الشيطاني واستدعاء مجموعة متنوعة من الأتباع لمساعدتها.
actors.mobs.yogdzewa.desc_spawners=يمكنك الشعور بموجات من الطاقة الشيطانية تشع إلى العين من الطوابق العليا. شيء ما تركته حياً هناك لا بد أنه يضخ الطاقة عائداً إلى يوغ-دزيوا. _سيستخدم يوغ هذه الطاقة لاستدعاء أتباع أقوى!_
actors.mobs.yogdzewa$larva.name=يرقة الإله
actors.mobs.yogdzewa$larva.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogdzewa$larva.desc=هذه الفراخ الصغيرة ليوغ-دزيوا هي أتباع بسيطون يسهل إنتاجهم. رغم ضعفهم فردياً، إلا أنهم يُستدعون بسرعة ويمكن أن يصبحوا طاغين بأعداد كبيرة.
actors.mobs.yogdzewa$yogripper.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogdzewa$yogeye.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogdzewa$yogscorpio.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogfist.invuln_warn=القبضة حصينة بينما هي قريبة من العين!
actors.mobs.yogfist.rankings_desc=التهمه يوغ-دزيوا
actors.mobs.yogfist.desc=هذه القبضة هي جانب من قوة يوغ-دزيوا. القبضات مرتبطة بقوة يوغ-دزيوا، وستكون محمية من كل الضرر عندما تكون قريبة من العين.
actors.mobs.yogfist$burningfist.name=قبضة مشتعلة
actors.mobs.yogfist$burningfist.desc=هذه القبضة مكونة من سحر ناري فوضوي. أثناء حركتها ستشعل التضاريس حولها باستمرار. وهي قادرة أيضاً على إطلاق انفجارات من القوة النارية، والتي تنشر اللهب حيث تصطدم.
قدرة القبضة على نشر اللهب تُقمع عندما تكون قريبة من الماء، لكن حرارتها عظيمة لدرجة أن أي ماء حولها سيتبخر بعد فترة قصيرة!
actors.mobs.yogfist$soiledfist.name=قبضة ترابية
actors.mobs.yogfist$soiledfist.desc=هذه القبضة مكونة من سحر ترابي فوضوي. أثناء حركتها ستسبب باستمرار نمو الغطاء النباتي حولها. يمكنها أيضاً إطلاق انفجارات ترابية مركزة ستحاصر هدفها في كروم وجذور سريعة النمو!
القبضة تستمد قوتها من هذه الحياة النباتية، وستقاوم الضرر بناءً على كمية الغطاء النباتي الطويل أو المحروث بالقرب منها!
actors.mobs.yogfist$rottingfist.name=قبضة متعفنة
actors.mobs.yogfist$rottingfist.desc=هذه القبضة مكونة من فساد حي. هي كتلة شامخة من اللحم المتحلل التي يمكنها نشر الوحل الأكّال في القتال القريب والغاز السام عن بُعد. والأسوأ من ذلك، أن كتلة القبضة العظيمة تسبب لها النزيف بدلاً من تلقي الضرر مباشرة.
يمكن استخدام الماء لغسل الوحل، لكن القبضة قادرة أيضاً على امتصاص الماء لشفاء نفسها! إضافة لذلك، إلحاق الضرر بالقبضة أثناء نزيفها سيسبب تجدد النزيف، لكن لن يتراكم!
actors.mobs.yogfist$rustedfist.name=قبضة صدئة
actors.mobs.yogfist$rustedfist.desc=هذه القبضة مكونة من معدن حي. هي كتلة شامخة من المعدن المتحول التي لديها هجمات قريبة قوية، ويمكنها شل أهدافها عن بُعد. بسبب كتلتها الهائلة، القبضة ستتلقى أي ضرر يُلحق بها عبر الزمن، بدلاً من فوراً.
القبضة غير مرنة مع ذلك، ولا يمكنها التحرك عبر الممرات الضيقة. إضافة لذلك، ورغم أنها قد تتلقى الضرر ببطء، إلا أن الضرر المؤجل سيستمر في الزيادة إذا ضُربت القبضة مرات متعددة.
actors.mobs.yogfist$brightfist.name=قبضة مضيئة
actors.mobs.yogfist$brightfist.teleport=القبضة تنتقل بعيداً في ومضة ضوء تعميك بشدة!
actors.mobs.yogfist$brightfist.desc=هذه القبضة مكونة من طاقة ضوئية نقية. إنها قادرة على إطلاق أشعة قوية من الضوء الحارق كل دور! هذه الأشعة ستعميك مؤقتاً إضافة إلى تسببها بضرر ثقيل. القبضة قادرة أيضاً على غمر الحلبة بضوء مبهر لفترة قصيرة من أجل الهروب!
القبضة ليس لديها قدرات خاصة يمكنها استخدامها في المدى القريب مع ذلك.
actors.mobs.yogfist$darkfist.name=قبضة مظلمة
actors.mobs.yogfist$darkfist.teleport=القبضة تنتقل بعيداً في انفجار ظلام يطفئ مصدر ضوءك!
actors.mobs.yogfist$darkfist.desc=هذه القبضة مكونة من طاقة مظلمة نقية. إنها قادرة على إطلاق انفجارات قوية من السحر المظلم كل دور! هذه الانفجارات ستضعف مصدر ضوءك إضافة إلى تسببها بضرر ثقيل. القبضة قادرة أيضاً على غمر الحلبة بالظلام لفترة قصيرة من أجل الهروب!
القبضة ليس لديها قدرات خاصة يمكنها استخدامها في المدى القريب مع ذلك.
