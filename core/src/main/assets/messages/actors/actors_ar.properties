actors.buffs.paralysis.name=مشلول
actors.buffs.paralysis.heromsg=أنت مشلول!
actors.buffs.paralysis.out=قاوم الشلل
actors.buffs.paralysis.desc=في كثير من الأحيان أسوأ شيء يمكن فعله هو عدم فعل أي شيء على الإطلاق.
الشلل يوقف كل الأفعال تماماً، مجبراً الهدف على الانتظار حتى ينتهي التأثير. الألم من تلقي الضرر يمكن أن يسبب مقاومة الشخصيات للشلل، مما يحررها من التأثير.
أدوار الشلل المتبقية: %s.
actors.buffs.physicalempower.name=ممكن جسدياً
actors.buffs.physicalempower.desc=ضرباتك مُمكنة، مما يزيد كمية الضرر الذي يمكنك توجيهه عند ضرب الأعداء بالهجمات الجسدية.
