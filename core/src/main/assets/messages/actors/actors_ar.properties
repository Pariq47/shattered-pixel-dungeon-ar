actors.hero.abilities.warrior.heroicleap.name=القفزة البطولية
actors.hero.abilities.warrior.heroicleap.prompt=اختر اتجاه القفز
actors.hero.abilities.warrior.heroicleap.short_desc=ينفذ المحارب _قفزة بطولية_ نحو موقع مستهدف، محلقاً فوق الأعداء والمخاطر.
actors.hero.abilities.warrior.heroicleap.desc=يقفز المحارب نحو موقع مستهدف، متجاوزاً أي أعداء أو مخاطر في الطريق. لا يمكنه القفز فوق الجدران أو التضاريس الصلبة الأخرى مع ذلك.
actors.hero.abilities.warrior.shockwave.name=موجة صادمة
actors.hero.abilities.warrior.shockwave.short_desc=يطلق المحارب _موجة صادمة_ في منطقة مخروطية بضرب الأرض. الأعداء Caught in the shockwave يتلقون ضرراً ويصابون بالعرج.
actors.hero.abilities.warrior.shockwave.desc=يضرب المحارب الأرض، منتجاً موجة صادمة تنتقل حتى 5 بلاطات في مخروط بزاوية 60 درجة.
الأعداء Caught in this shockwave يصابون بالعرج لـ5 أدوار. يتلقون أيضاً 5-10 ضرر، بالإضافة إلى 1-2 ضرر إضافي لكل نقطة قوة يمتلكها المحارب فوق 10.
actors.hero.abilities.warrior.endure.name=صمود
actors.hero.abilities.warrior.endure$enduretracker.name=صمود
actors.hero.abilities.warrior.endure$enduretracker.desc=المحارب يوجه الآن ضرراً إضافياً بناءً على الضرر الذي تحمل بصدره.
الضرر الإضافي: %1$d
الضربات المتبقية: %2$d
actors.hero.abilities.warrior.endure.short_desc=يصمد المحارب متحملاً الضرر، متخطياً عدة أدوار لكنه يكتسب مقاومة عالية للضرر. ثم يوجه ضرراً إضافياً بناءً على ما تحمله.
actors.hero.abilities.warrior.endure.desc=يصمد المحارب لـ3 أدوار، متلقياً نصف الضرر من كل المصادر. يُطبق هذا الخفض قبل تأثيرات مقاومة الضرر مثل الدرع.
بعد الصمود، ضربته التالية خلال 10 أدوار تكسب ضرراً إضافياً. هذا الضرر الإضافي يساوي نصف كل الضرر الذي أُنزل به أثناء الصمود، قبل أي تأثيرات لخفض الضرر!
إذا كان لدى المحارب أي تتابع، استخدام هذه القدرة يزيد وقته المتبقي بـ3 أدوار.
actors.hero.abilities.mage.elementalblast.name=انفجار عنصري
actors.hero.abilities.mage.elementalblast.no_staff=لا يمكنك استخدام هذه القدرة بدون عصاك.
actors.hero.abilities.mage.elementalblast.short_desc=يطلق الساحر _انفجاراً عنصرياً_ من عصاه، مغطياً مساحة كبيرة حوله بتأثير يختلف بناءً على العصا السحرية المحقونة في عصاه.
actors.hero.abilities.mage.elementalblast.desc=يطلق الساحر انفجاراً من السحر، يغطي منطقة دائرية حتى 4 بلاطات بعيداً ويسبب حتى 15-25 ضرر. التأثير المحدد للانفجار العنصري سيختلف حسب العصا السحرية المحقونة في عصا الساحر.
actors.hero.abilities.mage.elementalblast.generic_desc=تأثير الانفجار العنصري سيكون مشابهاً لتأثير العصا السحرية عند إطلاقها على عدو أو حليف.
actors.hero.abilities.mage.wildmagic.name=سحر بري
actors.hero.abilities.mage.wildmagic.no_wands=ليس لديك عصي سحرية للإطلاق!
actors.hero.abilities.mage.wildmagic.short_desc=يطلق الساحر العنان لـ_السحر البري_ الموجود في عصيه، مطلقاً إياها عشوائياً مرات متعددة على هدف مختار خلال دور واحد.
actors.hero.abilities.mage.wildmagic.desc=يطلق الساحر العنان للقوة في عصيه، مطلقاً إياها عشوائياً حتى 4 مرات في دور واحد. عصا الساحر لا تُضمن في هذا التأثير.
كل عصا تُعزز أيضاً مستواها بمقدار 2، حتى +3. تستخدم هذه القدرة نصف شحنة عصا لكل إطلاق، ولا يمكن إطلاق أي عصا أكثر من مرتين.
actors.hero.abilities.mage.warpbeacon.name=منارة الانتقال
actors.hero.abilities.mage.warpbeacon.depths=لا يمكنك الانتقال بين الأعماق!
actors.hero.abilities.mage.warpbeacon.locked_floor=لا يمكنك مغادرة طابق مقفل!
actors.hero.abilities.mage.warpbeacon.too_far=ذلك الموقع بعيد جداً!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=لا يمكنك وضع منارة هناك!
