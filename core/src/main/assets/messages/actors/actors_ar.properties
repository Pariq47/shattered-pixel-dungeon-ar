actors.buffs.preparation.out_of_reach=ذلك الهدف بعيد المنال.
actors.buffs.preparation.assassinated=مُغتال
actors.buffs.prismaticguard.name=حارس منشوري
actors.buffs.prismaticguard.desc=أنت محروس بواسطة صورة منشورية غير نشطة حالياً. عندما يكون الأعداء حاضرين، الصورة المنشورية ستتأهب للعمل وتحميك!
أثناء عدم النشاط، الصورة المنشورية ستتعافى بثبات من أي ضرر تلقته.
الصحة الحالية: %d/%d.
actors.buffs.prismaticguard.desc_many=هذه الصورة المنشورية تستفيد أيضاً من قوة الكثرة. الأدوار المتبقية: %d.
actors.buffs.recharging.name=إعادة شحن
actors.buffs.recharging.desc=الطاقة تجري فيك، محسنة معدل شحن عصيك وصوالجك.
كل دور هذا التأثير سيزيد الشحنة الحالية بربع شحنة، إضافة إلى الشحن العادي.
أدوار إعادة الشحن المتبقية: %s.
actors.buffs.revealedarea.name=منطقة مكشوفة
actors.buffs.revealedarea.desc=منطقة من الزنزانة كُشفت مؤقتاً للبطل، سيرونها بغض النظر عن مكان وجودهم.
